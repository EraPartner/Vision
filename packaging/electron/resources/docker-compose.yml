# Embedded compose for packaged app — replace the app image with your released image
name: vision
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ftm_user
      POSTGRES_DB: financial_transactions
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ftm_user -d financial_transactions"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  app:
    # CI pushes ghcr.io/erapartner/vision:<semver> and :latest on every release tag.
    # Electron sets APP_IMAGE_TAG to the exact version tag so `docker compose pull`
    # fetches the correct image when updating.
    image: ghcr.io/erapartner/vision:${APP_IMAGE_TAG:-latest}
    pull_policy: missing
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-3002}:3002"
    environment:
      SERVER_HOST: "0.0.0.0"
      CORS_ORIGINS: "http://localhost:${PORT:-3002}"
      # Expose version to the backend so /api/admin/update/check can report it
      APP_VERSION: ${APP_IMAGE_TAG:-latest}
    volumes:
      # Persist user-uploaded attachments across container recreate / image
      # update — without this, attachments live on the writable container
      # layer and disappear on every `docker compose up` after a version bump.
      - attachments_data:/app/data/attachments
      - vision_cache_data:/app/.vision-cache
    # depends_on removed — see docker-compose.yml for explanation.

volumes:
  postgres_data:
  attachments_data:
  vision_cache_data:
