version: "3.8"

# Embedded compose for packaged app — replace the app image with your released image
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ftm_user
      POSTGRES_DB: financial_transactions
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ftm_user -d financial_transactions"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    # Using your GHCR repo. CI will push both the sha-tag and `latest`.
    image: ghcr.io/erapartner/vision:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    ports:
      - "3002:3002"
    environment:
      EXTERNAL_DATABASE: "true"
      SERVER_HOST: "0.0.0.0"
      CORS_ORIGINS: "http://localhost:3002"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
