# Embedded compose for packaged app — replace the app image with your released image
name: vision
services:
  db:
    image: postgres:18-alpine
    # Keep this aligned with the real-data root Compose file. The current
    # linux/arm64 image can contain empty entrypoint scripts
    # (docker-library/postgres#1378), so only PostgreSQL runs under emulation.
    platform: linux/amd64
    restart: unless-stopped
    # SSD-tuned planner: default random_page_cost=4.0 assumes spinning disks and
    # over-penalizes index scans. 1.1 reflects near-uniform random/sequential cost.
    command: postgres -c random_page_cost=1.1
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    # Postgres uses /dev/shm for parallel query workers and large sorts/hash
    # joins; Docker's 64mb default is easily exhausted. 256mb is a safe bump.
    shm_size: 256mb
    # No `env_file: .env` here on purpose: the db container needs exactly one
    # secret, and inheriting the whole file would also hand it the app's API
    # keys, ADMIN_AUTH_TOKEN and DATABASE_URL for no reason. POSTGRES_PASSWORD
    # still comes from the same .env — Compose reads it for interpolation — it
    # is just passed on its own. Keep the app service's env_file.
    environment:
      POSTGRES_USER: ftm_user
      POSTGRES_DB: financial_transactions
      # Superuser password for first init (ignored once the volume exists).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ftm_user -d financial_transactions"]
      interval: 30s
      timeout: 3s
      retries: 10
      start_period: 5s
      # NOTE: `start_interval` was removed — it requires Compose >= 2.20.2 /
      # Engine >= 25, and older binaries reject the unknown property during
      # schema validation. Since resolveWorkDir() in main.js overwrites the
      # embedded compose on every launch, shipping it would break `docker
      # compose up` for upgraded installs on older Docker Desktop. It only sped
      # up the first health probes; the healthcheck works without it.

  app:
    # CI pushes ghcr.io/erapartner/vision:<semver> and :latest on every release tag.
    # APP_IMAGE_REF is the reference SUFFIX, so it can carry either form:
    #   @sha256:…  — an immutable digest, written into .env by the Electron
    #                updater from the digest the GitHub release published
    #   :1.2.3     — a plain tag, for manual pinning
    # Unset falls back to :latest, which is what every install ran before the
    # digest pin existed and what a fresh install runs until its first update.
    # A tag is mutable: the registry can repoint it at different content. The
    # digest is not, and it reaches the app over the GitHub API rather than from
    # the registry itself, so a compromised registry alone cannot swap the image.
    image: ghcr.io/erapartner/vision${APP_IMAGE_REF:-:latest}
    pull_policy: missing
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    env_file: .env
    ports:
      - "127.0.0.1:${PORT:-3002}:3002"
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 4g
    cpus: 4.0
    environment:
      SERVER_HOST: "0.0.0.0"
      # The container binds 0.0.0.0 but the port is published on host loopback
      # only (see ports: above) — acknowledge that so a tokenless start is not
      # refused. Remove this (and set ADMIN_AUTH_TOKEN) if you widen ports:.
      ADMIN_ALLOW_TOKENLESS_NONLOOPBACK: "true"
      CORS_ORIGINS: "http://localhost:${PORT:-3002}"
      # The version the backend reports (admin.js: APP_VERSION || APP_IMAGE_TAG
      # || 'unknown'). This used to read ${APP_IMAGE_TAG:-latest}, left over
      # from the tag-pinning mechanism APP_IMAGE_REF above replaced — nothing
      # has ever set APP_IMAGE_TAG, so it always resolved to the literal
      # "latest". Reading APP_VERSION instead keeps that same default while
      # letting a value in .env actually take effect: `environment:` wins over
      # `env_file:`, so a pin set there was previously overwritten.
      APP_VERSION: ${APP_VERSION:-latest}
    volumes:
      - attachments_data:/app/data/attachments
      - vision_cache_data:/app/.vision-cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # condition: service_started (not service_healthy) — creates the db container
    # for partial `up` targets without reintroducing the health-gate serial delay.
    depends_on:
      db:
        condition: service_started

volumes:
  postgres_data:
  attachments_data:
  vision_cache_data:
