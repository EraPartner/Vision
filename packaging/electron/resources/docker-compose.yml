# Embedded compose for packaged app — replace the app image with your released image
name: vision
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    # Postgres uses /dev/shm for parallel query workers and large sorts/hash
    # joins; Docker's 64mb default is easily exhausted. 256mb is a safe bump.
    shm_size: 256mb
    env_file: .env
    environment:
      POSTGRES_USER: ftm_user
      POSTGRES_DB: financial_transactions
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ftm_user -d financial_transactions"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
      # NOTE: `start_interval` was removed — it requires Compose >= 2.20.2 /
      # Engine >= 25, and older binaries reject the unknown property during
      # schema validation. Since resolveWorkDir() in main.js overwrites the
      # embedded compose on every launch, shipping it would break `docker
      # compose up` for upgraded installs on older Docker Desktop. It only sped
      # up the first health probes; the healthcheck works without it.

  app:
    # CI pushes ghcr.io/erapartner/vision:<semver> and :latest on every release tag.
    # Electron sets APP_IMAGE_TAG to the exact version tag so `docker compose pull`
    # fetches the correct image when updating.
    image: ghcr.io/erapartner/vision:${APP_IMAGE_TAG:-latest}
    pull_policy: missing
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${PORT:-3002}:3002"
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 4g
    cpus: 4.0
    environment:
      SERVER_HOST: "0.0.0.0"
      CORS_ORIGINS: "http://localhost:${PORT:-3002}"
      APP_VERSION: ${APP_IMAGE_TAG:-latest}
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ftm_user
      DB_NAME: financial_transactions
    volumes:
      - attachments_data:/app/data/attachments
      - vision_cache_data:/app/.vision-cache
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  attachments_data:
  vision_cache_data:
