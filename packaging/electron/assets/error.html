<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
    <title>Vision</title>
    <link rel="stylesheet" href="error.css" />
  </head>
  <body>
    <main role="alert">
      <!--
        The brand mark, full fidelity — this page has room for it and, unlike
        the splash, no palette to follow. Construction and every colour value
        are the packaged app icon's (packaging/electron/build/icon.svg, via
        apps/frontend/public/favicon.svg): obsidian glass body, emerald→
        champagne gradient, the two aurora washes, glass edge + hairline.
        Presentation attributes only, no style attribute — the page's CSP is
        `style-src 'self'`; sizing lives in error.css.
      -->
      <svg class="mark" viewBox="72 72 880 880" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="vm-body" x1="0" y1="0" x2="0.35" y2="1">
            <stop offset="0" stop-color="#16202A"/>
            <stop offset="0.55" stop-color="#0E1518"/>
            <stop offset="1" stop-color="#0A0D10"/>
          </linearGradient>
          <linearGradient id="vm-mark" x1="0.12" y1="0.05" x2="0.9" y2="1">
            <stop offset="0" stop-color="#5BE6B4"/>
            <stop offset="0.5" stop-color="#36D399"/>
            <stop offset="1" stop-color="#E7C16A"/>
          </linearGradient>
          <radialGradient id="vm-auroraEmerald" cx="0.32" cy="0.72" r="0.6">
            <stop offset="0" stop-color="#36D399" stop-opacity="0.30"/>
            <stop offset="1" stop-color="#36D399" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="vm-auroraGold" cx="0.78" cy="0.22" r="0.55">
            <stop offset="0" stop-color="#E7C16A" stop-opacity="0.20"/>
            <stop offset="1" stop-color="#E7C16A" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="vm-edge" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#F6F2EA" stop-opacity="0.42"/>
            <stop offset="0.12" stop-color="#F6F2EA" stop-opacity="0.06"/>
            <stop offset="0.5" stop-color="#F6F2EA" stop-opacity="0"/>
          </linearGradient>
          <radialGradient id="vm-markGlow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#36D399" stop-opacity="0.45"/>
            <stop offset="1" stop-color="#36D399" stop-opacity="0"/>
          </radialGradient>
          <clipPath id="vm-bodyClip">
            <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
          </clipPath>
        </defs>
        <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#vm-body)"/>
        <g clip-path="url(#vm-bodyClip)">
          <rect x="100" y="100" width="824" height="824" fill="url(#vm-auroraEmerald)"/>
          <rect x="100" y="100" width="824" height="824" fill="url(#vm-auroraGold)"/>
          <circle cx="512" cy="540" r="300" fill="url(#vm-markGlow)"/>
          <path d="M 268 300 L 512 792 L 756 300 L 656 300 L 512 596 L 368 300 Z"
                fill="url(#vm-mark)" stroke="#7CF0CC" stroke-width="3"
                stroke-opacity="0.5" stroke-linejoin="round"/>
          <circle cx="512" cy="444" r="60" fill="#0A0D10"/>
          <circle cx="512" cy="444" r="60" fill="none" stroke="#E7C16A" stroke-width="6" stroke-opacity="0.85"/>
          <circle cx="512" cy="444" r="26" fill="#5BE6B4"/>
          <circle cx="512" cy="444" r="26" fill="url(#vm-markGlow)"/>
        </g>
        <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#vm-edge)"/>
        <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" ry="184.5"
              fill="none" stroke="#F6F2EA" stroke-opacity="0.10" stroke-width="1.5"/>
      </svg>
      <h1 id="title"></h1>
      <p id="msg"></p>
      <div class="actions">
        <button class="primary" id="retry"></button>
        <button id="logs"></button>
      </div>
    </main>
    <script src="error.js"></script>
  </body>
</html>
