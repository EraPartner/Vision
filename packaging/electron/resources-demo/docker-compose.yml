# Embedded compose for the DEMO build (Vision Demo.app).
# Fully isolated from the real app: distinct project name -> distinct volumes
# (visiondemoapp_*), and synthetic data baked into a local custom Postgres image.
# Uses locally-built images only (no GHCR pull).
name: visiondemoapp

services:
  db:
    # Built locally by install-demo.sh: postgres + the synthetic dataset auto-loaded
    # on first init (no host-path mount needed).
    image: vision-demo-db:latest
    pull_policy: never
    restart: unless-stopped
    # SSD-tuned planner: default random_page_cost=4.0 assumes spinning disks and
    # over-penalizes index scans. 1.1 reflects near-uniform random/sequential cost.
    command: postgres -c random_page_cost=1.1
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    # Postgres uses /dev/shm for parallel query workers and large sorts/hash
    # joins; Docker's 64mb default is easily exhausted. 256mb is a safe bump.
    shm_size: 256mb
    env_file: .env
    environment:
      POSTGRES_USER: ftm_user
      POSTGRES_DB: financial_transactions
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ftm_user -d financial_transactions"]
      interval: 30s
      timeout: 3s
      retries: 10
      start_period: 5s
      # NOTE: `start_interval` was removed — it requires Compose >= 2.20.2 /
      # Engine >= 25, and older binaries reject the unknown property during
      # schema validation, breaking `docker compose up`. It only sped up the
      # first health probes; the healthcheck (which this demo's app gates on via
      # depends_on: service_healthy) works without it.

  app:
    image: vision-app:latest
    pull_policy: never
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    # Gate startup on a healthy db. Without this, a rebuild of vision-demo-db
    # recreates the db container (new IP) while the app burns its bounded
    # ~37s connect-retry against the torn-down endpoint, crash-loops, and the
    # Electron splash hangs on "Almost ready…". The db healthcheck already
    # exists below; service_healthy makes compose wait for it.
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    ports:
      - "127.0.0.1:${PORT:-3002}:3002"
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 4g
    cpus: 4.0
    environment:
      SERVER_HOST: "0.0.0.0"
      CORS_ORIGINS: "http://localhost:${PORT:-3002}"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ftm_user
      DB_NAME: financial_transactions
    volumes:
      - attachments_data:/app/data/attachments
      - vision_cache_data:/app/.vision-cache
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  attachments_data:
  vision_cache_data:
