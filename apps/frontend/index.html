<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Vault Voyager - Financial Management</title>
    <meta
        content="Track your spending, manage transactions, and take control of your personal finances with Vault Voyager"
        name="description" />
    <meta content="Vault Voyager" name="author" />

    <!-- Prevent flash by setting preferred theme before React mounts -->
    <script>
        (function () {
            try {
                const t = localStorage.getItem('vaultVoyager_theme');
                // Default to dark if not set
                if (t === 'light') {
                    document.documentElement.classList.remove('dark');
                } else {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
</head>

<body>
    <div id="root"></div>
    <script src="/src/main.tsx" type="module"></script>
</body>

</html>
