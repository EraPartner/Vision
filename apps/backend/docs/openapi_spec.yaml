    # ==================== Import Schemas ====================

    ImportResultWithLinks:
      type: object
      required: [ batch_id, total_processed, imported, duplicates, errors, status ]
      properties:
        batch_id:
          type: string
          description: |
            Unique identifier for the import batch.
            Format: batch_YYYYMMDD_HHMMSS_random
          example: "batch_20260203_103045_abc123"
        total_processed:
          type: integer
          minimum: 0
          description: |
            Total number of transactions processed from CSV file.
            Includes imported, duplicates, and errors.
          example: 150
        imported:
          type: integer
          minimum: 0
          description: |
            Number of new transactions successfully imported into the database.
          example: 142
        duplicates:
          type: integer
          minimum: 0
          description: |
            Number of duplicate transactions skipped.
            Duplicates are detected based on date, amount, and recipient.
          example: 8
        errors:
          type: integer
          minimum: 0
          description: |
            Number of transactions that failed to import due to validation or processing errors.
          example: 0
        status:
          type: string
          enum: [ "completed", "completed_with_errors", "failed", "processing" ]
          description: |
            Overall import status.
            - completed: All transactions processed successfully
            - completed_with_errors: Import finished but some transactions failed
            - failed: Import failed completely
            - processing: Import currently in progress
          example: "completed"
        error_message:
          type: string
          nullable: true
          maxLength: 1000
          description: |
            Detailed error message if status is 'failed' or 'completed_with_errors'.
            Contains information about what went wrong.
          example: null
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          description: Available next actions (HATEOAS links)

    ImportBatchResponse:
      type: object
      required: [ id, filename, bank_name, status, total_processed, imported_count, duplicate_count, error_count, created_at, links ]
      properties:
        id:
          type: integer
          minimum: 1
          description: Import batch ID
          example: 123
        filename:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Name of the imported CSV file.
            Stored for audit and tracking purposes.
          example: "transactions_jan_2026.csv"
        bank_name:
          type: string
          minLength: 1
          maxLength: 100
          description: |
            Bank or source name for this import.
            Identifies the bank adapter or custom configuration used.
          example: "Chase"
        status:
          type: string
          enum: [ "processing", "completed", "completed_with_errors", "failed" ]
          description: |
            Current status of the import batch.
            - processing: Import is currently in progress
            - completed: All transactions processed successfully
            - completed_with_errors: Import finished but some transactions failed
            - failed: Import failed completely
          example: "completed"
        total_processed:
          type: integer
          minimum: 0
          description: Total number of transactions processed from CSV
          example: 150
        imported_count:
          type: integer
          minimum: 0
          description: Number of new transactions successfully imported
          example: 145
        duplicate_count:
          type: integer
          minimum: 0
          description: Number of duplicate transactions skipped
          example: 5
        error_count:
          type: integer
          minimum: 0
          description: Number of transactions that failed to import
          example: 0
        error_message:
          type: string
          nullable: true
          maxLength: 1000
          description: Error message if import failed
          example: null
        config_used:
          type: string
          nullable: true
          description: |
            JSON configuration used for custom imports.
            Null for predefined bank adapters.
          example: null
        created_at:
          type: string
          format: date-time
          description: Import batch creation timestamp
          example: "2026-01-15T10:30:00Z"
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: Import completion timestamp
          example: "2026-01-15T10:30:15Z"
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          description: Available actions for this import batch (HATEOAS links)

    ImportBatchesListResponse:
      type: object
      required: [ items, total, limit, offset, links ]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImportBatchResponse'
          description: Array of import batch objects
        total:
          type: integer
          minimum: 0
          description: Total count of import batches in the system
          example: 45
        limit:
          type: integer
          minimum: 1
          description: Limit used for this page
          example: 50
        offset:
          type: integer
          minimum: 0
          description: Offset used for this page
          example: 0
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          description: Pagination and navigation links (HATEOAS)

    # ==================== Info Schemas ====================

    CategoryStats:
      type: object
      required: [ name, count ]
      properties:
        name:
          type: string
          description: Category name in GENERAL:DETAIL format
          example: "GROCERIES:FOOD"
        count:
          type: integer
          minimum: 0
          description: Number of transactions in this category
          example: 342

    StatisticsResponse:
      type: object
      required: [ total_transactions, total_amount, categories ]
      properties:
        total_transactions:
          type: integer
          minimum: 0
          description: Total number of transactions in the system
          example: 1250
        total_amount:
          type: number
          format: float
          description: |
            Sum of all transaction amounts.
            Negative value indicates net expenses, positive indicates net income.
          example: -15432.67
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryStats'
          description: Category-wise transaction breakdown

    InfoResponseWithLinks:
      type: object
      required: [ total_transactions, total_amount, categories, links ]
      properties:
        total_transactions:
          type: integer
          minimum: 0
          description: Total number of transactions in the system
          example: 1250
        total_amount:
          type: number
          format: float
          description: |
            Sum of all transaction amounts.
            Negative value indicates net expenses, positive indicates net income.
          example: -15432.67
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryStats'
          description: Category-wise transaction breakdown
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          description: Available actions (HATEOAS links)

    BankListResponse:
      type: object
      required: [ banks ]
      properties:
        banks:
          type: array
          items:
            type: string
          description: |
            List of unique bank account identifiers present in transactions.
            Used for filtering and reporting.
          example: [ "Chase Current Account", "Belfius Savings", "HSBC Premium" ]

    BankListResponseWithLinks:
      type: object
      required: [ banks, links ]
      properties:
        banks:
          type: array
          items:
            type: string
          description: |
            List of unique bank account identifiers present in transactions.
            Used for filtering and reporting.
          example: [ "Chase Current Account", "Belfius Savings", "HSBC Premium" ]
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          description: Available actions (HATEOAS links)

    TransactionSummaryResponse:
      type: object
      required: [ total_transactions, total_amount, links ]
      properties:
        total_transactions:
          type: integer
          minimum: 0
          description: Total number of transactions matching filters
          example: 89
        total_amount:
          type: number
          format: float
          description: Sum of all transaction amounts matching filters
          example: -2456.78
        date_range:
          type: object
          nullable: true
          properties:
            start:
              type: string
              format: date
              description: Start date of the filtered range
              example: "2026-01-01"
            end:
              type: string
              format: date
              description: End date of the filtered range
              example: "2026-01-31"
          description: Date range used for filtering (if applicable)
        bank_account:
          type: string
          nullable: true
          description: Bank account used for filtering (if applicable)
          example: "Chase Current Account"
        category_breakdown:
          type: array
          nullable: true
          items:
            type: object
            properties:
              category:
                type: string
                description: Category name in GENERAL:DETAIL format
                example: "GROCERIES:FOOD"
              count:
                type: integer
                minimum: 0
                description: Number of transactions in this category
                example: 23
              total_amount:
                type: number
                format: float
                description: Sum of transaction amounts in this category
                example: -567.89
          description: Category-wise breakdown of filtered transactions
        average_transaction:
          type: number
          format: float
          nullable: true
          description: Average transaction amount for filtered transactions
          example: -27.60
        largest_expense:
          type: number
          format: float
          nullable: true
          description: Largest expense (most negative amount) in filtered transactions
          example: -123.45
        largest_income:
          type: number
          format: float
          nullable: true
          description: Largest income (most positive amount) in filtered transactions
          example: 1500.00
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          description: Available actions (HATEOAS links)

  # ==================== Security Schemes ====================

  securitySchemes:
    # Future authentication schemes can be added here
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key authentication (not currently implemented)

    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT bearer token authentication (not currently implemented)

