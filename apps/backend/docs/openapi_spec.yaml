            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: |
            Start date for filtering (inclusive).
            **Format**: YYYY-MM-DD (ISO 8601)
            **Note**: Must be before or equal to end_date if both provided.
          example: "2026-01-01"
        - name: end_date
