                  - category: "TRANSPORT:FUEL"
                    count: 8
                    total_amount: -234.56
                average_transaction: -27.60
                largest_expense: -123.45
                largest_income: 1500.00
                links:
                  - rel: self
                    href: http://localhost:3002/api/info/transaction-summary?bank_account=Chase%20Current%20Account&start_date=2026-01-01&end_date=2026-01-31
                    method: GET
                    title: Current summary
                  - rel: transactions
                    href: http://localhost:3002/api/transactions?bank_account=Chase%20Current%20Account&date_from=2026-01-01&date_to=2026-01-31
                    method: GET
                    title: View filtered transactions
        '400':
          description: Invalid date format or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_start_date:
                  summary: Invalid start date format
                  value:
                    detail: "Invalid start_date format"
                    error_code: "INVALID_DATE_FORMAT"
                invalid_end_date:
                  summary: Invalid end date format
                  value:
                    detail: "Invalid end_date format"
                    error_code: "INVALID_DATE_FORMAT"
        '500':
          description: Error retrieving transaction summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  parameters:
    # ==================== Path Parameters ====================

    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: Unique identifier for the category
      example: 1

    CategoryGeneral:
      name: general
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      description: Category general name (will be normalised to uppercase)
      example: groceries

    CategoryDetail:
      name: detail
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      description: Category detail name (will be normalised to uppercase)
      example: food

    RecipientId:
      name: recipientId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: Unique identifier for the recipient
      example: 1

    TransactionId:
      name: transactionId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: Unique identifier for the transaction
      example: 1

    BatchId:
      name: batchId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: Unique identifier for the import batch
      example: 123

  schemas:
    # ==================== Foundation Schemas ====================

    Link:
      type: object
      required: [ rel, href, method ]
      properties:
        rel:
          type: string
          description: Relation type indicating the link's purpose
          examples: [ self, parent, init, reset, next, prev, update, delete ]
        href:
          type: string
          format: uri
          description: URL to follow for the related action
          example: "http://localhost:3002/api/categories/1"
        method:
          type: string
          description: HTTP method to use for the related action
          enum: [ GET, POST, PATCH, PUT, DELETE, OPTIONS ]
          example: GET
        title:
          type: string
          description: Human-readable description of the action
          example: "Get this category"

    MethodInfo:
      type: object
      required: [ method, description ]
      properties:
        method:
          type: string
          enum: [ GET, POST, PATCH, PUT, DELETE, OPTIONS ]
          description: HTTP method
          example: GET
        description:
          type: string
          description: Description of what the method does
          example: "Retrieve all categories with pagination"

    ErrorResponse:
      type: object
      required: [ detail ]
      properties:
        detail:
          type: string
          minLength: 1
          maxLength: 1000
          description: |
            Human-readable error message describing what went wrong.
            Suitable for displaying to end users.
          example: "Category not found"
        error_code:
          type: string
          pattern: '^[A-Z_]+$'
          maxLength: 100
          description: |
            Machine-readable error code for programmatic error handling.
            Uses UPPER_SNAKE_CASE format for consistency.
          example: "CATEGORY_NOT_FOUND"
        field_errors:
          type: object
          description: |
            Field-specific validation errors for form submissions.
            Maps field names to arrays of error messages.
          additionalProperties:
            type: array
            items:
              type: string
              minLength: 1
              maxLength: 200
          example:
            general: [ "Field is required" ]
        timestamp:
          type: string
          format: date-time
          description: |
            ISO 8601 timestamp when the error occurred.
            Useful for debugging and log correlation.
          example: "2026-02-03T10:30:00.000Z"

    # ==================== Common Response Schemas ====================

    MessageResponse:
      type: object
      required: [ message ]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 500
          description: |
            Human-readable success message describing the completed operation.
            Suitable for displaying to end users as confirmation.
          example: "Operation completed successfully"
        details:
          type: object
          description: |
            Additional structured information about the operation.
            Contains operation-specific metadata and context.
          additionalProperties:
            type: string
            maxLength: 200
          example:
            operation: "soft_delete"
            note: "Category marked as inactive"
            affected_records: "1"
        timestamp:
          type: string
          format: date-time
          description: |
            ISO 8601 timestamp when the operation completed.
            Useful for audit trails and synchronization.
          example: "2026-02-03T10:30:00.000Z"
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          description: Available next actions (HATEOAS links)

    OptionsResponse:
      type: object
      required: [ methods, links ]
      properties:
        methods:
          type: array
          items:
            $ref: '#/components/schemas/MethodInfo'
          description: Available HTTP methods on this endpoint
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          description: Available navigation links (HATEOAS)

    RootOptionsResponse:
      type: object
      required: [ methods, description, links ]
      properties:
        methods:
          type: array
          items:
            $ref: '#/components/schemas/MethodInfo'
          description: Available HTTP methods on API root endpoint
        description:
          type: string
          description: API root description
          example: "API root discovery endpoint for Level 3 REST API (HATEOAS)"
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          description: Available navigation links (HATEOAS)

    APIRootResponse:
      type: object
      required: [ version, title, description, links ]
      properties:
        version:
          type: string
          description: API version
          example: "1.0.0"
        title:
          type: string
          description: API title
          example: "Financial Transaction Manager"
        description:
          type: string
          description: API description
          example: "Import and manage financial transactions from various banks"
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          description: Available resource endpoints (HATEOAS links)

    # ==================== Admin Schemas ====================

    AdminStatusResponse:
      type: object
      required: [ is_initialised, table_count, timestamp, links ]
      properties:
        is_initialised:
          type: boolean
          description: Whether the database has been initialised
          example: true
        table_count:
          type: integer
          minimum: 0
          description: Number of tables in the database
          example: 8
        timestamp:
          type: string
          format: date-time
          description: Response timestamp in ISO 8601 format
          example: "2026-02-03T10:30:00.000Z"
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          description: Available administrative actions (HATEOAS links)

    # ==================== Category Schemas ====================

    CategoryBase:
      type: object
      required: [ general, detail ]
      properties:
        general:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '^[A-Za-z0-9\s\-_]+$'
          description: |
            General category name (automatically normalised to uppercase).
            **Constraints**: 1-50 characters, alphanumeric, spaces, hyphens, underscores only.
            **Examples**: "Groceries", "Transport", "Utilities"
          example: "groceries"
        detail:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '^[A-Za-z0-9\s\-_]+$'
          description: |
            Detail category name (automatically normalised to uppercase).
            **Constraints**: 1-50 characters, alphanumeric, spaces, hyphens, underscores only.
            **Examples**: "Food", "Fuel", "Electricity"
          example: "food"
        description:
          type: string
          nullable: true
          maxLength: 500
          description: |
            Optional detailed description of the category.
            Used for clarification and reporting purposes.
          example: "Food and grocery purchases including supermarkets and restaurants"

    CategoryUpdate:
      type: object
      properties:
        general:
          type: string
          minLength: 1
          nullable: true
          description: General category name (automatically normalised to uppercase)
          example: "groceries"
        detail:
          type: string
          minLength: 1
          nullable: true
          description: Detail category name (automatically normalised to uppercase)
          example: "food"
        description:
          type: string
          nullable: true
          description: Category description
          example: "Updated food category description"

    CategoryResponse:
      allOf:
        - $ref: '#/components/schemas/CategoryBase'
        - type: object
          required: [ id, created_at, links ]
          properties:
            id:
              type: integer
              minimum: 1
              description: Unique category identifier
              example: 1
            created_at:
              type: string
              format: date-time
              description: Category creation timestamp
              example: "2026-01-15T10:30:00Z"
            updated_at:
              type: string
              format: date-time
              nullable: true
              description: Last update timestamp
              example: "2026-01-20T14:45:00Z"
            links:
              type: array
              items:
                $ref: '#/components/schemas/Link'
              description: Available actions for this category (HATEOAS links)

    CategoriesListResponse:
      type: object
      required: [ items, total, limit, offset, links ]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CategoryResponse'
          description: Array of category objects
        total:
          type: integer
          minimum: 0
          description: Total count of categories in the system
          example: 25
        limit:
          type: integer
          minimum: 1
          description: Limit used for this page
          example: 10
        offset:
          type: integer
          minimum: 0
          description: Offset used for this page
          example: 0
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          description: Pagination and navigation links (HATEOAS)

    AssignCategoryRequest:
      type: object
      required: [ category_general, category_detail, recipient_ids ]
      properties:
        category_general:
          type: string
          minLength: 1
          description: Category general name (automatically normalised to uppercase)
          example: "groceries"
        category_detail:
          type: string
          minLength: 1
          description: Category detail name (automatically normalised to uppercase)
          example: "food"
        recipient_ids:
          oneOf:
            - type: integer
              minimum: 1
            - type: array
              items:
                type: integer
                minimum: 1
              minItems: 1
          description: Single recipient ID or array of recipient IDs to assign category to
          examples:
            - 5
            - [ 5, 8, 12, 15 ]

    AssignCategoryResponse:
      type: object
      required: [ updated_recipients, links ]
      properties:
        updated_recipients:
          type: integer
          minimum: 0
          description: Number of recipients that were updated
          example: 4
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          description: Available next actions (HATEOAS links)

    # ==================== Recipient Schemas ====================

    RecipientBase:
      type: object
      required: [ name ]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[A-Za-z0-9\s\-\.,&]+$'
          description: |
            Recipient name (automatically normalised to uppercase).
            **Constraints**: 1-255 characters, alphanumeric, spaces, hyphens, periods, commas, ampersands.
            **Examples**: "John Smith", "ACME Corp Ltd", "Smith & Associates"
          example: "john smith"
        account_number:
          type: string
          nullable: true
          minLength: 4
          maxLength: 50
          pattern: '^[A-Za-z0-9\-]+$'
          description: |
            Optional recipient account number (must be unique if provided).
            **Constraints**: 4-50 characters, alphanumeric and hyphens only.
            **Use**: For precise recipient identification and duplicate detection.
          example: "12345678"
        default_category_id:
          type: integer
          nullable: true
          minimum: 1
          description: |
            Optional default category ID for transactions with this recipient.
            **Use**: Automatically categorise transactions from this recipient.
            **Note**: Must reference an existing active category.
          example: 5
        notes:
          type: string
          nullable: true
          maxLength: 1000
          description: |
            Optional notes about the recipient for reference and context.
            **Use**: Additional details, business relationship, contact info.
          example: "Regular client for grocery transactions, preferred payment terms NET30"
        address:
          type: string
          nullable: true
          maxLength: 500
          description: |
            Optional recipient address (automatically normalised to uppercase).
            **Use**: For reporting, invoicing, and record-keeping purposes.
          example: "123 main street, london, UK"

    RecipientUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          nullable: true
          description: Recipient name (automatically normalised to uppercase)
          example: "jane doe"
        account_number:
          type: string
          nullable: true
          description: Account number (must be unique if provided, null to clear)
          example: "87654321"
        default_category_id:
          type: integer
          nullable: true
          minimum: 1
          description: Default category ID (null to clear)
          example: 8
        notes:
          type: string
          nullable: true
          description: Notes about the recipient (null to clear)
          example: "Updated notes"
        address:
          type: string
          nullable: true
          description: Recipient address (null to clear, automatically normalised to uppercase)
          example: "456 new street, manchester"

    RecipientResponse:
      type: object
      required: [ id, name, created_at, links ]
      properties:
        id:
          type: integer
          minimum: 1
          description: Unique recipient identifier
          example: 1
        name:
          type: string
          description: Recipient name (normalised to uppercase)
          example: "JOHN SMITH"
        account_number:
          type: string
          nullable: true
          description: Account number
          example: "12345678"
        default_category_id:
          type: integer
          nullable: true
          minimum: 1
          description: Default category ID
          example: 5
        notes:
          type: string
          nullable: true
          description: Notes about the recipient
          example: "Regular client for grocery transactions"
        address:
          type: string
          nullable: true
          description: Recipient address (normalised to uppercase)
          example: "123 MAIN STREET, LONDON"
        created_at:
          type: string
          format: date-time
          description: Recipient creation timestamp
          example: "2026-01-15T10:30:00Z"
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: Last update timestamp
          example: "2026-01-20T14:45:00Z"
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          description: Available actions for this recipient (HATEOAS links)

    RecipientsListResponse:
      type: object
      required: [ items, total, limit, offset, links ]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RecipientResponse'
          description: Array of recipient objects
        total:
          type: integer
          minimum: 0
          description: Total count of recipients in the system
          example: 45
        limit:
          type: integer
          minimum: 1
          description: Limit used for this page
          example: 10
        offset:
          type: integer
          minimum: 0
          description: Offset used for this page
          example: 0
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          description: Pagination and navigation links (HATEOAS)

    # ==================== Transaction Schemas ====================

    TransactionBase:
      type: object
      required: [ date, bank_account, recipient_id, amount ]
      properties:
        date:
          type: string
          format: date
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: |
            Transaction date in YYYY-MM-DD format (ISO 8601).
            Must be a valid date.
          example: "2026-01-15"
        bank_account:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Bank account identifier or name.
            Used for filtering and grouping transactions by account.
          example: "Chase Current Account"
        recipient_id:
          type: integer
          minimum: 1
          description: |
            ID of the recipient/payee for this transaction.
            Must reference an existing recipient.
          example: 3
        memo:
          type: string
          nullable: true
          maxLength: 1000
          description: |
            Optional memo or note about the transaction.
            Usually contains the description from the bank statement.
          example: "Grocery shopping at Tesco"
        amount:
          type: number
          format: float
          multipleOf: 0.01
          description: |
            Transaction amount.
            Negative values represent expenses/debits, positive values represent income/credits.
          example: -45.67
        currency:
          type: string
          nullable: true
          minLength: 3
          maxLength: 3
          pattern: '^[A-Z]{3}$'
          description: |
            Currency code in ISO 4217 format (3-letter code).
            **Examples**: GBP, EUR, USD, JPY
          example: "GBP"
        balance:
          type: number
          format: float
          nullable: true
          multipleOf: 0.01
          description: |
            Account balance after this transaction.
            Optional field, useful for reconciliation.
          example: 1254.33
        category_id:
          type: integer
          nullable: true
          minimum: 1
          description: |
            Optional category ID for transaction classification.
            Must reference an existing active category.
          example: 1
        comment:
          type: string
          nullable: true
          maxLength: 1000
          description: |
            Optional additional comment or note.
            Used for annotations beyond the transaction memo.
          example: "Split payment with flatmate"

    TransactionUpdate:
      type: object
      properties:
        date:
          type: string
          format: date
          nullable: true
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Transaction date (YYYY-MM-DD format)
          example: "2026-01-15"
        bank_account:
          type: string
          nullable: true
          minLength: 1
          maxLength: 255
          description: Bank account identifier
          example: "Chase Current Account"
        recipient_id:
          type: integer
          nullable: true
          minimum: 1
          description: Recipient ID
          example: 3
        memo:
          type: string
          nullable: true
          maxLength: 1000
          description: Transaction memo/note (null to clear)
          example: "Updated memo"
        amount:
          type: number
          format: float
          nullable: true
          multipleOf: 0.01
          description: Transaction amount
          example: -52.30
        currency:
          type: string
          nullable: true
          minLength: 3
          maxLength: 3
          pattern: '^[A-Z]{3}$'
          description: Currency code (ISO 4217)
          example: "GBP"
        balance:
          type: number
          format: float
          nullable: true
          multipleOf: 0.01
          description: Account balance (null to clear)
          example: 1200.00
        category_id:
          type: integer
          nullable: true
          minimum: 1
          description: Category ID (null to clear)
          example: 8
        comment:
          type: string
          nullable: true
          maxLength: 1000
          description: Additional comment (null to clear)
          example: "Split payment noted"

    TransactionResponse:
      type: object
      required: [ id, date, bank_account, recipient_id, amount, created_at, links ]
      properties:
        id:
          type: integer
          minimum: 1
          description: Unique transaction identifier
          example: 1
        date:
          type: string
          format: date
          description: Transaction date (YYYY-MM-DD)
          example: "2026-01-15"
        bank_account:
          type: string
          description: Bank account identifier
          example: "Chase Current Account"
        recipient_id:
          type: integer
          nullable: true
          minimum: 1
          description: Recipient ID
          example: 3
        memo:
          type: string
          nullable: true
          description: Transaction memo/note
          example: "Grocery shopping"
        amount:
          type: number
          format: float
          description: Transaction amount (negative for expenses, positive for income)
          example: -45.67
        currency:
          type: string
          nullable: true
          description: Currency code (ISO 4217)
          example: "GBP"
        balance:
          type: number
          format: float
          nullable: true
          description: Account balance after transaction
          example: 1254.33
        category_id:
          type: integer
          nullable: true
          minimum: 1
          description: Category ID
          example: 1
        comment:
          type: string
          nullable: true
          description: Additional comment
          example: null
        created_at:
          type: string
          format: date-time
          description: Transaction creation timestamp
          example: "2026-01-15T10:30:00Z"
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: Last update timestamp
          example: "2026-01-20T14:45:00Z"
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
          description: Available actions for this transaction (HATEOAS links)

    TransactionsListResponse:
      type: object
