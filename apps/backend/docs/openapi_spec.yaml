  # ==================== Import Endpoints ====================

  /api/import/csv:
    options:
      tags: [ import ]
      summary: Discover CSV import capabilities
      description: |
        Returns available HTTP methods and HATEOAS links for the CSV import endpoint.
        Use this to discover what import operations are available and supported bank formats.
      operationId: getCSVImportOptions
      responses:
        '200':
          description: Available methods and navigation links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptionsResponse'
              example:
                methods:
                  - method: POST
                    description: Import transactions from CSV file using predefined bank configurations
                links:
                  - rel: custom_import
                    href: http://localhost:3002/api/import/csv/custom
                    method: POST
                    title: Import with custom configuration

    post:
      tags: [ import ]
      summary: Import transactions from CSV file
      description: |
        Upload and import financial transactions from a CSV file using predefined bank configurations.
        
        **Features:**
        - Support for multiple bank formats (Chase, Belfius, etc.)
        - Automatic duplicate detection and prevention
        - File validation (type and size)
        - Batch processing with detailed results
        - Audit logging for compliance
        
        **File Requirements:**
        - Must be a CSV file (.csv extension)
        - Maximum size: 50MB
        - Supported encodings: UTF-8 (default), others configurable
        
        **Duplicate Handling:**
        - System automatically detects duplicate transactions
        - Duplicates are counted but not imported
        - Import continues with unique transactions
      operationId: importCSVFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ file, bank_name ]
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV file containing transaction data
                bank_name:
                  type: string
                  description: Name of the bank (e.g., 'chase', 'belfius')
                  example: "chase"
            examples:
              chase_upload:
                summary: Upload Chase bank CSV
                value:
                  bank_name: "chase"
              belfius_upload:
                summary: Upload Belfius bank CSV
                value:
                  bank_name: "belfius"
      parameters:
        - name: bank_name
          in: query
          required: true
          schema:
            type: string
            enum: [ "chase", "belfius", "hsbc", "barclays", "lloyds" ]
          description: |
            Name of the bank configuration to use for CSV parsing.
            Each bank has predefined column mappings and formats.
            
            **Supported Banks:**
            - chase: JPMorgan Chase Bank format
            - belfius: Belfius Bank (Belgium) format  
            - hsbc: HSBC Bank format
            - barclays: Barclays Bank format
            - lloyds: Lloyds Bank format
            
            For unsupported banks, use `/api/import/csv/custom` endpoint.
          example: "chase"
      responses:
        '200':
          description: Import completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResultWithLinks'
              example:
                batch_id: "batch_20260203_103045_abc123"
                total_processed: 150
                imported: 142
                duplicates: 8
                errors: 0
                status: "completed"
                error_message: null
                links:
                  - rel: transactions
                    href: http://localhost:3002/api/transactions
                    method: GET
                    title: View imported transactions
                  - rel: info
                    href: http://localhost:3002/api/info
                    method: GET
                    title: Updated info
                  - rel: categories
                    href: http://localhost:3002/api/categories
                    method: GET
                    title: Manage transaction categories
        '400':
          description: Invalid file or bank configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_file_type:
                  summary: Invalid file type
                  value:
                    detail: "File must be a CSV"
                    error_code: "INVALID_FILE_TYPE"
                file_too_large:
                  summary: File size exceeded
                  value:
                    detail: "File size exceeds 50MB limit"
                    error_code: "FILE_TOO_LARGE"
                invalid_bank:
                  summary: Unsupported bank
                  value:
                    detail: "Bank 'unknown_bank' not supported"
                    error_code: "UNSUPPORTED_BANK"
        '500':
          description: Import processing error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/import/csv/custom:
    options:
      tags: [ import ]
      summary: Discover custom CSV import capabilities
      description: |
        Returns available HTTP methods and HATEOAS links for the custom CSV import endpoint.
        Use this to discover what custom import configurations are supported.
      operationId: getCustomCSVImportOptions
      responses:
        '200':
          description: Available methods and navigation links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptionsResponse'
              example:
                methods:
                  - method: POST
                    description: Import CSV with custom configuration for unsupported bank formats
                links:
                  - rel: standard_import
                    href: http://localhost:3002/api/import/csv
                    method: POST
                    title: Import with predefined bank configuration

    post:
      tags: [ import ]
      summary: Import CSV with custom configuration
      description: |
        Import transactions using a custom CSV configuration for banks not included 
        in the predefined configurations.
        
        **Features:**
        - Flexible column mapping
        - Custom date formats
        - Configurable separators and encodings
        - Row skipping for headers
        - Full validation and error reporting
        
        **Configuration Requirements:**
        - Date format must be valid Python strftime format
        - Column names must exist in the CSV header
        - Amount column should contain numeric values
        
        **Use Cases:**
        - Regional banks with unique CSV formats
        - Custom export formats from accounting software
        - Legacy bank systems with non-standard layouts
      operationId: importCSVCustomConfig
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ file, bank_name, date_format, date_column, recipient_column, amount_column ]
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV file containing transaction data
                bank_name:
                  type: string
                  description: Custom bank name for identification
                  example: "regional_credit_union"
                date_format:
                  type: string
                  description: Date format using Python strftime syntax
                  example: "%m/%d/%Y"
                date_column:
                  type: string
                  description: Name of the date column in CSV
                  example: "Transaction Date"
                recipient_column:
                  type: string
                  description: Name of the recipient/description column
                  example: "Description"
                amount_column:
                  type: string
                  description: Name of the amount column
                  example: "Amount"
                memo_column:
                  type: string
                  description: Optional memo/notes column name
                  example: "Memo"
                separator:
                  type: string
                  description: CSV field separator
                  default: ","
                  example: ";"
                encoding:
                  type: string
                  description: File encoding
                  default: "utf-8"
                  example: "utf-8"
                skip_rows:
                  type: integer
                  minimum: 0
                  description: Number of header rows to skip
                  default: 0
                  example: 1
      parameters:
        - name: bank_name
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
            pattern: '^[a-zA-Z0-9_\-\s]+$'
          description: |
            Custom bank name for identification and tracking.
            Used in transaction records and audit logs.
            **Constraints**: Alphanumeric, spaces, hyphens, underscores only
          example: "regional_credit_union"
        - name: date_format
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 50
          description: |
            Date format using Python strftime syntax.
            **Common formats**:
            - %m/%d/%Y (MM/DD/YYYY, US format)
            - %d/%m/%Y (DD/MM/YYYY, European format)
            - %Y-%m-%d (YYYY-MM-DD, ISO format)
            - %d-%b-%Y (DD-MMM-YYYY, e.g., 01-Jan-2026)
          example: "%m/%d/%Y"
        - name: date_column
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
          description: |
            Name of the date column in your CSV file.
            Must match the header exactly (case-sensitive).
          example: "Transaction Date"
        - name: recipient_column
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
          description: |
            Name of the recipient/description column in your CSV file.
            Contains payee names or transaction descriptions.
          example: "Description"
        - name: amount_column
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
          description: |
            Name of the amount column in your CSV file.
            Should contain numeric values (positive for income, negative for expenses).
          example: "Amount"
        - name: memo_column
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 100
          description: |
            Optional memo/notes column name in your CSV file.
            Used for additional transaction details or references.
          example: "Memo"
        - name: separator
          in: query
          required: false
          schema:
            type: string
            enum: [ ",", ";", "\t", "|" ]
            default: ","
          description: |
            CSV field separator character.
            **Default**: "," (comma)
            **Options**: comma, semicolon, tab, pipe
          example: ";"
        - name: encoding
          in: query
          required: false
          schema:
            type: string
            enum: [ "utf-8", "utf-16", "iso-8859-1", "windows-1252" ]
            default: "utf-8"
          description: |
            File encoding format.
            **Default**: utf-8 (recommended)
            Use windows-1252 for older Excel exports, iso-8859-1 for legacy systems.
          example: "utf-8"
        - name: skip_rows
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 10
            default: 0
          description: |
            Number of header/metadata rows to skip before data starts.
            **Default**: 0 (data starts immediately)
            **Range**: 0-10
          example: 1
      responses:
        '200':
          description: Custom import completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResultWithLinks'
              example:
                batch_id: "batch_20260203_103045_custom_xyz"
                total_processed: 89
                imported: 89
                duplicates: 0
                errors: 0
                status: "completed"
                error_message: null
                links:
                  - rel: transactions
                    href: http://localhost:3002/api/transactions
                    method: GET
                    title: View imported transactions
        '400':
          description: Invalid configuration or file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_date_format:
                  summary: Invalid date format
                  value:
                    detail: "Invalid configuration: Date format '%invalid%' is not supported"
                    error_code: "INVALID_CONFIG"
                missing_column:
                  summary: Column not found
                  value:
                    detail: "Column 'InvalidColumn' not found in CSV"
                    error_code: "COLUMN_NOT_FOUND"

  /api/import/batches:
    options:
      tags: [ import ]
      summary: Discover import batch history capabilities
      description: |
        Returns available HTTP methods and HATEOAS links for the import batches collection.
        Use this to discover what operations are available for viewing import history.
      operationId: getImportBatchesOptions
      responses:
        '200':
          description: Available methods and navigation links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptionsResponse'
              example:
                methods:
                  - method: GET
                    description: Retrieve import batch history with pagination and filtering
                  - method: OPTIONS
                    description: Discover available methods on this endpoint
                links:
                  - rel: self
                    href: http://localhost:3002/api/import/batches
                    method: GET
                    title: View import history
                  - rel: new_import
                    href: http://localhost:3002/api/import/csv
                    method: POST
                    title: Import new CSV file

    get:
      tags: [ import ]
      summary: List import batch history
      description: |
        Retrieves a paginated list of import batches with support for filtering by
        bank name and status. Each batch includes comprehensive statistics about the
        import operation and links to view the imported transactions.
        
        **Features:**
        - Pagination support for large import histories
        - Filtering by bank name and status
        - Complete import statistics and metadata
        - Links to view imported transactions
        - Audit trail for compliance
        
        **Use Cases:**
        - Audit import history
        - Monitor import failures
        - Track data provenance
        - Identify duplicate import attempts
        - Review custom import configurations
        
        **Sorting:**
        Batches are sorted by creation date (newest first) for easy access to recent imports.
      operationId: getImportBatches
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
          description: |
            Maximum number of batches to return per page.
            **Default**: 50, **Range**: 1-1000
          example: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: |
            Number of batches to skip for pagination (zero-based).
            Use with limit for page navigation. **Default**: 0
          example: 0
        - name: bank_name
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 100
          description: |
            Filter by partial bank name match (case-insensitive).
            Useful for viewing imports from specific banks.
          example: "Chase"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ "processing", "completed", "completed_with_errors", "failed" ]
          description: |
            Filter by exact import status match.
            **Options:**
            - processing: Import currently in progress
            - completed: Import finished successfully with no errors
            - completed_with_errors: Import finished but some transactions failed
            - failed: Import failed completely
          example: "completed"
      responses:
        '200':
          description: Paginated import batches list with HATEOAS links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchesListResponse'
              example:
                items:
                  - id: 123
                    filename: "transactions_jan_2026.csv"
                    bank_name: "Chase"
                    status: "completed"
                    total_processed: 150
                    imported_count: 145
                    duplicate_count: 5
                    error_count: 0
                    error_message: null
                    config_used: null
                    created_at: "2026-01-15T10:30:00Z"
                    completed_at: "2026-01-15T10:30:15Z"
                    links:
                      - rel: self
                        href: http://localhost:3002/api/import/batches/123
                        method: GET
                        title: View batch details
                      - rel: transactions
                        href: http://localhost:3002/api/transactions?batch_id=123
                        method: GET
                        title: View imported transactions
                total: 45
                limit: 50
                offset: 0
                links:
                  - rel: self
                    href: http://localhost:3002/api/import/batches?limit=50&offset=0
                    method: GET
                    title: Current page
                  - rel: next
                    href: http://localhost:3002/api/import/batches?limit=50&offset=50
                    method: GET
                    title: Next page
        '500':
          description: Error retrieving import batches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: "Error retrieving import batches"
                error_code: "INTERNAL_SERVER_ERROR"

