                $ref: '#/components/schemas/ErrorResponse'

  # ==================== Transactions Endpoints ====================

  /api/transactions:
    options:
      tags: [ transactions ]
      summary: Discover transactions collection capabilities
      description: |
        Returns available HTTP methods and HATEOAS links for the transactions collection.
        Use this to discover what operations are available on transactions.
      operationId: getTransactionsOptions
      responses:
        '200':
          description: Available methods and navigation links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptionsResponse'
              example:
                methods:
                  - method: GET
                    description: Retrieve all transactions with pagination and filtering
                links:
                  - rel: self
                    href: http://localhost:3002/api/transactions
                    method: GET
                    title: List all transactions

    get:
      tags: [ transactions ]
      summary: List all transactions with pagination and filtering
      description: |
        Retrieves a paginated list of all transactions in the system.
        Each transaction includes HATEOAS links for available operations.
        
        **Features:**
        - Pagination support for large datasets
        - Filtering by date range, category, recipient, and amount
        - Sorting options (date, amount, recipient)
        - HATEOAS links for individual transaction operations
        - Audit logging for access tracking
        
        **Default Sorting:**
        Transactions are sorted by date (newest first) for consistent pagination.
      operationId: getTransactions
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
          description: |
            Maximum number of transactions to return per page.
            **Default**: 50, **Range**: 1-1000
          example: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: |
            Number of transactions to skip for pagination (zero-based).
            Use with limit for page navigation. **Default**: 0
          example: 0
        - name: category_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: |
            Filter transactions by category ID.
            Only returns transactions assigned to this category.
          example: 5
        - name: recipient_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: |
            Filter transactions by recipient ID.
            Only returns transactions with this recipient.
          example: 3
        - name: date_from
          in: query
          required: false
          schema:
            type: string
            format: date
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: |
            Filter transactions from this date (inclusive).
            **Format**: YYYY-MM-DD (ISO 8601)
          example: "2026-01-01"
        - name: date_to
          in: query
          required: false
          schema:
            type: string
            format: date
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: |
            Filter transactions to this date (inclusive).
            **Format**: YYYY-MM-DD (ISO 8601)
          example: "2026-01-31"
        - name: amount_min
          in: query
          required: false
          schema:
            type: number
            format: float
            multipleOf: 0.01
          description: |
            Filter transactions with minimum amount (inclusive).
            Supports negative values for expenses.
          example: -1000.00
        - name: amount_max
          in: query
          required: false
          schema:
            type: number
            format: float
            multipleOf: 0.01
          description: |
            Filter transactions with maximum amount (inclusive).
            Supports positive values for income.
          example: 1000.00
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [ date_asc, date_desc, amount_asc, amount_desc, recipient_asc, recipient_desc ]
            default: date_desc
          description: |
            Sort order for transactions.
            **Default**: date_desc (newest first)
            
            **Options:**
            - date_asc: Oldest first
            - date_desc: Newest first
            - amount_asc: Smallest amount first  
            - amount_desc: Largest amount first
            - recipient_asc: Alphabetical by recipient
            - recipient_desc: Reverse alphabetical by recipient
          example: date_desc
      responses:
        '200':
          description: Paginated transactions list with HATEOAS links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionsListResponse'
              example:
                items:
                  - id: 1
                    date: "2026-01-15"
                    description: "TESCO STORE 1234"
                    amount: -45.67
                    balance: 1254.33
                    category_id: 1
                    category_general: "GROCERIES"
                    category_detail: "FOOD"
                    recipient_id: 3
                    recipient_name: "Tesco PLC"
                    created_at: "2026-01-15T10:30:00Z"
                    updated_at: "2026-01-20T14:45:00Z"
                    links:
                      - rel: self
                        href: http://localhost:3002/api/transactions/1
                        method: GET
                        title: Get this transaction
                      - rel: update
                        href: http://localhost:3002/api/transactions/1
                        method: PATCH
                        title: Update this transaction
                      - rel: delete
                        href: http://localhost:3002/api/transactions/1
                        method: DELETE
                        title: Delete this transaction
                      - rel: category
                        href: http://localhost:3002/api/categories/1
                        method: GET
                        title: View transaction category
                      - rel: recipient
                        href: http://localhost:3002/api/recipients/3
                        method: GET
                        title: View transaction recipient
                total: 1250
                limit: 10
                offset: 0
                applied_filters:
                  category_id: null
                  recipient_id: null
                  date_from: null
                  date_to: null
                  amount_min: null
                  amount_max: null
                  sort: date_desc
                links:
                  - rel: self
                    href: http://localhost:3002/api/transactions?limit=10&offset=0
                    method: GET
                    title: Current page
                  - rel: next
                    href: http://localhost:3002/api/transactions?limit=10&offset=10
                    method: GET
                    title: Next page
                  - rel: first
                    href: http://localhost:3002/api/transactions?limit=10&offset=0
                    method: GET
                    title: First page
                  - rel: last
                    href: http://localhost:3002/api/transactions?limit=10&offset=1240
                    method: GET
                    title: Last page
                  - rel: categories
                    href: http://localhost:3002/api/categories
                    method: GET
                    title: Browse categories
                  - rel: recipients
                    href: http://localhost:3002/api/recipients
                    method: GET
                    title: Browse recipients
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: "Invalid date format. Expected YYYY-MM-DD"
                error_code: "INVALID_DATE_FORMAT"
        '500':
          description: Error retrieving transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

