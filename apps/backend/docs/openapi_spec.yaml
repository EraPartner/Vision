    delete:
      tags: [ recipients ]
      summary: Delete recipient
      description: |
        Deletes a recipient from the system using soft delete (default).
        Soft delete marks the recipient as inactive while preserving historical data.
        
        **Soft Delete (Default):**
        - Marks recipient as inactive (is_active=False)
        - Preserves data for historical reference
        - Maintains transaction history integrity
        - Recommended for production use
        
        **Features:**
        - Safe deletion that preserves transaction history
        - HATEOAS links for next available actions
        - Audit logging for delete operations
        - Prevents data loss while cleaning up active lists
        
        **Use Cases:**
        - Removing recipients from active lists
        - Cleaning up old or unused recipients
        - Maintaining data integrity for historical transactions
