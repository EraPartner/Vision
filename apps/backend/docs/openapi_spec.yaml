openapi: 3.1.0
info:
  title: Financial Transaction Manager API
  description: |
    A comprehensive REST Level 3 (HATEOAS) API for managing financial transactions, categories, recipients, and administrative operations.
    
    ## Features
    - Level 3 REST API implementation with full HATEOAS support
    - Financial transaction categorisation and management
    - Database administration capabilities
    - Audit logging and compliance features
    - British English terminology throughout
    
    ## Authentication
    Currently no authentication required (development setup)
    
    ## Error Handling
    All endpoints follow standard HTTP status codes and return structured error responses.

  version: 1.0.0
  contact:
    name: Financial Transaction Manager
    url: https://github.com/EraPartner/Vault-Voyager-Vision
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3002
    description: Development server

tags:
  - name: root
    description: API discovery and navigation endpoints
  - name: admin
    description: Database administration and lifecycle operations
  - name: categories
    description: Financial transaction category management
  - name: recipients
    description: Transaction recipient management
  - name: transactions
    description: Financial transaction management and retrieval
  - name: import
    description: CSV file import and data processing operations
  - name: info
    description: Financial information and reporting endpoints

paths:
  # ==================== Root API Endpoints ====================

  /api/:
    options:
      tags: [ root ]
      summary: Discover API root capabilities
      description: |
        Returns available HTTP methods and HATEOAS links for the API root.
        Use this as the entry point for API discovery and navigation.
      operationId: getRootOptions
      responses:
        '200':
          description: Available methods and navigation links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RootOptionsResponse'
              example:
                methods:
                  - method: GET
                    description: Retrieve API root with available resources
                description: "API root discovery endpoint for Level 3 REST API (HATEOAS)"
                links:
                  - rel: self
                    href: http://localhost:3002/api/
                    method: GET
                    title: API root
                  - rel: admin
                    href: http://localhost:3002/api/admin
                    method: GET
                    title: Admin status
        '500':
          description: Unable to generate API options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags: [ root ]
      summary: API root discovery endpoint
      description: |
        Serves as the entry point for Level 3 REST API navigation, providing hypermedia
        links that guide clients to available resources and operations. This endpoint
        implements the HATEOAS (Hypermedia As The Engine Of Application State) principle.
        
        **Features:**
        - API version information
        - Hypermedia links to all available resources
        - Self-documenting through links
        - Audit logging for access tracking
        
        **Security:**
        - Logs all access for audit purposes
        - No sensitive information exposed
        - Rate limiting applied through middleware
      operationId: getAPIRoot
      responses:
        '200':
          description: API metadata and navigation links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIRootResponse'
              example:
                version: "1.0.0"
                title: "Financial Transaction Manager"
                description: "Import and manage financial transactions from various banks"
                links:
                  - rel: self
                    href: http://localhost:3002/api/
                    method: GET
                    title: API root
                  - rel: admin
                    href: http://localhost:3002/api/admin
                    method: GET
                    title: Admin status
                  - rel: categories
                    href: http://localhost:3002/api/categories
                    method: GET
                    title: List categories
                  - rel: recipients
                    href: http://localhost:3002/api/recipients
                    method: GET
                    title: List recipients
                  - rel: transactions
                    href: http://localhost:3002/api/transactions
                    method: GET
                    title: List transactions
                  - rel: info
                    href: http://localhost:3002/api/info
                    method: GET
                    title: View info
                  - rel: import
                    href: http://localhost:3002/api/import/csv
                    method: POST
                    title: Import transactions
        '500':
          description: Unable to generate API root response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== Admin Endpoints ====================

  /api/admin:
    options:
      tags: [ admin ]
      summary: Discover admin endpoint capabilities
      description: |
        Returns available HTTP methods and HATEOAS links for the admin endpoint.
        Use this to discover what administrative operations are available.
      operationId: getAdminOptions
      responses:
        '200':
          description: Available methods and navigation links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptionsResponse'
              example:
                methods:
                  - method: GET
                    description: Get current database administration status
                  - method: POST
                    description: Initialise database or reset (see links for actions)
                links:
                  - rel: self
                    href: http://localhost:3002/api/admin
                    method: GET
                    title: Get current database administration status

    get:
      tags: [ admin ]
      summary: Get database administration status
      description: |
        Returns the current status of the database including whether it's initialised,
        table count, and available administrative actions as HATEOAS links.
        
        This endpoint provides crucial information for system health monitoring
        and guides administrators on available operations.
      operationId: getAdminStatus
      responses:
        '200':
          description: Database status with available actions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStatusResponse'
              example:
                is_initialised: true
                table_count: 8
                timestamp: "2026-02-03T10:30:00.000Z"
                links:
                  - rel: self
                    href: http://localhost:3002/api/admin
                    method: GET
                    title: Get current database administration status
                  - rel: init
                    href: http://localhost:3002/api/admin/database/init
                    method: POST
                    title: Initialise the database
        '500':
          description: Internal server error retrieving status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: "Error retrieving admin status"
                error_code: "INTERNAL_SERVER_ERROR"

  /api/admin/database/init:
    post:
      tags: [ admin ]
      summary: Initialise database tables
      description: |
        Initialises all database tables defined in the SQLAlchemy models.
        This operation is idempotent and safe to run multiple times.
        
        **Key Features:**
        - Creates missing tables without affecting existing data
        - Preserves all existing tables and data
        - Returns HATEOAS links for next available actions
        - Logs all operations for audit purposes
        
        **Use Cases:**
        - First-time database setup
        - Recovery after table deletion
        - Development environment setup
      operationId: initialiseDatabase
      responses:
        '201':
          description: Database initialised successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Database initialised successfully"
                details:
                  note: "All tables created or verified"
                links:
                  - rel: self
                    href: http://localhost:3002/api/admin
                    method: GET
                    title: Get current database administration status
        '500':
          description: Database initialisation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: "Error initialising database: connection failed"
                error_code: "DATABASE_INIT_ERROR"

  /api/admin/database/reset:
    post:
      tags: [ admin ]
      summary: Reset database (DESTRUCTIVE OPERATION)
      description: |
        **⚠️ DESTRUCTIVE OPERATION ⚠️**
        
        Completely resets the database by dropping and recreating all tables.
        This operation permanently deletes ALL data and cannot be undone.
        
        **Requirements:**
        - Must include `force=true` query parameter
        - Should only be used in development environments
        - Always backup database before using
        
        **Security Considerations:**
        - This endpoint can be disabled via configuration
        - Should be restricted in production environments
        - Consider additional authentication for this endpoint
        
        **Use Cases:**
        - Development environment resets
        - Test data cleanup
        - Starting fresh during development
      operationId: resetDatabase
      parameters:
        - name: force
          in: query
          required: true
          schema:
            type: boolean
            enum: [ true ]
          description: Must be set to true to confirm the destructive operation
          example: true
      responses:
        '200':
          description: Database reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Database reset successfully"
                details:
                  warning: "All previous data has been permanently deleted"
                links:
                  - rel: init
                    href: http://localhost:3002/api/admin/database/init
                    method: POST
                    title: Initialise the database
        '400':
          description: Force parameter missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Database reset requires force=true parameter"
                details:
                  error: "Set force=true query parameter to confirm reset (DESTRUCTIVE OPERATION)"
        '500':
          description: Database reset failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: "Error resetting database: operation failed"
                error_code: "DATABASE_RESET_ERROR"
        '404':
          description: Endpoint not available (disabled in configuration)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: "Database reset endpoint is disabled"
                error_code: "ENDPOINT_DISABLED"

  # ==================== Categories Endpoints ====================

  /api/categories:
    options:
      tags: [ categories ]
      summary: Discover categories collection capabilities
      description: |
        Returns available HTTP methods and HATEOAS links for the categories collection.
        Use this to discover what operations are available on categories.
      operationId: getCategoriesOptions
      responses:
        '200':
          description: Available methods and navigation links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptionsResponse'
              example:
                methods:
                  - method: GET
                    description: Retrieve all categories with pagination
                  - method: POST
                    description: Create a new category
                links:
                  - rel: self
                    href: http://localhost:3002/api/categories
                    method: GET
                    title: List all categories

    get:
      tags: [ categories ]
      summary: List all categories with pagination
      description: |
        Retrieves a paginated list of all active categories in the system.
        Each category includes HATEOAS links for available operations.
        
        **Features:**
        - Pagination support for large datasets
        - Hierarchical category structure (General:Detail)
        - HATEOAS links for individual category operations
        - Audit logging for access tracking
        
        **Sorting:**
        Categories are sorted by creation order (ID) for consistent pagination.
      operationId: getCategories
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
          description: |
            Maximum number of categories to return per page.
            **Default**: 50, **Range**: 1-1000
          example: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: |
            Number of categories to skip for pagination (zero-based).
            Use with limit for page navigation. **Default**: 0
          example: 0
        - name: active
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: |
            Filter categories by active status. When true, returns only active categories.
            When false, returns all categories including inactive ones.
            **Default**: true
          example: true
      responses:
        '200':
          description: Paginated categories list with HATEOAS links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriesListResponse'
              example:
                items:
                  - id: 1
                    general: "GROCERIES"
                    detail: "FOOD"
                    description: "Food and grocery purchases"
                    created_at: "2026-01-15T10:30:00Z"
                    updated_at: "2026-01-20T14:45:00Z"
                    links:
                      - rel: self
                        href: http://localhost:3002/api/categories/1
                        method: GET
                        title: Get this category
                      - rel: update
                        href: http://localhost:3002/api/categories/1
                        method: PATCH
                        title: Update this category
                      - rel: delete
                        href: http://localhost:3002/api/categories/1
                        method: DELETE
                        title: Delete this category
                total: 25
                limit: 10
                offset: 0
                links:
                  - rel: self
                    href: http://localhost:3002/api/categories?limit=10&offset=0
                    method: GET
                    title: Current page
                  - rel: next
                    href: http://localhost:3002/api/categories?limit=10&offset=10
                    method: GET
                    title: Next page
        '500':
          description: Error retrieving categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: "Error retrieving categories"
                error_code: "INTERNAL_SERVER_ERROR"

    post:
      tags: [ categories ]
      summary: Create or get existing category
      description: |
        Creates a new category with the specified general and detail names.
        If a category with the same General:Detail combination already exists,
        returns the existing category instead of creating a duplicate.
        
        **Features:**
        - Automatic deduplication based on General:Detail combination
        - Input normalisation (uppercase, trimmed)
        - Optional description 
        - HATEOAS links for category operations
        
        **Validation:**
        - General and Detail names are required
        - Names are automatically normalised to uppercase
        - Colour must be valid hex format if provided
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryBase'
            example:
              general: "groceries"
              detail: "food"
              description: "Food and grocery purchases"
      responses:
        '201':
          description: Category created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
              example:
                id: 5
                general: "GROCERIES"
                detail: "FOOD"
                description: "Food and grocery purchases"
                created_at: "2026-02-03T10:30:00Z"
                updated_at: null
                links:
                  - rel: self
                    href: http://localhost:3002/api/categories/5
                    method: GET
                    title: Get this category
                  - rel: update
                    href: http://localhost:3002/api/categories/5
                    method: PATCH
                    title: Update this category
        '200':
          description: Existing category returned (no duplicate created)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          description: Validation error in request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: "General name cannot be empty"
                error_code: "VALIDATION_ERROR"
        '500':
          description: Error creating category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/categories/{categoryId}:
    options:
      tags: [ categories ]
      summary: Discover individual category capabilities
      description: |
        Returns available HTTP methods and HATEOAS links for a specific category.
        Use this to discover what operations are available on an individual category.
      operationId: getCategoryOptions
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: Available methods and navigation links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptionsResponse'
              example:
                methods:
                  - method: GET
                    description: Retrieve a specific category by ID
                  - method: PATCH
                    description: Update a category
                  - method: DELETE
                    description: Delete a category
                links:
                  - rel: self
                    href: http://localhost:3002/api/categories/1
                    method: GET
                    title: Get this category
                  - rel: update
                    href: http://localhost:3002/api/categories/1
                    method: PATCH
                    title: Update this category

    get:
      tags: [ categories ]
      summary: Get category by ID
      description: |
        Retrieves detailed information for a single category identified by its ID.
        Returns the category with all its properties and HATEOAS links for available operations.
        
        **Features:**
        - Complete category information
        - HATEOAS links for operations (update, delete, list)
        - Audit logging for access tracking
      operationId: getCategoryById
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: Category details with HATEOAS links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
              example:
                id: 1
                general: "GROCERIES"
                detail: "FOOD"
                description: "Food and grocery purchases"
                created_at: "2026-01-15T10:30:00Z"
                updated_at: "2026-01-20T14:45:00Z"
                links:
                  - rel: self
                    href: http://localhost:3002/api/categories/1
                    method: GET
                    title: Get this category
                  - rel: update
                    href: http://localhost:3002/api/categories/1
                    method: PATCH
                    title: Update this category
                  - rel: delete
                    href: http://localhost:3002/api/categories/1
                    method: DELETE
                    title: Delete this category
                  - rel: list
                    href: http://localhost:3002/api/categories
                    method: GET
                    title: List all categories
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: "Category not found"
                error_code: "CATEGORY_NOT_FOUND"
        '500':
          description: Error retrieving category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags: [ categories ]
      summary: Update category
      description: |
        Partially updates an existing category with the provided values.
        Only fields included in the request body will be updated.
        
        **Features:**
        - Partial updates (only specified fields changed)
        - Input normalisation for text fields
        - Validation for all updated fields
        - Returns updated category with HATEOAS links
        
        **Validation:**
        - All fields are optional (partial update)
        - Text fields are normalised to uppercase
        - Colour must be valid hex format if provided
      operationId: updateCategory
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
            example:
              description: "Updated description for food category"
      responses:
        '200':
          description: Category updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
              example:
                id: 1
                general: "GROCERIES"
                detail: "FOOD"
                description: "Updated description for food category"
                created_at: "2026-01-15T10:30:00Z"
                updated_at: "2026-02-03T10:30:00Z"
                links:
                  - rel: self
                    href: http://localhost:3002/api/categories/1
                    method: GET
                    title: Get this category
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: "Category not found"
                error_code: "CATEGORY_NOT_FOUND"
        '400':
          description: Validation error in update data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error updating category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [ categories ]
      summary: Delete category
      description: |
        Deletes a category from the system. Supports both soft delete (default)
        and hard delete operations.
        
        **Soft Delete (Default):**
        - Marks category as inactive (is_active=False)
        - Preserves data for historical reference
        - Maintains referential integrity
        - Recommended for production use
        
        **Hard Delete:**
        - Permanently removes category from database
        - Cannot be undone
        - May cause referential integrity issues
        - Use with caution
        
        **Features:**
        - Configurable delete type via query parameter
        - HATEOAS links for next available actions
        - Audit logging for delete operations
      operationId: deleteCategory
      parameters:
        - $ref: '#/components/parameters/CategoryId'
        - name: soft
          in: query
          schema:
            type: boolean
            default: true
          description: |
            Whether to perform a soft delete (true) or hard delete (false).
            Soft delete is recommended to preserve historical data.
          example: true
      responses:
        '200':
          description: Category deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "Category deleted successfully"
                details:
                  operation: "soft_delete"
                  note: "Category marked as inactive but preserved for historical reference"
                links:
                  - rel: list
                    href: http://localhost:3002/api/categories
                    method: GET
                    title: List remaining categories
                  - rel: create
                    href: http://localhost:3002/api/categories
                    method: POST
                    title: Create a new category
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: "Category not found"
                error_code: "CATEGORY_NOT_FOUND"
        '500':
          description: Error deleting category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/categories/assign:
    options:
      tags: [ categories ]
      summary: Discover category assignment capabilities
      description: |
        Returns available HTTP methods for the category assignment endpoint.
        Use this to discover how to assign categories to recipients.
      operationId: getAssignCategoryOptions
      responses:
        '200':
          description: Available methods and navigation links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptionsResponse'

    post:
      tags: [ categories ]
      summary: Assign category to recipients
      description: |
        Assigns a category to one or multiple recipients. Creates the category
        if it doesn't exist using the provided general and detail names.
        
        **Features:**
        - Bulk assignment to multiple recipients
        - Automatic category creation if needed
        - Input validation and normalisation
        - Returns count of updated recipients
        - HATEOAS links for next actions
        
        **Validation:**
        - Category general and detail names are required
        - At least one recipient ID must be provided
        - All recipient IDs must exist in the system
        
        **Use Cases:**
        - Setting default categories for new recipients
        - Bulk categorisation operations
        - Category assignment workflows
      operationId: assignCategoryToRecipients
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignCategoryRequest'
            examples:
              single_recipient:
                summary: Assign to single recipient
                value:
                  category_general: "groceries"
                  category_detail: "food"
                  recipient_ids: 5
              multiple_recipients:
                summary: Assign to multiple recipients
                value:
                  category_general: "groceries"
                  category_detail: "food"
                  recipient_ids: [ 5, 8, 12, 15 ]
      responses:
        '200':
          description: Category assigned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignCategoryResponse'
              example:
                updated_recipients: 4
                links:
                  - rel: assigned_category
                    href: http://localhost:3002/api/categories/3
                    method: GET
                    title: Get the assigned category
                  - rel: categories_list
                    href: http://localhost:3002/api/categories
                    method: GET
                    title: Get all categories
        '400':
          description: Invalid request data or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_category:
                  summary: Missing category information
                  value:
                    detail: "Category general name is required"
                    error_code: "VALIDATION_ERROR"
                empty_recipients:
                  summary: No recipients provided
                  value:
                    detail: "At least one recipient ID must be provided"
                    error_code: "VALIDATION_ERROR"
        '404':
          description: One or more recipients not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: "Recipient with ID 999 not found"
                error_code: "RECIPIENT_NOT_FOUND"
        '500':
          description: Error assigning category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  # ==================== Recipients Endpoints ====================

  /api/recipients:
    options:
      tags: [ recipients ]
      summary: Discover recipients collection capabilities
      description: |
        Returns available HTTP methods and HATEOAS links for the recipients collection.
        Use this to discover what operations are available on recipients.
      operationId: getRecipientsOptions
      responses:
        '200':
          description: Available methods and navigation links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptionsResponse'
              example:
                methods:
                  - method: GET
                    description: Retrieve all recipients with optional filtering
                  - method: POST
                    description: Create a new recipient
                links:
                  - rel: self
                    href: http://localhost:3002/api/recipients
                    method: GET
                    title: List all recipients

    get:
      tags: [ recipients ]
      summary: List all recipients with optional filtering
      description: |
        Retrieves a paginated list of all active recipients in the system.
        Each recipient includes HATEOAS links for available operations.
        Supports filtering by name, account number, and default category.
        
        **Features:**
        - Pagination support for large datasets
        - Optional filtering by multiple criteria
        - HATEOAS links for individual recipient operations
        - Audit logging for access tracking
        
        **Filtering:**
        - Name: Partial match search (case-insensitive)
        - Account Number: Exact match search
        - Default Category: Filter by category ID
      operationId: getRecipients
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
          description: |
            Maximum number of recipients to return per page.
            **Default**: 50, **Range**: 1-1000
          example: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: |
            Number of recipients to skip for pagination (zero-based).
            Use with limit for page navigation. **Default**: 0
          example: 0
        - name: name
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 255
          description: |
            Filter recipients by partial name match (case-insensitive).
            Searches for recipients containing this text in their name.
          example: "john"
        - name: account_number
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 50
          description: |
            Filter recipients by exact account number match.
            Use for precise recipient identification.
          example: "12345678"
        - name: default_category_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: |
            Filter recipients by their default category assignment.
            Shows recipients that default to this category ID.
          example: 5
        - name: active
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: |
            Filter recipients by active status. When true, returns only active recipients.
            When false, returns all recipients including inactive ones.
            **Default**: true
          example: true
