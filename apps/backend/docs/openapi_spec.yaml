      summary: Get filtered transaction summary
      description: |
        Provides detailed transaction summary with optional filtering by bank account and date range.
        
        **Features:**
        - Flexible filtering by bank account, date range
        - Aggregated statistics for filtered data
        - Support for custom reporting periods
        - Real-time calculations
        - HATEOAS navigation to related resources
        
        **Filtering Options:**
        - Bank account: Filter by specific bank account
        - Date range: Start and end dates (inclusive)
        - Combinations: Multiple filters can be applied together
        
        **Use Cases:**
        - Monthly/quarterly financial reports
        - Account-specific analysis
        - Period comparison reporting
        - Budget vs actual analysis
      operationId: getTransactionSummary
      parameters:
        - name: bank_account
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 255
          description: |
            Filter by specific bank account name.
            Use exact account name as it appears in imported transactions.
            **Note**: Use `/api/statistics/banks` to get available account names.
          example: "Chase Current Account"
        - name: start_date
          in: query
          required: false
          schema:
