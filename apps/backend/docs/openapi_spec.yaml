          required: false
          schema:
            type: string
            format: date
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: |
            End date for filtering (inclusive).
            **Format**: YYYY-MM-DD (ISO 8601)
            **Note**: Must be after or equal to start_date if both provided.
          example: "2026-01-31"
      responses:
