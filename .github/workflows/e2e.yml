# Scheduled end-to-end + accessibility suite.
#
# These Playwright suites are deliberately NOT part of ci.yml (they would add
# minutes to every PR for flows that change rarely). Instead they run nightly
# and on demand against the real Docker stack, so regressions in critical user
# journeys and a11y are still caught — just off the PR critical path.
#
# This workflow is modeled on ci.yml's docker-verify / test-live-api-contracts
# jobs and shares their compose bring-up via .github/actions/compose-up (stub
# .env + plain `docker compose up -d` + /health poll).
name: E2E (scheduled)

on:
  schedule:
    # 03:17 UTC daily (offset from the hour to avoid Actions congestion).
    - cron: "17 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  e2e:
    name: E2E + a11y (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Isolate this stack from the real `vision` compose project (the default from
    # the repo dir basename). Without this, running these steps locally shares the
    # vision_postgres_data volume with the packaged app and dev stack — a teardown
    # or reset would wipe real financial data. Distinct project ⇒ distinct volumes.
    env:
      COMPOSE_PROJECT_NAME: vision_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Generate locales
        run: CI=1 bun run generate-locales

      - name: Install Playwright browser (chromium)
        run: cd apps/frontend && bunx playwright install --with-deps chromium

      # No image artifact here — compose builds the `app` image implicitly
      # (fresh runner → no cached image), so current source runs.
      #
      # SECRET_KEY: the backend requires one; any 32+ char test value works.
      # VISION_DEV=true enables the app's sanctioned dev/test bypass (skips
      # rate limiting) so the suite's rapid full-page navigation across every
      # route doesn't trip the 30/min per-route limiters (e.g. exchange-rates)
      # and surface as false "network drift" 429s. Test-env only — production
      # defaults are untouched; this suite exercises UI/a11y/contracts, not
      # rate limiting.
      - name: Bring up the compose stack
        uses: ./.github/actions/compose-up
        with:
          extra-env: |
            SECRET_KEY=ci_test_secret_key_minimum_32_chars_!
            VISION_DEV=true
          health-attempts: "60"
          health-interval: "2"

      - name: Run E2E + a11y suites
        run: cd apps/frontend && bun run test:e2e
        env:
          CI: "1"
          PLAYWRIGHT_BASE_URL: http://localhost:3002

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 14

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --no-color | tail -200

      # A nightly failure would otherwise only email the workflow file's last
      # editor and gate nothing. Open (or comment on) a single tracking issue so
      # a broken critical-flow/a11y suite is visible. Scheduled runs only, so a
      # manual workflow_dispatch debugging failure doesn't spam issues.
      - name: Open/refresh tracking issue on nightly failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Nightly E2E/a11y suite is failing"
          BODY="The scheduled E2E + a11y suite failed on $(date -u +%Y-%m-%d). Run: $RUN_URL"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
