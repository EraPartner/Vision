# Scheduled end-to-end + accessibility suite.
#
# These Playwright suites are deliberately NOT part of ci.yml (they would add
# minutes to every PR for flows that change rarely). Instead they run nightly
# and on demand against the real Docker stack, so regressions in critical user
# journeys and a11y are still caught — just off the PR critical path.
#
# NOTE: this workflow is modeled on ci.yml's docker-verify / test-live-api-contracts
# jobs but has not yet had a live run on GitHub Actions. Confirm the first
# scheduled/dispatch run is green and adjust the browser-install / compose steps
# if the runner image differs from expectations.
name: E2E (scheduled)

on:
  schedule:
    # 03:17 UTC daily (offset from the hour to avoid Actions congestion).
    - cron: "17 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E + a11y (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Isolate this stack from the real `vision` compose project (the default from
    # the repo dir basename). Without this, running these steps locally shares the
    # vision_postgres_data volume with the packaged app and dev stack — a teardown
    # or reset would wipe real financial data. Distinct project ⇒ distinct volumes.
    env:
      COMPOSE_PROJECT_NAME: vision_e2e
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Cache bun dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate locales
        run: CI=1 bun run generate-locales

      - name: Install Playwright browser (chromium)
        run: cd apps/frontend && bunx playwright install --with-deps chromium

      - name: Create stub .env for Docker Compose
        run: |
          # VISION_DEV=true enables the app's sanctioned dev/test bypass (skips
          # rate limiting) so the suite's rapid full-page navigation across every
          # route doesn't trip the 30/min per-route limiters (e.g. exchange-rates)
          # and surface as false "network drift" 429s. Test-env only — production
          # defaults are untouched; this suite exercises UI/a11y/contracts, not
          # rate limiting.
          printf 'POSTGRES_PASSWORD=ci_test_password\nDATABASE_URL=postgresql://ftm_user:ci_test_password@db:5432/financial_transactions\nSECRET_KEY=ci_test_secret_key_minimum_32_chars_!\nLOG_LEVEL=warn\nENABLE_LOGGING=true\nVISION_DEV=true\n' > .env

      # Use a plain `up -d` (NOT `up -d --build`). On the ubuntu-24.04 runner's
      # Docker Compose, `up -d --build` fails env_file resolution and aborts with
      # "env file .../.env not found" — even though the stub .env exists at the
      # repo root. The exact internal cause is unconfirmed (it does not reproduce
      # on newer local Compose), but ci.yml's docker-verify and test-live-api-
      # contracts jobs use the same stub .env with a plain `up -d` and pass, so
      # we mirror that proven invocation. Compose still builds the `app` image
      # implicitly here (fresh runner → no cached image), so current source runs.
      - name: Start the stack (Docker Compose)
        run: docker compose -f docker-compose.yml up -d

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3002/health >/dev/null; then
              echo "Backend healthy after ${i} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy in time."
          docker compose -f docker-compose.yml logs --no-color | tail -100
          exit 1

      - name: Run E2E + a11y suites
        run: cd apps/frontend && bun run test:e2e
        env:
          CI: "1"
          PLAYWRIGHT_BASE_URL: http://localhost:3002

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 14

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --no-color | tail -200
