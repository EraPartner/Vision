name: CI

on:
  # NOTE: this workflow deliberately has NO paths filter. "CI Complete" is the
  # required status check, and a filter that excluded a whole diff would skip the
  # workflow entirely, so "CI Complete" would never report and the PR would sit
  # blocked forever (this is exactly what happened to docs-only PRs while
  # `paths-ignore: [docs/**, *.md]` was set here).
  #
  # Path filtering now happens INSIDE the workflow: the `changes` job classifies
  # the diff and the expensive tiers are gated on `changes.outputs.code`, while
  # `changes`, `repo-checks` and `ci-complete` always run. That
  # keeps a single required check that always reports on every diff.
  #
  # Do NOT reintroduce a top-level `paths`/`paths-ignore` filter here, and do NOT
  # solve docs-only skipping with a second workflow that also names a job
  # "CI Complete": a mixed docs+code PR matches both filters, both workflows run,
  # and two checks share the required name — the no-op one can report success
  # before the real pipeline finishes, which is a merge-gate bypass.
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    # No ready_for_review: every job also runs on drafts, so marking a PR
    # ready does not need a second full run.
    types: [opened, synchronize, reopened]

permissions: {}

# Cancel superseded PR runs so a rapid succession of pushes to the same branch
# doesn't queue redundant pipelines; never cancel a push to main/tags, so every
# main commit gets a full "CI Complete" verdict (needed for bisecting a
# regression — a cancelled run on main leaves a gap).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Detect Changes — classifies the diff so the code tiers can be skipped
  # on documentation-only changes WITHOUT stranding the required "CI Complete"
  # check (see the note on the triggers above).
  #
  # "docs" means the `docs/` tree or a ROOT-level *.md. Anything else — including
  # a nested *.md outside docs/ and .agents/ or .codex/ — counts as code,
  # because such files can be referenced by builds or tooling. Executable files,
  # symlinks and agent configuration also count as code. Plain agent Markdown
  # uses the focused agent-tooling checks; mixed changes run the full pipeline.
  #
  # Fails safe: if the base cannot be resolved for any reason, `code` is 'true'
  # and the full pipeline runs.
  # ─────────────────────────────────────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Classify changed paths
        id: classify
        # Values reach the script through env, never via ${{ }} interpolation
        # into `run:` — same convention as the rest of this workflow.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: bun scripts/ci-classify.ts

  # ─────────────────────────────────────────────────────────────────────────────
  # Repo Checks — the cheap checks that run on EVERY diff, docs included: agent
  # tooling, commit messages, secrets, dependency review and the branch
  # protection verifier. A leaked credential in a markdown file must still fail
  # CI, so this job has no `changes` gate.
  # ─────────────────────────────────────────────────────────────────────────────
  repo-checks:
    name: Repo Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # gitleaks-action lists the PR's commits via the API to scan the diff
      # range, and dependency-review reads the PR; without pull-requests:read
      # both 403 ("Resource not accessible by integration") on every PR.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Reject vulnerable dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

      - name: Secrets scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: config/gitleaks.toml
          # The scan result gates via exit code; skip the report-artifact upload so
          # a hit Actions artifact-storage quota can't fail an otherwise-clean scan.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Check agent instructions and CI classification
        run: |
          bun scripts/check-agent-instructions.ts
          bun test scripts/tests/ci-classify.test.ts

      - name: Enforce private internal package boundaries
        run: |
          bun scripts/check-package-boundaries.ts
          bun test scripts/tests/package-boundaries.test.ts

      - name: Enforce workflow supply-chain policy
        run: |
          bun scripts/check-workflow-supply-chain.ts
          bun test scripts/tests/workflow-supply-chain.test.ts

      # Commit messages — enforce the same conventional-commit contract as the
      # local commit-msg hook. This cannot be bypassed with `git commit --no-verify`.
      - name: Lint commit range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            from="$PR_BASE_SHA"; to="$PR_HEAD_SHA"
          else
            from="$PUSH_BEFORE"; to="$PUSH_SHA"
          fi

          if [ -z "$to" ] || ! git cat-file -e "$to^{commit}" 2>/dev/null; then
            echo "Commit range head is not resolvable; refusing to skip commit-message validation."
            exit 1
          elif [ -z "$from" ] || [ "$from" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$from^{commit}" 2>/dev/null; then
            echo "Commit range base is not resolvable; linting the event head commit without ignore rules."
            git log -1 --format=%B "$to" | bun scripts/commitlint.ts
          else
            bun scripts/commitlint.ts --from "$from" --to "$to"
          fi

      # Branch protection — auto-merge lands a PR as soon as the *required*
      # checks pass, so that automation is only ever as safe as the ruleset's
      # required-check list. This reads the rules that actually apply to the
      # default branch and fails if our gates are not among them. It queries the
      # per-branch `rules` endpoint rather than `rulesets` on purpose: `rules`
      # answers "what applies to this branch" and is readable with the
      # workflow's own token, where the rulesets admin endpoint is not.
      #
      # It fails closed: an unreadable rules API is an unverified protection
      # state, not evidence that the merge gates still exist.
      - name: Verify branch protection
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Two separate mechanisms, asserted separately because that is how this
          # repo actually enforces them:
          #   • "CI Complete" is the aggregate status check the ruleset requires.
          #   • CodeQL is NOT a required status check — it is enforced by the
          #     ruleset's dedicated `code_scanning` rule, which gates on alert
          #     severity rather than on the analysis job's check run.
          EXPECTED_CHECKS=$'CI Complete'
          EXPECTED_SCANNERS=$'CodeQL'

          if ! RULES=$(gh api "repos/${REPO}/rules/branches/${DEFAULT_BRANCH}" 2>/dev/null); then
            echo "::error title=Branch protection unverified::Could not read branch rules for ${DEFAULT_BRANCH} (token access or API availability). Failing closed."
            exit 1
          fi

          echo "Rule types active on ${DEFAULT_BRANCH}:"
          echo "$RULES" | jq -r '.[].type' | sort -u | sed 's/^/  - /'

          CONTEXTS=$(echo "$RULES" | jq -r '
            .[] | select(.type == "required_status_checks")
                | .parameters.required_status_checks[]?.context' | sort -u)
          SCANNERS=$(echo "$RULES" | jq -r '
            .[] | select(.type == "code_scanning")
                | .parameters.code_scanning_tools[]?.tool' | sort -u)

          echo "Required status checks:"
          if [ -z "$CONTEXTS" ]; then echo "  (none)"; else echo "$CONTEXTS" | sed 's/^/  - /'; fi
          echo "Code-scanning tools gated by the ruleset:"
          if [ -z "$SCANNERS" ]; then echo "  (none)"; else echo "$SCANNERS" | sed 's/^/  - /'; fi

          MISSING=0
          while IFS= read -r want; do
            [ -z "$want" ] && continue
            if ! echo "$CONTEXTS" | grep -Fxq "$want"; then
              echo "MISSING required status check: '${want}'"
              MISSING=1
            fi
          done <<< "$EXPECTED_CHECKS"
          while IFS= read -r want; do
            [ -z "$want" ] && continue
            if ! echo "$SCANNERS" | grep -Fxq "$want"; then
              echo "MISSING code-scanning gate: '${want}'"
              MISSING=1
            fi
          done <<< "$EXPECTED_SCANNERS"

          if [ "$MISSING" = "1" ]; then
            echo
            echo "The ruleset for '${DEFAULT_BRANCH}' no longer enforces a gate this repo relies on."
            echo "Auto-merge lands PRs as soon as the *required* gates pass,"
            echo "so anything missing here no longer blocks a merge."
            echo "Fix the ruleset in repository settings, or update EXPECTED_CHECKS /"
            echo "EXPECTED_SCANNERS above if something was renamed deliberately."
            exit 1
          fi
          echo "Branch protection OK — every expected gate is enforced."

  # ─────────────────────────────────────────────────────────────────────────────
  # Lint — dependency audits, ESLint, generated-artifact drift, repository
  # script tests and the squawk migration lint.
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Audit JS dependencies
        # Shared with release.yml's verify job via scripts/audit-js.sh so the
        # audit command + accepted-risk ignore list can't drift between the two.
        run: sh scripts/audit-js.sh

      - name: Lint frontend
        run: bun run lint

      - name: Lint backend
        run: bun run lint:backend

      # Generated artifacts — the committed locale TS files and the
      # OpenAPI-derived TS types must match their sources. A drift here means
      # a developer edited openapi.yaml or i18n/source/*.json without running
      # the matching generate script.
      - name: Validate locales (en/nl key parity, generated TS integrity)
        run: bun run validate-locales

      - name: Regenerate locales and check for drift
        run: |
          bun run generate-locales
          if ! git diff --exit-code -- apps/frontend/src/locales/; then
            echo "ERROR: apps/frontend/src/locales/*.ts are out of sync with i18n/source."
            echo "Run 'bun run generate-locales' locally and commit the regenerated files."
            exit 1
          fi
          echo "Frontend locales in sync."

      - name: Regenerate OpenAPI types and check for drift
        run: |
          bun run generate:types
          if ! git diff --exit-code -- apps/frontend/src/types/generated.ts; then
            echo "ERROR: apps/frontend/src/types/generated.ts is out of sync with openapi.yaml."
            echo "Run 'bun run generate:types' locally and commit the regenerated file."
            exit 1
          fi
          echo "OpenAPI types in sync."

      - name: Verify endpoint matrix count matches openapi.yaml
        run: bun run check-endpoint-matrix

      - name: Test repository scripts
        run: bun run test:scripts

      # Destructive DDL must carry a squawk-ignore comment (config/squawk.toml, ADR-222).
      - name: Lint migrations for destructive DDL
        run: bun run db:lint

  # ─────────────────────────────────────────────────────────────────────────────
  # Type Check — strict TypeScript for the frontend, shared packages, backend,
  # scripts and Electron shell (ADR-186, ADR-191, ADR-195, ADR-196), the shared
  # package tests, and the production frontend build with its size guard.
  # ─────────────────────────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Generate locales (required for type-check)
        run: CI=1 bun run generate-locales

      - name: Type-check frontend
        run: cd apps/frontend && bun run typecheck

      - name: Type-check shared packages
        run: bun run typecheck:packages

      - name: Test shared packages (Belgian tax engine, ADR-217)
        run: bun run test:packages

      - name: Type-check backend (strict TypeScript)
        run: apps/node-backend/node_modules/.bin/tsc -p apps/node-backend/tsconfig.json

      - name: Type-check backend tests (strict TypeScript)
        run: apps/node-backend/node_modules/.bin/tsc -p apps/node-backend/tsconfig.tests.json

      - name: Type-check backend and repository scripts (strict TypeScript, ADR-195)
        run: |
          apps/node-backend/node_modules/.bin/tsc -p apps/node-backend/tsconfig.scripts.json
          apps/node-backend/node_modules/.bin/tsc -p scripts/tsconfig.json

      - name: Install electron workspace dependencies
        run: bun install --frozen-lockfile --ignore-scripts --cwd packaging/electron

      - name: Type-check the Electron shell (strict TypeScript, ADR-196)
        run: bun run typecheck:electron

      - name: Build frontend
        run: CI=1 bun run build

      # Bundle-size regression guard — see apps/frontend/scripts/check-bundle-size.ts
      # for what this measures and why (post-mortem: recharts leaking into the
      # boot-preload graph via a shared module, undetected until reported).
      - name: Check bundle size (boot-preload graph + total)
        run: cd apps/frontend && bun run size:check

  # ─────────────────────────────────────────────────────────────────────────────
  # Test (Frontend) — Vitest. Pull requests split the suite over two runners
  # without coverage; pushes to main run it whole with the v8 coverage ratchet
  # in apps/frontend/vite.config.ts, so the gate still holds on every main
  # commit and therefore on every release.
  # ─────────────────────────────────────────────────────────────────────────────
  test-frontend:
    name: Test (Frontend ${{ matrix.shard }})
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"shard":"1/2","coverage":false},{"shard":"2/2","coverage":false}]' || '[{"shard":"1/1","coverage":true}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Generate locales
        run: CI=1 bun run generate-locales

      - name: Run frontend tests
        env:
          SHARD: ${{ matrix.shard }}
          COVERAGE: ${{ matrix.coverage }}
        run: |
          set -euo pipefail
          if [ "$COVERAGE" = "true" ]; then
            bun run test:coverage
          else
            cd apps/frontend && bun run test --shard="$SHARD"
          fi

  # Backend vitest runs in exactly ONE job (this one). The suite uses an
  # isolated native PostgreSQL 18 cluster so DB-backed cases cannot silently
  # skip.
  #
  # The cluster turns the `tests/setup/db.js` opt-in seam ON: suites gated behind
  # `describe.skipIf(!hasTestDatabase())` execute for real instead of silently
  # skipping. TEST_DATABASE_URL and DATABASE_URL point at the SAME database on
  # purpose — DB-backed suites seed through the test pool (TEST_DATABASE_URL) but
  # the code under test queries through the app pool (DATABASE_URL), so they
  # must be the same database or the seed is invisible to the code being tested.
  #
  # This database is disposable and exclusive to this job — suites may wipe any
  # table they touch; nothing here is shared with another job or persisted.
  #
  # The same job then builds the production frontend once and runs the native
  # production stack twice: migrate + /health + latest-migration round trip,
  # and the live API contracts (MSW fixture schemas against the real backend).
  # Each wrapper starts and removes its own cluster, so they run in sequence.
  test-backend:
    name: Test (Backend)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Install native PostgreSQL 18
        run: bash .github/scripts/install-postgres-18.sh

      - name: Install electron workspace dependencies
        run: bun install --frozen-lockfile --ignore-scripts --cwd packaging/electron

      - name: Run Electron and native-runtime contract tests
        run: bun run test:electron

      - name: Run backend tests with coverage
        env:
          VISION_RUN_PERFORMANCE_PROBES: "1"
          # Fails when src/database/schema.generated.ts drifts from the migrated schema.
          VISION_TEST_DB_VERIFY_CODEGEN: "1"
        run: scripts/with-test-db.sh --coverage

      - name: Build production frontend
        run: CI=1 bun run build

      - name: Verify production health and migration reversibility
        env:
          VISION_NATIVE_VERIFY_MIGRATIONS: "1"
        run: bash .github/scripts/with-native-stack.sh curl -fsS http://127.0.0.1:3002/health

      - name: Run live API contract tests
        env:
          LIVE_API_BASE: http://localhost:3002
          VISION_NATIVE_COMMAND_DIR: apps/frontend
        run: bash .github/scripts/with-native-stack.sh bun run vitest run src/test/live-contracts/live-contracts.test.ts

      - name: Report backend coverage on PR
        if: always()
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2
        with:
          name: backend
          vite-config-path: apps/node-backend/vitest.config.js
          json-summary-path: apps/node-backend/coverage/coverage-summary.json
          json-final-path: apps/node-backend/coverage/coverage-final.json

  # ─────────────────────────────────────────────────────────────────────────────
  # CI Complete — aggregates the full pipeline so branch protection has one
  # required status check. Release (release.yml) also requires this check to
  # have passed on the tagged commit instead of re-running the suite.
  # ─────────────────────────────────────────────────────────────────────────────
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    needs: [changes, repo-checks, lint, typecheck, test-frontend, test-backend]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Check all CI stages passed
        # Values reach the script through env, never via ${{ }} interpolation
        # into `run:` — same convention as the rest of this workflow.
        env:
          EVENT_NAME: ${{ github.event_name }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ toJson(needs.*.result) }}
          EVENT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          REPO_CHECKS_RESULT: ${{ needs.repo-checks.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TEST_FRONTEND_RESULT: ${{ needs.test-frontend.result }}
          TEST_BACKEND_RESULT: ${{ needs.test-backend.result }}
        run: |
          set -euo pipefail

          echo "changes(code):  $CHANGES_RESULT (code=$CODE_CHANGED)"
          echo "repo-checks:    $REPO_CHECKS_RESULT"

          # A cancelled dependency is tolerated only when the live PR head has
          # moved away from this run's event SHA. Equal SHA, push events, missing
          # event identity, dependency failure, and GitHub API failure all fail
          # closed (scripts/ci-cancellation-policy.ts).
          tolerate_cancelled=false
          if echo "$RESULTS" | grep -q '"cancelled"'; then
            bun scripts/ci-cancellation-policy.ts
            tolerate_cancelled=true
          fi

          # require <job> <result>
          #
          # 'success' passes; 'cancelled' passes only under the tolerance
          # computed above. Everything else, 'skipped' included, is fatal.
          require() {
            job=$1; result=$2
            if [ "$result" = "success" ]; then return 0; fi
            if [ "$result" = "cancelled" ] && [ "$tolerate_cancelled" = "true" ]; then
              echo "::warning title=Superseded run::'$job' was cancelled and nothing failed — treating this as a run superseded by a newer push (see the concurrency block)."
              return 0
            fi
            echo "CI failed: $job result is '$result'."
            exit 1
          }

          # `changes` and `repo-checks` run on EVERY diff, docs included — a
          # leaked credential in a markdown file must still fail CI.
          require changes "$CHANGES_RESULT"
          require repo-checks "$REPO_CHECKS_RESULT"

          # Reachable only when the tolerance above accepted a cancelled
          # `changes`: the job never published its output, so the diff was never
          # classified. Bail out explicitly instead of falling through to the
          # docs-only branch, where an empty CODE_CHANGED would report a
          # confident "docs-only" verdict for a run that simply never ran.
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Superseded run: 'changes' did not complete, so the diff was never classified — no verdict to give."
            exit 0
          fi

          # Documentation-only diff: the code tiers are intentionally skipped,
          # so there is nothing further to assert. This job still runs and
          # reports, which is the whole point — "CI Complete" is the required
          # check and must never be left pending.
          if [ "$CODE_CHANGED" != "true" ]; then
            echo "Documentation/instruction diff — code tiers intentionally skipped."
            echo "All CI stages complete (documentation/instructions)."
            exit 0
          fi

          echo "lint:           $LINT_RESULT"
          echo "typecheck:      $TYPECHECK_RESULT"
          echo "test-frontend:  $TEST_FRONTEND_RESULT"
          echo "test-backend:   $TEST_BACKEND_RESULT"
          # Every code tier MUST run and succeed on a code diff; a 'skipped'
          # result means a required tier was bypassed.
          require lint "$LINT_RESULT"
          require typecheck "$TYPECHECK_RESULT"
          require test-frontend "$TEST_FRONTEND_RESULT"
          require test-backend "$TEST_BACKEND_RESULT"
          echo "All CI stages complete."
