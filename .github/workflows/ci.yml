name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "*.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Deny all permissions by default; each job opts in to only what it needs.
permissions: {}

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Secrets scan — gitleaks on push/PR diff range
  # ─────────────────────────────────────────────────────────────────────────────
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Deps audit — bun audit fails on HIGH or CRITICAL vulnerabilities
  # ─────────────────────────────────────────────────────────────────────────────
  deps-audit:
    name: Deps Audit (JS)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit JS dependencies
        # Ignore two fast-uri HIGH CVEs that only affect dev dependencies
        # (@stryker-mutator/core, eslint). fast-uri is not bundled into the
        # production frontend or backend, so neither advisory is reachable
        # at runtime. Re-evaluate when stryker/eslint ship a transitive bump.
        #   GHSA-v39h-62p7-jpjc — host confusion via percent-encoded delimiters
        #   GHSA-q3j6-qgpj-74h6 — path traversal via percent-encoded dots
        run: bun audit --audit-level=high --ignore=GHSA-v39h-62p7-jpjc --ignore=GHSA-q3j6-qgpj-74h6

  # ─────────────────────────────────────────────────────────────────────────────
  # Python deps audit — pip-audit on config/requirements.txt
  # ─────────────────────────────────────────────────────────────────────────────
  pip-audit:
    name: Deps Audit (Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: '3.12'

      - name: Audit Python dependencies
        run: pip install pip-audit && pip-audit -r config/requirements.txt

  # ─────────────────────────────────────────────────────────────────────────────
  # Lint — frontend ESLint + backend ESLint
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint frontend
        run: bun run lint

      - name: Lint backend
        run: bun run lint:backend

  # ─────────────────────────────────────────────────────────────────────────────
  # Type-check — TypeScript strict check on frontend
  # ─────────────────────────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate locales (required for type-check)
        run: CI=1 bun run generate-locales

      - name: Type-check frontend
        run: cd apps/frontend && bunx tsc --noEmit

  # ─────────────────────────────────────────────────────────────────────────────
  # Backend checkJs — tsc --checkJs over JSDoc-typed JS files.
  # Required gate: catches JSDoc rot in the backend before it reaches main.
  # ─────────────────────────────────────────────────────────────────────────────
  typecheck-backend:
    name: Type Check (Backend)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check backend (JSDoc)
        run: cd apps/node-backend && bunx tsc -p tsconfig.check.json

  # ─────────────────────────────────────────────────────────────────────────────
  # Verify generated artifacts — the committed locale TS files and the
  # OpenAPI-derived TS types must match their sources. A drift here means
  # a developer edited openapi.yaml or i18n/source/*.json without running
  # the matching generate script. Cheap (~30 s) and high-signal.
  # ─────────────────────────────────────────────────────────────────────────────
  verify-generated:
    name: Verify Generated Artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate locales (en/nl key parity, generated TS integrity)
        run: bun run validate-locales

      - name: Regenerate OpenAPI types and check for drift
        run: |
          bun run generate:types
          if ! git diff --exit-code -- apps/frontend/src/types/generated.ts; then
            echo "ERROR: apps/frontend/src/types/generated.ts is out of sync with openapi.yaml."
            echo "Run 'bun run generate:types' locally and commit the regenerated file."
            exit 1
          fi
          echo "OpenAPI types in sync."

  # ─────────────────────────────────────────────────────────────────────────────
  # Build — verify the frontend production bundle compiles
  # ─────────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: Build (Frontend)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: CI=1 bun run build

  # ─────────────────────────────────────────────────────────────────────────────
  # Test — frontend (Vitest + coverage gate) + backend (Bun test)
  # ─────────────────────────────────────────────────────────────────────────────
  test-frontend:
    name: Test (Frontend)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate locales
        run: CI=1 bun run generate-locales

      - name: Run frontend tests with coverage
        run: bun run test:coverage

      - name: Report coverage on PR
        if: always()
        uses: davelosert/vitest-coverage-report-action@3c50566c523e04813df28de8f7c48dd97d663f1c # v2
        with:
          vite-config-path: apps/frontend/vite.config.ts
          json-summary-path: apps/frontend/coverage/coverage-summary.json
          json-final-path: apps/frontend/coverage/coverage-final.json

  test-backend:
    name: Test (Backend)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Cache electron npm dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: |
            ~/.npm
            packaging/electron/node_modules
          key: ${{ runner.os }}-npm-electron-${{ hashFiles('packaging/electron/package.json') }}
          restore-keys: ${{ runner.os }}-npm-electron-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install electron workspace dependencies
        run: npm install --prefix packaging/electron --ignore-scripts

      - name: Run backend tests with coverage
        run: cd apps/node-backend && bun vitest run --coverage

      - name: Report backend coverage on PR
        if: always()
        uses: davelosert/vitest-coverage-report-action@3c50566c523e04813df28de8f7c48dd97d663f1c # v2
        with:
          name: backend
          vite-config-path: apps/node-backend/vitest.config.js
          json-summary-path: apps/node-backend/coverage/coverage-summary.json
          json-final-path: apps/node-backend/coverage/coverage-final.json

  # ─────────────────────────────────────────────────────────────────────────────
  # Compose sync — named volumes in docker-compose.yml must match the embedded
  # packaging/electron/resources/docker-compose.yml. Divergence caused the
  # v1.0.2 data-wipe bug; catch it early in CI, not just at release time.
  # ─────────────────────────────────────────────────────────────────────────────
  verify-compose-sync:
    name: Verify Compose Volume Sync
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Check named volumes match between compose files
        run: |
          ROOT_VOLS=$(awk '/^volumes:/{found=1; next} found && /^  [a-zA-Z]/{gsub(/:$/, "", $1); print $1}' docker-compose.yml | sort)
          ELECTRON_VOLS=$(awk '/^volumes:/{found=1; next} found && /^  [a-zA-Z]/{gsub(/:$/, "", $1); print $1}' packaging/electron/resources/docker-compose.yml | sort)
          echo "Root volumes    : $ROOT_VOLS"
          echo "Electron volumes: $ELECTRON_VOLS"
          if [ "$ROOT_VOLS" != "$ELECTRON_VOLS" ]; then
            echo "ERROR: Named volumes out of sync — add missing volumes to packaging/electron/resources/docker-compose.yml"
            exit 1
          fi
          echo "Compose volume sync OK."

  # ─────────────────────────────────────────────────────────────────────────────
  # Quality Gate — all quality checks must pass before Docker builds run.
  # Prevents wasting expensive Docker build time on broken commits.
  # ─────────────────────────────────────────────────────────────────────────────
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - secrets-scan
      - deps-audit
      - pip-audit
      - lint
      - typecheck
      - typecheck-backend
      - verify-generated
      - build-frontend
      - test-frontend
      - test-backend
      - verify-compose-sync
    if: always()
    steps:
      - name: Check all gates passed
        run: |
          results='${{ toJson(needs.*.result) }}'
          if echo "$results" | grep -qE '"(failure|cancelled)"'; then
            echo "Quality gate failed. Job results: $results"
            exit 1
          fi
          echo "All quality gates passed."

  # ─────────────────────────────────────────────────────────────────────────────
  # Build Docker image once — reused by trivy-scan, docker-verify, live-contracts.
  # Only runs after all quality gates pass.
  # ─────────────────────────────────────────────────────────────────────────────
  build-image:
    name: Build Docker Image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [quality-gate]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v3

      - name: Build Docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          load: false
          outputs: type=docker,dest=/tmp/vision-ci.tar
          tags: vision:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: docker-image
          path: /tmp/vision-ci.tar
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Trivy — container image CVE scan (HIGH/CRITICAL)
  # ─────────────────────────────────────────────────────────────────────────────
  trivy-scan:
    name: Trivy Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build-image]
    permissions:
      contents: read
      security-events: write  # required to upload SARIF to GitHub Security
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Download image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/vision-ci.tar

      - name: Run Trivy vulnerability scan (table — fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vision:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Run Trivy vulnerability scan (SARIF — upload to GitHub Security)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vision:ci
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@9e907b5e64f6b83e7804b09294d44122997950d6 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  # ─────────────────────────────────────────────────────────────────────────────
  # Docker verify — spin up compose, hit /health
  # ─────────────────────────────────────────────────────────────────────────────
  docker-verify:
    name: Docker Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build-image]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Download image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/vision-ci.tar

      - name: Create stub .env for Docker Compose
        run: |
          printf 'POSTGRES_PASSWORD=ci_test_password\nDATABASE_URL=postgresql://ftm_user:ci_test_password@db:5432/financial_transactions\nSECRET_KEY=ci_test_secret_key_minimum_32_chars_!\nLOG_LEVEL=warn\nENABLE_LOGGING=true\n' > .env

      - name: Start services with Docker Compose
        run: |
          export VISION_IMAGE=vision:ci
          docker compose -f docker-compose.yml up -d

      - name: Wait for /health to respond
        run: |
          echo "Waiting for backend health check..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3002/health; then
              echo ""
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i/30 — retrying in 3s..."
            sleep 3
          done
          echo "Health check timed out"
          docker compose logs
          exit 1

      # The release path bakes alembic into the image and runs migrations on
      # boot — by the time /health is green, the schema is at HEAD. Round-trip
      # one revision down and back up to catch non-reversible migrations *now*,
      # not at release time. Same class of bug as the v1.0.2 named-volume miss.
      - name: Verify migration reversibility (downgrade -1, upgrade head)
        run: |
          set -e
          echo "Current revision before round-trip:"
          docker compose exec -T app /venv/bin/alembic -c /app/config/alembic.ini current
          echo "Downgrading one revision..."
          docker compose exec -T app /venv/bin/alembic -c /app/config/alembic.ini downgrade -1
          echo "Re-upgrading to head..."
          docker compose exec -T app /venv/bin/alembic -c /app/config/alembic.ini upgrade head
          echo "Round-trip OK."

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ─────────────────────────────────────────────────────────────────────────────
  # Live API contracts — run MSW fixture schemas against the real backend.
  # Catches divergence between MSW stubs and actual backend responses.
  # Skipped on draft PRs; runs on push to main and non-draft PRs.
  # ─────────────────────────────────────────────────────────────────────────────
  test-live-api-contracts:
    name: Test (Live API Contracts)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [build-image]
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Download image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/vision-ci.tar

      - name: Create stub .env for Docker Compose
        run: |
          printf 'POSTGRES_PASSWORD=ci_test_password\nDATABASE_URL=postgresql://ftm_user:ci_test_password@db:5432/financial_transactions\nSECRET_KEY=ci_test_secret_key_minimum_32_chars_!\nLOG_LEVEL=warn\nENABLE_LOGGING=true\n' > .env

      - name: Start services with Docker Compose
        run: |
          export VISION_IMAGE=vision:ci
          docker compose -f docker-compose.yml up -d

      - name: Wait for /health to respond
        run: |
          echo "Waiting for backend health check..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3002/health; then
              echo ""
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i/30 — retrying in 3s..."
            sleep 3
          done
          echo "Health check timed out"
          docker compose logs
          exit 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate locales
        run: CI=1 bun run generate-locales

      - name: Run live API contract tests
        run: cd apps/frontend && bun run vitest run src/test/live-contracts/live-contracts.test.ts
        env:
          LIVE_API_BASE: http://localhost:3002

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ─────────────────────────────────────────────────────────────────────────────
  # E2E — Playwright against the live Docker stack (chromium only).
  # Runs the same image artifact as the other Docker-tier jobs to avoid a
  # second Docker build. Visual snapshot specs (e2e/visual.spec.ts) are
  # excluded — they need the developer's macOS-rendered baselines.
  # Skipped on draft PRs to keep iteration fast for solo work.
  # ─────────────────────────────────────────────────────────────────────────────
  test-e2e:
    name: Test (E2E)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [build-image]
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Download image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/vision-ci.tar

      - name: Create stub .env for Docker Compose
        run: |
          printf 'POSTGRES_PASSWORD=ci_test_password\nDATABASE_URL=postgresql://ftm_user:ci_test_password@db:5432/financial_transactions\nSECRET_KEY=ci_test_secret_key_minimum_32_chars_!\nLOG_LEVEL=warn\nENABLE_LOGGING=true\n' > .env

      - name: Start services with Docker Compose
        run: |
          export VISION_IMAGE=vision:ci
          docker compose -f docker-compose.yml up -d

      - name: Wait for /health to respond
        run: |
          echo "Waiting for backend health check..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3002/health; then
              echo ""
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i/30 — retrying in 3s..."
            sleep 3
          done
          echo "Health check timed out"
          docker compose logs
          exit 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate locales
        run: CI=1 bun run generate-locales

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('apps/frontend/package.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright (chromium + OS deps)
        run: cd apps/frontend && bunx playwright install --with-deps chromium

      - name: Run Playwright e2e tests
        run: cd apps/frontend && bun run test:e2e
        env:
          CI: '1'
          PLAYWRIGHT_BASE_URL: http://localhost:3002

      - name: Upload Playwright report on failure or cancellation
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report
          retention-days: 7

      - name: Capture container logs on failure or cancellation
        if: failure() || cancelled()
        run: |
          mkdir -p /tmp/docker-logs
          docker compose logs --no-color > /tmp/docker-logs/compose.log 2>&1 || true
          docker compose ps > /tmp/docker-logs/ps.txt 2>&1 || true

      - name: Upload container logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: e2e-container-logs
          path: /tmp/docker-logs
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ─────────────────────────────────────────────────────────────────────────────
  # CI Complete — aggregates the Docker-tier results so branch protection has a
  # single required-status-check that covers the full pipeline.
  # Set "CI Complete" as the required check in branch protection settings.
  # ─────────────────────────────────────────────────────────────────────────────
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [trivy-scan, docker-verify, test-live-api-contracts, test-e2e]
    if: always()
    steps:
      - name: Check Docker-tier stages passed
        run: |
          results='${{ toJson(needs.*.result) }}'
          if echo "$results" | grep -qE '"(failure|cancelled)"'; then
            echo "CI failed in Docker tier. Job results: $results"
            exit 1
          fi
          echo "All CI stages complete."
