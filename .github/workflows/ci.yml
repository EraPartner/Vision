name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "*.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Deny all permissions by default; each job opts in to only what it needs.
permissions: {}

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Secrets scan — gitleaks on push/PR diff range
  # ─────────────────────────────────────────────────────────────────────────────
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Deps audit — bun audit fails on HIGH or CRITICAL vulnerabilities
  # ─────────────────────────────────────────────────────────────────────────────
  deps-audit:
    name: Deps Audit (JS)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit JS dependencies
        run: bun audit --audit-level=high

  # ─────────────────────────────────────────────────────────────────────────────
  # Python deps audit — pip-audit on config/requirements.txt
  # ─────────────────────────────────────────────────────────────────────────────
  pip-audit:
    name: Deps Audit (Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Audit Python dependencies
        run: pip install pip-audit && pip-audit -r config/requirements.txt

  # ─────────────────────────────────────────────────────────────────────────────
  # Lint — frontend ESLint + backend ESLint
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint frontend
        run: bun run lint

      - name: Lint backend
        run: bun run lint:backend

  # ─────────────────────────────────────────────────────────────────────────────
  # Type-check — TypeScript strict check on frontend
  # ─────────────────────────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate locales (required for type-check)
        run: CI=1 bun run generate-locales

      - name: Type-check frontend
        run: cd apps/frontend && bunx tsc --noEmit

  # ─────────────────────────────────────────────────────────────────────────────
  # Build — verify the frontend production bundle compiles
  # ─────────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: Build (Frontend)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: CI=1 bun run build

  # ─────────────────────────────────────────────────────────────────────────────
  # Test — frontend (Vitest + coverage gate) + backend (Bun test)
  # ─────────────────────────────────────────────────────────────────────────────
  test-frontend:
    name: Test (Frontend)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate locales
        run: CI=1 bun run generate-locales

      - name: Run frontend tests with coverage
        run: bun run test:coverage

  test-backend:
    name: Test (Backend)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install electron workspace dependencies
        run: npm install --prefix packaging/electron --ignore-scripts

      - name: Run backend tests
        run: bun run test

  # ─────────────────────────────────────────────────────────────────────────────
  # Quality Gate — all quality checks must pass before Docker builds run.
  # Prevents wasting expensive Docker build time on broken commits.
  # ─────────────────────────────────────────────────────────────────────────────
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - secrets-scan
      - deps-audit
      - pip-audit
      - lint
      - typecheck
      - build-frontend
      - test-frontend
      - test-backend
    if: always()
    steps:
      - name: Check all gates passed
        run: |
          results='${{ toJson(needs.*.result) }}'
          if echo "$results" | grep -qE '"(failure|cancelled)"'; then
            echo "Quality gate failed. Job results: $results"
            exit 1
          fi
          echo "All quality gates passed."

  # ─────────────────────────────────────────────────────────────────────────────
  # Build Docker image once — reused by trivy-scan, docker-verify, live-contracts.
  # Only runs after all quality gates pass.
  # ─────────────────────────────────────────────────────────────────────────────
  build-image:
    name: Build Docker Image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [quality-gate]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: false
          outputs: type=docker,dest=/tmp/vision-ci.tar
          tags: vision:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-image
          path: /tmp/vision-ci.tar
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Trivy — container image CVE scan (HIGH/CRITICAL)
  # ─────────────────────────────────────────────────────────────────────────────
  trivy-scan:
    name: Trivy Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build-image]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/vision-ci.tar

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vision:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'

  # ─────────────────────────────────────────────────────────────────────────────
  # Docker verify — spin up compose, hit /health
  # ─────────────────────────────────────────────────────────────────────────────
  docker-verify:
    name: Docker Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build-image]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/vision-ci.tar

      - name: Create stub .env for Docker Compose
        run: |
          printf 'POSTGRES_PASSWORD=ci_test_password\nDATABASE_URL=postgresql://ftm_user:ci_test_password@db:5432/financial_transactions\nSECRET_KEY=ci_test_secret_key_minimum_32_chars_!\nLOG_LEVEL=warn\nENABLE_LOGGING=true\n' > .env

      - name: Start services with Docker Compose
        run: |
          export VISION_IMAGE=vision:ci
          docker compose -f docker-compose.yml up -d

      - name: Wait for /health to respond
        run: |
          echo "Waiting for backend health check..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3002/health; then
              echo ""
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i/30 — retrying in 3s..."
            sleep 3
          done
          echo "Health check timed out"
          docker compose logs
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ─────────────────────────────────────────────────────────────────────────────
  # Live API contracts — run MSW fixture schemas against the real backend.
  # Catches divergence between MSW stubs and actual backend responses.
  # Skipped on draft PRs; runs on push to main and non-draft PRs.
  # ─────────────────────────────────────────────────────────────────────────────
  test-live-api-contracts:
    name: Test (Live API Contracts)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [build-image]
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/vision-ci.tar

      - name: Create stub .env for Docker Compose
        run: |
          printf 'POSTGRES_PASSWORD=ci_test_password\nDATABASE_URL=postgresql://ftm_user:ci_test_password@db:5432/financial_transactions\nSECRET_KEY=ci_test_secret_key_minimum_32_chars_!\nLOG_LEVEL=warn\nENABLE_LOGGING=true\n' > .env

      - name: Start services with Docker Compose
        run: |
          export VISION_IMAGE=vision:ci
          docker compose -f docker-compose.yml up -d

      - name: Wait for /health to respond
        run: |
          echo "Waiting for backend health check..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3002/health; then
              echo ""
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i/30 — retrying in 3s..."
            sleep 3
          done
          echo "Health check timed out"
          docker compose logs
          exit 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate locales
        run: CI=1 bun run generate-locales

      - name: Run live API contract tests
        run: cd apps/frontend && bun run vitest run src/test/live-contracts/live-contracts.test.ts
        env:
          LIVE_API_BASE: http://localhost:3002

      - name: Tear down
        if: always()
        run: docker compose down -v
