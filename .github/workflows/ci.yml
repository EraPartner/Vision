name: CI

on:
  push:
    branches: ["main"]
    # NOTE: "CI Complete" is a required status check. A diff that matches every
    # pattern here skips the whole workflow, so "CI Complete" never reports and
    # such a PR is left pending / blocked from merging. We deliberately keep the
    # markdown ignore ROOT-ONLY ("*.md", not "**/*.md"): widening it would make
    # nested-doc-only PRs skip CI and strand the required check. Properly
    # skipping nested-docs PRs needs a companion no-op success workflow with the
    # inverted paths (tracked in TODO.md) — do not widen this without it.
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "*.md"

concurrency:
  group: ci-${{ github.ref }}
  # Only cancel superseded PR runs; never cancel a push to main/tags mid-run
  # (those runs gate merges/releases and must complete).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Deny all permissions by default; each job opts in to only what it needs.
permissions: {}

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Secrets scan — gitleaks on push/PR diff range
  # ─────────────────────────────────────────────────────────────────────────────
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # gitleaks-action lists the PR's commits via the API to scan the diff
      # range; without pull-requests:read it 403s ("Resource not accessible by
      # integration") on every PR.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: config/gitleaks.toml
          # The scan result gates via exit code; skip the report-artifact upload so
          # a hit Actions artifact-storage quota can't fail an otherwise-clean scan.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  # ─────────────────────────────────────────────────────────────────────────────
  # Deps audit — bun audit fails on HIGH or CRITICAL vulnerabilities
  # ─────────────────────────────────────────────────────────────────────────────
  deps-audit:
    name: Deps Audit (JS)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Audit JS dependencies
        # Shared with release.yml's verify job via scripts/audit-js.sh so the
        # audit command + accepted-risk ignore list can't drift between the two.
        run: sh scripts/audit-js.sh

  # ─────────────────────────────────────────────────────────────────────────────
  # Python deps audit — pip-audit on config/requirements.txt
  # ─────────────────────────────────────────────────────────────────────────────
  pip-audit:
    name: Deps Audit (Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: '3.12'

      - name: Audit Python dependencies
        run: pip install pip-audit==2.10.1 && pip-audit -r config/requirements.txt

  # ─────────────────────────────────────────────────────────────────────────────
  # Lint — frontend ESLint + backend ESLint
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Lint frontend
        run: bun run lint

      - name: Lint backend
        run: bun run lint:backend

  # ─────────────────────────────────────────────────────────────────────────────
  # Type-check — TypeScript strict check on frontend
  # ─────────────────────────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Generate locales (required for type-check)
        run: CI=1 bun run generate-locales

      - name: Type-check frontend
        run: cd apps/frontend && bun run typecheck

  # ─────────────────────────────────────────────────────────────────────────────
  # Backend checkJs — tsc --checkJs over JSDoc-typed JS files.
  # Required gate: catches JSDoc rot in the backend before it reaches main.
  # ─────────────────────────────────────────────────────────────────────────────
  typecheck-backend:
    name: Type Check (Backend)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Type-check backend (JSDoc)
        run: cd apps/node-backend && bunx tsc -p tsconfig.check.json

  # ─────────────────────────────────────────────────────────────────────────────
  # Verify generated artifacts — the committed locale TS files and the
  # OpenAPI-derived TS types must match their sources. A drift here means
  # a developer edited openapi.yaml or i18n/source/*.json without running
  # the matching generate script. Cheap (~30 s) and high-signal.
  # ─────────────────────────────────────────────────────────────────────────────
  verify-generated:
    name: Verify Generated Artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Validate locales (en/nl key parity, generated TS integrity)
        run: bun run validate-locales

      - name: Regenerate locales and check for drift
        run: |
          bun run generate-locales
          if ! git diff --exit-code -- apps/frontend/src/locales/; then
            echo "ERROR: apps/frontend/src/locales/*.ts are out of sync with i18n/source."
            echo "Run 'bun run generate-locales' locally and commit the regenerated files."
            exit 1
          fi
          echo "Frontend locales in sync."

      - name: Regenerate OpenAPI types and check for drift
        run: |
          bun run generate:types
          if ! git diff --exit-code -- apps/frontend/src/types/generated.ts; then
            echo "ERROR: apps/frontend/src/types/generated.ts is out of sync with openapi.yaml."
            echo "Run 'bun run generate:types' locally and commit the regenerated file."
            exit 1
          fi
          echo "OpenAPI types in sync."

      - name: Verify endpoint matrix count matches openapi.yaml
        run: bun run check-endpoint-matrix

  # ─────────────────────────────────────────────────────────────────────────────
  # Build — verify the frontend production bundle compiles
  # ─────────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: Build (Frontend)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Build frontend
        run: CI=1 bun run build

  # ─────────────────────────────────────────────────────────────────────────────
  # Test — frontend (Vitest + coverage gate) + backend (Bun test)
  # ─────────────────────────────────────────────────────────────────────────────
  test-frontend:
    name: Test (Frontend)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Generate locales
        run: CI=1 bun run generate-locales

      - name: Run frontend tests with coverage
        run: bun run test:coverage

      - name: Report coverage on PR
        if: always()
        uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2
        with:
          vite-config-path: apps/frontend/vite.config.ts
          json-summary-path: apps/frontend/coverage/coverage-summary.json
          json-final-path: apps/frontend/coverage/coverage-final.json

  test-backend:
    name: Test (Backend)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Cache electron npm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: |
            ~/.npm
            packaging/electron/node_modules
          key: ${{ runner.os }}-npm-electron-${{ hashFiles('packaging/electron/package.json') }}
          restore-keys: ${{ runner.os }}-npm-electron-

      - name: Install electron workspace dependencies
        run: npm install --prefix packaging/electron --ignore-scripts

      - name: Run backend tests with coverage
        run: cd apps/node-backend && bun vitest run --coverage

      - name: Report backend coverage on PR
        if: always()
        uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2
        with:
          name: backend
          vite-config-path: apps/node-backend/vitest.config.js
          json-summary-path: apps/node-backend/coverage/coverage-summary.json
          json-final-path: apps/node-backend/coverage/coverage-final.json

  # ─────────────────────────────────────────────────────────────────────────────
  # Compose sync — named volumes in docker-compose.yml must match the embedded
  # packaging/electron/resources/docker-compose.yml. Divergence caused the
  # v1.0.2 data-wipe bug; catch it early in CI, not just at release time.
  # ─────────────────────────────────────────────────────────────────────────────
  verify-compose-sync:
    name: Verify Compose Volume Sync
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Check named volumes match between compose files
        run: |
          ROOT_VOLS=$(awk '/^volumes:/{found=1; next} found && /^  [a-zA-Z]/{gsub(/:$/, "", $1); print $1}' docker-compose.yml | sort)
          ELECTRON_VOLS=$(awk '/^volumes:/{found=1; next} found && /^  [a-zA-Z]/{gsub(/:$/, "", $1); print $1}' packaging/electron/resources/docker-compose.yml | sort)
          echo "Root volumes    : $ROOT_VOLS"
          echo "Electron volumes: $ELECTRON_VOLS"
          if [ "$ROOT_VOLS" != "$ELECTRON_VOLS" ]; then
            echo "ERROR: Named volumes out of sync — add missing volumes to packaging/electron/resources/docker-compose.yml"
            exit 1
          fi
          echo "Compose volume sync OK."

      - name: Check compose project name matches between compose files
        run: |
          ROOT_NAME=$(awk '/^name:[[:space:]]/{print $2; exit}' docker-compose.yml)
          ELECTRON_NAME=$(awk '/^name:[[:space:]]/{print $2; exit}' packaging/electron/resources/docker-compose.yml)
          echo "Root name    : $ROOT_NAME"
          echo "Electron name: $ELECTRON_NAME"
          if [ -z "$ROOT_NAME" ] || [ "$ROOT_NAME" != "$ELECTRON_NAME" ]; then
            echo "ERROR: compose 'name:' out of sync — both files must pin the same project name"
            echo "(the shared vision_postgres_data volume depends on a stable project name)"
            exit 1
          fi
          echo "Compose project name sync OK."

  # ─────────────────────────────────────────────────────────────────────────────
  # Quality Gate — all quality checks must pass before Docker builds run.
  # Prevents wasting expensive Docker build time on broken commits.
  # ─────────────────────────────────────────────────────────────────────────────
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - secrets-scan
      - deps-audit
      - pip-audit
      - lint
      - typecheck
      - typecheck-backend
      - verify-generated
      - build-frontend
      - test-frontend
      - test-backend
      - verify-compose-sync
    if: always()
    steps:
      - name: Check all gates passed
        run: |
          results='${{ toJson(needs.*.result) }}'
          if echo "$results" | grep -qE '"(failure|cancelled)"'; then
            echo "Quality gate failed. Job results: $results"
            exit 1
          fi
          echo "All quality gates passed."

  # ─────────────────────────────────────────────────────────────────────────────
  # Build Docker image once — reused by trivy-scan, docker-verify, live-contracts.
  # Only runs after all quality gates pass.
  # ─────────────────────────────────────────────────────────────────────────────
  build-image:
    name: Build Docker Image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [quality-gate]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v3

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: false
          outputs: type=docker,dest=/tmp/vision-ci.tar
          tags: vision:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: docker-image
          path: /tmp/vision-ci.tar
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Trivy — container image CVE scan (HIGH/CRITICAL)
  # ─────────────────────────────────────────────────────────────────────────────
  trivy-scan:
    name: Trivy Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build-image]
    permissions:
      contents: read
      security-events: write  # required to upload SARIF to GitHub Security
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Download image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/vision-ci.tar

      - name: Run Trivy vulnerability scan (table — fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vision:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Run Trivy vulnerability scan (SARIF — upload to GitHub Security)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vision:ci
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@e0647621c2984b5ed2f768cb892365bf2a616ad1 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  # ─────────────────────────────────────────────────────────────────────────────
  # Docker verify — spin up compose, hit /health
  # ─────────────────────────────────────────────────────────────────────────────
  docker-verify:
    name: Docker Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build-image]
    permissions:
      contents: read
    # Isolate this stack from the `vision` project (default from the repo dir
    # basename) so the `down -v` teardown below can never remove the real app's
    # vision_postgres_data volume when these steps are run locally.
    env:
      COMPOSE_PROJECT_NAME: vision_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Bring up the compose stack
        uses: ./.github/actions/compose-up
        with:
          image-artifact: docker-image
          vision-image: vision:ci

      # The release path bakes alembic into the image and runs migrations on
      # boot — by the time /health is green, the schema is at HEAD. Round-trip
      # one revision down and back up to catch non-reversible migrations *now*,
      # not at release time. Same class of bug as the v1.0.2 named-volume miss.
      - name: Verify migration reversibility (downgrade -1, upgrade head)
        run: |
          set -e
          echo "Current revision before round-trip:"
          docker compose exec -T app /venv/bin/alembic -c /app/config/alembic.ini current
          echo "Downgrading one revision..."
          docker compose exec -T app /venv/bin/alembic -c /app/config/alembic.ini downgrade -1
          echo "Re-upgrading to head..."
          docker compose exec -T app /venv/bin/alembic -c /app/config/alembic.ini upgrade head
          echo "Round-trip OK."

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ─────────────────────────────────────────────────────────────────────────────
  # Live API contracts — run MSW fixture schemas against the real backend.
  # Catches divergence between MSW stubs and actual backend responses.
  # Skipped on draft PRs; runs on push to main and non-draft PRs.
  # ─────────────────────────────────────────────────────────────────────────────
  test-live-api-contracts:
    name: Test (Live API Contracts)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [build-image]
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
    # Isolate from the real `vision` project so the `down -v` teardown can never
    # remove vision_postgres_data when run locally (see docker-verify above).
    env:
      COMPOSE_PROJECT_NAME: vision_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Bring up the compose stack
        uses: ./.github/actions/compose-up
        with:
          image-artifact: docker-image
          vision-image: vision:ci

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Generate locales
        run: CI=1 bun run generate-locales

      - name: Run live API contract tests
        run: cd apps/frontend && bun run vitest run src/test/live-contracts/live-contracts.test.ts
        env:
          LIVE_API_BASE: http://localhost:3002

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ─────────────────────────────────────────────────────────────────────────────
  # CI Complete — aggregates the Docker-tier results so branch protection has a
  # single required-status-check that covers the full pipeline.
  # Set "CI Complete" as the required check in branch protection settings.
  # ─────────────────────────────────────────────────────────────────────────────
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [trivy-scan, docker-verify, test-live-api-contracts]
    if: always()
    steps:
      - name: Check Docker-tier stages passed
        run: |
          echo "trivy-scan:              ${{ needs.trivy-scan.result }}"
          echo "docker-verify:           ${{ needs.docker-verify.result }}"
          echo "test-live-api-contracts: ${{ needs.test-live-api-contracts.result }}"
          # trivy-scan and docker-verify MUST run and succeed. A 'skipped' here
          # means the Docker tier was silently bypassed (e.g. quality-gate or
          # build-image failed upstream) — treat that as a failure, not a pass.
          # A plain failure/cancellation grep would let a skipped required job
          # slip through green; assert success explicitly instead.
          if [ "${{ needs.trivy-scan.result }}" != "success" ]; then
            echo "CI failed: trivy-scan did not succeed (got '${{ needs.trivy-scan.result }}')."
            exit 1
          fi
          if [ "${{ needs.docker-verify.result }}" != "success" ]; then
            echo "CI failed: docker-verify did not succeed (got '${{ needs.docker-verify.result }}')."
            exit 1
          fi
          # test-live-api-contracts is INTENTIONALLY skipped on draft PRs
          # (if: !github.event.pull_request.draft), so 'skipped' is allowed here;
          # only an actual failure/cancellation is a hard error.
          case "${{ needs.test-live-api-contracts.result }}" in
            success|skipped) ;;
            *)
              echo "CI failed: test-live-api-contracts result is '${{ needs.test-live-api-contracts.result }}'."
              exit 1
              ;;
          esac
          echo "All CI stages complete."
