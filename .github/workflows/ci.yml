name: CI

on:
  # NOTE: this workflow deliberately has NO paths filter. "CI Complete" is the
  # required status check, and a filter that excluded a whole diff would skip the
  # workflow entirely, so "CI Complete" would never report and the PR would sit
  # blocked forever (this is exactly what happened to docs-only PRs while
  # `paths-ignore: [docs/**, *.md]` was set here).
  #
  # Path filtering now happens INSIDE the workflow: the `changes` job classifies
  # the diff and the expensive tiers are gated on `changes.outputs.code`, while
  # `changes`, `secrets-scan`, `quality-gate` and `ci-complete` always run. That
  # keeps a single required check that always reports on every diff.
  #
  # Do NOT reintroduce a top-level `paths`/`paths-ignore` filter here, and do NOT
  # solve docs-only skipping with a second workflow that also names a job
  # "CI Complete": a mixed docs+code PR matches both filters, both workflows run,
  # and two checks share the required name — the no-op one can report success
  # before the real pipeline finishes, which is a merge-gate bypass.
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: {}

# Cancel superseded PR runs so a rapid succession of pushes to the same branch
# doesn't queue redundant pipelines; never cancel a push to main/tags, so every
# main commit gets a full "CI Complete" verdict (needed for bisecting a
# regression — a cancelled run on main leaves a gap).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Secrets scan — gitleaks on push/PR diff range
  # ─────────────────────────────────────────────────────────────────────────────
  # ─────────────────────────────────────────────────────────────────────────────
  # Detect Changes — classifies the diff so the code/Docker tiers can be skipped
  # on documentation-only changes WITHOUT stranding the required "CI Complete"
  # check (see the note on the triggers above).
  #
  # "docs" means the `docs/` tree or a ROOT-level *.md. Anything else — including
  # a nested *.md outside docs/, e.g. apps/frontend/README.md — counts as code,
  # because such files can be referenced by builds or tooling.
  #
  # Fails safe: if the base cannot be resolved for any reason, `code` is 'true'
  # and the full pipeline runs.
  # ─────────────────────────────────────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        # Values reach the script through env, never via ${{ }} interpolation
        # into `run:` — same convention as the rest of this workflow.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"; head="$PR_HEAD_SHA"
          else
            base="$PUSH_BEFORE"; head="$PUSH_SHA"
          fi

          # New branch / unknown base / missing objects → run everything.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null \
             || ! git cat-file -e "$head^{commit}" 2>/dev/null; then
            echo "Base not resolvable (base='$base') — running the full pipeline."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$base" "$head")
          if [ -z "$changed" ]; then
            echo "Empty diff — running the full pipeline."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"; echo "$changed" | sed 's/^/  /'

          code=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              docs/*) ;;        # docs tree            → docs
              */*)  code=true ;; # any other nested path → code
              *.md) ;;          # root-level markdown  → docs
              *)    code=true ;; # any other root file  → code
            esac
          done <<< "$changed"

          if [ "$code" = "true" ]; then
            echo "Classified as: code (full pipeline)"
          else
            echo "Classified as: docs-only (code and Docker tiers will skip)"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────────────
  # Commit messages — enforce the same conventional-commit contract as the
  # local commit-msg hook. This cannot be bypassed with `git commit --no-verify`.
  # ─────────────────────────────────────────────────────────────────────────────
  commitlint:
    name: Commitlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Lint commit range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            from="$PR_BASE_SHA"; to="$PR_HEAD_SHA"
          else
            from="$PUSH_BEFORE"; to="$PUSH_SHA"
          fi

          if [ -z "$to" ] || ! git cat-file -e "$to^{commit}" 2>/dev/null; then
            echo "Commit range head is not resolvable; refusing to skip commit-message validation."
            exit 1
          elif [ -z "$from" ] || [ "$from" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$from^{commit}" 2>/dev/null; then
            echo "Commit range base is not resolvable; linting the event head commit without ignore rules."
            git log -1 --format=%B "$to" | bun x commitlint --config config/commitlint.config.mjs
          else
            bun x commitlint --from "$from" --to "$to" --config config/commitlint.config.mjs
          fi

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # gitleaks-action lists the PR's commits via the API to scan the diff
      # range; without pull-requests:read it 403s ("Resource not accessible by
      # integration") on every PR.
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: config/gitleaks.toml
          # The scan result gates via exit code; skip the report-artifact upload so
          # a hit Actions artifact-storage quota can't fail an otherwise-clean scan.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  # ─────────────────────────────────────────────────────────────────────────────
  # Deps audit — bun audit fails on HIGH or CRITICAL vulnerabilities
  # ─────────────────────────────────────────────────────────────────────────────
  deps-audit:
    name: Deps Audit (JS)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Audit JS dependencies
        # Shared with release.yml's verify job via scripts/audit-js.sh so the
        # audit command + accepted-risk ignore list can't drift between the two.
        run: sh scripts/audit-js.sh

  # ─────────────────────────────────────────────────────────────────────────────
  # Python deps audit — pip-audit on config/requirements.txt
  # ─────────────────────────────────────────────────────────────────────────────
  pip-audit:
    name: Deps Audit (Python)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v5
        with:
          python-version: "3.12"

      - name: Audit Python dependencies
        run: pip install pip-audit==2.10.1 && pip-audit -r config/requirements.txt

  # ─────────────────────────────────────────────────────────────────────────────
  # Lint — frontend ESLint + backend ESLint
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Lint frontend
        run: bun run lint

      - name: Lint backend
        run: bun run lint:backend

  # ─────────────────────────────────────────────────────────────────────────────
  # Type-check — TypeScript strict check on frontend
  # ─────────────────────────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Generate locales (required for type-check)
        run: CI=1 bun run generate-locales

      - name: Type-check frontend
        run: cd apps/frontend && bun run typecheck

  # ─────────────────────────────────────────────────────────────────────────────
  # Backend checkJs — tsc --checkJs over JSDoc-typed JS files.
  # Required gate: catches JSDoc rot in the backend before it reaches main.
  #
  # Two steps, one program: the base config is loose (strict/noImplicitAny off)
  # and covers all of src/; the ratchet re-runs it with noImplicitAny: true and
  # fails only on the paths listed in scripts/checkjs-ratchet.js (the data-layer
  # row contracts, every repository, and the service subdirectories annotated
  # against them). See that script's header for why this is not a second
  # directory-scoped tsconfig, and its RATCHETED list for what is still out.
  # ─────────────────────────────────────────────────────────────────────────────
  typecheck-backend:
    name: Type Check (Backend)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Type-check backend (JSDoc)
        run: cd apps/node-backend && bunx tsc -p tsconfig.check.json

      - name: Type-check backend (noImplicitAny ratchet)
        run: cd apps/node-backend && bun scripts/checkjs-ratchet.js

  # ─────────────────────────────────────────────────────────────────────────────
  # Verify generated artifacts — the committed locale TS files and the
  # OpenAPI-derived TS types must match their sources. A drift here means
  # a developer edited openapi.yaml or i18n/source/*.json without running
  # the matching generate script. Cheap (~30 s) and high-signal.
  # ─────────────────────────────────────────────────────────────────────────────
  verify-generated:
    name: Verify Generated Artifacts
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Validate locales (en/nl key parity, generated TS integrity)
        run: bun run validate-locales

      - name: Regenerate locales and check for drift
        run: |
          bun run generate-locales
          if ! git diff --exit-code -- apps/frontend/src/locales/; then
            echo "ERROR: apps/frontend/src/locales/*.ts are out of sync with i18n/source."
            echo "Run 'bun run generate-locales' locally and commit the regenerated files."
            exit 1
          fi
          echo "Frontend locales in sync."

      - name: Regenerate OpenAPI types and check for drift
        run: |
          bun run generate:types
          if ! git diff --exit-code -- apps/frontend/src/types/generated.ts; then
            echo "ERROR: apps/frontend/src/types/generated.ts is out of sync with openapi.yaml."
            echo "Run 'bun run generate:types' locally and commit the regenerated file."
            exit 1
          fi
          echo "OpenAPI types in sync."

      - name: Verify endpoint matrix count matches openapi.yaml
        run: bun run check-endpoint-matrix

      - name: Test repository scripts
        run: bun run test:scripts

  # ─────────────────────────────────────────────────────────────────────────────
  # Build — verify the frontend production bundle compiles
  # ─────────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: Build (Frontend)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Build frontend
        run: CI=1 bun run build

      # Bundle-size regression guard — see apps/frontend/scripts/check-bundle-size.mjs
      # for what this measures and why (post-mortem: recharts leaking into the
      # boot-preload graph via a shared module, undetected until reported).
      - name: Check bundle size (boot-preload graph + total)
        run: cd apps/frontend && bun run size:check

  # ─────────────────────────────────────────────────────────────────────────────
  # Test — frontend (Vitest + coverage gate) + backend (Bun test)
  # ─────────────────────────────────────────────────────────────────────────────
  test-frontend:
    name: Test (Frontend)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Generate locales
        run: CI=1 bun run generate-locales

      - name: Run frontend tests with coverage
        run: bun run test:coverage

      - name: Report coverage on PR
        if: always()
        uses: davelosert/vitest-coverage-report-action@3c054a2d2e2ca45446417ad5d6d5eb33092af8f1 # v2
        with:
          vite-config-path: apps/frontend/vite.config.ts
          json-summary-path: apps/frontend/coverage/coverage-summary.json
          json-final-path: apps/frontend/coverage/coverage-final.json

  # Backend vitest runs in exactly ONE job (this one) — `quality-gate` is a pure
  # results aggregator and runs no tests — so the real-Postgres service is wired
  # here and nowhere else. Duplicating it into another job would only pay the
  # migration cost twice for the same assertions.
  #
  # The service turns the `tests/setup/db.js` opt-in seam ON: suites gated behind
  # `describe.skipIf(!hasTestDatabase())` execute for real instead of silently
  # skipping. TEST_DATABASE_URL and DATABASE_URL point at the SAME database on
  # purpose — DB-backed suites seed through the test pool (TEST_DATABASE_URL) but
  # the service under test queries through the app pool (DATABASE_URL), so they
  # must be the same database or the seed is invisible to the code being tested.
  #
  # This database is disposable and exclusive to this job — suites may wipe any
  # table they touch; nothing here is shared with another job or persisted.
  test-backend:
    name: Test (Backend)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    services:
      postgres:
        # Kept in step with the `db` service in docker-compose.yml — testing
        # against a different major than production defeats the point of using a
        # real engine (partial indexes, trigger semantics, MV behaviour).
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vision_test
          POSTGRES_PASSWORD: vision_test
          POSTGRES_DB: vision_test
        ports:
          - 5432:5432
        # Steps must not start before the cluster accepts connections: the
        # migration step is the first thing to touch it and has no retry loop of
        # its own (unlike the app's boot-time checkConnection backoff).
        options: >-
          --health-cmd "pg_isready -U vision_test -d vision_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://vision_test:vision_test@localhost:5432/vision_test
      TEST_DATABASE_URL: postgresql://vision_test:vision_test@localhost:5432/vision_test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Setup toolchain
        uses: ./.github/actions/setup

      # Migrations are Alembic (Python) even though the backend is Node, so the
      # bun toolchain alone cannot build the schema.
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v5
        with:
          python-version: "3.12"

      - name: Install Alembic toolchain
        run: pip install -r config/requirements.txt

      # Runs the SAME migration path the app runs on boot (src/database/migrate.js),
      # not a bare `alembic upgrade head` — see the header of db-migrate.js for why
      # a bare invocation cannot migrate a fresh database in this repo.
      - name: Migrate the test database to head
        run: bun run apps/node-backend/scripts/db-migrate.js

      - name: Cache electron Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: packaging/electron/node_modules
          key: ${{ runner.os }}-bun-electron-${{ hashFiles('packaging/electron/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-electron-

      - name: Install electron workspace dependencies
        run: bun install --frozen-lockfile --ignore-scripts --cwd packaging/electron

      - name: Run Electron and native-runtime contract tests
        run: bun run test:electron

      - name: Run backend tests with coverage
        run: cd apps/node-backend && bun vitest run --coverage

      - name: Report backend coverage on PR
        if: always()
        uses: davelosert/vitest-coverage-report-action@3c054a2d2e2ca45446417ad5d6d5eb33092af8f1 # v2
        with:
          name: backend
          vite-config-path: apps/node-backend/vitest.config.js
          json-summary-path: apps/node-backend/coverage/coverage-summary.json
          json-final-path: apps/node-backend/coverage/coverage-final.json

  # ─────────────────────────────────────────────────────────────────────────────
  # Branch protection — Dependabot auto-merge (auto-merge.yml) lands a PR as soon
  # as the *required* checks pass, so that automation is only ever as safe as the
  # ruleset's required-check list. Nothing in this repo asserted that list, which
  # meant a rename or removal server-side would silently widen what can
  # auto-merge, with no diff to review and no failing job.
  #
  # This reads the rules that actually apply to the default branch and fails if
  # our gates are not among the required checks. It queries the per-branch
  # `rules` endpoint rather than `rulesets` on purpose: `rules` answers "what
  # applies to this branch" and is readable with the workflow's own token, where
  # the rulesets admin endpoint is not.
  #
  # This is wired into `ci-complete` and fails closed. An unreadable rules API
  # is an unverified protection state, not evidence that the merge gates still
  # exist; accepting it would make the verifier advisory at the exact moment it
  # is needed.
  # ─────────────────────────────────────────────────────────────────────────────
  verify-branch-protection:
    name: Verify Branch Protection
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Assert the required-check list still names our gates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Two separate mechanisms, asserted separately because that is how this
          # repo actually enforces them:
          #   • "CI Complete" is the aggregate status check the ruleset requires.
          #   • CodeQL is NOT a required status check — it is enforced by the
          #     ruleset's dedicated `code_scanning` rule, which gates on alert
          #     severity rather than on the analysis job's check run.
          EXPECTED_CHECKS=$'CI Complete'
          EXPECTED_SCANNERS=$'CodeQL'

          if ! RULES=$(gh api "repos/${REPO}/rules/branches/${DEFAULT_BRANCH}" 2>/dev/null); then
            echo "::error title=Branch protection unverified::Could not read branch rules for ${DEFAULT_BRANCH} (token access or API availability). Failing closed."
            exit 1
          fi

          echo "Rule types active on ${DEFAULT_BRANCH}:"
          echo "$RULES" | jq -r '.[].type' | sort -u | sed 's/^/  - /'

          CONTEXTS=$(echo "$RULES" | jq -r '
            .[] | select(.type == "required_status_checks")
                | .parameters.required_status_checks[]?.context' | sort -u)
          SCANNERS=$(echo "$RULES" | jq -r '
            .[] | select(.type == "code_scanning")
                | .parameters.code_scanning_tools[]?.tool' | sort -u)

          echo "Required status checks:"
          if [ -z "$CONTEXTS" ]; then echo "  (none)"; else echo "$CONTEXTS" | sed 's/^/  - /'; fi
          echo "Code-scanning tools gated by the ruleset:"
          if [ -z "$SCANNERS" ]; then echo "  (none)"; else echo "$SCANNERS" | sed 's/^/  - /'; fi

          MISSING=0
          while IFS= read -r want; do
            [ -z "$want" ] && continue
            if ! echo "$CONTEXTS" | grep -Fxq "$want"; then
              echo "MISSING required status check: '${want}'"
              MISSING=1
            fi
          done <<< "$EXPECTED_CHECKS"
          while IFS= read -r want; do
            [ -z "$want" ] && continue
            if ! echo "$SCANNERS" | grep -Fxq "$want"; then
              echo "MISSING code-scanning gate: '${want}'"
              MISSING=1
            fi
          done <<< "$EXPECTED_SCANNERS"

          if [ "$MISSING" = "1" ]; then
            echo
            echo "The ruleset for '${DEFAULT_BRANCH}' no longer enforces a gate this repo relies on."
            echo "Dependabot auto-merge lands patch/minor PRs as soon as the *required* gates pass,"
            echo "so anything missing here no longer blocks a merge."
            echo "Fix the ruleset in repository settings, or update EXPECTED_CHECKS /"
            echo "EXPECTED_SCANNERS above if something was renamed deliberately."
            exit 1
          fi
          echo "Branch protection OK — every expected gate is enforced."

  # ─────────────────────────────────────────────────────────────────────────────
  # Compose sync — the database runtime and named volumes in docker-compose.yml
  # must match packaging/electron/resources/docker-compose.yml. Divergence can
  # start the wrong database image against user data; catch it early in CI.
  # ─────────────────────────────────────────────────────────────────────────────
  verify-compose-sync:
    name: Verify Compose Volume Sync
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      # No setup-toolchain step on purpose: the checker is Node-stdlib-only and
      # ubuntu-24.04 ships node, so this stays as dependency-free as the awk it
      # replaced — and the same file backs release.yml's verify job and
      # .githooks/pre-push, so the three copies cannot drift.
      - name: Self-test the checker
        run: node scripts/check-compose-sync.js --self-test

      - name: Check database runtime and named volumes match between compose files
        run: node scripts/check-compose-sync.js

  # ─────────────────────────────────────────────────────────────────────────────
  # Destructive migrations — native and Docker startup use the guarded migration
  # runner before accepting requests, so a DROP in alembic/versions/ reaches every
  # installation on its next start. That is exactly how 0055 dropped bank_account
  # ahead of its coupled code and crashed startup (ADR-088; 0055 neutered, 0056
  # recovery).
  # This gate makes destructive DDL state its case instead of relying on someone
  # remembering that incident.
  # ─────────────────────────────────────────────────────────────────────────────
  verify-destructive-migrations:
    name: Verify Destructive Migrations
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      # No setup-python step on purpose: the checker is stdlib-only (ast + re) and
      # ubuntu-24.04 ships python3, so this stays as dependency-free as the awk in
      # verify-compose-sync above.
      - name: Self-test the checker
        run: python3 scripts/check-destructive-migrations.py --self-test

      - name: Check migrations for unmarked destructive DDL
        run: python3 scripts/check-destructive-migrations.py

  # ─────────────────────────────────────────────────────────────────────────────
  # Quality Gate — all quality checks must pass before Docker builds run.
  # Prevents wasting expensive Docker build time on broken commits.
  # ─────────────────────────────────────────────────────────────────────────────
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    needs:
      - changes
      - commitlint
      - secrets-scan
      - deps-audit
      - pip-audit
      - lint
      - typecheck
      - typecheck-backend
      - verify-generated
      - build-frontend
      - test-frontend
      - test-backend
      - verify-compose-sync
      - verify-destructive-migrations
    if: always()
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Check all gates passed
        # Values reach the script through env, never via ${{ }} interpolation
        # into `run:` — same convention as the rest of this workflow.
        env:
          EVENT_NAME: ${{ github.event_name }}
          RESULTS: ${{ toJson(needs.*.result) }}
          EVENT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # 'skipped' is tolerated here BY DESIGN: on a docs-only diff the eleven
          # code jobs are gated off by `changes.outputs.code`, so they report
          # 'skipped' and this gate must still pass. `changes` and `secrets-scan`
          # always run, so a genuine upstream break still shows as failure.
          # Do not tighten this to "must equal success" without also
          # special-casing the docs-only path — that would put docs-only PRs
          # straight back to permanently blocked.
          #
          # A cancelled dependency is tolerated only when the live PR head has
          # moved away from this run's event SHA. Equal SHA, push events, missing
          # event identity, dependency failure, and GitHub API failure all fail
          # closed. Both aggregation jobs call the same tested policy script.
          node scripts/ci-cancellation-policy.js
          echo "All quality gates passed."

  # ─────────────────────────────────────────────────────────────────────────────
  # Build Docker image once — the expensive `docker build` happens here and the
  # Docker-tier jobs below re-materialise the result from the GHA build cache.
  # Only runs after all quality gates pass.
  #
  # The hand-off is a CACHE, not an artifact. This job used to export
  # `type=docker,dest=/tmp/vision-ci.tar` and upload the ~1 GB tarball, which
  # every downstream job downloaded. That upload is what hit the Actions
  # artifact-storage quota, and a quota failure failed `build-image` — taking
  # the whole Docker tier ('skipped') with it. Now nothing is uploaded: this job
  # only exports layers with `cache-to: type=gha,mode=max`, and each consumer
  # runs the identical build with `load: true`, which is a full cache hit.
  #
  # Worst case (GHA's 10 GB cache eviction drops the entries mid-run) a consumer
  # rebuilds from scratch: slow, but correct — and no worse than the uncached
  # rebuild `docker-verify` silently did on every single run before this change.
  # ─────────────────────────────────────────────────────────────────────────────
  build-image:
    name: Build Docker Image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [changes, quality-gate]
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      # The producer: builds with no image export at all (`load: false`, no
      # `outputs:`) — its only product is the cache the consumers read. The
      # build itself is defined once, in the action, so producer and consumers
      # cannot drift into different cache keys. See that file's header.
      - name: Build Docker image (exports layers to the GHA cache)
        uses: ./.github/actions/build-ci-image
        with:
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # Trivy — container image CVE scan (HIGH/CRITICAL)
  # ─────────────────────────────────────────────────────────────────────────────
  trivy-scan:
    name: Trivy Scan
    runs-on: ubuntu-24.04
    # Headroom for the documented worst case: if the GHA cache entries were
    # evicted between build-image and here, the restore step is a genuine cold
    # build (~10 min) rather than a materialisation, and the old 15 min would
    # have turned "slow" into a red required check.
    timeout-minutes: 25
    needs: [build-image]
    permissions:
      contents: read
      security-events: write # required to upload SARIF to GitHub Security
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      # Cache-hit rebuild of the image `build-image` just exported — same build
      # inputs, so this is a materialisation, not a real build. Leaves
      # `vision:ci` in the local image store for the scans below.
      - name: Restore vision:ci from the build cache
        uses: ./.github/actions/build-ci-image
        with:
          load: "true"

      - name: Run Trivy vulnerability scan (table — fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vision:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Run Trivy vulnerability scan (SARIF — upload to GitHub Security)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vision:ci
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  # ─────────────────────────────────────────────────────────────────────────────
  # Docker verify — spin up compose, hit /health
  # ─────────────────────────────────────────────────────────────────────────────
  docker-verify:
    name: Docker Verify
    runs-on: ubuntu-24.04
    # +10 for a possible cold rebuild in the restore step — see trivy-scan.
    timeout-minutes: 25
    needs: [build-image]
    permissions:
      contents: read
    # Isolate this stack from the `vision` project (default from the repo dir
    # basename) so the `down -v` teardown below can never remove the real app's
    # vision_postgres_data volume when these steps are run locally.
    env:
      COMPOSE_PROJECT_NAME: vision_ci
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      # Cache-hit rebuild of the image `build-image` exported; `vision-image`
      # below is what makes compose consume this exact image instead of
      # rebuilding the app from source itself.
      - name: Restore vision:ci from the build cache
        uses: ./.github/actions/build-ci-image
        with:
          load: "true"

      - name: Bring up the compose stack
        uses: ./.github/actions/compose-up
        with:
          vision-image: vision:ci

      # The release path bakes alembic into the image and runs migrations on
      # boot — by the time /health is green, the schema is at HEAD. Round-trip
      # one revision down and back up to catch non-reversible migrations *now*,
      # not at release time. Same class of bug as the v1.0.2 named-volume miss.
      #
      # Same `-f` pair as the bring-up in ./.github/actions/compose-up — the
      # stack was created from both files, so every later invocation must name
      # both or compose resolves a different service definition.
      - name: Verify migration reversibility (downgrade -1, upgrade head)
        run: |
          set -e
          COMPOSE=(docker compose -f docker-compose.yml -f docker-compose.ci.yml)
          echo "Current revision before round-trip:"
          "${COMPOSE[@]}" exec -T app /venv/bin/alembic -c /app/config/alembic.ini current
          echo "Downgrading one revision..."
          "${COMPOSE[@]}" exec -T app bun run apps/node-backend/scripts/db-migrate.js downgrade -1
          echo "Re-upgrading to head..."
          "${COMPOSE[@]}" exec -T app bun run apps/node-backend/scripts/db-migrate.js upgrade head
          echo "Round-trip OK."

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  # ─────────────────────────────────────────────────────────────────────────────
  # Live API contracts — run MSW fixture schemas against the real backend.
  # Catches divergence between MSW stubs and actual backend responses.
  # Skipped on draft PRs; runs on push to main and non-draft PRs.
  # ─────────────────────────────────────────────────────────────────────────────
  test-live-api-contracts:
    name: Test (Live API Contracts)
    runs-on: ubuntu-24.04
    # +10 for a possible cold rebuild in the restore step — see trivy-scan.
    timeout-minutes: 30
    needs: [build-image]
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
    # Isolate from the real `vision` project so the `down -v` teardown can never
    # remove vision_postgres_data when run locally (see docker-verify above).
    env:
      COMPOSE_PROJECT_NAME: vision_ci
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      # See docker-verify above — cache-hit rebuild, then compose consumes the
      # loaded `vision:ci` via docker-compose.ci.yml.
      - name: Restore vision:ci from the build cache
        uses: ./.github/actions/build-ci-image
        with:
          load: "true"

      - name: Bring up the compose stack
        uses: ./.github/actions/compose-up
        with:
          vision-image: vision:ci

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Generate locales
        run: CI=1 bun run generate-locales

      - name: Run live API contract tests
        run: cd apps/frontend && bun run vitest run src/test/live-contracts/live-contracts.test.ts
        env:
          LIVE_API_BASE: http://localhost:3002

      # Both `-f` files, as in docker-verify — the stack was created from both.
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  # ─────────────────────────────────────────────────────────────────────────────
  # CI Complete — aggregates the Docker-tier results so branch protection has a
  # single required-status-check that covers the full pipeline.
  # Set "CI Complete" as the required check in branch protection settings.
  # ─────────────────────────────────────────────────────────────────────────────
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    needs:
      [
        changes,
        secrets-scan,
        quality-gate,
        verify-branch-protection,
        trivy-scan,
        docker-verify,
        test-live-api-contracts,
      ]
    if: always()
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Check Docker-tier stages passed
        # Values reach the script through env, never via ${{ }} interpolation
        # into `run:` — same convention as the rest of this workflow.
        env:
          EVENT_NAME: ${{ github.event_name }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          ALL_RESULTS: ${{ toJson(needs.*.result) }}
          RESULTS: ${{ toJson(needs.*.result) }}
          EVENT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          SECRETS_SCAN_RESULT: ${{ needs.secrets-scan.result }}
          QUALITY_GATE_RESULT: ${{ needs.quality-gate.result }}
          BRANCH_PROTECTION_RESULT: ${{ needs.verify-branch-protection.result }}
          TRIVY_SCAN_RESULT: ${{ needs.trivy-scan.result }}
          DOCKER_VERIFY_RESULT: ${{ needs.docker-verify.result }}
          LIVE_CONTRACTS_RESULT: ${{ needs.test-live-api-contracts.result }}
        run: |
          set -euo pipefail

          echo "changes(code):           $CHANGES_RESULT (code=$CODE_CHANGED)"
          echo "secrets-scan:            $SECRETS_SCAN_RESULT"
          echo "quality-gate:            $QUALITY_GATE_RESULT"
          echo "branch-protection:       $BRANCH_PROTECTION_RESULT"

          tolerate_cancelled=false
          if echo "$ALL_RESULTS" | grep -q '"cancelled"'; then
            node scripts/ci-cancellation-policy.js
            tolerate_cancelled=true
          fi

          # require <job> <result> [extra allowed results...]
          #
          # 'success' always passes; extra allowed results are per-job (only
          # test-live-api-contracts gets one, 'skipped', for draft PRs).
          # 'cancelled' passes only under the tolerance computed above.
          # Everything else — crucially 'skipped' for trivy-scan/docker-verify,
          # which means the Docker tier was silently bypassed rather than run —
          # is fatal.
          require() {
            job=$1; result=$2; shift 2
            if [ "$result" = "success" ]; then return 0; fi
            for allowed in "$@"; do
              if [ "$result" = "$allowed" ]; then return 0; fi
            done
            if [ "$result" = "cancelled" ] && [ "$tolerate_cancelled" = "true" ]; then
              echo "::warning title=Superseded run::'$job' was cancelled and nothing failed — treating this as a run superseded by a newer push (see the concurrency block)."
              return 0
            fi
            echo "CI failed: $job result is '$result'."
            exit 1
          }

          # `changes` and `secrets-scan` run on EVERY diff, docs included — a
          # leaked credential in a markdown file must still fail CI.
          require changes "$CHANGES_RESULT"
          require secrets-scan "$SECRETS_SCAN_RESULT"
          require quality-gate "$QUALITY_GATE_RESULT"
          require verify-branch-protection "$BRANCH_PROTECTION_RESULT"

          # Reachable only when the tolerance above accepted a cancelled
          # `changes`: the job never published its output, so the diff was never
          # classified. Bail out explicitly instead of falling through to the
          # docs-only branch, where an empty CODE_CHANGED would report a
          # confident "docs-only" verdict for a run that simply never ran.
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Superseded run: 'changes' did not complete, so the diff was never classified — no verdict to give."
            exit 0
          fi

          # Documentation-only diff: the code and Docker tiers are intentionally
          # skipped, so there is nothing further to assert — this early exit is
          # why the trivy-scan/docker-verify assertions below never see the
          # 'skipped' they would (correctly) reject on a docs-only run. This job
          # still runs and reports, which is the whole point — "CI Complete" is
          # the required check and must never be left pending.
          if [ "$CODE_CHANGED" != "true" ]; then
            echo "Docs-only diff — code and Docker tiers intentionally skipped."
            echo "All CI stages complete (docs-only)."
            exit 0
          fi

          echo "trivy-scan:              $TRIVY_SCAN_RESULT"
          echo "docker-verify:           $DOCKER_VERIFY_RESULT"
          echo "test-live-api-contracts: $LIVE_CONTRACTS_RESULT"
          # trivy-scan and docker-verify MUST run and succeed. A 'skipped' here
          # means the Docker tier was silently bypassed (e.g. quality-gate or
          # build-image failed upstream) — treat that as a failure, not a pass.
          # A plain failure grep would let a skipped required job slip through
          # green; `require` allows no extra results for these two, so only
          # 'success' (or a tolerated supersede-cancel) passes.
          require trivy-scan "$TRIVY_SCAN_RESULT"
          require docker-verify "$DOCKER_VERIFY_RESULT"
          # test-live-api-contracts is INTENTIONALLY skipped on draft PRs
          # (if: !github.event.pull_request.draft), so 'skipped' is allowed here.
          require test-live-api-contracts "$LIVE_CONTRACTS_RESULT" skipped
          echo "All CI stages complete."
