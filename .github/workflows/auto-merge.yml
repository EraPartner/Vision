name: Auto-merge Dependabot PRs

on: pull_request

# Deny all permissions by default; each job opts in to only what it needs.
permissions: {}

jobs:
  auto-merge:
    name: Auto-merge patch/minor
    runs-on: ubuntu-24.04
    # Long enough for the checks-gate step below to watch a full CI run to
    # completion (the Docker tier alone can take ~30 min). --fail-fast still
    # exits early the moment a required check fails.
    timeout-minutes: 90
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Defense-in-depth checks gate. The branch ruleset already requires
      # "CI Complete" server-side, and `gh pr merge --auto` defers the merge
      # until required checks pass — but block here explicitly so this workflow
      # only reaches the merge step after CI is actually green.
      # --required scopes the wait to required checks (i.e. "CI Complete"),
      # which avoids waiting on this auto-merge workflow's own in-progress
      # check run (it is not a required check) — an unscoped --watch would
      # deadlock on itself. --fail-fast aborts as soon as a required check fails.
      - name: Wait for required checks to pass
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr checks "$PR_URL" --watch --fail-fast --required --interval 30
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch and minor updates
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
