name: Build images & Mac app

permissions:
  contents: write
  packages: write

on:
  push:
    tags:
      - "v*"
    branches:
      - main

env:
  IMAGE_REPO: ghcr.io/erapartner/vision
  IMAGE_TAG: ${{ github.sha }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build_and_push_images:
    name: Build and push multi-arch images
    runs-on: ubuntu-latest
    env:
      OWNER: ${{ github.repository_owner }}
    outputs:
      image_full: ${{ steps.set_tag.outputs.image_full }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: set_tag
        run: |
          # Lowercase the owner to form a valid registry path and expose image tags
          OWNER_LOWER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE_REPO="ghcr.io/${OWNER_LOWER}/vision"
          echo "image_full=${IMAGE_REPO}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${IMAGE_REPO}:latest" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT || github.token }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.set_tag.outputs.image_full }}
            ${{ steps.set_tag.outputs.image_latest }}

  build_mac_app:
    name: Build macOS DMG
    needs: build_and_push_images
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        run: |
          # Install Bun and add it to the runner PATH for subsequent steps
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
        shell: bash

      - name: Prepare embedded docker-compose with concrete image
        run: |
          cd packaging/electron/resources
          # Read image_full from the build job output and extract its tag
          IMAGE_FULL="${{ needs.build_and_push_images.outputs.image_full }}"
          if [ -z "$IMAGE_FULL" ]; then
            echo "Failed to read image_full from previous job" >&2
            exit 1
          fi
          IMAGE_TAG="${IMAGE_FULL##*:}"
          echo "APP_IMAGE_TAG=${IMAGE_TAG}" > .compose.env
          cd -
        shell: bash

      - name: Install dependencies & build
        run: |
          cd packaging/electron
          bun install
          bun run dist
        shell: bash

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: vision-macos-dmg
          path: packaging/electron/dist/*.dmg

      - name: Create or update GitHub Release
        id: create_release
        uses: peter-evans/create-or-update-release@v3
        with:
          token: ${{ secrets.RELEASE_PAT || github.token }}
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Find generated DMG
        id: find_dmg
        run: |
          echo "Searching recursively for any .dmg under packaging/electron/dist"
          # show tree for debugging
          ls -la packaging/electron || true
          ls -la packaging/electron/dist || true
          # Find the first .dmg (recursively) and write it to the output
          DMG_PATH=$(find packaging/electron/dist -type f -name '*.dmg' -print -quit || true)
          if [ -z "$DMG_PATH" ]; then
            echo "No DMG found under packaging/electron/dist" >&2
            exit 1
          fi
          echo "Found DMG: $DMG_PATH"
          echo "dmg_path=$DMG_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload DMG to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.find_dmg.outputs.dmg_path }}
          asset_name: vision-${{ github.ref_name }}.dmg
          asset_content_type: application/x-apple-diskimage
