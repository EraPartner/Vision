name: Build images & Mac app

permissions:
  contents: read
  packages: write

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

env:
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/vision
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build_and_push_images:
    name: Build and push multi-arch images
    runs-on: ubuntu-latest
    outputs:
      image_full: ${{ steps.set_tag.outputs.image_full }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: set_tag
        run: echo "::set-output name=image_full::${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT || github.token }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REPO }}:latest

  build_mac_app:
    name: Build macOS DMG
    needs: build_and_push_images
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
        shell: bash

      - name: Prepare embedded docker-compose with concrete image
        run: |
          cd packaging/electron/resources
          # Write the APP_IMAGE_TAG into an env file used by docker-compose
          # Use the commit SHA as the image tag passed from the workflow
          echo "APP_IMAGE_TAG=${{ github.sha }}" > .compose.env
          cd -
        shell: bash

      - name: Install dependencies & build
        run: |
          cd packaging/electron
          bun install
          bun run dist
        shell: bash

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: vision-macos-dmg
          path: packaging/electron/dist/*.dmg

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Upload DMG to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: packaging/electron/dist/*.dmg
          asset_name: vision-${{ github.ref_name }}.dmg
          asset_content_type: application/x-apple-diskimage
