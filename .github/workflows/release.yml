name: Release

# Triggered when a version tag is pushed, e.g. v1.2.3
# Workflow:
#   0. Verify: version tag matches packaging/electron/package.json + run lint/tests
#   1. Build & push multi-arch Docker image to GHCR (linux/amd64 + linux/arm64)
#   2. Build source launcher ZIP for source-based production startup
#   3. Publish a GitHub Release with all artifacts + SHA256 checksums

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3)"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/vision

# Deny all permissions by default; each job opts in to only what it needs.
permissions: {}

# Serialize releases for the same ref. Do NOT cancel in-progress —
# tag publishes are not safe to abort mid-upload.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 0. Verify: version tag == package.json version + lint + tests
  # ─────────────────────────────────────────────────────────────────────────────
  verify:
    name: Verify Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check version tag matches package.json
        run: |
          TAG="${{ github.ref_name }}"
          # Trim leading 'v' from tag
          TAG_VERSION="${TAG#v}"
          ROOT_VERSION=$(node -p "require('./package.json').version")
          PKG_VERSION=$(node -p "require('./packaging/electron/package.json').version")
          echo "Tag version              : $TAG_VERSION"
          echo "Root package.json        : $ROOT_VERSION"
          echo "Electron package.json    : $PKG_VERSION"
          if [ "$TAG_VERSION" != "$ROOT_VERSION" ]; then
            echo "ERROR: git tag ($TAG_VERSION) does not match root package.json version ($ROOT_VERSION)"
            echo "Update root package.json before tagging."
            exit 1
          fi
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: git tag ($TAG_VERSION) does not match packaging/electron/package.json version ($PKG_VERSION)"
            echo "Update packaging/electron/package.json before tagging."
            exit 1
          fi
          if [ "$ROOT_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: root package.json ($ROOT_VERSION) and packaging/electron/package.json ($PKG_VERSION) are out of sync"
            echo "Both files must have the same version."
            exit 1
          fi
          echo "Version check passed."

      - name: Lint frontend
        run: bun run lint

      - name: Lint backend
        run: bun run lint:backend

      - name: Generate locales
        run: CI=1 bun run generate-locales

      - name: Test backend
        run: bun run test

      - name: Test frontend
        run: bun run test:frontend

  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Build & push Docker image to GHCR
  # ─────────────────────────────────────────────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # required to push to GHCR with GITHUB_TOKEN

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for cross-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # e.g. v1.2.3 → 1.2.3 + latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write docker metadata file
        run: |
          mkdir -p dist
          echo "version=${{ steps.meta.outputs.version }}" > dist/docker-image-tag.txt
          echo "tags=${{ steps.meta.outputs.tags }}" >> dist/docker-image-tag.txt

      - name: Upload docker metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: dockerbuild
          path: dist/docker-image-tag.txt

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Build mac .app + .dmg via electron-builder (arm64 — Apple Silicon only)
  #    Ad-hoc signed (mac.identity=null) so the binary loads on Apple Silicon
  #    without an Apple Developer ID. Users still see Gatekeeper on first run
  #    and need right-click → Open once. README explains this.
  # ─────────────────────────────────────────────────────────────────────────────
  package-mac:
    name: Build mac .app + DMG
    needs: [verify]
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (for electron-builder native deps)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Generate locales (writes packaging/electron/i18n)
        run: CI=1 bun run generate-locales

      - name: Install electron deps and build .app + DMG
        env:
          # No Apple Developer cert — fall back to ad-hoc signing.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          cd packaging/electron
          npm install
          # electron-builder reads `mac.identity: null` from package.json and
          # falls back to ad-hoc signing because CSC_IDENTITY_AUTO_DISCOVERY=false.
          # `--publish never` stops electron-builder from trying to upload to
          # GitHub itself; the release job at the end of this workflow handles
          # asset upload via softprops/action-gh-release.
          npx electron-builder --mac --arm64 --publish never

      - name: Stage release artifacts
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          VER="${TAG#v}"
          OUT="$GITHUB_WORKSPACE/dist/release"
          mkdir -p "$OUT"

          # electron-builder emits files into packaging/electron/dist/. Filenames
          # use `productName` ("Vision") + version. We rename to predictable
          # names that match the README and setup script.
          DMG_SRC=$(ls packaging/electron/dist/*.dmg | head -1)
          ZIP_SRC=$(ls packaging/electron/dist/*-arm64-mac.zip 2>/dev/null | head -1 \
                    || ls packaging/electron/dist/*-mac.zip | head -1)
          cp "$DMG_SRC" "$OUT/Vision-${VER}-arm64.dmg"
          cp "$ZIP_SRC" "$OUT/Vision-${VER}-arm64-mac.zip"

          # Inject the version tag into the setup script and README, then
          # ship them alongside the binaries.
          sed "s/__VERSION__/${VER}/g" packaging/release/vision-setup.command \
            > "$OUT/vision-setup.command"
          chmod +x "$OUT/vision-setup.command"
          sed "s/__VERSION__/${VER}/g" packaging/release/README.md \
            > "$OUT/README.md"

      - name: Compute SHA256 checksums
        run: |
          set -euo pipefail
          cd dist/release
          for f in Vision-*.dmg Vision-*.zip vision-setup.command README.md; do
            shasum -a 256 "$f" > "${f}.sha256"
            echo "--- ${f} ---"
            cat "${f}.sha256"
          done

      - name: Upload mac release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vision-mac-release
          path: dist/release/

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Create GitHub Release and attach artifacts
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [docker, package-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to create releases and upload assets
      packages: read
    steps:
      - name: Download mac release artifacts
        uses: actions/download-artifact@v4
        with:
          name: vision-mac-release
          path: dist/mac

      - name: Download docker metadata artifact
        uses: actions/download-artifact@v4
        with:
          name: dockerbuild
          path: dist/dockerbuild

      - name: List downloaded artifacts
        run: find dist/ -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Vision ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/mac/Vision-*.dmg
            dist/mac/Vision-*.zip
            dist/mac/vision-setup.command
            dist/mac/README.md
            dist/mac/*.sha256
