name: Release

# Triggered when a version tag is pushed, e.g. v1.2.3
# Workflow:
#   0. Verify: version tag matches packaging/electron/package.json + full quality gate
#   1. Build a multi-arch image (linux/amd64 + linux/arm64), push it to GHCR by
#      DIGEST ONLY, scan + smoke-test that candidate, and only then promote the
#      digest to the semver tags and `latest`
#   2. Build mac .app + .dmg via electron-builder (arm64 — Apple Silicon only)
#   3. Create a GitHub Release with all artifacts + SHA256 checksums

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3)"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/vision

# Deny all permissions by default; each job opts in to only what it needs.
permissions: {}

# Serialize releases for the same ref. Do NOT cancel in-progress —
# tag publishes are not safe to abort mid-upload.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 0. Verify: version tag == package.json version + full quality gate
  # ─────────────────────────────────────────────────────────────────────────────
  verify:
    name: Verify Release
    runs-on: ubuntu-24.04
    # 40, not 30: this job now also runs the secrets scan, the backend JSDoc
    # type-check and the generated-artifact checks that ci.yml's quality tier
    # runs (they were missing here, so a tag pushed on a commit that never
    # passed CI got none of them).
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      # Fail fast on a malformed release tag. Map the (possibly workflow_dispatch
      # user-supplied) value through env: rather than interpolating ${{ }} inline
      # into the shell, so it can't inject shell, and validate the format before
      # it's used as a checkout ref or elsewhere in the pipeline.
      - name: Validate release tag format
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: release tag '$TAG' must be vMAJOR.MINOR.PATCH (e.g. v1.2.3)"
            exit 1
          fi
          echo "Release tag OK: $TAG"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # ci.yml's Secrets Scan job cannot stand in for this one: gitleaks-action
      # scans the push event's commit RANGE, and a tag push carries no commits,
      # so it would report "no commits to scan" and pass. This scans the whole
      # tree the tag actually ships — and runs before `bun install`, so vendored
      # test fixtures under node_modules can never flag. The release is pinned to
      # a version AND its checksum, like every action SHA in this workflow.
      - name: Secrets scan (gitleaks, full release tree)
        env:
          GITLEAKS_VERSION: "8.30.0"
          GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --config config/gitleaks.toml --redact --no-banner

      - name: Setup toolchain
        uses: ./.github/actions/setup

      # Same checker ci.yml's verify-compose-sync job and .githooks/pre-push run
      # — the two workflows used to carry byte-identical copies of an awk
      # one-liner that could drift apart. See scripts/check-compose-sync.js.
      - name: Self-test the compose-sync checker
        run: node scripts/check-compose-sync.js --self-test

      - name: Check project name and named volumes match between compose files
        run: node scripts/check-compose-sync.js

      - name: Check version tag matches package.json
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          TAG_VERSION="${TAG#v}"
          ROOT_VERSION=$(node -p "require('./package.json').version")
          PKG_VERSION=$(node -p "require('./packaging/electron/package.json').version")
          echo "Tag version              : $TAG_VERSION"
          echo "Root package.json        : $ROOT_VERSION"
          echo "Electron package.json    : $PKG_VERSION"
          if [ "$TAG_VERSION" != "$ROOT_VERSION" ]; then
            echo "ERROR: git tag ($TAG_VERSION) does not match root package.json version ($ROOT_VERSION)"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: git tag ($TAG_VERSION) does not match packaging/electron/package.json version ($PKG_VERSION)"
            exit 1
          fi
          if [ "$ROOT_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: root package.json ($ROOT_VERSION) and packaging/electron/package.json ($PKG_VERSION) are out of sync"
            exit 1
          fi
          echo "Version check passed."

      - name: Audit JS dependencies
        # Shared with ci.yml's Deps Audit (JS) job via scripts/audit-js.sh so the
        # audit command + accepted-risk ignore list can't drift between the two.
        run: sh scripts/audit-js.sh

      - name: Setup Python (for pip-audit)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v5
        with:
          python-version: '3.12'

      - name: Audit Python dependencies
        run: pip install pip-audit==2.10.1 && pip-audit -r config/requirements.txt

      - name: Lint frontend
        run: bun run lint

      - name: Lint backend
        run: bun run lint:backend

      - name: Generate locales
        run: CI=1 bun run generate-locales

      # The four assertions of ci.yml's verify-generated job, which this gate
      # omitted entirely: a tag cut from a commit that edited openapi.yaml or
      # i18n/source without regenerating shipped the stale committed artifacts.
      # `Generate locales` above already regenerated them, so the locale drift
      # check here is a plain git diff.
      - name: Validate locales (en/nl key parity, generated TS integrity)
        run: bun run validate-locales

      - name: Check generated locales for drift
        run: |
          if ! git diff --exit-code -- apps/frontend/src/locales/; then
            echo "ERROR: apps/frontend/src/locales/*.ts are out of sync with i18n/source."
            echo "Run 'bun run generate-locales' locally and commit the regenerated files."
            exit 1
          fi
          echo "Frontend locales in sync."

      - name: Regenerate OpenAPI types and check for drift
        run: |
          bun run generate:types
          if ! git diff --exit-code -- apps/frontend/src/types/generated.ts; then
            echo "ERROR: apps/frontend/src/types/generated.ts is out of sync with openapi.yaml."
            echo "Run 'bun run generate:types' locally and commit the regenerated file."
            exit 1
          fi
          echo "OpenAPI types in sync."

      - name: Verify endpoint matrix count matches openapi.yaml
        run: bun run check-endpoint-matrix

      - name: Type-check frontend
        run: cd apps/frontend && bun run typecheck

      # ci.yml's typecheck-backend job — a required gate there, absent here.
      # Both halves: the loose base program over all of src/, then the
      # noImplicitAny ratchet over the paths scripts/checkjs-ratchet.js lists.
      - name: Type-check backend (JSDoc)
        run: cd apps/node-backend && bunx tsc -p tsconfig.check.json

      - name: Type-check backend (noImplicitAny ratchet)
        run: cd apps/node-backend && bun scripts/checkjs-ratchet.js

      - name: Build frontend
        run: CI=1 bun run build

      - name: Install electron workspace dependencies (required for backend tests)
        run: npm install --prefix packaging/electron --ignore-scripts

      - name: Run backend tests
        run: bun run test

      - name: Run frontend tests with coverage
        run: bun run test:coverage

  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Build & push Docker image to GHCR
  # ─────────────────────────────────────────────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    needs: [verify]
    runs-on: ubuntu-24.04
    # 60, not 45: the job now also boots the pushed candidate under compose and
    # round-trips a migration before promoting it to the release tags.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write  # required to push to GHCR with GITHUB_TOKEN

    # Isolate the smoke-test stack from the `vision` project the compose files
    # pin via `name:`, exactly as ci.yml's docker-verify does, so the `down -v`
    # teardown can never remove a real vision_postgres_data volume.
    env:
      COMPOSE_PROJECT_NAME: vision_release

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_digest: ${{ steps.build-push.outputs.digest }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up QEMU (for cross-platform builds)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v3

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only move `latest` when this tag is actually the highest release — a
      # re-release of an older version (e.g. v1.0.3 pushed after v1.2.0 exists)
      # must not repoint `latest` at the older image. Worst case is `latest`
      # staying put, never worse than the previous unconditional behavior.
      - name: Determine whether this tag should move `latest`
        id: latest_check
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          git fetch --tags --force --quiet
          HIGHEST=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ "$TAG" = "$HIGHEST" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
            echo "$TAG is the highest release tag — 'latest' will move to it."
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "$TAG is not the highest release tag ($HIGHEST) — leaving 'latest' unchanged."
          fi

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.latest_check.outputs.is_latest == 'true' }}

      # Pushed WITHOUT any tag — `push-by-digest=true` uploads the image index
      # and leaves it addressable only by digest. That is the whole point: the
      # scan and the migration round-trip below run against the real published
      # artifact, but nothing users pull (`:1.2.3`, `:1.2`, `:latest`) points at
      # it until those gates pass. Previously every tag including `latest` moved
      # first and the scan ran afterwards, so a HIGH/CRITICAL finding failed the
      # job with the vulnerable image already serving `latest`.
      #
      # `load: true` is NOT an option here: buildx cannot load a multi-platform
      # index into the local docker daemon, and this build is amd64+arm64 with
      # attestations. A candidate digest in the registry is the workable shape.
      #
      # A candidate that fails the gates is left untagged in GHCR. That is
      # inert — it cannot be reached by name — and untagged versions are the
      # normal cleanup target for the registry's retention policy.
      - name: Build and push by digest (untagged release candidate)
        id: build-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Names the repository only; `push-by-digest` discards the tag part.
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Ship an SBOM and full build provenance alongside the image so the
          # release is auditable without trusting the registry's tag mapping.
          # Both ride in the same image index the digest above addresses; the
          # build is already multi-platform, so the index shape is unchanged
          # apart from the extra attestation manifests.
          provenance: mode=max
          sbom: true

      - name: Run Trivy vulnerability scan on release image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'

      # The migration round-trip ci.yml's docker-verify job runs, which this
      # pipeline had no equivalent of. `docker-entrypoint.sh` runs `alembic
      # upgrade head` on every boot, so an irreversible migration reaches every
      # self-hosted database — the same class of bug as the v1.0.2 volume miss.
      # Running it here rather than in `verify` costs no extra build AND tests
      # the exact artifact being released instead of a separately-built image.
      - name: Pull the release candidate for the compose smoke test
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}
        run: |
          set -euo pipefail
          # docker-compose.yml's `app` service keeps `build: .`, and compose
          # builds from source when the image is absent locally. Pulling first
          # is what makes the stack run the pushed candidate.
          docker pull "$IMAGE_REF"

      - name: Bring up the release candidate stack
        uses: ./.github/actions/compose-up
        with:
          vision-image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}

      # Same `-f` pair as the bring-up in ./.github/actions/compose-up — the
      # stack was created from both files, so every later invocation must name
      # both or compose resolves a different service definition.
      - name: Verify migration reversibility (downgrade -1, upgrade head)
        run: |
          set -e
          COMPOSE=(docker compose -f docker-compose.yml -f docker-compose.ci.yml)
          echo "Current revision before round-trip:"
          "${COMPOSE[@]}" exec -T app /venv/bin/alembic -c /app/config/alembic.ini current
          echo "Downgrading one revision..."
          "${COMPOSE[@]}" exec -T app /venv/bin/alembic -c /app/config/alembic.ini downgrade -1
          echo "Re-upgrading to head..."
          "${COMPOSE[@]}" exec -T app /venv/bin/alembic -c /app/config/alembic.ini upgrade head
          echo "Round-trip OK."

      - name: Tear down the release candidate stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

      # Promotion: every gate above passed, so the candidate digest may now take
      # the release tags. `imagetools create` copies the pushed index by digest
      # — it does not rebuild or re-resolve anything — so the semver tags and
      # `latest` end up pointing at the SAME index, attestation manifests
      # included, that Trivy scanned and the release metadata publishes.
      - name: Promote the scanned digest to the release tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            args+=(-t "$tag")
            echo "Promoting -> $tag"
          done <<< "$TAGS"
          if [ ${#args[@]} -eq 0 ]; then
            echo "ERROR: docker/metadata-action produced no tags — refusing to publish an unreachable release."
            exit 1
          fi
          docker buildx imagetools create "${args[@]}" "$IMAGE_REF"

      # The invariant this whole flow exists for: what users pull must be the
      # digest that was scanned and the digest the release asset names. Assert
      # it instead of trusting that the copy behaved.
      - name: Verify every promoted tag resolves to the scanned digest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            got=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$tag")
            if [ "$got" = "$DIGEST" ]; then
              echo "OK   $tag -> $got"
            else
              echo "FAIL $tag -> $got (expected $DIGEST)"
              failed=1
            fi
          done <<< "$TAGS"
          if [ "$failed" != "0" ]; then
            echo "ERROR: a release tag does not resolve to the scanned digest."
            exit 1
          fi

      # Published as a release asset (see the release job) so the image this
      # release shipped can be pulled by immutable digest rather than by the
      # mutable `:latest` tag the desktop app pulls today. The digest comes from
      # the push itself, so a registry that later repoints the tag cannot serve
      # different content under this reference.
      - name: Write docker metadata file
        run: |
          mkdir -p dist
          {
            echo "version=${{ steps.meta.outputs.version }}"
            echo "tags=${{ steps.meta.outputs.tags }}"
            echo "digest=${{ steps.build-push.outputs.digest }}"
            echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}"
          } > dist/docker-image-tag.txt

      - name: Upload docker metadata artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: dockerbuild
          path: dist/docker-image-tag.txt
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Build mac .app + .dmg via electron-builder (arm64 — Apple Silicon only)
  #    Ad-hoc signed (mac.identity=null) so the binary loads on Apple Silicon
  #    without an Apple Developer ID. Users still see Gatekeeper on first run
  #    and need right-click → Open once. README explains this.
  # ─────────────────────────────────────────────────────────────────────────────
  package-mac:
    name: Build mac .app + DMG
    needs: [verify]
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Setup Node (for electron-builder native deps)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: 20

      - name: Generate locales (writes packaging/electron/i18n)
        run: CI=1 bun run generate-locales

      - name: Install electron deps and build .app + DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          cd packaging/electron
          # Hardened install for the shipped artifact: pin to the committed
          # lockfile (--frozen-lockfile) and block transitive lifecycle scripts
          # (--ignore-scripts) so no postinstall code runs into the signed .dmg.
          # electron-builder fetches the Electron binary itself via @electron/get,
          # independent of any postinstall.
          # bun, not npm: packaging/electron's package-lock.json was deleted in
          # 4a671a3 and bun.lock is the only committed lockfile, so `npm ci` here
          # had no lockfile left to install from.
          bun install --frozen-lockfile --ignore-scripts
          npx electron-builder --mac --arm64 --publish never

      - name: Stage release artifacts
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          OUT="$GITHUB_WORKSPACE/dist/release"
          mkdir -p "$OUT"
          DMG_SRC=$(ls packaging/electron/dist/*.dmg | head -1)
          ZIP_SRC=$(ls packaging/electron/dist/*-arm64-mac.zip 2>/dev/null | head -1 \
                    || ls packaging/electron/dist/*-mac.zip | head -1)
          cp "$DMG_SRC" "$OUT/Vision-${VER}-arm64.dmg"
          cp "$ZIP_SRC" "$OUT/Vision-${VER}-arm64-mac.zip"
          sed "s/__VERSION__/${VER}/g" packaging/release/vision-setup.command \
            > "$OUT/vision-setup.command"
          chmod +x "$OUT/vision-setup.command"
          sed "s/__VERSION__/${VER}/g" packaging/release/README.md \
            > "$OUT/README.md"

      # The in-app shell updater (repo/source mode) installs from this ZIP.
      # Its layout is dictated by packaging/electron/updater.js, NOT by taste:
      #   - the asset name must match /vision-source-launcher-.*-arm64\.zip$/i
      #     (pickSourceLauncherZip, updater.js:214-217)
      #   - after `ditto -x -k` the extracted tree must contain
      #     `unsigned/Vision/package.json` — that directory is rsynced over the
      #     user's clone as the new source root (updater.js:319-324)
      #   - `unsigned/launch.command`, when present, is copied to the install
      #     root as the double-clickable launcher (updater.js:320,331)
      #   - every entry must be a relative, non-traversing path (updater.js:305-315)
      # `git archive HEAD` gives exactly the tagged source tree — no node_modules,
      # no packaging/electron/dist, none of the electron-builder output produced
      # by the steps above. Generated locales are deliberately absent: the
      # installed tree regenerates them via `electron:prod` → generate-locales.
      - name: Build source-launcher bundle for the in-app updater
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          OUT="$GITHUB_WORKSPACE/dist/release"
          ZIP="$OUT/vision-source-launcher-${VER}-arm64.zip"
          STAGE="$RUNNER_TEMP/source-launcher"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/unsigned/Vision"
          git archive --format=tar HEAD | tar -x -C "$STAGE/unsigned/Vision"
          cp packaging/electron/unsigned/launch.command "$STAGE/unsigned/launch.command"
          chmod +x "$STAGE/unsigned/launch.command"
          ( cd "$STAGE" && zip -r -q -X "$ZIP" unsigned )

          # Guard the contract above — a silently malformed bundle would strand
          # source-mode users exactly like the missing asset did.
          unzip -Z1 "$ZIP" > "$STAGE/entries.txt"
          for want in unsigned/Vision/package.json unsigned/Vision/docker-compose.yml unsigned/launch.command; do
            if ! grep -qxF "$want" "$STAGE/entries.txt"; then
              echo "ERROR: source-launcher ZIP is missing required entry: $want"
              exit 1
            fi
          done
          if grep -qE '^/|(^|/)\.\.(/|$)' "$STAGE/entries.txt"; then
            echo "ERROR: source-launcher ZIP contains an absolute or traversing path"
            exit 1
          fi
          echo "Source-launcher bundle OK: $(basename "$ZIP") ($(wc -l < "$STAGE/entries.txt") entries)"

      - name: Compute SHA256 checksums
        run: |
          set -euo pipefail
          cd dist/release
          for f in Vision-*.dmg Vision-*.zip vision-source-launcher-*.zip vision-setup.command README.md; do
            shasum -a 256 "$f" > "${f}.sha256"
            echo "--- ${f} ---"
            cat "${f}.sha256"
          done

      - name: Upload mac release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: vision-mac-release
          path: dist/release/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Create GitHub Release and attach artifacts
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [docker, package-mac]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write  # required to create releases and upload assets
      packages: read
    steps:
      - name: Download mac release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: vision-mac-release
          path: dist/mac

      - name: Download docker metadata artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: dockerbuild
          path: dist/dockerbuild

      - name: List downloaded artifacts
        run: find dist/ -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "Vision ${{ github.event.inputs.tag || github.ref_name }}"
          draft: false
