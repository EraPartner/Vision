name: Release

# Triggered when a version tag is pushed, e.g. v1.2.3
# Workflow:
#   0. Verify: version tag matches packaging/electron/package.json + full quality gate
#   1. Build & push multi-arch Docker image to GHCR (linux/amd64 + linux/arm64)
#   2. Build mac .app + .dmg via electron-builder (arm64 — Apple Silicon only)
#   3. Create a GitHub Release with all artifacts + SHA256 checksums

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3)"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/vision

# Deny all permissions by default; each job opts in to only what it needs.
permissions: {}

# Serialize releases for the same ref. Do NOT cancel in-progress —
# tag publishes are not safe to abort mid-upload.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 0. Verify: version tag == package.json version + full quality gate
  # ─────────────────────────────────────────────────────────────────────────────
  verify:
    name: Verify Release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check version tag matches package.json
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG_VERSION="${TAG#v}"
          ROOT_VERSION=$(node -p "require('./package.json').version")
          PKG_VERSION=$(node -p "require('./packaging/electron/package.json').version")
          echo "Tag version              : $TAG_VERSION"
          echo "Root package.json        : $ROOT_VERSION"
          echo "Electron package.json    : $PKG_VERSION"
          if [ "$TAG_VERSION" != "$ROOT_VERSION" ]; then
            echo "ERROR: git tag ($TAG_VERSION) does not match root package.json version ($ROOT_VERSION)"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: git tag ($TAG_VERSION) does not match packaging/electron/package.json version ($PKG_VERSION)"
            exit 1
          fi
          if [ "$ROOT_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: root package.json ($ROOT_VERSION) and packaging/electron/package.json ($PKG_VERSION) are out of sync"
            exit 1
          fi
          echo "Version check passed."

      - name: Audit JS dependencies
        run: bun audit --audit-level=high

      - name: Setup Python (for pip-audit)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Audit Python dependencies
        run: pip install pip-audit && pip-audit -r config/requirements.txt

      - name: Lint frontend
        run: bun run lint

      - name: Lint backend
        run: bun run lint:backend

      - name: Generate locales
        run: CI=1 bun run generate-locales

      - name: Type-check frontend
        run: cd apps/frontend && bunx tsc --noEmit

      - name: Build frontend
        run: CI=1 bun run build

      - name: Install electron workspace dependencies (required for backend tests)
        run: npm install --prefix packaging/electron --ignore-scripts

      - name: Run backend tests
        run: bun run test

      - name: Run frontend tests with coverage
        run: bun run test:coverage

  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Build & push Docker image to GHCR
  # ─────────────────────────────────────────────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write  # required to push to GHCR with GITHUB_TOKEN

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up QEMU (for cross-platform builds)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write docker metadata file
        run: |
          mkdir -p dist
          echo "version=${{ steps.meta.outputs.version }}" > dist/docker-image-tag.txt
          echo "tags=${{ steps.meta.outputs.tags }}" >> dist/docker-image-tag.txt

      - name: Upload docker metadata artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dockerbuild
          path: dist/docker-image-tag.txt
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Build mac .app + .dmg via electron-builder (arm64 — Apple Silicon only)
  #    Ad-hoc signed (mac.identity=null) so the binary loads on Apple Silicon
  #    without an Apple Developer ID. Users still see Gatekeeper on first run
  #    and need right-click → Open once. README explains this.
  # ─────────────────────────────────────────────────────────────────────────────
  package-mac:
    name: Build mac .app + DMG
    needs: [verify]
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Setup Node (for electron-builder native deps)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Generate locales (writes packaging/electron/i18n)
        run: CI=1 bun run generate-locales

      - name: Install electron deps and build .app + DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          cd packaging/electron
          npm install
          npx electron-builder --mac --arm64 --publish never

      - name: Stage release artifacts
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          OUT="$GITHUB_WORKSPACE/dist/release"
          mkdir -p "$OUT"
          DMG_SRC=$(ls packaging/electron/dist/*.dmg | head -1)
          ZIP_SRC=$(ls packaging/electron/dist/*-arm64-mac.zip 2>/dev/null | head -1 \
                    || ls packaging/electron/dist/*-mac.zip | head -1)
          cp "$DMG_SRC" "$OUT/Vision-${VER}-arm64.dmg"
          cp "$ZIP_SRC" "$OUT/Vision-${VER}-arm64-mac.zip"
          sed "s/__VERSION__/${VER}/g" packaging/release/vision-setup.command \
            > "$OUT/vision-setup.command"
          chmod +x "$OUT/vision-setup.command"
          sed "s/__VERSION__/${VER}/g" packaging/release/README.md \
            > "$OUT/README.md"

      - name: Compute SHA256 checksums
        run: |
          set -euo pipefail
          cd dist/release
          for f in Vision-*.dmg Vision-*.zip vision-setup.command README.md; do
            shasum -a 256 "$f" > "${f}.sha256"
            echo "--- ${f} ---"
            cat "${f}.sha256"
          done

      - name: Upload mac release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vision-mac-release
          path: dist/release/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Create GitHub Release and attach artifacts
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [docker, package-mac]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write  # required to create releases and upload assets
      packages: read
    steps:
      - name: Download mac release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vision-mac-release
          path: dist/mac

      - name: Download docker metadata artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dockerbuild
          path: dist/dockerbuild

      - name: List downloaded artifacts
        run: find dist/ -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "Vision ${{ github.event.inputs.tag || github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/mac/Vision-*.dmg
            dist/mac/Vision-*.zip
            dist/mac/vision-setup.command
            dist/mac/README.md
            dist/mac/*.sha256
