name: Release

# Triggered when a version tag is pushed, e.g. v1.2.3
# Workflow:
#   1. Build & push multi-arch Docker image to GHCR (linux/amd64 + linux/arm64)
#   2. Build macOS DMG for arm64 (Apple Silicon)
#   3. Publish a GitHub Release with the DMG attached
#      — electron-updater reads the auto-generated latest-mac.yml from that release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3)"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/vision

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Build & push Docker image to GHCR
  # ─────────────────────────────────────────────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for cross-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # e.g. v1.2.3 → 1.2.3 + latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write docker metadata file
        run: |
          mkdir -p dist
          # Write the resolved image version/tag and raw tags for later jobs
          echo "version=${{ steps.meta.outputs.version }}" > dist/docker-image-tag.txt
          echo "tags=${{ steps.meta.outputs.tags }}" >> dist/docker-image-tag.txt

      - name: Upload docker metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: dockerbuild
          path: dist/docker-image-tag.txt

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Build macOS DMG (arm64 — Apple Silicon only)
  # ─────────────────────────────────────────────────────────────────────────────
  dmg-arm64:
    name: Build DMG (arm64)
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ secrets.GH_RELEASE_PAT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
        shell: bash

      - name: Stamp version into electron package.json
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Use explicit workflow_dispatch input.tag when provided; otherwise use
          # the ref_name (for tag pushes). This prevents branch names like
          # 'main' from being written into package.json as the version.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            VERSION="$INPUT_TAG"
          else
            VERSION="$REF_NAME"
          fi
          # Strip leading 'v' for package.json
          VERSION="${VERSION#v}"
          node -e "
            const fs = require('fs');
            const p = 'packaging/electron/package.json';
            const pkg = JSON.parse(fs.readFileSync(p));
            pkg.version = '${VERSION}';
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build Electron DMG (arm64)
        run: |
          set -euo pipefail
          cd packaging/electron
          bun install
          bun run dist:arm64
        shell: bash

      - name: Create unsigned portable zip
        shell: bash
        run: |
          set -euo pipefail
          cd packaging/electron/dist
          mkdir -p unsigned
          # Copy any produced .app into the unsigned folder (if present)
          cp -R *.app unsigned/ 2>/dev/null || true

          # If no .app was produced directly, try extracting from the generated .dmg
          if [ -z "$(ls -A unsigned 2>/dev/null || true)" ]; then
            DMG=$(ls *.dmg 2>/dev/null | head -n1 || true)
            if [ -n "$DMG" ]; then
              MNT=$(mktemp -d)
              hdiutil attach "$DMG" -mountpoint "$MNT" -nobrowse -quiet || true
              cp -R "$MNT"/*.app unsigned/ 2>/dev/null || true
              hdiutil detach "$MNT" -quiet || true
              rmdir "$MNT" || true
            fi
          fi

          # Create a small double-clickable launcher that removes quarantine and opens the app
          cat > unsigned/launch.command <<'EOF'
#!/bin/bash
DIR="$(cd "$(dirname "$0")" && pwd)"
APP="$DIR/Vision.app"
if [ ! -d "$APP" ]; then
  echo "Vision.app not found in $DIR"
  exit 1
fi
xattr -dr com.apple.quarantine "$APP" 2>/dev/null || true
open "$APP" || { echo "Failed to open $APP — try right-click → Open in Finder to bypass Gatekeeper."; exit 2; }
EOF

          chmod +x unsigned/launch.command

          ZIPNAME="Vision-unsigned-${{ github.ref_name }}-arm64.zip"
          zip -r "$ZIPNAME" unsigned

          mkdir -p "$GITHUB_WORKSPACE/dist/unsigned"
          mv "$ZIPNAME" "$GITHUB_WORKSPACE/dist/unsigned/"

      - name: Upload unsigned portable zip
        uses: actions/upload-artifact@v4
        with:
          name: vision-unsigned-zip
          path: dist/unsigned/Vision-unsigned-${{ github.ref_name }}-arm64.zip

      - name: Find generated artifacts
        id: artifacts
        run: |
          DMG=$(find packaging/electron/dist -name '*.dmg' -print -quit)
          YML=$(find packaging/electron/dist -name 'latest-mac.yml' -print -quit || true)
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "yml=$YML" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Upload DMG (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: dmg-arm64
          path: ${{ steps.artifacts.outputs.dmg }}

      - name: Upload latest-mac.yml
        if: steps.artifacts.outputs.yml != ''
        uses: actions/upload-artifact@v4
        with:
          name: latest-mac-yml
          path: ${{ steps.artifacts.outputs.yml }}

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Create GitHub Release and attach artifacts
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [docker, dmg-arm64]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_RELEASE_PAT }}
    permissions:
      contents: write
      packages: read

    steps:
      - name: Download DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: dmg-arm64
          path: dist/dmg-arm64

      - name: Download latest-mac.yml artifact
        uses: actions/download-artifact@v4
        with:
          name: latest-mac-yml
          path: dist/latest-mac-yml

      - name: Download docker metadata artifact
        uses: actions/download-artifact@v4
        with:
          name: dockerbuild
          path: dist/dockerbuild

      - name: List downloaded artifacts
        run: find dist/ -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Vision ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/dmg-arm64/*.dmg
            dist/latest-mac-yml/latest-mac.yml
            dist/unsigned/*.zip
