name: Release

# Triggered when a version tag is pushed, e.g. v1.2.3
# Workflow:
#   1. Build & push multi-arch Docker image to GHCR (linux/amd64 + linux/arm64)
#   2. Build unsigned macOS ZIP for arm64 (Apple Silicon)
#   3. Publish a GitHub Release with the unsigned ZIP attached

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3)"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/vision

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Build & push Docker image to GHCR
  # ─────────────────────────────────────────────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for cross-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # e.g. v1.2.3 → 1.2.3 + latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write docker metadata file
        run: |
          mkdir -p dist
          # Write the resolved image version/tag and raw tags for later jobs
          echo "version=${{ steps.meta.outputs.version }}" > dist/docker-image-tag.txt
          echo "tags=${{ steps.meta.outputs.tags }}" >> dist/docker-image-tag.txt

      - name: Upload docker metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: dockerbuild
          path: dist/docker-image-tag.txt

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Build unsigned macOS ZIP (arm64 — Apple Silicon only)
  # ─────────────────────────────────────────────────────────────────────────────
  # Create an unsigned mac package (no signing, no notarization). This produces
  # an unsigned zip containing Vision.app and the launch.command so users can
  # run the app locally without needing Apple Developer signing/notarization.
  package-mac:
    name: Package mac app (unsigned)
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ secrets.GH_RELEASE_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
        shell: bash

      - name: Build Electron (unsigned .app)
        run: |
          set -euo pipefail
          cd packaging/electron
          bun install
          # build the arm64 mac artifact (use existing dist:arm64 script)
          bun run dist:arm64
        shell: bash

      - name: Create unsigned portable zip (ditto)
        run: |
          set -euo pipefail
          cd packaging/electron/dist
          # Copy the app into a clean folder and generate a launch.command helper
          mkdir -p unsigned
          cp -R *.app unsigned/ 2>/dev/null || true
          # Generate a simple launcher that removes quarantine and opens the app
          cat > unsigned/launch.command <<'LAUNCH'
          #!/bin/bash
          set -euo pipefail
          DIR="$(cd "$(dirname "$0")" && pwd)"
          SRC_APP="$DIR/Vision.app"
          if [ ! -d "$SRC_APP" ]; then
            echo "Vision.app not found in $DIR"
            exit 1
          fi

          TARGET_DIR="/Applications"
          TARGET_APP="$TARGET_DIR/Vision.app"

          if [ ! -w "$TARGET_DIR" ]; then
            TARGET_DIR="$HOME/Applications"
            TARGET_APP="$TARGET_DIR/Vision.app"
            mkdir -p "$TARGET_DIR"
          fi

          rm -rf "$TARGET_APP"
          cp -R "$SRC_APP" "$TARGET_APP"
          xattr -dr com.apple.quarantine "$TARGET_APP" 2>/dev/null || true
          open "$TARGET_APP" || { echo "Failed to open $TARGET_APP — try right-click -> Open in Finder to bypass Gatekeeper."; exit 2; }
          LAUNCH
          chmod +x unsigned/launch.command
          TAG="${{ github.ref_name }}"
          # Use ditto to preserve macOS metadata
          ditto -c -k --sequesterRsrc --keepParent unsigned "Vision-unsigned-${TAG}-arm64.zip"
          mkdir -p "$GITHUB_WORKSPACE/dist/unsigned"
          mv "Vision-unsigned-${TAG}-arm64.zip" "$GITHUB_WORKSPACE/dist/unsigned/"

      - name: Upload unsigned portable zip
        uses: actions/upload-artifact@v4
        with:
          name: vision-unsigned-zip
          path: dist/unsigned/Vision-unsigned-${{ github.ref_name }}-arm64.zip

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Create GitHub Release and attach artifacts
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [docker, package-mac]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_RELEASE_PAT }}
    permissions:
      contents: write
      packages: read

    steps:
      - name: Download unsigned portable zip
        uses: actions/download-artifact@v4
        with:
          name: vision-unsigned-zip
          path: dist/unsigned

      - name: Download docker metadata artifact
        uses: actions/download-artifact@v4
        with:
          name: dockerbuild
          path: dist/dockerbuild

      - name: List downloaded artifacts
        run: find dist/ -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Vision ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/unsigned/*.zip
