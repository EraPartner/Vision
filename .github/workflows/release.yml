name: Release

# Triggered when a version tag is pushed, e.g. v1.2.3
# Workflow:
#   0. Verify: version tag matches packaging/electron/package.json + run lint/tests
#   1. Build & push multi-arch Docker image to GHCR (linux/amd64 + linux/arm64)
#   2. Build source launcher ZIP for source-based production startup
#   3. Publish a GitHub Release with all artifacts + SHA256 checksums

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3)"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/vision

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 0. Verify: version tag == package.json version + lint + tests
  # ─────────────────────────────────────────────────────────────────────────────
  verify:
    name: Verify Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check version tag matches package.json
        run: |
          TAG="${{ github.ref_name }}"
          # Trim leading 'v' from tag
          TAG_VERSION="${TAG#v}"
          PKG_VERSION=$(node -p "require('./packaging/electron/package.json').version")
          echo "Tag version  : $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: git tag ($TAG_VERSION) does not match packaging/electron/package.json version ($PKG_VERSION)"
            echo "Update packaging/electron/package.json before tagging."
            exit 1
          fi
          echo "Version check passed."

      - name: Lint frontend
        run: bun run lint

      - name: Lint backend
        run: bun run lint:backend

      - name: Generate locales
        run: CI=1 bun run generate-locales

      - name: Test backend
        run: bun run test

      - name: Test frontend
        run: bun run test:frontend

  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Build & push Docker image to GHCR
  # ─────────────────────────────────────────────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for cross-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # e.g. v1.2.3 → 1.2.3 + latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write docker metadata file
        run: |
          mkdir -p dist
          # Write the resolved image version/tag and raw tags for later jobs
          echo "version=${{ steps.meta.outputs.version }}" > dist/docker-image-tag.txt
          echo "tags=${{ steps.meta.outputs.tags }}" >> dist/docker-image-tag.txt

      - name: Upload docker metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: dockerbuild
          path: dist/docker-image-tag.txt

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Build source launcher ZIP (arm64 — Apple Silicon only)
  # ─────────────────────────────────────────────────────────────────────────────
  # Create a source launcher package (no .app binary distribution). This
  # produces a zip containing the Vision source tree + launch.command.
  package-mac:
    name: Package mac source launcher
    needs: [verify]
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ secrets.GH_RELEASE_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
        shell: bash

      - name: Create source launcher zip (ditto)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          TAG="${{ github.ref_name }}"
          mkdir -p dist/source-launcher/unsigned

          # Package source tree (without .git and heavy transient dirs)
          rsync -a ./ dist/source-launcher/unsigned/Vision/ \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'apps/frontend/node_modules' \
            --exclude 'apps/node-backend/node_modules' \
            --exclude 'packaging/electron/node_modules' \
            --exclude 'dist' \
            --exclude 'postgres_data' \
            --exclude 'venv' \
            --exclude '.idea' \
            --exclude '.pytest_cache' \
            --exclude '.DS_Store'

          cp packaging/electron/unsigned/launch.command dist/source-launcher/unsigned/launch.command
          chmod +x dist/source-launcher/unsigned/launch.command

          cd dist/source-launcher
          ditto -c -k --sequesterRsrc --keepParent unsigned "Vision-source-launcher-${TAG}-arm64.zip"
          mkdir -p "$GITHUB_WORKSPACE/dist/unsigned"
          mv "Vision-source-launcher-${TAG}-arm64.zip" "$GITHUB_WORKSPACE/dist/unsigned/"

      - name: Compute SHA256 checksum
        run: |
          TAG="${{ github.ref_name }}"
          cd dist/unsigned
          ZIP="Vision-source-launcher-${TAG}-arm64.zip"
          shasum -a 256 "$ZIP" > "${ZIP}.sha256"
          echo "--- Checksum ---"
          cat "${ZIP}.sha256"

      - name: Upload source launcher zip
        uses: actions/upload-artifact@v4
        with:
          name: vision-source-launcher-zip
          path: |
            dist/unsigned/Vision-source-launcher-${{ github.ref_name }}-arm64.zip
            dist/unsigned/Vision-source-launcher-${{ github.ref_name }}-arm64.zip.sha256

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Create GitHub Release and attach artifacts
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [docker, package-mac]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_RELEASE_PAT }}
    permissions:
      contents: write
      packages: read

    steps:
      - name: Download source launcher zip
        uses: actions/download-artifact@v4
        with:
          name: vision-source-launcher-zip
          path: dist/unsigned

      - name: Download docker metadata artifact
        uses: actions/download-artifact@v4
        with:
          name: dockerbuild
          path: dist/dockerbuild

      - name: List downloaded artifacts
        run: find dist/ -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Vision ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/unsigned/*.zip
            dist/unsigned/*.sha256
