name: Release

# Triggered when a version tag is pushed, e.g. v1.2.3
# Workflow:
#   0. Verify: version tag matches root, frontend, and Electron package manifests; run release checks
#   1. Build mac .app + .dmg via electron-builder (arm64 — Apple Silicon only)
#   2. Create a GitHub Release with all artifacts + SHA256 checksums

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3)"
        required: true

# Deny all permissions by default; each job opts in to only what it needs.
permissions: {}

# Serialize releases for the same ref. Do NOT cancel in-progress —
# tag publishes are not safe to abort mid-upload.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 0. Verify: version tag == package.json version + release checks
  # ─────────────────────────────────────────────────────────────────────────────
  verify:
    name: Verify Release
    runs-on: ubuntu-24.04
    outputs:
      release_commit: ${{ steps.release_commit.outputs.sha }}
    # Allow time for native migration checks and all release test suites.
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      # Fail fast on a malformed release tag. Map the (possibly workflow_dispatch
      # user-supplied) value through env: rather than interpolating ${{ }} inline
      # into the shell, so it can't inject shell, and validate the format before
      # it's used as a checkout ref or elsewhere in the pipeline.
      - name: Validate release tag format
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "ERROR: release tag '$TAG' must be canonical vMAJOR.MINOR.PATCH (e.g. v1.2.3; no leading zeros)"
            exit 1
          fi
          echo "Release tag OK: $TAG"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require release commit on main
        id: release_commit
        run: |
          set -euo pipefail
          git show-ref --verify --quiet refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "ERROR: release commit is not reachable from main"
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Enforce private internal package boundaries
        run: node scripts/check-package-boundaries.js

      - name: Enforce workflow supply-chain policy
        run: python3 scripts/check-workflow-supply-chain.py

      # ci.yml's Secrets Scan job cannot stand in for this one: gitleaks-action
      # scans the push event's commit RANGE, and a tag push carries no commits,
      # so it would report "no commits to scan" and pass. This scans the whole
      # tree the tag actually ships — and runs before `bun install`, so vendored
      # test fixtures under node_modules can never flag. The release is pinned to
      # a version AND its checksum, like every action SHA in this workflow.
      - name: Secrets scan (gitleaks, full release tree)
        env:
          GITLEAKS_VERSION: "8.30.0"
          GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --config config/gitleaks.toml --redact --no-banner

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Check version tag matches package.json
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          TAG_VERSION="${TAG#v}"
          ROOT_VERSION=$(node -p "require('./package.json').version")
          FRONTEND_VERSION=$(node -p "require('./apps/frontend/package.json').version")
          PKG_VERSION=$(node -p "require('./packaging/electron/package.json').version")
          echo "Tag version              : $TAG_VERSION"
          echo "Root package.json        : $ROOT_VERSION"
          echo "Frontend package.json    : $FRONTEND_VERSION"
          echo "Electron package.json    : $PKG_VERSION"
          if [ "$TAG_VERSION" != "$ROOT_VERSION" ]; then
            echo "ERROR: git tag ($TAG_VERSION) does not match root package.json version ($ROOT_VERSION)"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: git tag ($TAG_VERSION) does not match packaging/electron/package.json version ($PKG_VERSION)"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$FRONTEND_VERSION" ]; then
            echo "ERROR: git tag ($TAG_VERSION) does not match apps/frontend/package.json version ($FRONTEND_VERSION)"
            exit 1
          fi
          if [ "$ROOT_VERSION" != "$FRONTEND_VERSION" ] || [ "$ROOT_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: root ($ROOT_VERSION), frontend ($FRONTEND_VERSION), and Electron ($PKG_VERSION) package versions are out of sync"
            exit 1
          fi
          echo "Version check passed."

      - name: Audit JS dependencies
        # Shared with ci.yml's Deps Audit (JS) job via scripts/audit-js.sh so the
        # audit command + accepted-risk ignore list can't drift between the two.
        run: sh scripts/audit-js.sh

      - name: Setup Python (for pip-audit)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v5
        with:
          python-version: "3.12"

      - name: Audit Python dependencies
        run: pip install pip-audit==2.10.1 && pip-audit -r config/requirements.txt

      - name: Install native runtime dependencies
        run: |
          pip install -r config/requirements.txt
          bash .github/scripts/install-postgres-18.sh

      - name: Scan release filesystem with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Lint frontend
        run: bun run lint

      - name: Lint backend
        run: bun run lint:backend

      - name: Generate locales
        run: CI=1 bun run generate-locales

      # The four assertions of ci.yml's verify-generated job, which this gate
      # omitted entirely: a tag cut from a commit that edited openapi.yaml or
      # i18n/source without regenerating shipped the stale committed artifacts.
      # `Generate locales` above already regenerated them, so the locale drift
      # check here is a plain git diff.
      - name: Validate locales (en/nl key parity, generated TS integrity)
        run: bun run validate-locales

      - name: Check generated locales for drift
        run: |
          if ! git diff --exit-code -- apps/frontend/src/locales/; then
            echo "ERROR: apps/frontend/src/locales/*.ts are out of sync with i18n/source."
            echo "Run 'bun run generate-locales' locally and commit the regenerated files."
            exit 1
          fi
          echo "Frontend locales in sync."

      - name: Regenerate OpenAPI types and check for drift
        run: |
          bun run generate:types
          if ! git diff --exit-code -- apps/frontend/src/types/generated.ts; then
            echo "ERROR: apps/frontend/src/types/generated.ts is out of sync with openapi.yaml."
            echo "Run 'bun run generate:types' locally and commit the regenerated file."
            exit 1
          fi
          echo "OpenAPI types in sync."

      - name: Verify endpoint matrix count matches openapi.yaml
        run: bun run check-endpoint-matrix

      - name: Type-check frontend
        run: cd apps/frontend && bun run typecheck

      # ci.yml's typecheck-backend job — a required gate there, absent here.
      # Both halves: the loose base program over all of src/, then the
      # noImplicitAny ratchet over src/ with an explicit existing-debt baseline.
      - name: Type-check backend (JSDoc)
        run: apps/node-backend/node_modules/.bin/tsc -p apps/node-backend/tsconfig.check.json

      - name: Type-check backend (noImplicitAny ratchet)
        run: cd apps/node-backend && bun scripts/checkjs-ratchet.js

      - name: Build frontend
        run: CI=1 bun run build

      - name: Check frontend bundle size
        run: cd apps/frontend && bun run size:check

      - name: Verify production health and migration reversibility
        env:
          VISION_NATIVE_VERIFY_MIGRATIONS: "1"
        run: bash .github/scripts/with-native-stack.sh curl -fsS http://127.0.0.1:3002/health

      - name: Install electron workspace dependencies (required for backend tests)
        run: bun install --frozen-lockfile --ignore-scripts --cwd packaging/electron

      - name: Run Electron and native-runtime contract tests
        run: bun run test:electron

      - name: Run repository script tests
        run: bun run test:scripts

      - name: Run backend tests with disposable PostgreSQL
        run: scripts/with-test-db.sh --coverage

      - name: Run frontend tests with coverage
        run: bun run test:coverage

      - name: Run live API contract tests
        env:
          LIVE_API_BASE: http://localhost:3002
          VISION_NATIVE_COMMAND_DIR: apps/frontend
        run: bash .github/scripts/with-native-stack.sh bun run vitest run src/test/live-contracts/live-contracts.test.ts

  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Build mac .app + .dmg via electron-builder (arm64 — Apple Silicon only)
  #    Ad-hoc signed (mac.identity=null) so the binary loads on Apple Silicon
  #    without an Apple Developer ID. Users still see Gatekeeper on first run
  #    and need right-click → Open once. README explains this.
  # ─────────────────────────────────────────────────────────────────────────────
  package-mac:
    name: Build mac .app + DMG
    needs: [verify]
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # keyless build attestations are created in the build job
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.release_commit }}

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Setup Node (for electron-builder native deps)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: 20

      - name: Setup Python (for the self-contained migration runtime)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v5
        with:
          python-version: "3.12"

      - name: Install pinned migration build dependencies
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r config/requirements.txt
          python -m pip install PyInstaller==6.22.2

      - name: Generate locales (writes packaging/electron/i18n)
        run: CI=1 bun run generate-locales

      - name: Install pinned native report browser
        run: |
          set -euo pipefail
          BROWSER_PATH=$(apps/node-backend/node_modules/.bin/puppeteer browsers install \
            chrome-headless-shell@150.0.7871.24 \
            --format '{{path}}')
          test -x "$BROWSER_PATH"
          printf 'VISION_CHROMIUM_SOURCE=%s\n' "$BROWSER_PATH" >> "$GITHUB_ENV"

      - name: Install electron deps and build .app + DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          POSTGRES_APP_URL: https://github.com/PostgresApp/PostgresApp/releases/download/v2.9.6/Postgres-2.9.6-14-15-16-17-18.dmg
          POSTGRES_APP_SHA256: ee67776540fb0d29cbd119ea4db4cac3c182349ed53048fdf79766a588ac86b3
        run: |
          set -euo pipefail
          bun run build
          PG_DMG="$RUNNER_TEMP/postgres-app-2.9.6.dmg"
          PG_MOUNT="$RUNNER_TEMP/postgres-app-2.9.6"
          curl -sSfL --retry 3 --retry-all-errors -o "$PG_DMG" "$POSTGRES_APP_URL"
          echo "$POSTGRES_APP_SHA256  $PG_DMG" | shasum -a 256 -c -
          mkdir -p "$PG_MOUNT"
          hdiutil attach -nobrowse -readonly -mountpoint "$PG_MOUNT" "$PG_DMG"
          trap 'hdiutil detach "$PG_MOUNT" >/dev/null' EXIT
          export VISION_POSTGRES_SOURCE_BIN="$PG_MOUNT/Postgres.app/Contents/Versions/18/bin"
          VISION_PYTHON_BIN="$(command -v python)"
          export VISION_PYTHON_BIN
          cd packaging/electron
          # Hardened install for the shipped artifact: pin to the committed
          # lockfile (--frozen-lockfile) and block transitive lifecycle scripts
          # (--ignore-scripts) so no postinstall code runs into the signed .dmg.
          # electron-builder fetches the Electron binary itself via @electron/get,
          # independent of any postinstall.
          # bun, not npm: packaging/electron's package-lock.json was deleted in
          # 4a671a3 and bun.lock is the only committed lockfile, so `npm ci` here
          # had no lockfile left to install from.
          bun install --frozen-lockfile --ignore-scripts
          node scripts/build-native-package.js
          hdiutil detach "$PG_MOUNT"
          trap - EXIT

      - name: Stage release artifacts
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          OUT="$GITHUB_WORKSPACE/dist/release"
          mkdir -p "$OUT"
          shopt -s nullglob
          DMG_FILES=(packaging/electron/dist/*.dmg)
          ZIP_FILES=(packaging/electron/dist/*-arm64-mac.zip)
          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            ZIP_FILES=(packaging/electron/dist/*-mac.zip)
          fi
          if [ "${#DMG_FILES[@]}" -ne 1 ] || [ "${#ZIP_FILES[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly one DMG and one macOS ZIP"
            exit 1
          fi
          cp "${DMG_FILES[0]}" "$OUT/Vision-${VER}-arm64.dmg"
          cp "${ZIP_FILES[0]}" "$OUT/Vision-${VER}-arm64-mac.zip"
          sed "s/__VERSION__/${VER}/g" packaging/release/README.md \
            > "$OUT/README.md"

      # The in-app shell updater (repo/source mode) installs from this ZIP.
      # Its layout is dictated by packaging/electron/updater.js, NOT by taste:
      #   - the asset name must match /vision-source-launcher-.*-arm64\.zip$/i
      #     (pickSourceLauncherZip, updater.js:214-217)
      #   - after `ditto -x -k` the extracted tree must contain
      #     `unsigned/Vision/package.json` — that directory is rsynced over the
      #     user's clone as the new source root (updater.js:319-324)
      #   - `unsigned/launch.command`, when present, is copied to the install
      #     root as the double-clickable launcher (updater.js:320,331)
      #   - every entry must be a relative, non-traversing path (updater.js:305-315)
      # `git archive HEAD` gives exactly the tagged source tree — no node_modules,
      # no packaging/electron/dist, none of the electron-builder output produced
      # by the steps above. Generated locales are deliberately absent: the
      # installed tree regenerates them via `electron:prod` → generate-locales.
      - name: Build source-launcher bundle for the in-app updater
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          OUT="$GITHUB_WORKSPACE/dist/release"
          ZIP="$OUT/vision-source-launcher-${VER}-arm64.zip"
          STAGE="$RUNNER_TEMP/source-launcher"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/unsigned/Vision"
          git archive --format=tar HEAD | tar -x -C "$STAGE/unsigned/Vision"
          cp packaging/electron/unsigned/launch.command "$STAGE/unsigned/launch.command"
          chmod +x "$STAGE/unsigned/launch.command"
          ( cd "$STAGE" && zip -r -q -X "$ZIP" unsigned )

          # Guard the contract above — a silently malformed bundle would strand
          # source-mode users exactly like the missing asset did.
          unzip -Z1 "$ZIP" > "$STAGE/entries.txt"
          for want in unsigned/Vision/package.json unsigned/launch.command; do
            if ! grep -qxF "$want" "$STAGE/entries.txt"; then
              echo "ERROR: source-launcher ZIP is missing required entry: $want"
              exit 1
            fi
          done
          if grep -qE '^/|(^|/)\.\.(/|$)' "$STAGE/entries.txt"; then
            echo "ERROR: source-launcher ZIP contains an absolute or traversing path"
            exit 1
          fi
          echo "Source-launcher bundle OK: $(basename "$ZIP") ($(wc -l < "$STAGE/entries.txt") entries)"

      - name: Generate shipped application and source SBOMs
        env:
          SYFT_VERSION: "1.52.0"
          SYFT_SHA256: 014d561b6d13059124155f74a6c5a9a99501f5e209313638dd884f39eb418ee6
        run: |
          set -euo pipefail
          if [ "$(uname -m)" != arm64 ]; then
            echo "ERROR: the macOS release runner must be Apple Silicon"
            exit 1
          fi
          SYFT_ARCHIVE="$RUNNER_TEMP/syft.tar.gz"
          curl -sSfL --retry 3 --retry-all-errors -o "$SYFT_ARCHIVE" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_darwin_arm64.tar.gz"
          echo "$SYFT_SHA256  $SYFT_ARCHIVE" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/syft-bin"
          tar -xzf "$SYFT_ARCHIVE" -C "$RUNNER_TEMP/syft-bin" syft
          APP_DIRS=(packaging/electron/dist/mac*/Vision.app)
          if [ "${#APP_DIRS[@]}" -ne 1 ] || [ ! -d "${APP_DIRS[0]}" ]; then
            echo "ERROR: expected exactly one packaged Vision.app for the SBOM"
            exit 1
          fi
          SYFT_CHECK_FOR_APP_UPDATE=false "$RUNNER_TEMP/syft-bin/syft" \
            "dir:${APP_DIRS[0]}" -o "cyclonedx-json=dist/release/Vision-app.cdx.json"
          SYFT_CHECK_FOR_APP_UPDATE=false "$RUNNER_TEMP/syft-bin/syft" \
            "dir:$RUNNER_TEMP/source-launcher/unsigned/Vision" \
            -o "cyclonedx-json=dist/release/Vision-source.cdx.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ("Vision-app.cdx.json", "Vision-source.cdx.json"):
              document = json.loads((Path("dist/release") / name).read_text())
              if document.get("bomFormat") != "CycloneDX" or not document.get("components"):
                  raise SystemExit(f"ERROR: {name} has no catalogued components")
              print(f"{name}: {len(document['components'])} components")
          PY

      - name: Compute SHA256 checksums
        run: |
          set -euo pipefail
          cd dist/release
          for f in Vision-*.dmg Vision-*.zip vision-source-launcher-*.zip Vision-*.cdx.json README.md; do
            shasum -a 256 "$f" > "${f}.sha256"
            echo "--- ${f} ---"
            cat "${f}.sha256"
          done

      - name: Attest artifacts from the build job
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/release/Vision-*.dmg
            dist/release/Vision-*-arm64-mac.zip
            dist/release/vision-source-launcher-*.zip

      - name: Attest packaged application SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/release/Vision-*.dmg
            dist/release/Vision-*-arm64-mac.zip
          sbom-path: dist/release/Vision-app.cdx.json

      - name: Attest source bundle SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/release/vision-source-launcher-*.zip
          sbom-path: dist/release/Vision-source.cdx.json

      - name: Upload mac release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: vision-mac-release
          path: dist/release/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Create GitHub Release and attach artifacts
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    environment: release
    needs: [verify, package-mac]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # required to create releases and upload assets
      attestations: read # verify build-job attestations before publication
    steps:
      - name: Download mac release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: vision-mac-release
          path: dist/mac

      - name: List downloaded artifacts
        run: find dist/ -type f | sort

      - name: Verify build-job provenance before publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for file in dist/mac/Vision-*.dmg dist/mac/Vision-*-arm64-mac.zip dist/mac/vision-source-launcher-*.zip; do
            gh attestation verify "$file" --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/release.yml"
          done

      - name: Stage GitHub Release with all assets
        id: stage_release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "Vision ${{ github.event.inputs.tag || github.ref_name }}"
          draft: true
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/mac/Vision-*.dmg
            dist/mac/Vision-*.zip
            dist/mac/vision-source-launcher-*.zip
            dist/mac/README.md
            dist/mac/Vision-*.cdx.json
            dist/mac/*.sha256

      - name: Publish immutable-ready release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          EXPECTED_COMMIT: ${{ needs.verify.outputs.release_commit }}
          RELEASE_ID: ${{ steps.stage_release.outputs.id }}
        run: |
          set -euo pipefail
          # The release tag must still name the reviewed commit when the draft
          # becomes public. `gh release edit` is the final publication step.
          ACTUAL_COMMIT=$(gh api "repos/${GITHUB_REPOSITORY}/commits/tags/${TAG}" --jq '.sha')
          if [ "$ACTUAL_COMMIT" != "$EXPECTED_COMMIT" ]; then
            echo "ERROR: release tag changed after verification"
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > "$RUNNER_TEMP/vision-draft-release.json"
          python3 - "$RUNNER_TEMP/vision-draft-release.json" dist/mac "$TAG" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          def sha256_file(file_path):
              hasher = hashlib.sha256()
              with file_path.open("rb") as source:
                  for block in iter(lambda: source.read(1024 * 1024), b""):
                      hasher.update(block)
              return hasher.hexdigest()

          release = json.loads(pathlib.Path(sys.argv[1]).read_text())
          directory = pathlib.Path(sys.argv[2])
          tag = sys.argv[3]
          version = tag.removeprefix("v")
          originals = {
              f"Vision-{version}-arm64.dmg",
              f"Vision-{version}-arm64-mac.zip",
              f"vision-source-launcher-{version}-arm64.zip",
              "Vision-app.cdx.json",
              "Vision-source.cdx.json",
              "README.md",
          }
          expected = originals | {f"{name}.sha256" for name in originals}
          items = list(directory.iterdir())
          local = {item.name for item in items}
          if (local != expected or any(not item.is_file() or item.is_symlink() for item in items) or
                  release.get("draft") is not True or release.get("tag_name") != tag):
              raise SystemExit("ERROR: local release inventory, draft state or tag is unexpected")

          for name in originals:
              digest = sha256_file(directory / name)
              if (directory / f"{name}.sha256").read_bytes() != f"{digest}  {name}\n".encode():
                  raise SystemExit(f"ERROR: invalid checksum file for {name}")

          assets = release.get("assets")
          if not isinstance(assets, list) or len(assets) != len(expected):
              raise SystemExit("ERROR: draft release has missing or extra assets")
          names = [asset.get("name") for asset in assets]
          if set(names) != expected or len(set(names)) != len(names):
              raise SystemExit("ERROR: draft release asset names differ from the verified handoff")
          for asset in assets:
              name = asset["name"]
              file_path = directory / name
              digest = sha256_file(file_path)
              if (asset.get("size") != file_path.stat().st_size or
                      asset.get("digest") != f"sha256:{digest}" or
                      asset.get("state") != "uploaded"):
                  raise SystemExit(f"ERROR: draft release asset differs from verified handoff: {name}")
          PY
          # The release environment reviewer must confirm that repository
          # immutability is enabled before approving this job. GITHUB_TOKEN
          # cannot read that administration setting. If it drifted, retract
          # a mutable publication immediately and fail the run.
          retract_if_mutable() {
            if [ "$(gh release view "$TAG" --json isImmutable --jq '.isImmutable' 2>/dev/null)" = "false" ]; then
              if ! gh release edit "$TAG" --draft=true; then
                echo "ERROR: published release could not be returned to draft; inspect it immediately" >&2
              fi
            fi
          }
          gh release edit "$TAG" --draft=false --verify-tag
          if [ "$(gh release view "$TAG" --json isDraft,isImmutable --jq '.isDraft == false and .isImmutable == true')" != "true" ]; then
            retract_if_mutable
            echo "ERROR: published release is not immutable"
            exit 1
          fi
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}/commits/tags/${TAG}" --jq '.sha')" != "$EXPECTED_COMMIT" ]; then
            retract_if_mutable
            echo "ERROR: published release tag does not point to the verified commit"
            exit 1
          fi
