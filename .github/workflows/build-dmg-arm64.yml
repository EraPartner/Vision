name: Build macOS ZIP (legacy)

# This workflow is superseded by release.yml which builds the arm64 unsigned ZIP,
# pushes the Docker image to GHCR, and creates a GitHub Release.
#
# Kept here only to avoid breaking any external references; it immediately
# triggers the release workflow instead.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v1.2.3). Triggers the release workflow.'
        required: true

jobs:
  trigger-release:
    name: Trigger Release Workflow
    runs-on: ubuntu-latest
    steps:
      - name: Trigger release.yml
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release.yml',
              ref: context.ref,
              inputs: { tag: '${{ github.event.inputs.tag }}' },
            });
            console.log('Triggered release.yml');
