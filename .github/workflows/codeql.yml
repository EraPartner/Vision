name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  schedule:
    - cron: "0 3 * * 1"  # weekly, Monday 03:00 UTC — full scan even without code changes

# Deny all permissions by default; each job opts in to only what it needs.
permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4

      - name: Perform CodeQL Analysis
        # Code scanning (GitHub Advanced Security) is not enabled on this repository, so the
        # SARIF upload fails with "Resource not accessible by integration". Keep the analysis
        # running as a smoke check, but don't fail CI on the upload that this plan can't accept.
        # Remove this guard if/when code scanning is enabled in repository settings.
        continue-on-error: true
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
