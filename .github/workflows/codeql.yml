name: CodeQL

on:
  push:
    branches: [main]
    # NOTE: if CodeQL is a required check, a diff matching every pattern here
    # skips the workflow and the required check can stay pending, blocking
    # merge. Keep the markdown ignore ROOT-ONLY ("*.md", not "**/*.md") so
    # nested-doc-only PRs don't strand the check. The weekly schedule below
    # still guarantees a full scan regardless.
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  schedule:
    - cron: "0 3 * * 1"  # weekly, Monday 03:00 UTC — full scan even without code changes

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# Deny all permissions by default; each job opts in to only what it needs.
permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # JS/TS app code + the CI workflows themselves (actions — script
        # injection, unpinned actions, permission misconfig). Python stays out:
        # the only Python here is Alembic migrations (path-ignored) plus two
        # config-glue files, so a Python job would add ~4 min/run for ~no coverage.
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          # JS/TS needs no compilation; skip autobuild entirely.
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
