name: Swift app build

# Manual only (ADR-249). It never runs on pull requests, so it adds no time to CI. Start it with
# workflow_dispatch, or by pushing a claude/* commit whose message contains "[swift-build]" (the
# Claude GitHub App cannot dispatch workflows); every other push skips the job.
on:
  push:
    branches: ["claude/**"]
    paths: ["apps/native/**", ".github/workflows/swift-build.yml"]
  workflow_dispatch:
    inputs:
      tests:
        description: Also run the Swift package tests
        type: boolean
        default: true

permissions: {}

concurrency:
  group: swift-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-build:
    name: Swift app (macOS)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[swift-build]')
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Show Xcode
        run: xcodebuild -version

      # Pinned XcodeGen release, verified by SHA-256 before use (same pin as the retired
      # Native (macOS) job, hash of the 2.46.0 release zip downloaded on 2026-10-12).
      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: "2.46.0"
          XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate the Xcode project
        run: xcodegen generate --spec apps/native/project.yml

            # On failure print only the unique compiler errors; the full log holds huge command lines.
      - name: Build the app (Debug, unsigned)
        run: |
          xcodebuild -quiet -project apps/native/VisionNative.xcodeproj -scheme "Vision Native" \
            -configuration Debug CODE_SIGNING_ALLOWED=NO -IDEBuildingContinueBuildingAfterErrors=YES \
            build > "$RUNNER_TEMP/build.log" 2>&1 || {
            grep -E ': (error|fatal error): ' "$RUNNER_TEMP/build.log" | sed "s#^$GITHUB_WORKSPACE/##" | sort -u | head -500
            exit 1
          }

      - name: Test the Swift package
        if: github.event_name == 'push' || inputs.tests
        run: |
          # Run AppKit layouts separately so they cannot starve Core watchdogs/polling on MainActor.
          # Print only errors and failed tests; the full log is mostly deprecation warnings.
          summarize() {
            # Issue comments follow their "recorded an issue" line, so keep a few lines after it.
            grep -E -A40 '(error|fatal error): |✘|Fatal error' "$1" | grep -v -E 'warning: |^--$' \
              | sed "s#^$GITHUB_WORKSPACE/##" | awk '!seen[$0]++' | head -800
          }
          # Both suites run even when the first fails, so one round reports every failure.
          status=0
          swift test --package-path apps/native --skip VisionNativeUITests > "$RUNNER_TEMP/test.log" 2>&1 || {
            summarize "$RUNNER_TEMP/test.log"; status=1
          }
          tail -3 "$RUNNER_TEMP/test.log"
          # AppKit activation, key windows and display transactions are process-global.
          swift test --package-path apps/native --skip-build --no-parallel --filter VisionNativeUITests \
            > "$RUNNER_TEMP/ui-test.log" 2>&1 || {
            summarize "$RUNNER_TEMP/ui-test.log"; status=1
          }
          tail -3 "$RUNNER_TEMP/ui-test.log"
          exit $status
