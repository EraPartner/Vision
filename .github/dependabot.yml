# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
# One grouped PR per ecosystem per week instead of one PR per dependency:
# ten single-bump PRs landing together each ran the full CI and queued
# behind each other.
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      bun:
        patterns: ["*"]
    ignore:
      # TypeScript 7 ships no JavaScript compiler API, and typescript-eslint
      # (peer typescript <6.1), knip, dependency-cruiser and openapi-typescript
      # need one. Drop this once typescript-eslint supports 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/packaging/electron"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      electron:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
