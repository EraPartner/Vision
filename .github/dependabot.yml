# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-deps:
        dependency-type: "development"
      prod-deps:
        dependency-type: "production"

  - package-ecosystem: "npm"
    directory: "/packaging/electron"
    schedule:
      interval: "weekly"
    groups:
      electron-deps:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/config"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker-deps:
        patterns: ["*"]

  # Base image for the dev container (debian:bookworm-slim).
  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
    groups:
      devcontainer-deps:
        patterns: ["*"]

  # Packaged-app embedded compose: postgres + the GHCR app image.
  # (resources-demo uses only local pull_policy:never images, so nothing to track.)
  - package-ecosystem: "docker"
    directory: "/packaging/electron/resources"
    schedule:
      interval: "weekly"
    groups:
      packaged-compose-deps:
        patterns: ["*"]
