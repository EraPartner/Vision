# CodeQL configuration for the Vision monorepo.
#
# This is the SINGLE, project-tailored CodeQL configuration, consumed by the
# advanced workflow at .github/workflows/codeql.yml. It intentionally replaces
# GitHub's "default" code-scanning setup — the default setup must be disabled in
# repository settings (Settings → Code security → Code scanning) so that only
# this advanced configuration runs. Running both at once produces the
# "configuration error" seen on the Analyze (python) / Analyze
# (javascript-typescript) checks.

name: "Vision CodeQL"

# Broader than the default query suite: security findings plus maintainability
# and correctness ("quality") queries.
queries:
  - uses: security-and-quality

# Deny-list only (no allow-list) so newly added source roots are scanned by
# default. We exclude code that is either not shipped (tests/fixtures),
# generated, vendored, or pure build output — scanning it adds noise and false
# positives without covering anything we author.
paths-ignore:
  # Tests, mocks & fixtures
  - "**/__tests__/**"
  - "**/__mocks__/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "**/test/**"
  - "**/tests/**"
  # Build output, coverage & dependencies
  - "**/dist/**"
  - "**/build/**"
  - "**/coverage/**"
  - "**/node_modules/**"
  - "**/*.min.js"
  # Generated / vendored sources
  - "apps/frontend/src/locales/**"   # generated i18n bundles (en.ts, nl.ts)
  - "alembic/versions/**"            # autogenerated DB migration scripts
  - "alembic/legacy_versions/**"
  - "docs/**"
