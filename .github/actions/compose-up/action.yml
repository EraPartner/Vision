name: Bring up the Docker Compose stack
description: >
  Optionally download and load a CI image artifact, write the stub .env,
  `docker compose up -d` the stack, and poll the backend /health endpoint.
  Shared by ci.yml (docker-verify, test-live-api-contracts) and e2e.yml.
  Callers set COMPOSE_PROJECT_NAME at the job level to isolate the stack
  from the real `vision` project so teardown can never touch real data.
inputs:
  image-artifact:
    description: >
      Name of an uploaded docker-image artifact to download and `docker load`.
      Empty skips both steps (compose then builds the app image implicitly).
    required: false
    default: ""
  vision-image:
    description: >
      Value exported as VISION_IMAGE before `docker compose up`. Empty leaves
      the variable unset. (Currently a no-op — docker-compose.yml's app
      service has no `image:` key; see the TODO.md entry on VISION_IMAGE.)
    required: false
    default: ""
  extra-env:
    description: Extra lines appended to the stub .env (newline-separated).
    required: false
    default: ""
  health-attempts:
    description: Number of /health polls before giving up.
    required: false
    default: "30"
  health-interval:
    description: Seconds to sleep between /health polls.
    required: false
    default: "3"
runs:
  using: composite
  steps:
    - name: Download image artifact
      if: ${{ inputs.image-artifact != '' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
      with:
        name: ${{ inputs.image-artifact }}
        path: /tmp

    - name: Load Docker image
      if: ${{ inputs.image-artifact != '' }}
      shell: bash
      run: docker load < /tmp/vision-ci.tar

    - name: Create stub .env for Docker Compose
      shell: bash
      env:
        EXTRA_ENV: ${{ inputs.extra-env }}
      run: |
        printf 'POSTGRES_PASSWORD=ci_test_password\nDATABASE_URL=postgresql://ftm_user:ci_test_password@db:5432/financial_transactions\nLOG_LEVEL=warn\nENABLE_LOGGING=true\n' > .env
        if [ -n "$EXTRA_ENV" ]; then
          printf '%s\n' "$EXTRA_ENV" >> .env
        fi

    # A plain `up -d` (NOT `up -d --build`) — on the ubuntu-24.04 runner's
    # Compose, `up -d --build` fails env_file resolution with "env file
    # .../.env not found" even though the stub .env exists. Compose still
    # builds the `app` image implicitly when it is not already present.
    - name: Start services with Docker Compose
      shell: bash
      env:
        VISION_IMAGE_INPUT: ${{ inputs.vision-image }}
      run: |
        if [ -n "$VISION_IMAGE_INPUT" ]; then
          export VISION_IMAGE="$VISION_IMAGE_INPUT"
        fi
        docker compose -f docker-compose.yml up -d

    - name: Wait for /health to respond
      shell: bash
      env:
        HEALTH_ATTEMPTS: ${{ inputs.health-attempts }}
        HEALTH_INTERVAL: ${{ inputs.health-interval }}
      run: |
        echo "Waiting for backend health check..."
        for i in $(seq 1 "$HEALTH_ATTEMPTS"); do
          if curl -sf http://localhost:3002/health; then
            echo ""
            echo "Health check passed"
            exit 0
          fi
          echo "Attempt $i/$HEALTH_ATTEMPTS — retrying in ${HEALTH_INTERVAL}s..."
          sleep "$HEALTH_INTERVAL"
        done
        echo "Health check timed out"
        docker compose logs
        exit 1
