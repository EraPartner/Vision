name: Bring up the Docker Compose stack
description: >
  Write the stub .env, `docker compose up -d` the stack, and poll the backend
  /health endpoint. Shared by ci.yml (docker-verify, test-live-api-contracts)
  and e2e.yml. Callers set COMPOSE_PROJECT_NAME at the job level to isolate the
  stack from the real `vision` project so teardown can never touch real data.

  Callers that have already put an image in the local image store pass
  `vision-image`; callers that have not (e2e.yml) omit it and let compose build
  the app from source.
inputs:
  vision-image:
    description: >
      Tag of an already-built app image, e.g. `vision:ci`. When set, the
      bring-up adds the docker-compose.ci.yml overlay — which gives the `app`
      service the `image:` key the base file lacks — and exports the tag as
      VISION_IMAGE for it, so compose runs THIS image instead of rebuilding the
      app from source. Empty (e2e.yml) uses the base file alone and lets
      compose build.

      Callers that set this must also name both `-f` files on any later
      `docker compose` invocation in the job (`exec`, `down`); see ci.yml's
      docker-verify.
    required: false
    default: ""
  extra-env:
    description: Extra lines appended to the stub .env (newline-separated).
    required: false
    default: ""
  health-attempts:
    description: Number of /health polls before giving up.
    required: false
    default: "30"
  health-interval:
    description: Seconds to sleep between /health polls.
    required: false
    default: "3"
runs:
  using: composite
  steps:
    - name: Create stub .env for Docker Compose
      shell: bash
      env:
        EXTRA_ENV: ${{ inputs.extra-env }}
      run: |
        printf 'POSTGRES_PASSWORD=ci_test_password\nDATABASE_URL=postgresql://ftm_user:ci_test_password@db:5432/financial_transactions\nLOG_LEVEL=warn\nENABLE_LOGGING=true\n' > .env
        if [ -n "$EXTRA_ENV" ]; then
          printf '%s\n' "$EXTRA_ENV" >> .env
        fi

    # A plain `up -d` (NOT `up -d --build`) — on the ubuntu-24.04 runner's
    # Compose, `up -d --build` fails env_file resolution with "env file
    # .../.env not found" even though the stub .env exists. Compose still
    # builds the `app` image implicitly when it is not already present, which
    # is both what the e2e branch relies on and the fallback for the overlay
    # branch if the tagged image is somehow missing.
    - name: Start services with Docker Compose
      shell: bash
      env:
        VISION_IMAGE_INPUT: ${{ inputs.vision-image }}
      run: |
        if [ -n "$VISION_IMAGE_INPUT" ]; then
          # The overlay is what makes the export bite: it adds the `image:` key
          # docker-compose.yml's `app` service does not have, so compose stops
          # ignoring the prebuilt image and rebuilding from source.
          export VISION_IMAGE="$VISION_IMAGE_INPUT"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d
        else
          docker compose -f docker-compose.yml up -d
        fi

    - name: Wait for /health to respond
      shell: bash
      env:
        HEALTH_ATTEMPTS: ${{ inputs.health-attempts }}
        HEALTH_INTERVAL: ${{ inputs.health-interval }}
      run: |
        echo "Waiting for backend health check..."
        for i in $(seq 1 "$HEALTH_ATTEMPTS"); do
          if curl -sf http://localhost:3002/health; then
            echo ""
            echo "Health check passed"
            exit 0
          fi
          echo "Attempt $i/$HEALTH_ATTEMPTS — retrying in ${HEALTH_INTERVAL}s..."
          sleep "$HEALTH_INTERVAL"
        done
        echo "Health check timed out"
        docker compose logs
        exit 1
