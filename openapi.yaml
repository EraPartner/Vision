              schema:
                $ref: "#/components/schemas/Envelope"

  /api/aggregations/tag-pivot:
    get:
      summary: Per-tag spending pivot (periods × tags) for custom charts
      description: >
        Per-tag, per-period spending breakdown (expenses only, internal
        transfers excluded). Pass explicit tag_ids[] for a specific selection,
        or all=true (alias all_tags=true) to return every active tag in the
        workspace. With neither, the pivot is empty. A transaction carrying
        several selected tags counts toward each tag's total independently.
        Used by custom saved charts with tag series; the frontend caps results
        to top 8 by spend + "Other" when all=true and entity count exceeds 8.
      operationId: getTagPivot
      tags: [Aggregations]
      parameters:
        - in: query
          name: tag_ids
          description: "Tag ids to include as series (repeatable). Ignored when all=true."
          schema:
            type: array
            items:
              type: integer
        - in: query
          name: all
          description: "When true, returns all active tags; tag_ids is ignored. Alias: all_tags."
          schema:
            type: boolean
        - in: query
          name: bucket
          schema:
            type: string
            enum: [monthly, yearly]
        - in: query
          name: start
          schema:
            type: string
            format: date
        - in: query
          name: end
          schema:
            type: string
            format: date
        - in: query
          name: currency
          schema:
            type: string
      responses:
        "200":
          description: Pivot table data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

