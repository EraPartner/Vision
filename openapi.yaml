        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    post:
      summary: Merge aliases into the primary recipient identified by id
      operationId: mergeRecipient
      tags: [Recipients]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alias_ids]
              properties:
                alias_ids:
                  type: array
                  minItems: 1
                  description: Each id is an integer or a digit string.
                  items:
                    type: integer
                    format: int32
                    minimum: 1
                    maximum: 2147483647
      responses:
        "200":
          description: Merged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          description: alias_ids is missing, empty, or contains a malformed or out-of-range id; no recipients are merged
        "404":
          description: Primary recipient does not exist, including removal before row locking.
        "409":
          description: Primary became an alias while waiting for merge locks; no references are reassigned. Retry using its primary.

