    Account:
      type: object
      required:
        [
          id,
          name,
          currency,
          type,
          liquidity_class,
          spendable,
          in_net_worth,
          tax_wrapper,
          owner,
          multi_currency_cash,
          has_cash_sleeve,
          is_active,
          created_at,
          updated_at,
        ]
      properties:
        id:
          type: integer
        name:
          type: string
        display_name:
          type: string
          nullable: true
        institution:
          type: string
          nullable: true
        currency:
          type: string
          description: ISO 4217 currency code
        type:
          type: string
          enum:
            [
              checking,
              savings,
              brokerage,
              crypto_exchange,
              wallet,
              pension,
              liability,
            ]
        liquidity_class:
          type: string
          enum: [liquid, semi_liquid, illiquid]
        spendable:
          type: boolean
        in_net_worth:
          type: boolean
        tax_wrapper:
          type: string
          enum: [none, pension, tax_advantaged]
        owner:
          type: string
          enum: [me, partner, joint]
        multi_currency_cash:
          type: boolean
        has_cash_sleeve:
          type: boolean
        funding_account_id:
          type: integer
          nullable: true
        statement_balances:
          type: array
          description: Authoritative statement readings per native currency (ADR-089 D2).
          items:
            type: object
            required: [currency, balance, balance_date]
            properties:
              currency:
                type: string
                pattern: "^[A-Z]{3}$"
              balance:
                type: number
              balance_date:
                type: string
                format: date
        computed_balance:
          type: number
          nullable: true
          description: >-
            The account's anchor+delta computed balance (ADR-094), denominated in
            `currency`. On a multi-currency account each currency partition is
            computed separately and converted into `currency` at today's rate, so
            this figure moves with exchange rates. A partition with no usable
            source or target rate is excluded rather than treated as 1:1; when
            that happens `balance_incomplete` is true and the native amount is
            available in `balance_parts`.
        balance_parts:
          type: array
          description: Native per-currency ledger balances; only returned by the list endpoint.
          items:
            type: object
            required: [currency, balance]
            properties:
              currency: { type: string }
              balance: { type: number }
        balance_incomplete:
          type: boolean
          description: Whether computed_balance excludes at least one partition because a conversion rate is unavailable; only returned by the list endpoint.
        unconverted_currencies:
          type: array
          description: Currency codes excluded from computed_balance because a conversion rate is unavailable; only returned by the list endpoint.
          items: { type: string }
        reconcilable_balance:
          type: number
          nullable: true
          description: >-
            The reconciliation base: the computed balance of the single currency
            partition the selected statement reading is a statement for, in
            `reconcilable_currency` and NOT FX-converted. Equals
            `computed_balance` for a single-currency account and differs on a
            multi-currency one, so the reconcile dialog previews an entered
            reading against THIS figure — it is what `POST /accounts/{id}/reconcile`
            resolves against. The declared `currency` partition wins whenever it
            exists, including at exactly zero. Zero/sub-cent filtering applies only
            to the fallback when that partition is absent. Only returned by the list
            endpoint.
        reconcilable_currency:
          type: string
          description: >-
            Currency of `reconcilable_balance` and `drift` — normally `currency`,
            but the account's sole funded partition's code when the declared
            currency partition is absent and the ledger contains one funded
            foreign partition. Only returned by the list endpoint.
        drift:
          type: number
          nullable: true
          description: >-
            selected statement balance − reconcilable_balance, in `reconcilable_currency`
            (ADR-094); null if no statement balance. Native-currency by design —
            never statement balance − computed_balance, which on a multi-currency
            account would make the badge move with the daily exchange rate.
        anchor_date:
          type: string
          format: date
          description: YYYY-MM-DD date of the stamped statement balance anchoring computed_balance (WP-A1 provenance); absent when nothing is stamped. Only returned by the list endpoint.
        post_anchor_count:
          type: integer
          description: Active ledger entries after the anchor, or all active entries when unstamped — the "{n} entries since" / "sum of {n} entries" figure (WP-A1 provenance). Only returned by the list endpoint.
        has_transactions:
          type: boolean
          description: Whether the account has any active ledger rows; only returned by the list endpoint.
        is_active:
          type: boolean
        closed_at:
          type: string
          format: date-time
          nullable: true
          description: Server-stamped when the account is closed (is_active=false); cleared on reactivate (ADR-088 addendum, D5)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AccountList:
      allOf:
        - $ref: "#/components/schemas/OptionalPaginationFields"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Account"
            links:
              type: array
              items:
                $ref: "#/components/schemas/Link"

    AccountCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        display_name:
          type: string
          nullable: true
        institution:
          type: string
          nullable: true
        currency:
          type: string
        type:
          type: string
          enum:
            [
              checking,
              savings,
              brokerage,
              crypto_exchange,
              wallet,
              pension,
              liability,
            ]
        liquidity_class:
          type: string
          enum: [liquid, semi_liquid, illiquid]
        spendable:
          type: boolean
        in_net_worth:
          type: boolean
        tax_wrapper:
          type: string
          enum: [none, pension, tax_advantaged]
        owner:
          type: string
          enum: [me, partner, joint]
        multi_currency_cash:
          type: boolean
        has_cash_sleeve:
          type: boolean
        funding_account_id:
          type: integer
          nullable: true

    AccountUpdate:
      type: object
      properties:
        name:
          type: string
        display_name:
          type: string
          nullable: true
        institution:
          type: string
          nullable: true
        currency:
          type: string
        type:
          type: string
          enum:
            [
              checking,
              savings,
              brokerage,
              crypto_exchange,
              wallet,
              pension,
              liability,
            ]
        liquidity_class:
          type: string
          enum: [liquid, semi_liquid, illiquid]
        spendable:
          type: boolean
        in_net_worth:
          type: boolean
        tax_wrapper:
          type: string
          enum: [none, pension, tax_advantaged]
        owner:
          type: string
          enum: [me, partner, joint]
        multi_currency_cash:
          type: boolean
        has_cash_sleeve:
          type: boolean
        funding_account_id:
          type: integer
          nullable: true
        is_active:
          type: boolean

    BulkTagRequest:
      type: object
      required: [transaction_ids]
      properties:
        transaction_ids:
          type: array
          items:
            type: integer
          minItems: 1
          maxItems: 500
        add_slugs:
          type: array
          items:
            type: string
          maxItems: 50
        remove_slugs:
          type: array
          items:
            type: string
          maxItems: 50

    BulkTagResult:
      type: object
      required: [added, removed, transactions_affected]
      properties:
        added:
          type: integer
        removed:
          type: integer
        transactions_affected:
          type: integer

    BulkSelection:
      description: >-
        Selects transactions to act on. Explicit-id mode accepts only `ids`.
        Filter mode requires both `filter` and the `expected_count` shown when
        the user confirmed the action.
      oneOf:
        - type: object
          required: [ids]
          properties:
            ids:
              type: array
              minItems: 1
              maxItems: 500
              items:
                type: integer
          not:
            anyOf:
              - required: [filter]
              - required: [expected_count]
        - type: object
          required: [filter, expected_count]
          properties:
            filter:
              $ref: "#/components/schemas/BulkTransactionFilter"
            expected_count:
              type: integer
              minimum: 1
              maximum: 5000
              description: Count shown when the user confirmed the action.
          not:
            required: [ids]

    BulkTransactionFilter:
      type: object
      description: >-
        Filter-mode selector. Every field is validated and an unknown key, a
        wrong type or a malformed value rejects the whole request with a 400 —
        these endpoints include a hard DELETE, and a filter field that was
        skipped rather than rejected made the action cover a WIDER set of rows
        than the caller named. Absent, `null` and empty (`""`, `[]`) still mean
        "no filter on this field". Each field also accepts its camelCase
        spelling, but not both spellings at once.
      additionalProperties: false
      properties:
        transaction_id:
          type: integer
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        account_id:
          type: integer
        bank_account:
          type: string
          description: Substring match on the account name
        bank_accounts:
          type: array
          description: Exact account names. Must be an array, not a comma string.
          items:
            type: string
        category_id:
          type: integer
        category_ids:
          type: array
          description: Must be an array of integers, not a comma string.
          items:
            type: integer
        uncategorised:
          type: boolean
          description: >-
            Defaults to false. When true, selects the uncategorised queue the
            list endpoint's `uncategorised=true` returns: active rows whose
            effective category is empty. `active`, `category_id` and
            `category_ids` are then ignored.
        recipient_id:
          type: integer
        recipient_group_id:
          type: integer
        recipient_name:
          type: string
        search:
          type: string
          maxLength: 200
        active:
          type: boolean
          description: Defaults to true (active rows only) when omitted.
        transaction_type:
          type: string
          enum: [income, expense]
        amount_min:
          type: number
        amount_max:
          type: number
        amount_signed:
          type: boolean
          description: >-
            Defaults to false, comparing amount_min/amount_max against
            |amount|; true compares against the signed amount.
        tags:
          description: Tag slugs, as an array or a comma-separated string.
          oneOf:
            - type: array
              items:
                type: string
            - type: string

    # The transaction parser setup a saved custom parser stores (`parserConfigSchema`
    # in lib/parserConfigSchema.ts, camelCase keys plus `number_format`). The server
    # fills absent keys with their defaults on save; older rows may lack some.
    TransactionParserConfig:
      type: object
      additionalProperties: true
      properties:
        dateColumn:
          type: string
        recipientColumn:
          type: string
        amountColumn:
          type: string
        memoColumn:
          type: string
        dateFormat:
          type: string
          description: strptime-style date format, default `%Y-%m-%d`.
        separator:
          type: string
          description: CSV delimiter, default ','
        encoding:
          type: string
          description: UTF-8, Latin-1 (latin1, latin-1, iso-8859-1), or windows-1252.
        skipRows:
          type: integer
          minimum: 0
          description: Physical leading lines before the CSV header.
        number_format:
          $ref: "#/components/schemas/CsvNumberFormat"

    CustomParserConfig:
      type: object
      required: [id, name, config]
      properties:
        id:
          type: integer
        name:
          type: string
        config:
          $ref: "#/components/schemas/TransactionParserConfig"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PortfolioImportPreviewData:
      type: object
      required:
        [batch_id, account_id, account_name, account_valid, groups, totals]
      properties:
        batch_id: { type: integer, format: int64 }
        account_id: { type: integer, nullable: true }
        account_name: { type: string, nullable: true }
        account_valid:
          type: boolean
          description: True only when account_id still names an active portfolio account.
        groups:
          type: array
          items: { type: object, additionalProperties: true }
        totals:
          type: object
          additionalProperties: { type: integer }

    PortfolioImportPreviewEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/PortfolioImportPreviewData" }

    # ─── Transactions ────────────────────────────────────────────────────────
    Transaction:
      type: object
      required: [id, transaction_date, bank_account, amount, created_at, links]
      properties:
        id:
          type: integer
        transaction_date:
          type: string
          format: date
          description: YYYY-MM-DD
        account_id:
          type: integer
          nullable: true
          description: Stable linked account identity
        is_transfer:
          type: boolean
          description: True when ordinary income/spending statistics exclude this internal movement.
        transfer_peer_id:
          type: integer
          nullable: true
          description: Existing transaction on the other account, when a reciprocal transfer is paired.
        transfer_source:
          type: string
          nullable: true
          description: Origin of transfer classification, including automatic, manual, system or brokerage.
        bank_account:
          type: string
          nullable: true
          description: Canonical display name projected from the linked account (null when account_id is); use account_id as the stable identity
        recipient_id:
          type: integer
        recipient_name:
          type: string
        memo:
          type: string
        amount:
          type: number
          format: double
        amount_eur:
          type: number
          format: double
        currency:
          type: string
        balance:
          type: number
          format: double
        running_balance:
          type: number
          format: double
          description: Per-account, per-currency running balance over the filtered set before pagination. The latest preceding stored statement balance resets the cumulative amount; later unstamped rows advance it. Present only when include_balance=true. Rows with no currency are treated as EUR.
        category_id:
          type: integer
        category_name:
          type: string
          description: "Format: GENERAL:DETAIL"
        comment:
          type: string
        is_active:
          type: boolean
          description: False when the transaction is excluded from totals and statistics.
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TransactionTagRef"
          description: Tags attached to this transaction
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
        links:
          type: array
          items:
            $ref: "#/components/schemas/Link"

    TransactionCreate:
      type: object
      required: [transaction_date, account_id, recipient_id, amount]
      properties:
        transaction_date:
          type: string
          format: date
        account_id:
          type: integer
          minimum: 1
          description: Canonical account identity
        recipient_id:
          type: integer
          format: int32
          minimum: 1
        memo:
          type: string
        amount:
          type: number
        currency:
          type: string
        balance:
          type: number
        category_id:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: >-
            Absent or null files the transaction uncategorized. Validated since
            2026-08-11 — before that this operation forwarded the field raw and a
            malformed value reached Postgres as a cast error (500).
        comment:
          type: string
        tags:
          type: array
          items:
            type: string
          description: Tag slugs to assign (replaces existing tags)
        allow_duplicate:
          type: boolean
          description: >-
            Explicit confirmation that a matching active manual transaction is
            intentional. Omit or false to retain the default 409 duplicate guard.

    TransactionUpdate:
      type: object
      description: >-
        PATCH semantics: an explicit null on a nullable field clears the stored
        value; an absent key leaves it unchanged.
      properties:
        transaction_date:
          type: string
          format: date
        account_id:
          type: integer
          minimum: 1
          nullable: true
        recipient_id:
          type: integer
          format: int32
          minimum: 1
          nullable: true
        recipient_name:
          type: string
        memo:
          type: string
          nullable: true
        amount:
          type: number
        currency:
          type: string
        category_id:
          type: integer
          format: int32
          minimum: 1
          nullable: true
        category_name:
          type: string
        comment:
          type: string
          nullable: true
        is_active:
          type: boolean
        tags:
          type: array
          items:
            type: string
          description: Tag slugs to assign (replaces existing tags when present)

    TransactionList:
      allOf:
        - $ref: "#/components/schemas/PaginationFields"
        - type: object
          required: [items, links]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Transaction"
            links:
              type: array
              items:
                $ref: "#/components/schemas/Link"

