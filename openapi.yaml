        "204":
          description: No Content

  /api/recipients:
    get:
      summary: List recipients
      operationId: getRecipients
      description: >-
        Name and general search filters use Unicode case-insensitive matching,
        including accented uppercase/lowercase pairs on native C-locale clusters.
        Accents are preserved. Stored names, sort order and response shape are unchanged.
      tags: [Recipients]
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            maximum: 1000
        - in: query
          name: offset
          schema:
            type: integer
        - in: query
          name: name
          schema:
            type: string
        - in: query
          name: search
          description: Truncated to 200 characters.
          schema:
            type: string
        - in: query
          name: default_category_id
          description: Empty means no filter; any other non-id value returns 400.
          schema:
            type: integer
            format: int32
            minimum: 1
        - in: query
          name: active
          description: Accepts true/false/1/0 (default true); other values use the default.
          schema:
            type: boolean
            default: true
        - in: query
          name: uncategorized
          schema:
            type: boolean
            default: false
        - in: query
          name: sort_by
          schema:
            type: string
        - in: query
          name: sort_dir
          description: Any other value uses the default order.
          schema:
            type: string
            enum: [asc, desc]
      responses:
        "400":
          description: "VALIDATION_ERROR: malformed default_category_id, or name/search/sort_by sent more than once"
        "200":
          description: Recipient list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RecipientList"
    post:
      summary: Create or get existing recipient
      operationId: createRecipient
      tags: [Recipients]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipientCreate"
      responses:
        "400":
          description: "VALIDATION_ERROR: missing name, or a field of the wrong type"
        "200":
          description: Existing recipient
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/Recipient"
                          - type: object
                            required: [created]
                            properties:
                              created:
                                type: boolean
                                enum: [false]
        "201":
          description: New recipient created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/Recipient"
                          - type: object
                            required: [created]
                            properties:
                              created:
                                type: boolean
                                enum: [true]

  /api/recipients/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    get:
      summary: Get recipient
      operationId: getRecipient
      tags: [Recipients]
      responses:
        "200":
          description: Single recipient
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Recipient"
    patch:
      summary: Update recipient
      operationId: updateRecipient
      tags: [Recipients]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipientUpdate"
      responses:
        "400":
          description: "VALIDATION_ERROR: missing body or a field of the wrong type"
        "200":
          description: Updated recipient
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Recipient"
    delete:
