          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
    post:
      summary: Resolve an unmatched non-cash portfolio import row to an existing investment or request a new one be created
      operationId: portfolioImportRowInvestmentOverride
      tags: [PortfolioImport]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                investment_id:
                  type: integer
                  format: int32
                  minimum: 1
                  nullable: true
                  description: >-
                    Existing investment to link this row to. `null` — or an
                    absent field — clears the override. A present value must be
                    a positive integer; a malformed one is rejected rather than
                    coerced, because a coerced id names a different instrument
                    and the committed lot records it.
                create_new:
                  type: boolean
                  description: When true, a new investment record is created from the row's symbol/name/asset_class and linked
      responses:
        "200":
          description: Override applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          description: Malformed batch id, row id or investment_id, create_new validation failed, or a body that is not a JSON object
        "404":
          description: Batch or staging row not found, or the row is cash and cannot accept an investment override

  /api/portfolio/import/batches/{id}/rows/investment-override:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
    post:
      summary: Atomically resolve a portfolio import review group to one investment
      operationId: portfolioImportRowsInvestmentOverride
      tags: [PortfolioImport]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [row_ids]
              properties:
                row_ids:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  uniqueItems: true
                  items:
                    type: integer
                    format: int64
                    minimum: 1
                    maximum: 9007199254740991
                  description: Complete set of review-row ids to resolve atomically
                investment_id:
                  type: integer
                  format: int32
                  minimum: 1
                  description: Existing investment to link every requested row to
                create_new:
                  type: boolean
                  enum: [true]
                  description: Create one investment from the first requested row and link every requested row to it; rejected if any row already has a user override
              oneOf:
                - required: [investment_id]
                - required: [create_new]
      responses:
        "200":
          description: Every requested row resolved to one investment in a single transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          description: Malformed input, mutually ambiguous resolution request, non-reviewable batch, or create-new row set already overridden
        "404":
          description: Investment or requested row not found, belongs to another batch, is a cash row, or is no longer reviewable; no rows are changed

  /api/portfolio/import/reconciliation/preview:
    post:
      summary: Preview reconciliation across a complete portfolio statement scope
      operationId: previewPortfolioImportReconciliation
      tags: [PortfolioImport]
      description: >-
        Read-only plan across up to 100 staged batches. Detects source duplicates,
        unique existing transactions, corrections, duplicate repairs, dated
        transfers, asset fees, zero-basis yield reversals and blockers.
        Omitted policy allows only exact adoption. Explicit policies require a
        subsequent commit bound to this plan's fingerprint. No history is changed.
        Explicit prefer_source may correct an unchanged prior Saxo workbook adoption
        only when the same verified literal source and active receipt after-image
        prove identity; the fingerprint binds that original batch and receipt context.
        Literal Saxo CSV events may be duplicate_source companions of uniquely
        matching selected detailed workbook events, including net-only dividend
        errors. Missing, ambiguous or conflicting source context remains blocked.
        Authenticated IBKR header and statement-currency context may prove currency
        or separate-withholding corrections for imported-copy repairs and standalone
        legacy sales. Unique same-date economic claims can narrow copy candidates;
        other proved copies remain duplicates. Matching windows remain unchanged.
        Optional reconciliation_scope=adopt_existing_only derives proven existing
        buy/gift adoptions and receipt-proven duplicate/settled actions from complete
        freshly captured unfiltered Kinesis sources under explicit preserve_existing.
        The full source is classified before selection. Narrow review never plans
        inserts, repairs, cash, custody or adjustments; paired yield income remains
        deferred. Source/receipt ambiguity still blocks. Pending progress describes
        excluded unsettled events. Full history may record proved zero-basis paired
        income after the distinct selected Gift insert/adoption or exact existing
        unit is proved. incomeProof.unitRowId binds that Gift action; unitTransactionId
        is present for canonical existing units and repeated income. Source roles
        retain included-in-units income without adding acquisitions or gains again.
        Complete already-retained original-document evidence may prove closed yield-group membership
        through independent positive-basis deposit boundaries, complete interval
        closure, same-file settled yield anchors and globally unique eight-decimal
        unit pairing. Members select together or block together, without changing
        original recorded dates or other canonical fields. Broker payment dates
        remain source evidence. Grouped actions retain one distinct source row and
        existing record per adopt; the response shape is unchanged.
        Optional correct_existing_only uses explicit prefer_source to select only
        proved financial corrections of unique existing Kinesis buy/gift records
        plus strict receipt-proven retries. Literal primary purchase fees replace
        recorded fees. Meaningful gift basis/currency require validated original
        Portfolio Performance recorded-native evidence and an existing meaningful
        positive gift basis. Currency changes without literal original FX require
        usable stored historical-date rate evidence, bound in the fingerprint;
        corrections use the normal historical cache, and rates
        at most seven days before the transaction date qualify. Unavailable gifts
        defer without blocking independent literal-fee corrections. Today's rate
        never authorizes correction and canonical source FX stays unstamped.
        Ordinary financial corrections retain dates, types, units, notes and IDs;
        unknown original FX is not invented. A proved closed yield group may instead
        produce date-only adopt actions with typed dateProof and corrections exactly
        [date]. Its changed members use the literal broker payment date together;
        quantities, type, financial values, notes and IDs stay unchanged. memberCount
        includes unchanged anchors rather than only correction actions. The server
        binds complete group closure, original reference and all before/after dates
        in the fingerprint. This does not permit ordinary nearby-date corrections.
        The same
        selected-only progress and deferred lifecycle applies.
        record_in_kind_income_only requires explicit preserve_existing and zero
        yield interpretation on complete original unfiltered Kinesis primary
        source. It selects literal paired income only when a unique proved existing
        zero-basis acquisition and retained source/receipt after-image agree.
        Actions use record_income with typed incomeProof; source type is dividend,
        income_recognition_role is included_in_units, units/price are null,
        and fees/taxes are zero. Positive literal income is rounded at canonical
        precision without an invented minimum; the retained raw value may round to zero.
        No new gift, cash movement, custody, adjustment or financial/date correction
        is selected. Literal amount is retained separately and not added to gains
        again. Stored historical proof remains readable; no reference upload is available.
        Preview and locked commit warm normal historical rates automatically.
        Conversion requires a usable stored income-date rate within seven days,
        bound in the fingerprint; unresolved dates defer and current rates do not
        authorize recording. Canonical source FX stays null.
        record_cash_only requires complete original unfiltered Kinesis source,
        explicit preserve_existing and source-bound cash_funding_policy=own_account_transfer.
        The server proves complete cash balance chains and selects cash/duplicate/settled
        with typed cashProof. New cashValues carry signed amount, date, currency, account,
        brokerage origin and null peer; trade quotes and confirmed funding are internal,
        while card payments remain expenses. imported equals recordedCash; adopted,
        repaired and recordedIncome are zero. No portfolio, income, custody or adjustment
        drain runs, no opposite bank row is invented, and other source events stay pending.
        XML is not applied in this scope; retained reference context remains intact.
        Ordinary full scope rejects new Kinesis cash with cash_reconciliation_required;
        confirmed cash-only review is required. Unchanged source-owned settled repeats
        remain compatible with full review.
        A separately quoted same-currency funding withdrawal fee produces a second
        cashFeeValues expense component; the main transfer is net of that fee.
        cashProof.componentCount is one or two, and two-component repeats identify
        a distinct existingCashFeeTransactionId. Card spending includes its fee once.
        Source actions and ledger component counts are distinct.
        The zero-opening complete source requires no unrelated active ledger rows
        or routed-account statement balance readings, including zero readings;
        statement and ledger state are fingerprint-bound and rechecked under locks.
        Historical date-rate readiness is prepared automatically and fingerprint-bound;
        unresolved readiness defers the whole group rather than using a current rate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [batch_ids]
              properties:
                batch_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    {
                      type: integer,
                      format: int64,
                      minimum: 1,
                      maximum: 9007199254740991,
                    }
                adopt_policy:
                  type: string
                  enum: [preserve_existing, prefer_source]
                  description: Preserve recorded facts, or use proven source facts while preserving known original transfer basis.
                reconciliation_scope:
                  type: string
                  enum:
                    [
                      full,
                      adopt_existing_only,
                      correct_existing_only,
                      record_in_kind_income_only,
                      record_cash_only,
                    ]
                  default: full
                  description: >-
                    Optional additive scope. adopt_existing_only requires Kinesis
                    sources, explicit global preserve_existing, no conflicting
                    overrides, no included_symbols/skipped source rows, and verified
                    complete source capture. Row IDs cannot be supplied by callers.
                    correct_existing_only instead requires explicit global prefer_source
                    and either complete Kinesis financial/date proof or a separate native
                    IBKR funding scope proving exact existing base-currency cash corrections.
                    record_in_kind_income_only requires explicit global preserve_existing,
                    zero yield basis and a proved existing zero-basis income/units pair;
                    retained source proof remains readable and other events remain pending.
                    record_cash_only requires complete unfiltered Kinesis source,
                    explicit preserve_existing and cash_funding_policy=own_account_transfer;
                    only the complete proved cash chain is selected, with no XML application.
                cash_funding_policy:
                  type: string
                  enum: [own_account_transfer]
                  description: Required only with record_cash_only. Explicit source-bound confirmation that all source cash deposits and withdrawals are transfers between the user's own accounts. Bound in the reviewed fingerprint; no opposite bank leg is created.
                batch_policies:
                  type: array
                  maxItems: 100
                  description: Explicit per-batch overrides of adopt_policy. Each selected batch may occur at most once; IDs outside batch_ids reject. The reviewed fingerprint binds the sorted overrides.
                  items:
                    type: object
                    additionalProperties: false
                    required: [batch_id, adopt_policy]
                    properties:
                      batch_id:
                        {
                          type: integer,
                          format: int64,
                          minimum: 1,
                          maximum: 9007199254740991,
                        }
                      adopt_policy:
                        {
                          type: string,
                          enum: [preserve_existing, prefer_source],
                        }
      responses:
        "200":
          description: Review plan; blocked plans still return 200. Narrow scope adds reconciliationScope, selectedRowIds, pending, complete, deferredCounts and batchProgress; actions/summary contain only the selected records. Full response may additionally include proved paired income actions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        {
                          $ref: "#/components/schemas/PortfolioImportReconciliationPlan",
                        }
        "400":
          description: Malformed scope or policy, missing batch, or non-reviewable scope

  /api/portfolio/import/reconciliation/commit:
    post:
      summary: Atomically commit a reviewed portfolio statement scope
      operationId: commitReviewedPortfolioImports
      tags: [PortfolioImport]
      description: >-
        Locks and rechecks the complete source scope and projected history against
        the reviewed fingerprint. Adopts existing records with permanent before
        and after receipts, inserts missing events in global chronological order,
        and records dated custody transfers and asset adjustments. Proven imported
        copies of manual transactions are repaired with permanent dual-row receipts.
        Any blocker or row failure rolls back the whole operation. Adopted records
        retain their identity and notes.
        A proved prior Saxo adoption correction locks the original batch and writes
        a new reversible receipt without changing original counters or cash records.
        Proved Saxo CSV companions settle as duplicates before financial inserts;
        their errors and counters update atomically without inventing gross income.
        With reconciliation_scope=adopt_existing_only, the same reviewed scope and
        fingerprint apply only proven Kinesis adoptions and newly settled receipted
        duplicates. Imported and repaired are zero. The writer returns before any
        general event drain. Deferred source rows remain unsettled; while pending
        is nonzero all selected batches remain awaiting_review without completion
        timestamps, even if individual source progress is complete. Existing guarded
        immutable adoption/restore receipts support rollback after after-image checks.
        With correct_existing_only and explicit prefer_source, only proved existing
        financial corrections, proved whole-group yield payment-date corrections
        and strict receipted retries are applied. Ordinary financial corrections
        retain dates; grouped date-only corrections require typed dateProof and
        unchanged financials. Types, units, notes and IDs stay unchanged. Imported and repaired remain
        zero; pending source events retain the same review lifecycle and guarded
        immutable adoption receipt rollback.
        Full history composes literal paired income with its selected zero-basis Gift
        insert/adoption or already-proved existing unit in one atomic commit. Output-only
        incomeProof.unitRowId binds the Gift row; unitTransactionId identifies an
        existing canonical unit. The actual unit after-image is proved before income
        is written. recordedIncome and recordedCash are additive subsets of imported
        at batch and aggregate level; repeated income/cash writes neither again.
        record_in_kind_income_only records only the reviewed literal paired income
        as canonical included_in_units dividends. imported equals recordedIncome;
        adopted/repaired are zero. It creates no acquisitions or cash/custody events
        and returns before the general event drain. Immutable paired-income receipts
        bind source and unchanged unit acquisition for repeat and guarded rollback.
        Other source events retain the same pending review lifecycle.
        record_cash_only requires complete original unfiltered Kinesis source,
        explicit preserve_existing and source-bound cash_funding_policy=own_account_transfer.
        The server proves complete cash balance chains and selects cash/duplicate/settled
        with typed cashProof. New cashValues carry signed amount, date, currency, account,
        brokerage origin and null peer; trade quotes and confirmed funding are internal,
        while card payments remain expenses. imported equals recordedCash; adopted,
        repaired and recordedIncome are zero. No portfolio, income, custody or adjustment
        drain runs, no opposite bank row is invented, and other source events stay pending.
        XML is not applied in this scope; retained reference context remains intact.
        Ordinary full scope rejects new Kinesis cash with cash_reconciliation_required;
        confirmed cash-only review is required. Unchanged source-owned settled repeats
        remain compatible with full review.
        A separately quoted same-currency funding withdrawal fee produces a second
        cashFeeValues expense component; the main transfer is net of that fee.
        cashProof.componentCount is one or two, and two-component repeats identify
        a distinct existingCashFeeTransactionId. Card spending includes its fee once.
        Source actions and ledger component counts are distinct.
        The zero-opening complete source requires no unrelated active ledger rows
        or routed-account statement balance readings, including zero readings;
        statement and ledger state are fingerprint-bound and rechecked under locks.
        Historical date-rate readiness is prepared automatically and fingerprint-bound;
        unresolved readiness defers the whole group rather than using a current rate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [batch_ids, expected_plan_fingerprint]
              properties:
                batch_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    {
                      type: integer,
                      format: int64,
                      minimum: 1,
                      maximum: 9007199254740991,
                    }
                adopt_policy:
                  type: string
                  enum: [preserve_existing, prefer_source]
                reconciliation_scope:
                  type: string
                  enum:
                    [
                      full,
                      adopt_existing_only,
                      correct_existing_only,
                      record_in_kind_income_only,
                      record_cash_only,
                    ]
                  default: full
                  description: Same scope as the reviewed preview. Bounded modes require complete unfiltered Kinesis sources and the matching explicit policy (preserve_existing for attachment/income, prefer_source for corrections). Income requires zero yield basis and already proved units; excluded events remain pending.
                cash_funding_policy:
                  type: string
                  enum: [own_account_transfer]
                  description: Required only with record_cash_only. Explicit source-bound confirmation that all source cash deposits and withdrawals are transfers between the user's own accounts. Bound in the reviewed fingerprint; no opposite bank leg is created.
                batch_policies:
                  type: array
                  maxItems: 100
                  description: Exact selected per-batch overrides used by the reviewed preview.
                  items:
                    type: object
                    additionalProperties: false
                    required: [batch_id, adopt_policy]
                    properties:
                      batch_id:
                        {
                          type: integer,
                          format: int64,
                          minimum: 1,
                          maximum: 9007199254740991,
                        }
                      adopt_policy:
                        {
                          type: string,
                          enum: [preserve_existing, prefer_source],
                        }
                expected_plan_fingerprint:
                  type: string
                  pattern: "^[a-f0-9]{64}$"
                  description: Exact fingerprint returned by preview for this source/reconciliation scope, global policy and per-batch overrides; narrow fingerprints also bind selected records, full source proof, receipt context and deferred counts.
      responses:
        "200":
          description: Aggregate and per-batch counts. Narrow scope adds reconciliationScope, pending, complete and deferredCounts at both levels plus top-level selectedRowIds; imported/repaired are zero and partial sessions stay awaiting_review. Full response adds optional recordedIncome/recordedCash subtotals within imported; older responses remain compatible. errors is zero on success and repaired is always emitted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        {
                          $ref: "#/components/schemas/PortfolioImportReconciliationCommitResult",
                        }
        "400":
          description: Malformed request or non-reviewable scope
        "404":
          description: A requested batch or account no longer exists
        "409":
          description: Stale preview, ambiguous existing history, unresolved source facts, invalid projected history or atomic row failure; no changes retained

  /api/portfolio/import/batches/{id}/commit:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
    post:
      summary: Commit a reviewed portfolio import batch
      description: >-
        Maintained IBKR, Kinesis, Nexo, Nexo Pro and Saxo adapters preflight source
        completeness and reconcile exact existing records atomically. Corrections
        and multi-file review use the reconciliation preview and commit endpoints.
        Generic partial imports retain their existing behavior.
      operationId: commitPortfolioImportBatch
      tags: [PortfolioImport]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id:
                  type: integer
                  format: int32
                  minimum: 1
                  nullable: true
                  description: >-
                    Brokerage sleeve account (ADR-095) stamped on the batch, so
                    every lot it commits inherits it. `null` — or an absent
                    field — preserves the existing batch account. A present value must
                    be a positive integer naming an existing account; a
                    malformed one is rejected rather than coerced, since a
                    coerced id names a different account and passes the
                    existence check. On recommit, a present account also resets
                    cash rows that failed solely because the batch account was
                    missing.
      responses:
        "200":
          description: Commit result with row counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          description: Malformed batch id or account_id, a body that is not a JSON object, or the batch is not in a reviewable state
        "404":
          description: Batch not found, or account_id names no account
        "409":
          description: >-
            Maintained staging is incomplete, needs an explicit reconciliation
            policy, overlaps ambiguous history, lacks proven basis or has invalid
            projected holdings. No canonical changes are retained. Readiness
            conflicts report a reason, count and one-based staging ordinals;
            reconciliation conflicts report blockers and the reviewed plan state.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    required: [error]
                    properties:
                      error:
                        type: object
                        required: [code, message, details]
                        properties:
                          code: { type: string, enum: [CONFLICT] }
                          message: { type: string }
                          details:
                            type: object
                            required: [reason]
                            properties:
                              reason:
                                type: string
                              count: { type: integer, minimum: 0 }
                              row_ordinals:
                                type: array
                                description: One-based staging row ordinals, including adapter-derived rows; not source-file line numbers.
                                items: { type: integer, minimum: 1 }
                              blockers:
                                type: array
                                items:
                                  { type: object, additionalProperties: true }
                              planFingerprint:
                                type: string
                                pattern: "^[a-f0-9]{64}$"

  # ─── Private Electron audit bridge ────────────────────────────────────────────
  /api/internal/audit/verify:
    post:
      summary: Verify the audit chain against a main-process checkpoint
      operationId: internalAuditVerify
      tags: [Internal Audit Bridge]
      description: >
        Private native Electron endpoint. The server requires both a loopback
        socket peer and the per-launch bearer token. The optional checkpoint
        must first be authenticated outside PostgreSQL by the Electron main
        process. HTTP 200 reports the verification result, including failed
        and unavailable statuses; it does not imply audit success.
      security:
        - AuditBridgeToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                trustedCheckpoint:
                  $ref: "#/components/schemas/AuditTrustedCheckpoint"
      responses:
        "200":
          description: Verification status in the response data
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/AuditVerificationResult" }
        "400": { description: Invalid or oversized request body }
        "401": { description: Missing or invalid per-launch bearer token }
        "403": { description: Socket peer is not loopback }

  /api/internal/audit/read:
    post:
      summary: Read a bounded audit page from a verified database snapshot
      operationId: internalAuditRead
      tags: [Internal Audit Bridge]
      description: >
        Private native Electron endpoint. The per-launch bearer and loopback
        socket checks match verify. The main process supplies an externally
        authenticated checkpoint. The server verifies the full history and
        reads the page under one repeatable-read transaction. Failed or
        unavailable verification returns an empty entries array. A verified
        prefix does not authenticate a pending tail.
      security:
        - AuditBridgeToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                trustedCheckpoint:
                  $ref: "#/components/schemas/AuditTrustedCheckpoint"
                afterSequence: { type: integer, minimum: 0 }
                limit: { type: integer, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: Verification result and bounded audit page
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/AuditReadPage" }
        "400": { description: Invalid or oversized request body }
        "401": { description: Missing or invalid per-launch bearer token }
        "403": { description: Socket peer is not loopback }

  /api/internal/audit/retention-plan:
    post:
      summary: Plan an eligible one-year audit prefix after full verification
      operationId: internalAuditRetentionPlan
      tags: [Internal Audit Bridge]
      description: >
        Private Electron endpoint with loopback and per-launch bearer checks.
        The caller supplies an externally authenticated checkpoint. The plan
        is advisory; Electron must sign its boundary outside PostgreSQL before
        invoking retention-prune. A non-eligible plan does not delete rows.
      security:
        - AuditBridgeToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [trustedCheckpoint]
              properties:
                trustedCheckpoint:
                  $ref: "#/components/schemas/AuditTrustedCheckpoint"
      responses:
        "200":
          description: Eligible boundary or bounded reason for no deletion
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, enum: [true] }
                  data:
                    type: object
                    required: [eligible]
                    properties:
                      eligible: { type: boolean }
                      reason: { type: string }
                      through: { type: integer, minimum: 1 }
                      hash: { type: string, pattern: "^[0-9a-f]{64}$" }
                      domainMax:
                        { $ref: "#/components/schemas/AuditRetentionDomainMax" }
                      migrationHeads:
                        type: array
                        items: { type: string }
        "400": { description: Invalid or missing authenticated checkpoint }
        "401": { description: Missing or invalid per-launch bearer token }
        "403": { description: Socket peer is not loopback }

  /api/internal/audit/retention-prune:
    post:
      summary: Prune a complete old prefix bound by a signed receipt
      operationId: internalAuditRetentionPrune
      tags: [Internal Audit Bridge]
      description: >
        Private Electron endpoint. The signed retention boundary must already
        be present in the externally authenticated checkpoint. Full retained
        history is verified before the guarded database function runs.
      security:
        - AuditBridgeToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [trustedCheckpoint]
              properties:
                trustedCheckpoint:
                  $ref: "#/components/schemas/AuditTrustedCheckpoint"
      responses:
        "200":
          description: Number of deleted rows; zero on an exact retry
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, enum: [true] }
                  data:
                    type: object
                    required: [removed]
                    properties:
                      removed: { type: integer, minimum: 0 }
        "400": { description: Invalid or missing signed retention boundary }
        "401": { description: Missing or invalid per-launch bearer token }
        "403": { description: Socket peer is not loopback }

  /api/internal/audit/checkpoint:
    post:
      summary: Record metadata for an already persisted Electron receipt
      operationId: internalAuditCheckpoint
      tags: [Internal Audit Bridge]
      description: >
        Private native Electron endpoint with the same loopback and per-launch
        token checks as verify. This records database metadata only. The
        receipt itself is kept in Electron application data outside PostgreSQL.
      security:
        - AuditBridgeToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditCheckpointMetadata"
      responses:
        "200":
          description: Inserted checkpoint metadata identifier and creation time
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, enum: [true] }
                  data:
                    type: object
                    required: [id, createdAt]
                    properties:
                      id: { type: string }
                      createdAt: { type: string, format: date-time }
        "400": { description: Invalid or oversized request body }
        "401": { description: Missing or invalid per-launch bearer token }
        "403": { description: Socket peer is not loopback }
        "409":
          {
            description: Checkpoint sequence or hash conflicts with the stored chain,
          }

  /api/internal/audit/update-decision:
    post:
      summary: Append a local Electron updater decision to the audit chain
      operationId: internalAuditUpdateDecision
      tags: [Internal Audit Bridge]
      description: >
        Private native Electron endpoint with loopback and per-launch Bearer
        checks. Records a bounded decision, update mode, and version as a
        release_update audit event. It does not prove release signature or
        publisher provenance.
      security:
        - AuditBridgeToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditUpdateDecision"
      responses:
        "200":
          description: Appended audit sequence and hash
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, enum: [true] }
                  data:
                    type: object
                    required: [sequence, hash]
                    properties:
                      sequence: { type: integer, minimum: 1 }
                      hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        "400": { description: Invalid or oversized request body }
        "401": { description: Missing or invalid per-launch bearer token }
        "403": { description: Socket peer is not loopback }

