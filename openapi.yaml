  # ─── Portfolio Import ─────────────────────────────────────────────────────────
  /api/portfolio/import/probe:
    post:
      summary: Read-only maintained statement detection and CSV header preview
      description: >-
        Inspects an uploaded file without creating a batch or financial rows. Uses
        the same maintained-format detection and 16384-byte, five-row CSV preview
        rules as the web frontend. Full-file detection retains every source account
        identity. Detection and preview errors are independent; a supported workbook
        can be detected while CSV preview is unavailable. Temporary uploads are cleaned
        up on every outcome. The existing 50 MB upload and workbook inflation limits apply.
      operationId: probePortfolioImport
      tags: [PortfolioImport]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                separator:
                  type: string
                  enum: [",", ";", "\t", "|"]
                  description: Omit to sniff the first nonempty header line.
                encoding:
                  type: string
                  enum: [utf-8, utf8, latin1, latin-1, iso-8859-1, windows-1252]
                  description: Case-insensitive and trimmed; Latin-1 aliases normalize to latin1.
                  default: utf-8
                skipRows:
                  type: string
                  pattern: '^\d{1,6}$'
                  default: "0"
      responses:
        "200":
          description: Independent detection and CSV preview outcomes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          [
                            detected,
                            detectionError,
                            preview,
                            previewError,
                            separator,
                          ]
                        properties:
                          detected:
                            type: object
                            nullable: true
                            required: [source, sourceAccountIdentities]
                            properties:
                              source:
                                type: string
                                enum:
                                  [
                                    ibkr,
                                    kinesis,
                                    nexo,
                                    nexo_pro,
                                    saxo,
                                    native_receipts,
                                  ]
                              sourceAccountIdentities:
                                type: array
                                items:
                                  type: string
                              presetKey:
                                type: string
                                enum: [ibkr_funding_history]
                          detectionError:
                            type: string
                            nullable: true
                            enum: [parse_error]
                          preview:
                            type: object
                            nullable: true
                            required: [headers, rows]
                            properties:
                              headers:
                                type: array
                                items:
                                  type: string
                              rows:
                                type: array
                                maxItems: 5
                                items:
                                  type: array
                                  items:
                                    type: string
                          previewError:
                            type: string
                            nullable: true
                            enum: [parse_error]
                          separator:
                            type: string
                            enum: [",", ";", "\t", "|"]
        "400":
          description: Missing or unsupported upload or invalid probe options

  /api/portfolio/import/csv/custom:
    post:
      summary: One-shot portfolio history import with custom mapping or a supported format
      description: >-
        Accepts CSV and detailed Saxo XLSX through the existing endpoint path.
        Mapping and brokerage fields are accepted in the multipart body.
        Workbook preflight rejects unsupported or inconsistent input before
        creating a batch. Maintained formats always require staged review.
