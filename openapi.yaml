      properties:
        derivedAmount: { type: number, nullable: true }
        derivedUnits: { type: number, nullable: true }
        derivedPrice: { type: number, nullable: true }
        effectiveAmount: { type: number, nullable: true }
        effectiveUnits: { type: number, nullable: true }
        effectivePrice: { type: number, nullable: true }
        providedCount: { type: integer, minimum: 0, maximum: 3 }
        isConsistent: { type: boolean }

    ResearchLifeScenario:
      type: object
      additionalProperties: true
      required:
        [
          id,
          interruptionMonths,
          monthlySurplus,
          monthlyIncomeLoss,
          monthlyContribution,
        ]
      properties:
        id: { type: string, minLength: 1 }
        kind: { type: string, enum: [income_interruption] }
        interruptionMonths: { type: integer, enum: [3] }
        monthlySurplus: { type: number, minimum: 0 }
        monthlyIncomeLoss: { type: number, minimum: 0 }
        monthlyContribution: { type: number, minimum: 0 }
        goalValue: { type: number, exclusiveMinimum: 0 }
        name: { type: string }
        goalDate: { type: string }

    ResearchLifeScenarioForecastInput:
      type: object
      additionalProperties: true
      required: [horizonMonths]
      description: >-
        Immediate camelCase forecast input. Only horizon is validated here.
        monthlyContribution, targetValue, goalMonth and seed are overwritten from
        the scenario, so malformed discarded main money values do not block a
        valid scenario. Other fields pass through unchanged; the existing forecast
        request adapter/route retains its own normalization and validation.
      properties:
        horizonMonths: { type: integer, minimum: 1, maximum: 600 }

    ResearchLifeScenarioPreparedInput:
      type: object
      additionalProperties: true
      required: [horizonMonths, monthlyContribution, seed]
      properties:
        horizonMonths: { type: integer, minimum: 1, maximum: 600 }
        monthlyContribution: { type: number, minimum: 0 }
        targetValue: { type: number, exclusiveMinimum: 0 }
        goalMonth: { type: integer, minimum: 1, maximum: 600 }
        seed: { type: string }

    ResearchLifeScenarioPrepareResult:
      type: object
      required:
        [baselineInput, interruptedInput, reducedContribution, monthlyDeficit]
      properties:
        baselineInput:
          { $ref: "#/components/schemas/ResearchLifeScenarioPreparedInput" }
        interruptedInput:
          allOf:
            - $ref: "#/components/schemas/ResearchLifeScenarioPreparedInput"
            - type: object
              required: [monthlyContributionSchedule]
              properties:
                monthlyContributionSchedule:
                  type: array
                  minItems: 3
                  maxItems: 3
                  items: { type: number, minimum: 0 }
        goalMonth: { type: integer, minimum: 1, maximum: 600 }
        reducedContribution: { type: number, minimum: 0 }
        monthlyDeficit: { type: number, minimum: 0 }

    ResearchLifeScenarioCompareResult:
      type: object
      required: [comparable, available, medianGap, errorKey]
      properties:
        comparable: { type: boolean }
        available: { type: boolean }
        medianGap: { type: number, nullable: true }
        errorKey:
          {
            type: string,
            nullable: true,
            enum: [research.lifeScenario.inputsChanged],
          }

    ResearchPresentationSnapshot:
      type: object
      required: [kind]
      description: >-
        Uploaded JSON discriminated by kind. compare requires series[{symbol,points}]
        (max 6). chart requires series[{id,field,type,points}] (max 5),
        indicators[{id,type,period,seriesId}] (max 20, period 1..500), rebase,
        oscillator and nullable oscillatorSeriesId. watchlist requires nullable
        targetPrice/currentPrice/addedPrice and optional points. watchlistBatch
        requires entries[{id,targetPrice,currentPrice,addedPrice}] (max 5000).
        providerQuote requires points and investment{name,currency,symbol?,priceProvider?},
        with optional selectedSymbol. analyst requires nullable consensus with all five
        numeric count fields. marketAdd accepts positive amount/units/price and optional
        derive (default true). lifeScenarioPrepare requires scenario, forecastInput
        and optional nullable goalMonth; contribution must not exceed surplus, and
        a dated goal pairs a positive goalValue with goalMonth within horizon.
        lifeScenarioCompare requires baseline/interrupted raw forecasts and checks
        exactly five market-input fields with strict missing/null semantics.
        Points require time, with optional nullable numeric
        close/high/low/volume. There is no point-count truncation; transport is bounded.
      properties:
        kind:
          {
            type: string,
            enum:
              [
                compare,
                chart,
                watchlist,
                watchlistBatch,
                providerQuote,
                analyst,
                marketAdd,
                lifeScenarioPrepare,
                lifeScenarioCompare,
              ],
          }
        scenario: { $ref: "#/components/schemas/ResearchLifeScenario" }
        forecastInput:
          { $ref: "#/components/schemas/ResearchLifeScenarioForecastInput" }
        goalMonth: { type: integer, minimum: 1, maximum: 600, nullable: true }
        baseline: { $ref: "#/components/schemas/ResearchPortfolioForecastData" }
        interrupted:
          { $ref: "#/components/schemas/ResearchPortfolioForecastData" }
        series:
          type: array
          items:
            type: object
            properties:
              symbol: { type: string, minLength: 1, maxLength: 64 }
              id: { type: string, minLength: 1, maxLength: 128 }
              field: { type: string, enum: [price, volume] }
              type: { type: string, enum: [line, area, candlestick, bar] }
              points:
                type: array
                items: { $ref: "#/components/schemas/ResearchChartPoint" }
        indicators:
          type: array
          maxItems: 20
          items:
            type: object
            required: [id, type, period, seriesId]
            properties:
              id: { type: string, minLength: 1, maxLength: 128 }
              type: { type: string, enum: [sma, ema, bollinger] }
              period: { type: integer, minimum: 1, maximum: 500 }
              seriesId: { type: string, minLength: 1, maxLength: 128 }
        rebase: { type: boolean }
        oscillator: { type: string, enum: [none, rsi, macd] }
        oscillatorSeriesId: { type: string, nullable: true }
        targetPrice: { type: number, nullable: true }
        currentPrice: { type: number, nullable: true }
        addedPrice: { type: number, nullable: true }
        points:
          type: array
          items: { $ref: "#/components/schemas/ResearchChartPoint" }
        entries:
          type: array
          maxItems: 5000
          items:
            type: object
            required: [id, targetPrice, currentPrice, addedPrice]
            properties:
              id: { type: integer, minimum: 1 }
              targetPrice: { type: number }
              currentPrice: { type: number, nullable: true }
              addedPrice: { type: number, nullable: true }
        investment:
          type: object
          required: [name, currency]
          properties:
            symbol: { type: string, nullable: true }
            name: { type: string }
            currency: { type: string }
            priceProvider: { type: string, nullable: true }
        selectedSymbol: { type: string, nullable: true }
        consensus:
          {
            $ref: "#/components/schemas/ResearchAnalystConsensus",
            nullable: true,
          }
        amount: { type: number, exclusiveMinimum: 0 }
        units: { type: number, exclusiveMinimum: 0 }
        price: { type: number, exclusiveMinimum: 0 }
        derive: { type: boolean, default: true }

    ResearchPresentationData:
      type: object
      required: [kind, result]
      description: result shape is determined by the echoed kind; unavailable analyst/providerQuote results are null.
      properties:
        kind:
          {
            type: string,
            enum:
              [
                compare,
                chart,
                watchlist,
                watchlistBatch,
                providerQuote,
                analyst,
                marketAdd,
                lifeScenarioPrepare,
                lifeScenarioCompare,
