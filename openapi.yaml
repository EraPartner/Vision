        "204":
          description: No Content

  # ─── Transactions extra ──────────────────────────────────────────────────────
  /api/transactions/bulk-delete:
    post:
      summary: Bulk-delete transactions selected by ids or filter
      operationId: bulkDeleteTransactions
      tags: [Transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkSelection"
      responses:
        "200":
          description: Number of transactions deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deleted:
                            type: integer
                          requested:
                            type: integer
                          matched:
                            type: integer
                        required: [deleted, requested, matched]
        "400":
          description: >-
            Invalid selector: neither/both of `ids` and `filter`, a malformed
            id, a missing or misplaced `expected_count`, or an
            unknown/malformed filter field
        "429":
          description: Rate limit exceeded
        "409":
          description: Selection contains a planned execution link or changed transaction ownership; nothing is deleted

  /api/transactions/bulk-update:
    post:
      summary: Apply a shared field update to transactions selected by ids or filter
      operationId: bulkUpdateTransactions
      tags: [Transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/BulkSelection"
                - type: object
                  required: [fields]
                  properties:
                    fields:
                      type: object
                      description: At least one of the updatable properties
                      properties:
                        category_id:
                          type: integer
                          nullable: true
                        recipient_id:
                          type: integer
                        is_active:
                          type: boolean
      responses:
        "200":
          description: Number of transactions updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          updated:
                            type: integer
                          requested:
                            type: integer
                          matched:
                            type: integer
                        required: [updated, requested, matched]
        "400":
          description: >-
            Invalid selector or fields, including a missing or misplaced
            `expected_count`, an invalid FK reference, or an unknown/malformed
            filter field
        "429":
          description: Rate limit exceeded

  /api/transactions/bulk-export:
    post:
      summary: Export transactions selected by ids or filter (CSV or NDJSON stream)
      operationId: bulkExportTransactions
      tags: [Transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/BulkSelection"
                - type: object
                  properties:
                    format:
                      type: string
                      enum: [csv, json]
                      default: csv
                    include_balance:
                      type: boolean
                      default: false
      responses:
        "200":
          description: Streamed export
          headers:
            X-Exported-Count:
              description: Number of transactions written to the export stream
              schema:
                type: integer
          content:
            text/csv:
              schema:
                type: string
            application/x-ndjson:
              schema:
                type: string
        "400":
          description: >-
            Invalid selector or format, including a missing or misplaced
            `expected_count`, or an unknown/malformed filter field
        "429":
          description: Rate limit exceeded

  /api/transactions/bulk-tag:
    post:
      summary: Bulk add/remove tags across multiple transactions
      operationId: bulkTagTransactions
      tags: [Transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkTagRequest"
      responses:
        "200":
          description: Bulk tag result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BulkTagResult"
        "400":
          description: Unknown tags or invalid input
        "429":
          description: Rate limit exceeded

  /api/transactions/transfer-suggestions:
    get:
      summary: Paginated ambiguous internal-transfer matches (ADR-083)
      description: Candidate edges are ordered by outflow and inflow IDs. An outflow can occur on consecutive pages; combine its candidates across pages. Uniqueness is evaluated against the full ledger, independently of pagination. Pages are live and may change after ledger mutations.
      operationId: getTransferSuggestions
      tags: [Transactions]
      parameters:
        - name: cursor
          in: query
          description: nextCursor from the preceding page; omit for the first page.
          schema: { type: string, pattern: '^[0-9]+:[0-9]+$' }
        - name: limit
          in: query
          description: Maximum candidate edges, not outflow groups.
          schema: { type: integer, minimum: 1, maximum: 200, default: 200 }
      responses:
        "200":
          description: A page of suggestions. Follow nextCursor until hasMore is false to enumerate all candidate edges.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, hasMore, nextCursor]
                        properties:
                          items:
                            type: array
                            items:
                              type: object
                          hasMore: { type: boolean }
                          nextCursor: { type: string, nullable: true }
        "400":
          description: Invalid cursor or limit.

  /api/transactions/transfers:
    post:
      summary: Manually confirm an internal-transfer pair (ADR-083)
      operationId: markTransfer
      tags: [Transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [aId, bId]
              properties:
                aId: { type: integer }
                bId: { type: integer }
      responses:
        "200":
          description: Pair marked as a transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          description: aId and bId must be two distinct transaction ids

  /api/transactions/transfers/{id}:
    delete:
      summary: Clear a transfer mark on a transaction and its peer (ADR-083)
      operationId: unmarkTransfer
      tags: [Transactions]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: No Content (transfer mark cleared)

  /api/transactions/export/csv:
    get:
      summary: Export transactions as CSV (streaming)
      operationId: exportTransactionsCsv
      tags: [Transactions]
      parameters:
        - in: query
          name: start_date
          schema:
            type: string
            format: date
        - in: query
          name: end_date
          schema:
            type: string
            format: date
        - in: query
          name: account_id
          description: Preferred account filter (exact FK match, ADR-088); bank_account remains a substring escape hatch
          schema:
            type: integer
            format: int32
            minimum: 1
        - in: query
          name: account_ids
          description: >-
            Comma-separated account ids (exact FK match, ADR-088); preferred over bank_accounts.
            Every element must be a plain base-10 integer in 1..2147483647; a malformed element
            returns 400 VALIDATION_ERROR rather than being dropped, which used to widen the
            export to every account. Capped at 50 entries after validation.
          schema:
            type: string
            pattern: "^[0-9]+(,[0-9]+)*$"
        - in: query
          name: bank_account
          schema:
            type: string
        - in: query
          name: bank_accounts
          description: >-
            Comma-separated account labels (legacy escape hatch next to account_ids); blank
            entries are dropped and the list is capped at 50 entries.
          schema:
            type: string
        - in: query
          name: category_ids
          description: >-
            Comma-separated category ids. Every element must be a plain base-10 integer in
            1..2147483647; a malformed element returns 400 VALIDATION_ERROR.
          schema:
            type: string
            pattern: "^([0-9]+(,[0-9]+)*)?$"
        - in: query
          name: include_balance
          schema:
            type: boolean
        - in: query
          name: tags
          schema:
            type: string
          description: Comma-separated tag slugs — OR filter
        - in: query
          name: transaction_id
          description: Restrict the export to one transaction id (the list filter of the same name).
          schema:
            type: integer
            format: int32
            minimum: 1
        - in: query
          name: recipient_id
          schema:
            type: integer
            format: int32
            minimum: 1
        - in: query
          name: category_id
          schema:
            type: integer
            format: int32
            minimum: 1
        - in: query
          name: search
          description: Free-text search, as on the list endpoint (truncated to 200 characters).
          schema:
            type: string
        - in: query
          name: transaction_type
          description: income or expense; any other value is ignored.
          schema:
            type: string
        - in: query
          name: amount_min
          schema:
            type: number
        - in: query
          name: amount_max
          schema:
            type: number
        - in: query
          name: amount_signed
          description: Compare amount_min/amount_max against the signed amount instead of its absolute value.
          schema:
            type: boolean
      responses:
        "200":
          description: CSV stream
          content:
            text/csv:
              schema:
                type: string

  /api/transactions/export/json:
    get:
      summary: Export transactions as NDJSON (streaming)
      operationId: exportTransactionsJson
      tags: [Transactions]
      parameters:
        - in: query
          name: start_date
          schema:
            type: string
            format: date
        - in: query
          name: end_date
          schema:
            type: string
            format: date
        - in: query
          name: account_id
          description: Preferred account filter (exact FK match, ADR-088); bank_account remains a substring escape hatch
          schema:
            type: integer
            format: int32
            minimum: 1
        - in: query
          name: account_ids
          description: >-
            Comma-separated account ids (exact FK match, ADR-088); preferred over bank_accounts.
            Every element must be a plain base-10 integer in 1..2147483647; a malformed element
            returns 400 VALIDATION_ERROR rather than being dropped, which used to widen the
            export to every account. Capped at 50 entries after validation.
          schema:
            type: string
            pattern: "^[0-9]+(,[0-9]+)*$"
        - in: query
          name: bank_account
          schema:
            type: string
        - in: query
          name: bank_accounts
          description: >-
            Comma-separated account labels (legacy escape hatch next to account_ids); blank
            entries are dropped and the list is capped at 50 entries.
          schema:
            type: string
        - in: query
          name: category_ids
          description: >-
            Comma-separated category ids. Every element must be a plain base-10 integer in
            1..2147483647; a malformed element returns 400 VALIDATION_ERROR.
          schema:
            type: string
            pattern: "^([0-9]+(,[0-9]+)*)?$"
        - in: query
          name: tags
          schema:
            type: string
          description: Comma-separated tag slugs — OR filter
        - in: query
          name: transaction_id
          description: Restrict the export to one transaction id (the list filter of the same name).
          schema:
            type: integer
            format: int32
            minimum: 1
        - in: query
          name: recipient_id
          schema:
            type: integer
            format: int32
            minimum: 1
        - in: query
          name: category_id
          schema:
            type: integer
            format: int32
            minimum: 1
        - in: query
          name: search
          description: Free-text search, as on the list endpoint (truncated to 200 characters).
          schema:
            type: string
        - in: query
          name: transaction_type
          description: income or expense; any other value is ignored.
          schema:
            type: string
        - in: query
          name: amount_min
          schema:
            type: number
        - in: query
          name: amount_max
          schema:
            type: number
        - in: query
          name: amount_signed
          description: Compare amount_min/amount_max against the signed amount instead of its absolute value.
          schema:
            type: boolean
      responses:
        "200":
          description: Newline-delimited JSON stream
          content:
            application/x-ndjson:
              schema:
                type: string

  # ─── Categories extra ────────────────────────────────────────────────────────
  /api/categories/{id}/assign:
    parameters:
      - in: path
