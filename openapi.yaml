  /api/categories/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    get:
      summary: Get category
      operationId: getCategory
      tags: [Categories]
      responses:
        "200":
          description: Single category
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Category"
    patch:
      summary: Update category
