    get:
      summary: List portfolio transactions across all investments
      operationId: getBulkPortfolioTransactions
      tags: [Portfolio]
      description: Ordinary portfolio transaction rows across the requested investments, ranked newest first per investment and then globally by date/id descending. This operation excludes custody and asset-adjustment events, which have separate APIs. total counts matching ordinary rows before per-investment and global limits; response limit is the requested global cap or the returned item count when omitted.
      parameters:
        # Documented as `investment_id` (singular, optional) until 2026-08-11;
        # the route has only ever read `investment_ids`, and 400s without it.
        - in: query
          name: investment_ids
          required: true
          description: >-
            Comma-separated investment ids (`1,2,3`), the shape the frontend's
            `ids.join(',')` builder emits. Every element must be a positive
            int32; one malformed element rejects the whole request. Repeated
            occurrences are also accepted by the route; generated clients use the
            comma-joined string.
          schema:
            type: string
            pattern: "^[0-9]+(,[0-9]+)*$"
        - in: query
          name: type
          description: Optional exact ordinary transaction type filter.
          schema: { type: string }
        - in: query
          name: per_investment_limit
          description: Maximum newest rows per investment. Defaults invalid/non-positive values to 1000 and clamps values over 5000; native editing uses 1000, matching the web bulk loader.
          schema: { type: integer, default: 1000, minimum: 1, maximum: 5000 }
        - in: query
          name: limit
          description: Optional global cap after per-investment ranking. Omit or leave empty for no global cap. Invalid/non-positive explicit values default to 1; positive values clamp at 200000.
          schema:
            type: integer
            minimum: 1
            maximum: 200000
        - in: query
          name: offset
          description: Global offset after ranking and descending date/id order. Invalid/negative values fall back to zero.
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "400":
          description: Missing or malformed investment_ids, or repeated/non-scalar type filter.
        "200":
          description: Ordinary transaction items plus full matching total, numeric effective limit, numeric offset, and links. total can exceed items even without a global limit because of per-investment caps.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PortfolioTransactionList"

  /api/investments/transactions/broker:
    put:
      summary: Atomically re-tag reviewed portfolio transactions to a broker
      operationId: bulkRetagPortfolioTransactions
      tags: [Portfolio]
      description: >-
        Applies one compare-and-set update. Every selected row must still have
        from_account_id. Replaying the same UUID with the same semantic request
        returns the durable receipt; reusing it for another request returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                [
                  transaction_ids,
                  from_account_id,
                  to_account_id,
                  idempotency_key,
                ]
              properties:
                transaction_ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  uniqueItems: true
                  items:
                    type: integer
                    format: int32
                    minimum: 1
                from_account_id:
                  type: integer
                  format: int32
                  minimum: 1
                  nullable: true
                to_account_id:
                  type: integer
                  format: int32
                  minimum: 1
                  nullable: true
                idempotency_key:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Durable re-tag receipt or idempotent replay
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PortfolioBrokerRetagReceipt"
        "400":
          description: Invalid request shape, destination, or projected partition
        "409":
          description: Stale source assignment or conflicting idempotency key
        "403":
          description: Request failed the application's mutation access policy
        "429":
          description: Broker re-tag rate limit exceeded

  /api/investments/transactions/{txnId}:
    parameters:
      - in: path
        name: txnId
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    patch:
      summary: Update portfolio transaction
      operationId: updatePortfolioTransaction
      tags: [Portfolio]
      requestBody:
        required: true
        description: >-
          Partial portfolio-transaction fields. Shared POST/PATCH validation
          rejects malformed dates, non-finite or out-of-range numbers,
          non-boolean recurrence flags, invalid recurrence intervals, and
          non-string notes with 400 VALIDATION_ERROR before a repository write.
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  $ref: "#/components/schemas/PortfolioTxnType"
                date:
                  type: string
                  format: date
                amount:
                  type: number
                units:
                  type: number
                price_per_unit:
                  type: number
                fees:
                  type: number
                taxes:
                  type: number
                dividend_amount_convention:
                  type: string
                  enum: [gross, net, unknown]
                  description: Only meaningful for dividend transactions
                currency:
                  type: string
                fx_rate_to_eur:
                  type: number
                  nullable: true
                  description: Explicit EUR conversion rate; null clears it
                account_id:
                  type: integer
                  format: int32
                  minimum: 1
                  nullable: true
                  description: Owning account for the lot (ADR-091); null = unassigned
                note:
                  type: string
                  nullable: true
                  description: Free-text note; null clears it
                is_recurring:
                  type: boolean
                recurrence_interval:
                  allOf:
                    - $ref: "#/components/schemas/RecurrenceInterval"
                  nullable: true
                recurrence_end_date:
                  type: string
                  format: date
                  nullable: true
      responses:
        "200":
          description: Updated transaction
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PortfolioTransaction"
        "400":
          description: Malformed transaction field or repository validation failure
    delete:
      summary: Delete portfolio transaction
      operationId: deletePortfolioTransaction
      tags: [Portfolio]
      responses:
        "204":
          description: No Content

  /api/investments/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    get:
      summary: Get investment
      operationId: getInvestment
      tags: [Portfolio]
      responses:
        "200":
          description: Single investment
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Investment"
    patch:
      summary: Update investment
      operationId: updateInvestment
      tags: [Portfolio]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestmentUpdateRequest"
      responses:
        "200":
          description: Updated investment
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Investment"
        "400":
          description: Malformed investment field, including a null, empty, or invalid currency
    delete:
      summary: Delete investment
      operationId: deleteInvestment
      tags: [Portfolio]
      responses:
        "204":
          description: No Content

  /api/investments/{id}/price-history:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    get:
      summary: Get price history for investment
      operationId: getInvestmentPriceHistory
      tags: [Portfolio]
      parameters:
        - in: query
          name: start_date
          deprecated: true
          description: Accepted but ignored; use from_ms.
          schema:
            type: string
            format: date
        - in: query
          name: end_date
          deprecated: true
          description: Accepted but ignored; use to_ms.
          schema:
            type: string
            format: date
        - in: query
          name: from_ms
          description: Inclusive epoch milliseconds. Missing or non-finite parsed values leave this bound absent.
          schema: { type: number }
        - in: query
          name: to_ms
          description: Inclusive epoch milliseconds. Missing or non-finite parsed values leave this bound absent.
          schema: { type: number }
        - in: query
          name: db_only
          description: Defaults true; false allows the existing provider fetch/cache behavior. Lenient boolean parsing is retained.
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: Price history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        {
                          $ref: "#/components/schemas/InvestmentPriceHistoryData",
                        }

  /api/investments/{id}/transactions:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    get:
      summary: List transactions for investment
      operationId: getInvestmentTransactions
      tags: [Portfolio]
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: offset
          schema:
            type: integer
      responses:
        "200":
          description: Transaction list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PortfolioTransactionList"
    post:
      summary: Create transaction for investment
      operationId: createInvestmentTransaction
      tags: [Portfolio]
      requestBody:
        required: true
        description: >-
          Portfolio-transaction fields use the same shape validation as PATCH;
          type and date are additionally required for create. Malformed fields
          return 400 VALIDATION_ERROR before a repository write.
        content:
          application/json:
            schema:
              type: object
              required: [type, date]
              properties:
                type:
                  $ref: "#/components/schemas/PortfolioTxnType"
                date:
                  type: string
                  format: date
                amount:
                  type: number
                units:
                  type: number
                price_per_unit:
                  type: number
                fees:
                  type: number
                taxes:
                  type: number
                dividend_amount_convention:
                  type: string
                  enum: [gross, net, unknown]
                  default: unknown
                  description: Only meaningful for dividend transactions
                currency:
                  type: string
                note:
                  type: string
                  nullable: true
                is_recurring:
                  type: boolean
                recurrence_interval:
                  allOf:
                    - $ref: "#/components/schemas/RecurrenceInterval"
                  nullable: true
                recurrence_end_date:
                  type: string
                  format: date
                  nullable: true
                fx_rate_to_eur:
                  type: number
                  nullable: true
                  description: Explicit EUR conversion rate; absent/null is resolved automatically
                account_id:
                  type: integer
                  format: int32
                  minimum: 1
                  nullable: true
                  description: >-
                    Owning account for the lot (ADR-091); absent or null leaves it
                    unassigned. Accepted and applied by this operation all along —
                    it was simply undocumented.
      responses:
        "201":
          description: Created transaction
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PortfolioTransaction"
        "400":
          description: Missing required field, malformed transaction field, or repository validation failure

  /api/investments/{id}/summary:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    get:
      summary: Get investment summary (current value, P&L, units)
      operationId: getInvestmentSummary
      tags: [Portfolio]
      parameters:
        - in: query
          name: currency
          schema:
            type: string
      responses:
        "200":
          description: Investment summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  # ─── Market Lookup ───────────────────────────────────────────────────────────
  /api/market/search:
    get:
      summary: Search for market symbols
      operationId: marketSearch
      tags: [Market]
      parameters:
        - in: query
          name: q
          description: Search text. Missing or empty returns an empty `items` list. A repeated key returns 400.
          schema:
            type: string
      responses:
        "400": { description: "VALIDATION_ERROR: `q` sent more than once" }
        "200":
          description: Symbol search results
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MarketSearchData" }

  /api/market/quote:
    get:
      summary: Get real-time quotes for one or more symbols
      operationId: marketQuote
      tags: [Market]
      parameters:
        - in: query
          name: symbols
          required: true
          description: Comma-separated list of symbols (e.g. `AAPL,MSFT`). A repeated key is joined with commas.
          schema:
            type: string
        - in: query
          name: detail
          description: "`basic` returns price fields only; any other single value (default full) also fetches fundamentals/analyst data. A repeated key returns 400."
          schema:
            type: string
            enum: [basic, full]
      responses:
        "400":
          {
            description: "VALIDATION_ERROR: missing `symbols`, or `detail` sent more than once",
          }
        "200":
          description: Quote data (canonical `{items, total}` body)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MarketQuoteData" }

  /api/market/chart:
    get:
      summary: Get historical chart data for symbol
      operationId: marketChart
      tags: [Market]
      parameters:
        - in: query
          name: symbol
          required: true
          schema:
            type: string
        - in: query
          name: range
          description: Lookback window. An unknown value falls back to `1mo`.
          schema:
            type: string
            enum: [1d, 5d, 1mo, 3mo, 6mo, 1y, 2y, 5y, max]
            default: 1mo
        - in: query
          name: interval
          schema:
            type: string
            enum: [1m, 2m, 5m, 15m, 30m, 60m, 90m, 1h, 1d, 5d, 1wk, 1mo, 3mo]
            default: 1d
      responses:
        "400":
          {
            description: "VALIDATION_ERROR: missing `symbol`, an `interval` outside the list, or a parameter sent more than once",
          }
        "200":
          description: OHLC chart data (canonical `{items, total}` series with `symbol`/`currency` alongside)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, total]
                        properties:
                          symbol: { type: string }
                          currency: { type: string }
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                time: { type: number }
                                close: { type: number }
                                high: { type: number }
                                low: { type: number }
                                volume: { type: number }
                          total:
                            type: integer

  /api/market/news:
    get:
      summary: Get news for symbol
      operationId: marketNews
      tags: [Market]
      parameters:
        - in: query
          name: symbols
          description: Comma-separated symbols; the first 10 are used. Defaults to `SPY,QQQ,DIA`. A repeated key is joined with commas.
          schema:
            type: string
        - in: query
          name: count
          description: Articles per symbol (max 50). A non-numeric value falls back to 20. A repeated key returns 400.
          schema:
            type: integer
            default: 20
            maximum: 50
      responses:
        "400": { description: "VALIDATION_ERROR: `count` sent more than once" }
        "200":
          description: News items (canonical `{items, total}` body)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MarketNewsData" }

  /api/watchlist:
    get:
      summary: List watchlist items
      operationId: getWatchlist
      tags: [Watchlist]
      parameters:
        - in: query
          name: asset_class
          description: Optional exact asset-class filter; repeated keys return 400.
          schema: { type: string }
        - in: query
          name: limit
          description: Lenient integer parsing; clamped to 1..5000; malformed values use 50.
          schema: { type: integer, minimum: 1, maximum: 5000, default: 50 }
        - in: query
          name: offset
          description: Lenient integer parsing; negative values clamp to zero.
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Watchlist
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/WatchlistData" }
    post:
      summary: Add symbol to watchlist
      operationId: addToWatchlist
      tags: [Watchlist]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, asset_class, target_price]
              properties:
                symbol:
                  type: string
                name:
                  type: string
                asset_class:
                  type: string
                  enum: [stock, etf, crypto, metals]
                target_price:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 999999999999
                currency:
                  type: string
                  pattern: '^\s*[A-Za-z]{3}\s*$'
                  description: Three-letter ISO currency code; trimmed and normalized to uppercase. Omit to default to EUR.
                notes:
                  type: string
                  nullable: true
                price_provider_id:
                  type: string
                  nullable: true
                added_price:
                  type: number
                  minimum: 0
                  maximum: 999999999999
                  nullable: true
      responses:
        "201":
          description: Added item
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/WatchlistItem"
        "400":
          description: Malformed watchlist field, including an explicit null or empty currency

  /api/watchlist/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    get:
      summary: Get watchlist item
      operationId: getWatchlistItem
      tags: [Watchlist]
      responses:
        "200":
          description: Watchlist item with current price
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/WatchlistItem"
    patch:
      summary: Update watchlist item
      operationId: updateWatchlistItem
      tags: [Watchlist]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                symbol:
                  type: string
                  nullable: true
                asset_class:
                  type: string
                  enum: [stock, etf, crypto, metals]
                target_price:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 999999999999
                currency:
                  type: string
                  pattern: '^\s*[A-Za-z]{3}\s*$'
                  description: Three-letter ISO currency code; normalized to uppercase and cannot be cleared.
                notes:
                  type: string
                  nullable: true
                price_provider_id:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          description: Malformed watchlist field, including an explicit null or empty currency
    delete:
      summary: Remove from watchlist
      operationId: deleteWatchlistItem
      tags: [Watchlist]
      responses:
        "204":
          description: No Content

  # ─── Splits ───────────────────────────────────────────────────────────────────
  /api/splits/owed:
    get:
      summary: List split amounts owed per recipient
      operationId: getSplitsOwed
      tags: [Splits]
      parameters:
        - $ref: "#/components/parameters/OptionalLimit"
        - $ref: "#/components/parameters/OptionalOffset"
      responses:
        "200":
          description: Owed summary per recipient (complete unless limit/offset are supplied)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/OptionalPaginationFields"
                          - type: object
                            required: [items]
                            properties:
                              items:
                                type: array
                                items:
                                  $ref: "#/components/schemas/SplitOwed"

  /api/splits/owed/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    get:
      summary: Get owed detail for recipient
      operationId: getSplitOwedByRecipient
      tags: [Splits]
      parameters:
        - $ref: "#/components/parameters/OptionalLimit"
        - $ref: "#/components/parameters/OptionalOffset"
      responses:
        "200":
          description: Owed detail (complete unless limit/offset are supplied)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/OptionalPaginationFields"
                          - type: object
                            required: [items]
                            properties:
                              items:
                                type: array
                                items:
                                  $ref: "#/components/schemas/SplitOwedDetail"

  /api/splits/owed/{id}/export/csv:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    get:
      summary: Export owed splits as CSV
      operationId: exportSplitsOwedCsv
      tags: [Splits]
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

  /api/splits/transaction/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    get:
      summary: Get splits for a transaction
      operationId: getSplitsByTransaction
      tags: [Splits]
      parameters:
        - $ref: "#/components/parameters/OptionalLimit"
        - $ref: "#/components/parameters/OptionalOffset"
      responses:
        "200":
          description: Split list (complete unless limit/offset are supplied)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SplitList"

  /api/splits:
    post:
      summary: Create a split
      operationId: createSplit
      tags: [Splits]
      requestBody:
        required: true
        content:
          application/json:
            # Flat single-split body (routes/splits.js createSplitSchema) — the
            # nested description/shares[] shape described a split model the
            # backend has never implemented.
            schema:
              type: object
              required: [transaction_id, recipient_id, amount]
              properties:
                transaction_id:
                  type: integer
                recipient_id:
                  type: integer
                amount:
                  type: number
                note:
                  type: string
                  nullable: true
      responses:
        "201":
          description: Created split
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Split"

  /api/splits/batch:
    post:
      summary: Create multiple splits in one request
      operationId: createSplitBatch
      tags: [Splits]
      requestBody:
        required: true
        content:
          application/json:
            # routes/splits.js batchSplitsSchema + batchSplitRowSchema: one
            # parent transaction, one row per recipient share. An empty splits[]
            # or any malformed row rejects the whole request (all-or-nothing).
            schema:
              type: object
              required: [transaction_id, splits]
              properties:
                transaction_id:
                  type: integer
                splits:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [recipient_id, amount]
                    properties:
                      recipient_id:
                        type: integer
                      amount:
                        type: number
                      note:
                        type: string
                        nullable: true
      responses:
        "201":
          description: Created splits
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SplitList"

  /api/splits/bulk:
    post:
      summary: Give one payee a preset share of many transactions (bulk split)
      operationId: createBulkSplits
      tags: [Splits]
      requestBody:
        required: true
        content:
          application/json:
            # routes/splits.ts bulkSplitSchema: ids reuse validateId (a
            # malformed id rejects the whole request), the array cap mirrors
            # transactions/bulk-tag. The share per transaction is computed
            # server-side (lib/calculations/splits.ts computeBulkSplitAmount):
            # equal = half of the absolute amount, full = the whole amount.
            schema:
              type: object
              required: [transaction_ids, recipient_id, mode]
              properties:
                transaction_ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: integer
                recipient_id:
                  type: integer
                mode:
                  type: string
                  enum: [equal, full]
                  description: >-
                    `equal` — the payee owes half of each transaction (50/50).
                    `full` — the payee owes the whole amount (0/100).
                note:
                  type: string
                  maxLength: 500
      responses:
        "201":
          description: >-
            Created splits plus skip counts. The write is atomic; rows the
            preset cannot apply to are skipped and counted, not failed: ids
            that no longer exist, transactions that already carry a split, and
            zero-amount transactions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BulkSplitResult"
        "400":
          description: Validation error (empty or malformed ids, unknown mode)
        "404":
          description: Recipient not found
        "429":
          description: Rate limited (30 requests per minute)

