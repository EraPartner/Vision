      required: [enabled, available, mappingKeyConfigured, openAiEnabled]
      properties:
        enabled:
          { type: boolean, description: Effective Desktop preference and mode }
        available:
          { type: boolean, description: Fresh bounded loopback detection probe }
        mappingKeyConfigured:
          {
            type: boolean,
            description: Valid local reference mapping key exists,
          }
        openAiEnabled:
          {
            type: boolean,
            description: Effective OpenAI API route availability,
          }

    ErrorPayload:
      type: object
      required: [message]
      properties:
        message:
          type: string
        code:
          type: string
        status:
          type: integer

    # GET /api/info/exchange-rates (routes/info/rates.ts)
    ExchangeRate:
      type: object
      required: [currency, rate_to_eur, rate_date, fetched_at]
      properties:
        currency: { type: string, description: ISO 4217 currency code }
        rate_to_eur: { type: number, description: The value of one unit in EUR }
        rate_date: { type: string, format: date }
        fetched_at: { type: string, format: date-time }
    ExchangeRates:
      type: object
      required:
        [total_rates, rates, fallback_rates, source, is_stale, last_fetched_at]
      properties:
        total_rates: { type: integer, minimum: 0 }
        rates:
          type: array
          items: { $ref: "#/components/schemas/ExchangeRate" }
        fallback_rates:
          type: object
          description: Built-in rates to EUR by currency code, used when no stored rate exists
          additionalProperties: { type: number }
        source: { type: string, enum: [database, fallback] }
        is_stale:
          { type: boolean, description: The stored rate date is before today }
        last_fetched_at: { type: string, format: date-time, nullable: true }
    InfoMessage:
      type: object
      required: [message]
      properties:
        message: { type: string }

    # GET /api/admin/database/stats (routes/admin.ts, DbStatsSchema)
    DbTableStat:
      type: object
      required:
        [
          schemaname,
          table_name,
          live_rows,
          dead_rows,
          last_autovacuum,
          last_autoanalyze,
          size,
          size_bytes,
        ]
      properties:
        schemaname: { type: string }
        table_name: { type: string }
        live_rows:
          {
            type: string,
            description: "BIGINT estimate from pg_stat_user_tables, as decimal text",
          }
        dead_rows:
          {
            type: string,
            description: "BIGINT estimate from pg_stat_user_tables, as decimal text",
          }
        last_autovacuum: { type: string, nullable: true }
        last_autoanalyze: { type: string, nullable: true }
        size:
          {
            type: string,
            description: pg_size_pretty of the total relation size,
          }
        size_bytes:
          { type: string, description: "BIGINT byte count, as decimal text" }
    DbStats:
      type: object
      required: [tables, db_size]
      properties:
        tables:
          type: array
          items: { $ref: "#/components/schemas/DbTableStat" }
        db_size:
          {
            type: string,
            nullable: true,
            description: pg_size_pretty of the database size,
          }
    # POST /api/admin/database/vacuum (routes/admin.ts)
    DbVacuumResult:
      type: object
      required: [vacuumed]
      properties:
        vacuumed:
          {
            type: string,
            description: "The vacuumed table, or `all` for every table",
          }
    # /api/admin/database/tables/* (services/dbEditor.ts, packages/types/src/contracts/admin.ts, ADR-101)
    DbEditorColumn:
      type: object
      required:
        [name, dataType, udtName, nullable, hasDefault, generated, writable]
      properties:
        name: { type: string }
        dataType: { type: string, description: information_schema data_type }
        udtName: { type: string, description: information_schema udt_name }
        nullable: { type: boolean }
        hasDefault: { type: boolean }
        generated: { type: boolean }
        writable:
          {
            type: boolean,
            description: "False for generated and identity-always columns",
          }
    DbEditorTableSchema:
      type: object
      required: [table, columns, primaryKey]
      properties:
        table: { type: string }
        columns:
          type: array
          items: { $ref: "#/components/schemas/DbEditorColumn" }
        primaryKey:
          type: array
          items: { type: string }
    DbEditorRows:
      allOf:
        - $ref: "#/components/schemas/DbEditorTableSchema"
        - type: object
          required: [rows, limit, hasMore, nextCursor]
          properties:
            rows:
              type: array
              description: The page's rows by column name; each row also carries its `__xmin` row version as text.
              items: { type: object, additionalProperties: {} }
            total:
              type: integer
              description: Exact total only when the first page is shorter than the requested limit.
            limit: { type: integer }
            hasMore: { type: boolean }
            nextCursor:
              {
                type: string,
                nullable: true,
                description: "Opaque cursor of the next page, null on the last page",
              }
    DbEditorStatement:
      type: object
      required: [op, preview]
      properties:
        op: { type: string }
        preview:
          {
            type: string,
            description: The SQL statement with its parameters rendered as literals,
          }
    DbEditorMutationResult:
      type: object
      description: "A dry run returns `count` and `statements`; a commit returns `applied`, `results` and `refreshScheduled`."
      required: [dryRun]
      properties:
        dryRun: { type: boolean }
        count: { type: integer, description: Dry run only }
        statements:
          type: array
          description: Dry run only
          items: { $ref: "#/components/schemas/DbEditorStatement" }
        applied: { type: integer, description: Commit only }
        results:
          type: array
          description: Commit only
          items:
            type: object
            required: [op]
            properties:
              op: { type: string }
              after:
                type: object
                additionalProperties: {}
                description: The written row; absent for a delete
        refreshScheduled:
          {
            type: boolean,
            description: "Commit only; true when the dashboard materialized views refresh",
          }
    # /api/admin/providers/* (services/providerHealthService.ts, ProviderHealthSchema)
    ProviderHealth:
      type: object
      required:
        [
          provider,
          kind,
          label,
          last_success_at,
          last_error_at,
          last_error,
          consecutive_failures,
          updated_at,
        ]
      properties:
        provider: { type: string }
        kind:
          {
            type: string,
            description: "The provider kind: price, fx, inflation or research",
          }
        label: { type: string }
        last_success_at: { type: string, format: date-time, nullable: true }
        last_error_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string, nullable: true }
        consecutive_failures: { type: integer, minimum: 0 }
        updated_at: { type: string, format: date-time, nullable: true }
    ProviderHealthList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProviderHealth" }
        total: { type: integer, minimum: 0 }
    ProbeResult:
      type: object
      required: [ok, provider]
      properties:
        ok: { type: boolean }
        provider: { $ref: "#/components/schemas/ProviderHealth" }
        error:
          {
            type: string,
            description: "The probe error, only when ok is false",
          }
    # GET /api/admin/metrics/requests (middleware/requestMetrics.ts, RouteMetricSchema)
    RouteMetric:
      type: object
      required:
        [
          route,
          method,
          path,
          count,
          errors,
          error_rate,
          p50_ms,
          p95_ms,
          window_minutes,
        ]
      properties:
        route: { type: string, description: "METHOD:path" }
        method: { type: string }
        path: { type: string }
        count: { type: integer, minimum: 0 }
        errors: { type: integer, minimum: 0 }
        error_rate: { type: number, description: "errors / count, from 0 to 1" }
        p50_ms: { type: number, nullable: true }
        p95_ms: { type: number, nullable: true }
        window_minutes: { type: number }
    RouteMetricList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RouteMetric" }
        total: { type: integer, minimum: 0 }
    # GET /api/admin/endpoints (getRouteManifest)
    EndpointEntry:
      type: object
      required: [method, path]
      properties:
        method: { type: string }
        path: { type: string }
    EndpointList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/EndpointEntry" }
        total: { type: integer, minimum: 0 }

    ResearchDossierSource:
      type: object
      additionalProperties: false
      required: [title, reference]
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        reference: { type: string, minLength: 1, maxLength: 2000 }
        sourceDate: { type: string, format: date, nullable: true }
        accessedAt: { type: string, format: date-time, nullable: true }
        documentId: { type: string, format: uuid }
        documentVersion: { type: integer, minimum: 1 }
        passageOrdinal: { type: integer, minimum: 0 }
        contentSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
      description: >
        Citation snapshot. Document metadata is optional, but requires documentId when present;
        the server pins document version and digest on save. The snapshot remains after source deletion.

    ResearchDossierEvidence:
      type: object
      additionalProperties: false
      required: [stance, origin, claim, source]
      properties:
        id: { type: string, format: uuid }
        stance: { type: string, enum: [support, oppose, context] }
        origin: { type: string, enum: [user, ai-draft] }
        claim: { type: string, minLength: 1, maxLength: 8000 }
        source: { $ref: "#/components/schemas/ResearchDossierSource" }
        notes: { type: string, maxLength: 8000 }

    ResearchDossierLinks:
      type: object
      additionalProperties: false
      required: [categoryIds, investmentIds, savedAnalysisIds]
      properties:
        categoryIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: integer, minimum: 1 }
        investmentIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: integer, minimum: 1 }
        savedAnalysisIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 100 }
      description: Current live links only; deleted targets appear in linkDetails instead.

    ResearchDossierContent:
      type: object
      required: [title, workspace, question]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        workspace:
          type: string
          enum: [budgeting, portfolio, research, cross-workspace]
        question: { type: string, minLength: 1, maxLength: 8000 }
        userThesis: { type: string, maxLength: 16000, default: "" }
        assumptions:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 2000 }
        openQuestions:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 2000 }
        conclusion: { type: string, maxLength: 16000, default: "" }
        reviewDate: { type: string, format: date, nullable: true }
        evidence:
          type: array
          maxItems: 30
          items: { $ref: "#/components/schemas/ResearchDossierEvidence" }
        links: { $ref: "#/components/schemas/ResearchDossierLinks" }
      description: >
        User-authored research record. Optional arrays, strings and links receive empty defaults;
        evidence id may be omitted on input and is generated on save. The server rejects unknown
        request properties; this reusable content schema also describes version snapshots.

    ResearchDossier:
      allOf:
        - $ref: "#/components/schemas/ResearchDossierContent"
        - type: object
          required: [id, version, linkDetails, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer, minimum: 1 }
            linkDetails:
              type: array
              items:
                type: object
                required: [kind, historicalId, labelSnapshot, status]
                properties:
                  kind:
                    {
                      type: string,
                      enum: [category, investment, saved-analysis],
                    }
                  historicalId: { type: string }
                  labelSnapshot: { type: string }
                  liveId:
                    nullable: true
                    oneOf:
                      - { type: integer, minimum: 1 }
                      - { type: string }
                    description: Integer for category/investment, string for saved analysis; null after deletion.
                  status: { type: string, enum: [live, deleted] }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    ResearchDossierSummary:
      type: object
      required:
        [
          id,
          title,
          workspace,
          version,
          question,
          reviewDate,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        workspace:
          type: string
          enum: [budgeting, portfolio, research, cross-workspace]
        version: { type: integer, minimum: 1 }
        question: { type: string }
        reviewDate: { type: string, format: date, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ResearchDossierVersion:
      type: object
      required: [version, snapshot, createdAt]
      properties:
        version: { type: integer, minimum: 1 }
        snapshot: { $ref: "#/components/schemas/ResearchDossierContent" }
        createdAt: { type: string, format: date-time }

    ResearchDossierExport:
      type: object
      required: [schemaVersion, exportedAt, dossiers]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        exportedAt: { type: string, format: date-time }
        dossiers:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/ResearchDossier"
              - type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items:
                      { $ref: "#/components/schemas/ResearchDossierVersion" }

    ResearchDossierEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/ResearchDossier" }

    ResearchDossierListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              required: [items, total, limit, offset]
              properties:
                items:
                  type: array
                  items: { $ref: "#/components/schemas/ResearchDossierSummary" }
                total: { type: integer, minimum: 0 }
                limit: { type: integer, minimum: 1, maximum: 500 }
                offset: { type: integer, minimum: 0 }

    ResearchDossierVersionsEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: "#/components/schemas/ResearchDossierVersion" }

    ResearchDossierExportEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/ResearchDossierExport" }

    AnalysisMonitorCreate:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, title, savedAnalysisId, fieldId, operator, threshold]
          properties:
            kind: { type: string, enum: [analysis-threshold] }
            title: { type: string, minLength: 1, maxLength: 200 }
            savedAnalysisId: { type: string, format: uuid }
            fieldId: { type: string, minLength: 1, maxLength: 100 }
            operator: { type: string, enum: [above, below] }
            threshold:
              type: string
              maxLength: 100
              pattern: '^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
              description: Exact decimal string; never a JSON number.
            intervalMinutes:
              { type: integer, minimum: 15, maximum: 10080, default: 1440 }
            cooldownMinutes:
              { type: integer, minimum: 0, maximum: 10080, default: 1440 }
        - type: object
          additionalProperties: false
          required: [kind, title, dossierId]
          properties:
            kind: { type: string, enum: [dossier-evidence] }
            title: { type: string, minLength: 1, maxLength: 200 }
            dossierId: { type: string, format: uuid }
            intervalMinutes:
              { type: integer, minimum: 15, maximum: 10080, default: 1440 }
            cooldownMinutes:
              { type: integer, minimum: 0, maximum: 10080, default: 1440 }

    AnalysisMonitorUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        enabled: { type: boolean }
        fieldId: { type: string, minLength: 1, maxLength: 100 }
        operator: { type: string, enum: [above, below] }
        threshold:
          type: string
          maxLength: 100
          pattern: '^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
        intervalMinutes: { type: integer, minimum: 15, maximum: 10080 }
        cooldownMinutes: { type: integer, minimum: 0, maximum: 10080 }
      description: Numeric condition fields are valid only for analysis-threshold monitors.

    AnalysisMonitorObservation:
      type: object
      required: [id, monitorId, status, coverage, reasonCode, reason, checkedAt]
      properties:
        id: { type: string, format: uuid }
        monitorId: { type: string, format: uuid }
        status:
          type: string
          enum:
            [
              baseline,
              unchanged,
              triggered,
              cooldown-pending,
              partial,
              stale,
              failed,
            ]
        previousValue: { type: string, nullable: true }
        currentValue: { type: string, nullable: true }
        previousEvidenceVersion: { type: integer, nullable: true }
        currentEvidenceVersion: { type: integer, nullable: true }
        analysisDefinitionVersion: { type: integer, nullable: true }
        analysisRunId: { type: string, nullable: true }
        historicalAnalysisRunId: { type: string, nullable: true }
        analysisRunStatus: { type: string, nullable: true }
        analysisWindow:
          { type: object, nullable: true, additionalProperties: true }
        coverage:
          type: object
          required: [status, reason]
          properties:
            status: { type: string, enum: [unknown] }
            reason: { type: string }
        reasonCode: { type: string }
        reason: { type: string }
        checkedAt: { type: string, format: date-time }

    AnalysisMonitor:
      type: object
      required:
        [
          id,
          kind,
          title,
          enabled,
          historicalTargetId,
          targetLabel,
          targetAvailable,
          intervalMinutes,
          cooldownMinutes,
          nextDueAt,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [analysis-threshold, dossier-evidence] }
        title: { type: string }
        enabled: { type: boolean }
        savedAnalysisId: { type: string, nullable: true }
        dossierId: { type: string, format: uuid, nullable: true }
        historicalTargetId: { type: string }
        targetLabel: { type: string }
        targetAvailable: { type: boolean }
        fieldId: { type: string, nullable: true }
        operator: { type: string, enum: [above, below], nullable: true }
        threshold: { type: string, nullable: true }
        intervalMinutes: { type: integer, minimum: 15, maximum: 10080 }
        cooldownMinutes: { type: integer, minimum: 0, maximum: 10080 }
        nextDueAt: { type: string, format: date-time }
        lastCheckedAt: { type: string, format: date-time, nullable: true }
        lastStatus: { type: string, nullable: true }
        lastObservation:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AnalysisMonitorObservation"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AnalysisMonitorNotification:
      type: object
      required:
        [
          id,
          monitorId,
          observationId,
          kind,
          title,
          reasonCode,
          reason,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        monitorId: { type: string, format: uuid }
        observationId: { type: string, format: uuid }
        kind: { type: string, enum: [analysis-threshold, dossier-evidence] }
        title: { type: string }
        reasonCode: { type: string }
        reason: { type: string }
        previousValue: { type: string, nullable: true }
        currentValue: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time, nullable: true }

    AnalysisMonitorEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/AnalysisMonitor" }
    AnalysisMonitorObservationEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/AnalysisMonitorObservation" }
    AnalysisMonitorNotificationEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/AnalysisMonitorNotification" }
    AnalysisMonitorListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              required: [items, total, limit, offset]
              properties:
                items:
                  type: array
                  items: { $ref: "#/components/schemas/AnalysisMonitor" }
                total: { type: integer, minimum: 0 }
                limit: { type: integer, minimum: 1, maximum: 200 }
                offset: { type: integer, minimum: 0, maximum: 1000000 }
    AnalysisMonitorObservationListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              required: [items, total, limit, offset]
              properties:
                items:
                  type: array
                  items:
                    { $ref: "#/components/schemas/AnalysisMonitorObservation" }
                total: { type: integer, minimum: 0 }
                limit: { type: integer, minimum: 1, maximum: 200 }
                offset: { type: integer, minimum: 0, maximum: 1000000 }
    AnalysisMonitorNotificationListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              required: [items, total, unreadCount, limit, offset]
              properties:
                items:
                  type: array
                  items:
                    { $ref: "#/components/schemas/AnalysisMonitorNotification" }
                total: { type: integer, minimum: 0 }
                unreadCount: { type: integer, minimum: 0 }
                limit: { type: integer, minimum: 1, maximum: 200 }
                offset: { type: integer, minimum: 0, maximum: 1000000 }

    AnalysisInterchangeValue:
      nullable: true
      oneOf:
        - { type: string }
        - { type: number, format: double }
        - { type: boolean }
      description: Values as returned. PostgreSQL decimal and unsafe-integer strings remain strings; numeric workbook cells retain the existing parser conversion.
    AnalysisInterchangeColumn:
      type: object
      required: [id, label, type]
      properties:
        id: { type: string }
        label: { type: string }
        type:
          type: string
          enum: [string, integer, decimal, boolean, date]
    AnalysisInterchangeAttachment:
      type: object
      required: [id, fileName, importedAt, sha256, columns, rows]
      properties:
        id: { type: string }
        fileName: { type: string }
        importedAt: { type: string, format: date-time }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        columns:
          type: array
          maxItems: 32
          items: { $ref: "#/components/schemas/AnalysisInterchangeColumn" }
        rows:
          type: array
          maxItems: 1000
          items:
            type: object
            additionalProperties:
              { $ref: "#/components/schemas/AnalysisInterchangeValue" }
    AnalysisInterchangeImport:
      type: object
      required: [format, attachment, formulaCells]
      properties:
        format: { type: string, enum: [csv, xlsx] }
        attachment:
          { $ref: "#/components/schemas/AnalysisInterchangeAttachment" }
        formulaCells: { type: integer, minimum: 0 }
      description: Read-only inferred scenario attachment. CSV uses a stable decoded-text SHA-derived identifier; XLSX uses a fresh workbook identifier and byte digest. Workbook formula cells are counted and become null, never executed. Units are unavailable after import.
    AnalysisInterchangeExportPayload:
      type: object
      required: [result, context]
      description: UTF-8 JSON submitted as the multipart file. Preserve the captured result and context exactly. No query execution or recomputation occurs; unchanged-input/export availability checks remain caller-owned.
      properties:
        result:
          type: object
          additionalProperties: true
          required: [requestId, completedAt, rows, columns, window]
          properties:
            requestId: { type: string }
            startedAt: { type: string }
            completedAt: { type: string }
            executor: { type: string }
            columns:
              type: array
              items:
                type: object
                required: [id, type]
                additionalProperties: true
                properties:
                  id: { type: string }
                  type: { type: string }
            declaredColumns:
              type: array
              items:
                type: object
                required: [id, type]
                additionalProperties: true
                properties:
                  id: { type: string }
                  type: { type: string }
                  label: { type: string }
            rows:
              type: array
              items:
                type: object
                additionalProperties: {}
              description: Original Analysis cells, including JSON/array columns, as returned; no currency conversion.
            window: { type: object, additionalProperties: true }
            complete: { type: boolean }
            coverage: {}
            transformationCoverage: {}
            preparationLineage: {}
            transformationErrors: {}
            formulaErrors: {}
            formulaSummaries:
              type: object
              additionalProperties:
                { $ref: "#/components/schemas/AnalysisInterchangeValue" }
        context:
          type: object
          additionalProperties: true
          required: [name, timezone, workspace]
          properties:
            name: { type: string }
            timezone: { type: string }
            workspace: { type: string }
            definitionId: { type: string }
            definitionVersion: { type: integer }
            datasetIds: { type: array, items: { type: string } }
            sourceReferences: { type: array, items: { type: string } }
            assumptions: {}
            formulas: {}

    AnalysisVisualFilter:
      type: object
      required: [fieldId, operator]
      properties:
        fieldId: { type: string }
        operator: { type: string }
        value:
          nullable: true
          oneOf:
            - type: string
            - type: number
            - type: boolean

    AnalysisVisualPlan:
      type: object
      description: Visual analysis plan. The route checks these field types; the catalog compiler owns semantic validation. Unknown keys are kept. A null option means the same as leaving it out.
      required: [datasetId]
      additionalProperties: true
      properties:
        datasetId: { type: string }
        fields: { type: array, items: { type: string } }
        groups: { type: array, items: { type: string } }
        measures: { type: array, items: { type: string } }
        joins: { type: array, items: { type: string } }
        filters:
          type: array
          items: { $ref: "#/components/schemas/AnalysisVisualFilter" }
        orderBy:
          type: array
          items:
            type: object
            required: [id, direction]
            properties:
              id: { type: string }
              direction: { type: string, enum: [asc, desc] }
        limit: { type: number, nullable: true }
        reportingCurrency: { type: string, nullable: true }
        from: { type: string, nullable: true }
        to: { type: string, nullable: true }
        symbol: { type: string, nullable: true }
        range: { type: string, nullable: true }
        costBasisMethod: { type: string, nullable: true }
        generatedSql: { type: string }

    AnalysisColumnRef:
      type: object
      required: [id]
      additionalProperties: true
      properties:
        id: { type: string }

    AnalysisWorkbenchInput:
      type: object
      additionalProperties: true
      properties:
        steps:
          { type: array, items: { type: object, additionalProperties: true } }
        time: { type: object, additionalProperties: true }

    AnalysisQuerySpec:
      oneOf:
        - type: object
          required: [mode, plan]
          properties:
            mode: { type: string, enum: [visual] }
            plan: { $ref: "#/components/schemas/AnalysisVisualPlan" }
        - type: object
          required: [mode, sql, datasetIds]
          properties:
            mode: { type: string, enum: [sql] }
            sql: { type: string }
            datasetIds: { type: array, items: { type: string } }
            columns:
              type: array
              items: { $ref: "#/components/schemas/AnalysisColumnRef" }
            visualOrigin: { $ref: "#/components/schemas/AnalysisVisualPlan" }

    AnalysisSavedFields:
      type: object
      properties:
        name: { type: string }
        workspace:
          type: string
          enum: [budgeting, portfolio, research, cross-workspace]
        querySpec: { $ref: "#/components/schemas/AnalysisQuerySpec" }
        parameters: { type: object, additionalProperties: true }
        charts: { type: array, items: {} }
        sourceReferences: { type: array, items: {} }
        refreshMode: { type: string, enum: [live, frozen] }
        formulas:
          { type: array, items: { type: object, additionalProperties: true } }
        assumptions:
          { type: array, items: { type: object, additionalProperties: true } }
        assumptionValues: { type: object, additionalProperties: true }

    AiAnalysisEditProposal:
      type: object
      additionalProperties: false
      required:
        [schemaVersion, savedAnalysisId, baseVersion, rationale, operations]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        savedAnalysisId: { type: string, minLength: 1 }
        baseVersion: { type: integer, minimum: 1 }
        rationale: { type: string, minLength: 1, maxLength: 2000 }
        operations:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: object
            additionalProperties: false
            required: [op, path]
            properties:
              op: { type: string, enum: [add, replace, remove] }
              path:
                type: string
                pattern: "^/(name|parameters|charts|querySpec)(/.*)?$"
              value: {}

    AiInvestigationRequest:
      type: object
      additionalProperties: false
      required: [question, scope]
      properties:
        question: { type: string, minLength: 1, maxLength: 8000 }
        route: { type: string, enum: [local, openai-api], default: local }
        researchMode:
          type: string
          enum: [local-only, public-providers, public-web]
          default: local-only
        publicQuestion:
          type: string
          minLength: 1
          maxLength: 1000
          nullable: true
          description: Separately authored public-only cloud planning question; never derived from question.
        publicWebQuery:
          type: string
          minLength: 1
          maxLength: 300
          nullable: true
          description: Explicit public-only search text; never derived from question.
        publicSymbols:
          type: array
          maxItems: 3
          items: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,19}$" }
        publicMacroQueries:
          type: array
          maxItems: 3
          items: { type: string, minLength: 1, maxLength: 120 }
        clarification:
          { type: string, minLength: 1, maxLength: 1000, nullable: true }
        model:
          type: string
          minLength: 1
          maxLength: 200
          nullable: true
          description: OpenAI model selected from the server-configured allowlist, or the configured default when omitted.
        depth: { type: string, enum: [quick, detailed], default: quick }
        language: { type: string, enum: [en, nl], default: en }
        scope:
          type: object
          additionalProperties: false
          required: [workspaces]
          properties:
            workspaces:
              type: array
              minItems: 1
              maxItems: 4
              items:
                type: string
                enum: [budgeting, portfolio, research, cross-workspace]
            accountIds:
              type: array
              maxItems: 100
              items: { type: integer, minimum: 1 }
            investmentIds:
              type: array
              maxItems: 100
              items: { type: integer, minimum: 1 }
            dateFrom: { type: string, format: date, nullable: true }
            dateTo: { type: string, format: date, nullable: true }
            currency: { type: string, pattern: "^[A-Z]{3}$", default: EUR }
            constraints:
              type: array
              maxItems: 30
              items: { type: string, minLength: 1, maxLength: 500 }
        grantId: { type: string, format: uuid, nullable: true }
        selectedSummary: { type: string, maxLength: 8000, nullable: true }
        selectedEvidence:
          type: string
          maxLength: 24000
          nullable: true
          description: Exact manually selected task and evidence for consent-bound cloud final synthesis; never populated from local records by the server.
        referenceScopeId:
          type: string
          format: uuid
          nullable: true
          description: One-use local scope returned by disclosure preview for typed reversible references.
        savedAnalysisId: { type: string, format: uuid, nullable: true }

    UpdateCheck:
      type: object
      required: [up_to_date, current_version, latest_version, update_mode]
      properties:
        up_to_date: { type: boolean }
        current_version: { type: string }
        latest_version: { type: string, nullable: true }
        published_at: { type: string, format: date-time }
        release_notes: { type: string }
        html_url: { type: string, format: uri }
        update_mode:
          type: string
          enum: [source, native, dev]
        source_launcher_available: { type: boolean }
        error: { type: string }

    UpdateCheckEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/UpdateCheck" }

    CashForecastInsight:
      type: object
      required:
        [
          month,
          currency,
          monthEndNetCashflow,
          monthEndNetCashflowLow,
          monthEndNetCashflowHigh,
          movedSignificantly,
          prominence,
          methodId,
        ]
      properties:
        month: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
        currency: { type: string }
        monthEndNetCashflow:
          type: number
          description: Zero-based expected income minus outflows at month end; not an account balance.
        monthEndNetCashflowLow: { type: number, nullable: true }
        monthEndNetCashflowHigh: { type: number, nullable: true }
        movedSignificantly: { type: boolean }
        prominence: { type: string, enum: [alert, standing] }
        methodId: { type: string }

    InsightsDigestData:
      type: object
      required: [subscriptionCreep, categoryOutliers, cashForecast]
      properties:
        subscriptionCreep:
          type: object
          required: [new, priceChanges]
          properties:
            new:
              type: array
              items: { type: object, additionalProperties: true }
            priceChanges:
              type: array
              items: { type: object, additionalProperties: true }
        categoryOutliers:
          type: array
          items: { type: object, additionalProperties: true }
        cashForecast:
          allOf:
            - $ref: "#/components/schemas/CashForecastInsight"
          nullable: true

    InsightsDigestEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/InsightsDigestData" }

    InsightsCountData:
      type: object
      required: [count, status, computed_at]
      properties:
        count: { type: integer, nullable: true, minimum: 0 }
        status: { type: string, enum: [ready, pending, unavailable] }
        computed_at: { type: string, format: date-time, nullable: true }

    InsightsCountEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/InsightsCountData" }

    InsightDismissalRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, recipient_id]
          properties:
            kind:
              type: string
              enum: [subscription_new, subscription_price_change]
            recipient_id: { type: integer, minimum: 1 }
        - type: object
          additionalProperties: false
          required: [kind, category_id, month_key]
          properties:
            kind: { type: string, enum: [category_outlier] }
            category_id: { type: integer, minimum: 1 }
            month_key: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" }

    PortfolioSummaryItem:
      type: object
      required: [id, fullyAssigned, oversold, byAccount]
      additionalProperties: true
      properties:
        id: { type: integer, format: int32 }
        name: { type: string }
        symbol: { type: string, nullable: true }
        asset_class: { type: string }
        assetClass: { type: string }
        currency: { type: string }
        originalCurrency: { type: string }
        summarySource: { type: string }
        is_active: { type: boolean }
        usedFallbackRate: { type: boolean }
        gainLossPercent: { type: number }
        interestRate: { type: number }
        transactionCount:
          {
            type: integer,
            description: Ordinary history count on archivedPresentation; at most 1000 as in the existing web archive.,
          }
        currentPrice: { type: number }
        currentValue: { type: number }
        totalInvested: { type: number }
        totalBuyCost: { type: number }
        totalSellProceeds: { type: number }
        totalFees: { type: number }
        totalTaxes: { type: number }
        totalDividends: { type: number }
        totalIncome: { type: number }
        avgCostBasis: { type: number }
        realizedGain: { type: number }
        unrealizedGain: { type: number }
        totalGain: { type: number }
        gainLoss: { type: number }
        assetGain: { type: number }
        fxGain: { type: number }
        nativeCurrentValue: { type: number }
        accruedInterest: { type: number }
        projectedAnnualInterest: { type: number }
        totalAppreciation: { type: number }
        nativeCurrentPrice: { type: number }
        nativeAvgCostBasis: { type: number }
        unrealizedGainPercent: { type: number }
        estimatedMonthlyRent:
          type: number
          description: Latest ordinary rent amount in its booking currency, without FX conversion. The Real Estate page reads monthlyRent instead.
        monthlyRent:
          type: number
          nullable: true
          description: Latest rent_income amount (by date, then id) converted from its booking currency to the response currency at the latest stored rate (fallback constants fill currencies without a stored rate). 0 without rent; null when no rate exists.
        feesAndTaxes:
          type: number
          description: totalFees + totalTaxes, from the rounded fields.
        propertyReturn:
          type: number
          description: Real Estate return shown per property, totalAppreciation + totalIncome − totalFees − totalTaxes, from the rounded fields.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        totalUnits:
          type: number
          description: Current units including custody fees and unit adjustments, rounded to eight decimal places.
        totalInKindIncome:
          type: number
          description: Literal income already represented by acquired units, converted to the response currency. Separate from ordinary totalDividends/totalIncome and never added to gain again. Absence in an older response means zero.
        fullyAssigned:
          type: boolean
          description: False while any unit transaction remains unassigned to a broker account.
        oversold:
          type: boolean
          description: True when at least one assigned broker partition sold more units than its lots provide.
        byAccount:
          type: array
          description: Exact current holdings and profit/loss partitions for this investment.
          items: { $ref: "#/components/schemas/PortfolioSummaryByAccountItem" }

    PortfolioSummaryByAccountItem:
      type: object
      required:
        [
          account_id,
          assignment,
          contribution_kind,
          oversold,
          currentValue,
          totalInvested,
          realizedGain,
          unrealizedGain,
          gainLoss,
        ]
      properties:
        account_id: { type: integer, format: int32, nullable: true }
        assignment:
          type: string
          enum: [account, unassigned]
          description: Stable machine-readable identity for accountless contributions.
        contribution_kind:
          type: string
          enum: [position, non_position]
          description: Lot-bearing position result or standalone income/adjustment partition.
        oversold: { type: boolean }
        currentValue: { type: number }
        totalInvested: { type: number }
        realizedGain: { type: number }
        unrealizedGain: { type: number }
        gainLoss: { type: number }

    PortfolioHoldingTotals:
      type: object
      description: >-
        Totals of a set of holdings, each the exact sum of the rounded
        per-investment figures in `summaries`, in the response currency.
      required:
        [
          holdingCount,
          totalPortfolioValue,
          totalInvested,
          totalGainLoss,
          totalRealizedGain,
          totalUnrealizedGain,
          totalIncome,
          totalDividends,
          totalInKindIncome,
          totalFees,
          totalTaxes,
          totalFeesAndTaxes,
          netReturnExcludingIncome,
          netReturnWithDividends,
          totalAppreciation,
          totalPropertyReturn,
          totalAccruedInterest,
          totalProjectedAnnualInterest,
          valueWeightedInterestRate,
          estimatedMonthlyRent,
          monthlyRentRateMissing,
          usedFallbackRate,
        ]
      properties:
        holdingCount: { type: integer, minimum: 0 }
        totalPortfolioValue: { type: number, description: Σ currentValue. }
        totalInvested: { type: number, description: Σ totalBuyCost, as totals.totalInvested. }
        totalGainLoss: { type: number }
        totalRealizedGain: { type: number }
        totalUnrealizedGain: { type: number }
        totalIncome: { type: number }
        totalDividends: { type: number }
        totalInKindIncome: { type: number }
        totalFees: { type: number }
        totalTaxes: { type: number }
        totalFeesAndTaxes: { type: number, description: Σ feesAndTaxes. }
        netReturnExcludingIncome: { type: number, description: Σ (gainLoss − totalIncome). }
        netReturnWithDividends: { type: number, description: Σ (gainLoss − totalIncome + totalDividends). }
        totalAppreciation: { type: number }
        totalPropertyReturn: { type: number, description: Σ propertyReturn. }
        totalAccruedInterest: { type: number }
        totalProjectedAnnualInterest: { type: number }
        valueWeightedInterestRate:
          type: number
          description: Σ (interestRate × currentValue) / Σ currentValue, in percent; 0 without value.
        estimatedMonthlyRent: { type: number, description: Σ monthlyRent of the holdings that have a rate. }
        monthlyRentRateMissing: { type: boolean, description: Some holding's monthlyRent is null. }
        usedFallbackRate: { type: boolean }

    PortfolioAssetClassTotals:
      allOf:
        - type: object
          required: [assetClass]
          properties:
            assetClass: { type: string }
        - $ref: "#/components/schemas/PortfolioHoldingTotals"

    PortfolioAssetGroupTotals:
      allOf:
        - type: object
          required: [group, assetClasses]
          properties:
            group:
              type: string
              enum: [stocks_etfs, crypto, metals, real_estate, savings_bonds]
            assetClasses:
              type: array
              items: { type: string }
        - $ref: "#/components/schemas/PortfolioHoldingTotals"

    PortfolioSummaryTotals:
      type: object
      required:
        [
          totalPortfolioValue,
          totalInvested,
          totalGainLoss,
          totalRealizedGain,
          totalUnrealizedGain,
          totalGain,
          totalIncome,
          totalDividends,
          totalInKindIncome,
          totalFees,
          totalTaxes,
          totalAssetGain,
          totalFxGain,
          totalReturnPct,
          usedFallbackRate,
        ]
      properties:
        totalPortfolioValue: { type: number }
        totalInvested: { type: number }
        totalGainLoss: { type: number }
        totalRealizedGain: { type: number }
        totalUnrealizedGain: { type: number }
        totalGain: { type: number }
        totalIncome: { type: number }
        totalDividends: { type: number }
        totalInKindIncome: { type: number }
        totalFees: { type: number }
        totalTaxes: { type: number }
        totalAssetGain: { type: number }
        totalFxGain: { type: number }
        totalReturnPct: { type: number }
        usedFallbackRate: { type: boolean }

    PortfolioSummaryData:
      type: object
      required:
        [currency, computed_at, totals, summaries, byAccount, byAssetClass, byAssetGroup]
      properties:
        currency: { type: string }
        computed_at: { type: string, format: date-time }
        firstInvestmentDate:
          type: string
          format: date
          description: Earliest ordinary transaction on active investments, independent of selected performance chart period and investment creation dates. Custody/adjustment event dates and inactive investments are excluded. Omitted when no qualifying transaction exists.
        totals:
          $ref: "#/components/schemas/PortfolioSummaryTotals"
        archivedPresentation:
          type: array
          description: Inactive-only presentation matching the web archive's ordinary CRUD replay and current quote FX. Supplied when active=false, separate from canonical dated-FX summaries/totals. In-kind income remains canonical dated data; broker byAccount remains a separate canonical snapshot.
          items: { $ref: "#/components/schemas/PortfolioSummaryItem" }
        summaries:
          type: array
          items: { $ref: "#/components/schemas/PortfolioSummaryItem" }
        byAccount:
          type: array
          items: { $ref: "#/components/schemas/PortfolioSummaryByAccountItem" }
        byAssetClass:
          type: array
          description: Totals per asset class present in `summaries` (archived holdings included when active=false), in canonical class order.
          items: { $ref: "#/components/schemas/PortfolioAssetClassTotals" }
        byAssetGroup:
          type: array
          description: Totals per asset page group (stocks_etfs, crypto, metals, real_estate, savings_bonds), always all five in that order, zero when empty.
          items: { $ref: "#/components/schemas/PortfolioAssetGroupTotals" }

        brokerageCashFees:
          type: object
          description: >-
            Imported, source-owned account fees without an instrument, converted at
            transaction-date rates and counted once per canonical cash transaction.
            Separate from investment totals, cost basis and return series. Optional
            for compatibility with older responses; absence means unavailable.
          required: [total, gainAfterFees, usedFallbackRate, byAccount]
          properties:
            total: { type: number, minimum: 0 }
            gainAfterFees:
              type: number
              description: totals.totalGainLoss minus this account fee subtotal.
            usedFallbackRate:
              type: boolean
              description: A missing historical fee rate required a current-rate fallback.
            byAccount:
              type: array
              items:
                type: object
                required: [account_id, total]
                properties:
                  account_id: { type: integer, minimum: 1 }
                  total: { type: number, minimum: 0 }

        archivedInKindIncome:
          type: array
          description: >-
            Separate archived holding income subtotals, converted from each literal income
            currency at its transaction date to the response currency. Always present on
            current responses, empty when none; optional for older-reader compatibility.
            Absence means unknown, not a current-rate conversion. Active totals and
            archived ordinary units, basis, gains and income remain unchanged.
          items:
            type: object
            required: [id, totalInKindIncome]
            properties:
              id: { type: integer, minimum: 1 }
              totalInKindIncome: { type: number }

    PortfolioSummaryEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/PortfolioSummaryData" }

