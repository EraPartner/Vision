    BelgianPortfolioTaxTotals:
      type: object
      description: Server-computed display totals. effectiveTaxRate is a percent; totalPIT is selected-year frozen-first. Historical realized/unrealized gains retain the web all-time holdings calculation.
      required:
        [
          totalTaxes,
          totalFees,
          totalTaxesAndFees,
          totalRecordedTaxes,
          totalRecordedFees,
          totalManualTaxes,
          totalManualFees,
          totalManualCosts,
          totalRealizedGain,
          totalUnrealizedGain,
          effectiveTaxRate,
          totalPIT,
          portfolioTaxesPlusPIT,
        ]
      properties:
        totalTaxes: { type: number, format: double }
        totalFees: { type: number, format: double }
        totalTaxesAndFees: { type: number, format: double }
        totalRecordedTaxes: { type: number, format: double }
        totalRecordedFees: { type: number, format: double }
        totalManualTaxes: { type: number, format: double }
        totalManualFees: { type: number, format: double }
        totalManualCosts: { type: number, format: double }
        totalRealizedGain: { type: number, format: double }
        totalUnrealizedGain: { type: number, format: double }
        effectiveTaxRate: { type: number, format: double }
        totalPIT: { type: number, format: double }
        portfolioTaxesPlusPIT: { type: number, format: double }

    BelgianPortfolioTaxCostEntry:
      type: object
      required: [nameKey, value]
      properties:
        nameKey: { type: string }
        value: { type: number, format: double }

    BelgianPortfolioTaxAssetCosts:
      type: object
      required: [assetClass, taxes, fees, total]
      properties:
        assetClass: { type: string }
        taxes: { type: number, format: double }
        fees: { type: number, format: double }
        total: { type: number, format: double }

    BelgianPortfolioTaxInvestmentCosts:
      type: object
      description: realizedGain and all cost amounts are already expressed in the response currency; assetClass is the untranslated localization suffix.
      required:
        [
          id,
          name,
          symbol,
          assetClass,
          recordedTaxes,
          recordedFees,
          manualTaxes,
          manualFees,
          taxes,
          fees,
          total,
          realizedGain,
          currency,
        ]
      properties:
        id: { type: integer }
        name: { type: string }
        symbol: { type: string, nullable: true }
        assetClass: { type: string }
        recordedTaxes: { type: number, format: double }
        recordedFees: { type: number, format: double }
        manualTaxes: { type: number, format: double }
        manualFees: { type: number, format: double }
        taxes: { type: number, format: double }
        fees: { type: number, format: double }
        total: { type: number, format: double }
        realizedGain: { type: number, format: double }
        currency: { type: string }

    BelgianPortfolioTaxMonthlyCosts:
      type: object
      description: YYYY-MM ordinary-transaction costs, including zero-cost months with transactions. Manual adjustments are excluded.
      required: [period, taxes, fees]
      properties:
        period: { type: string }
        taxes: { type: number, format: double }
        fees: { type: number, format: double }

    BelgianPortfolioTaxDividend:
      type: object
      description: Unknown ordinary dividend conventions leave gross base, reclaim, and net cost null. Included-in-units dividends are excluded; married reclaim uses a doubled exemption while dividendExemption is the single-taxpayer table value.
      required:
        [
          totalDividendIncome,
          dividendWhtRecorded,
          grossDividendWht,
          dividendExemption,
          grossDividendBase,
          dividendWhtReclaim,
          dividendWhtNetCost,
          unknownDividendConventionCount,
        ]
      properties:
        totalDividendIncome: { type: number, format: double }
        dividendWhtRecorded: { type: number, format: double }
        grossDividendWht: { type: number, format: double }
        dividendExemption: { type: number, format: double }
        grossDividendBase: { type: number, format: double, nullable: true }
        dividendWhtReclaim: { type: number, format: double, nullable: true }
