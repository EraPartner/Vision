  /api/settings:
    get:
      summary: Get all settings
      operationId: getSettings
      tags: [Settings]
      parameters:
        - in: query
          name: withBaselines
          schema:
            type: boolean
            default: false
          description: Return data as {settings, expected} maps from the same database read. Only the literal values `true` and `false` are accepted; any other value or a repeated key returns 400.
      responses:
        "200":
          description: All settings as key-value map
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: true
        "400":
          description: "VALIDATION_ERROR: withBaselines must be true or false"
    put:
      summary: Atomically replace settings with persisted baselines
      operationId: saveSettings
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings, expected]
              properties:
                settings:
                  type: object
                  additionalProperties: true
                expected:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/SettingBaseline"
      responses:
        "200":
          description: Number of settings saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          saved:
                            type: integer
        "400":
          description: Invalid settings or missing persisted baseline
        "409":
          description: A setting changed; the entire request is rolled back

  /api/settings/{key}:
    parameters:
      - in: path
        name: key
        required: true
        schema:
          type: string
    get:
      summary: Get single setting
      operationId: getSetting
      tags: [Settings]
      responses:
        "200":
          description: Setting value
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Setting"
    put:
      summary: Save setting
      operationId: saveSetting
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value, expected]
              properties:
                value: {}
                expected:
                  $ref: "#/components/schemas/SettingBaseline"
      responses:
        "200":
          description: Saved setting
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Setting"
        "400":
          description: Invalid value or missing persisted baseline
        "409":
          description: Setting changed; reload before saving
    delete:
      summary: Conditionally delete setting
      operationId: deleteSetting
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected]
              properties:
                expected:
                  $ref: "#/components/schemas/SettingBaseline"
      responses:
        "204":
          description: No Content
        "400":
          description: Missing or invalid persisted baseline
        "409":
          description: Setting changed or disappeared

  /api/investments:
    get:
      summary: List investments
      operationId: getInvestments
      tags: [Portfolio]
      parameters:
        - {
            in: query,
            name: asset_class,
            schema:
              {
                type: string,
                enum: [stock, etf, crypto, metals, real_estate, savings, bond],
              },
            description: Filter one exact asset class.,
          }
        - {
            in: query,
            name: active,
            schema: { type: boolean, default: true },
            description: true restricts to active investments; false returns active and inactive investments.,
          }
        - {
            in: query,
            name: limit,
            schema: { type: integer, default: 200, minimum: 1, maximum: 1000 },
            description: Lenient pagination parser defaults invalid limits and clamps at 1000.,
          }
        - {
            in: query,
            name: offset,
            schema: { type: integer, default: 0, minimum: 0 },
          }
      responses:
        "200":
          description: Investment list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/InvestmentList"
    post:
      summary: Create an investment
      operationId: createInvestment
      tags: [Portfolio]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestmentCreateRequest"
      responses:
        "201":
          description: Created investment
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Investment"
        "400":
          description: Missing required fields or malformed investment fields, including currency

  /api/info/net-worth:
    get:
      summary: Get net worth summary
      description: Holdings-only crypto_exchange and wallet accounts contribute portfolio value but no ledger cash to current totals, history, or the transaction-flow fallback. Ordinary brokerage cash remains eligible.
      operationId: getNetWorth
      tags: [Info]
      parameters:
        - in: query
          name: currency
          description: Target currency (3-letter code; `target_currency` is an alias). A malformed code falls back to EUR. A repeated key returns 400.
          schema:
            type: string
        - $ref: "#/components/parameters/OptionalLimit"
        - $ref: "#/components/parameters/OptionalOffset"
      responses:
        "400":
          description: "VALIDATION_ERROR: currency must be a single value"
        "200":
          description: >
            Net worth with history. `snapshots` holds every snapshot unless
            limit/offset are supplied, in which case it is a newest-first page
            and snapshotsTotal/snapshotsLimit/snapshotsOffset describe it.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/NetWorthResponse"

  /api/info/net-worth/by-account:
    get:
      summary: Get current net worth by account
      description: >-
        One row per account that counts toward net worth (its cash balance
        converted at the latest stored rate) and per account or unassigned
        bucket holding live portfolio positions. Holdings-only crypto_exchange
        and wallet accounts contribute holdings but no cash. Not cached.
      operationId: getNetWorthByAccount
      tags: [Info]
      parameters:
        - in: query
          name: currency
          description: Target currency (3-letter code; `target_currency` is an alias). A malformed code falls back to EUR. A repeated key returns 400.
          schema:
            type: string
      responses:
        "400":
          description: "VALIDATION_ERROR: currency must be a single value"
        "200":
          description: Net worth rows by account
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/NetWorthByAccountResponse"

  /api/saved-charts:
    get:
      summary: List saved charts
      operationId: getSavedCharts
      tags: [Charts]
      parameters:
        - $ref: "#/components/parameters/OptionalLimit"
        - $ref: "#/components/parameters/OptionalOffset"
      responses:
        "200":
          description: Saved chart list (complete unless limit/offset are supplied)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/OptionalPaginationFields"
                          - type: object
                            required: [items]
                            properties:
                              items:
                                type: array
                                items:
                                  $ref: "#/components/schemas/SavedChart"
    post:
      summary: Create saved chart
      operationId: createSavedChart
      tags: [Charts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
