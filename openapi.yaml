      responses:
        "200":
          description: "Stored mappings (canonical `{items, total}` body)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchMappingsEnvelope"
        "400":
          description: instrument_key required or invalid key_type
    post:
      summary: Persist user-confirmed cross-provider mappings (upsert per provider)
      operationId: researchSaveMappings
      tags: [Research]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instrument_key, mappings]
              properties:
                instrument_key:
                  type: string
                key_type:
                  type: string
                  enum: [isin, internal]
                  default: isin
                mappings:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [provider]
                    properties:
                      provider: { type: string, minLength: 1 }
                      providerSymbol: { type: string, nullable: true }
                      provider_symbol: { type: string, nullable: true }
                      resolvedName: { type: string, nullable: true }
                      resolved_name: { type: string, nullable: true }
                      exchange: { type: string, nullable: true }
                      currency: { type: string, nullable: true }
                      status: { type: string, nullable: true }
      responses:
        "200":
          description: Updated mapping set (canonical `{items, total}` body)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchMappingsEnvelope"
        "400":
          description: instrument_key required, mappings must be a non-empty array, or a mapping has no provider or a non-string field
  /api/research/mappings/resolve:
    post:
      summary: Auto-propose per-provider symbols for an instrument (does not persist)
      operationId: researchResolveMappings
      tags: [Research]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instrument_key, query]
              properties:
                instrument_key:
                  type: string
                key_type:
                  type: string
                  enum: [isin, internal]
                  default: isin
                asset_class:
                  type: string
                query:
                  type: string
                investment_id:
                  type: integer
                  description: >-
                    Optional held-investment id. When set, that holding's
                    already-configured provider (price_provider +
                    price_provider_id) is pre-seeded as a confirmed proposal
                    (fromHolding) and its live search is skipped.
      responses:
        "200":
          description: Per-provider proposals + existing mappings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchMappingResolveEnvelope"
        "400":
          description: instrument_key and query required
  /api/research/mappings/audit:
    post:
      summary: Cross-provider self-audit of an instrument's mappings (currency/price agreement)
      operationId: researchAuditMappings
      tags: [Research]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instrument_key]
              properties:
                instrument_key:
                  type: string
                key_type:
                  type: string
                  enum: [isin, internal]
                  default: isin
      responses:
        "200":
          description: Audit result (ok, quotes, discrepancies); stamps verified_at
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchMappingAuditEnvelope"
        "400":
          description: instrument_key required
  /api/research/mappings/{id}:
    delete:
      summary: Delete a stored mapping by id
      operationId: researchDeleteMapping
      tags: [Research]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        "204":
          description: No Content (idempotent — an unknown id is not an error)
        "400":
          description: id must be a positive integer
  # Research provider API keys (Settings, ADR-079)
  /api/research/provider-keys:
    get:
      summary: List keyed-provider API-key statuses (masked; never the full key)
      operationId: researchListProviderKeys
      tags: [Research]
      responses:
        "200":
          description: "Canonical `{items, total}` body; each item is { provider, label, envVar, configured, source, masked }"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchProviderKeysEnvelope"
  /api/research/provider-keys/{provider}:
    put:
      summary: Set or replace a provider's API key (takes effect immediately)
      operationId: researchSetProviderKey
      tags: [Research]
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
            enum: [twelve_data, finnhub, fmp, alpha_vantage, fred]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key]
              properties:
                api_key:
                  type: string
      responses:
        "200":
          description: Updated masked statuses (canonical `{items, total}` body)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchProviderKeysEnvelope"
        "400":
          description: unknown provider or empty api_key
    delete:
      summary: Clear a provider's stored API key (env fallback then applies)
      operationId: researchClearProviderKey
      tags: [Research]
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
            enum: [twelve_data, finnhub, fmp, alpha_vantage, fred]
      responses:
        "204":
          description: No Content (refetch GET /provider-keys for the new statuses)
        "400":
          description: unknown provider
