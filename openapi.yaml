      required: [issuerId, issuerName, sourceLabel]
      description: Exactly one of investmentId or identifier must be present.
      properties:
        investmentId: { type: integer, minimum: 1 }
        identifier: { $ref: "#/components/schemas/PortfolioSecurityIdentifier" }
        issuerId: { type: string, minLength: 1, maxLength: 128 }
        issuerName: { type: string, minLength: 1, maxLength: 256 }
        sector: { type: string, minLength: 1, maxLength: 128 }
        issuerCountryCode: { type: string, pattern: "^[A-Z]{2}$" }
        sourceLabel: { type: string, minLength: 1, maxLength: 300 }

    FundHoldingsIdentity:
      type: object
      additionalProperties: false
      required: [name, identifiers]
      properties:
        name: { type: string, minLength: 1, maxLength: 256 }
        identifiers:
          type: array
          minItems: 1
          maxItems: 16
          items: { $ref: "#/components/schemas/PortfolioSecurityIdentifier" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }

    FundHoldingsShareClass:
      type: object
      additionalProperties: false
      required: [name, identifiers, currency]
      properties:
        name: { type: string, minLength: 1, maxLength: 256 }
        identifiers:
          type: array
          minItems: 1
          maxItems: 16
          items: { $ref: "#/components/schemas/PortfolioSecurityIdentifier" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }

    FundHoldingRow:
      type: object
      additionalProperties: false
      required:
        [
          provenance,
          name,
          identifiers,
          instrumentType,
          exposureKind,
          exposureStatus,
          weightPercent,
        ]
      properties:
        provenance:
          type: object
          additionalProperties: false
          required: [rowNumber]
          properties:
            rowNumber: { type: integer, minimum: 1 }
            sheetName: { type: string, minLength: 1, maxLength: 128 }
        name: { type: string, minLength: 1, maxLength: 256 }
        identifiers:
          type: array
          maxItems: 16
          items: { $ref: "#/components/schemas/PortfolioSecurityIdentifier" }
        instrumentType:
          { type: string, enum: [equity, bond, cash, fund, derivative, other] }
        exposureKind:
          {
            type: string,
            enum: [direct, cash, nested-fund, derivative, synthetic, unknown],
          }
        exposureStatus: { type: string, enum: [supported, unsupported] }
        unsupportedReason: { type: string, minLength: 1, maxLength: 500 }
        weightPercent:
          type: string
          pattern: "^(?:0|[1-9][0-9]*)(?:\\.[0-9]*[1-9])?$"
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        countryCode: { type: string, pattern: "^[A-Z]{2}$" }

    FundHoldingsDocument:
      type: object
      additionalProperties: false
      required:
        [
          contractVersion,
          fund,
          shareClass,
          source,
          holdings,
          coverage,
          staleness,
        ]
      properties:
        contractVersion: { type: integer, enum: [1] }
        fund: { $ref: "#/components/schemas/FundHoldingsIdentity" }
        shareClass: { $ref: "#/components/schemas/FundHoldingsShareClass" }
        source:
          type: object
          additionalProperties: false
          required: [kind, fileName, asOfDate, retrievedAt, license]
          properties:
            kind: { type: string, enum: [user-supplied-file] }
            providerName: { type: string }
            fileName: { type: string }
            sourceUrl: { type: string, format: uri }
            asOfDate: { type: string, format: date }
            retrievedAt: { type: string, format: date-time }
            license:
              type: object
              additionalProperties: false
              required: [status, redistribution]
              properties:
                status:
                  {
                    type: string,
                    enum:
                      [
                        user-provided,
                        permission-confirmed,
                        unknown,
                        restricted,
                      ],
                  }
                redistribution:
                  { type: string, enum: [allowed, forbidden, unknown] }
                termsUrl: { type: string, format: uri }
                note: { type: string }
        holdings:
          type: array
          items: { $ref: "#/components/schemas/FundHoldingRow" }
        coverage:
          type: object
          additionalProperties: false
          required:
            [
              status,
              reportedWeightPercent,
              supportedWeightPercent,
              unsupportedWeightPercent,
              missingWeightPercent,
            ]
          properties:
            status: { type: string, enum: [complete, partial] }
            reportedWeightPercent: { type: string }
            supportedWeightPercent: { type: string }
            unsupportedWeightPercent: { type: string }
            missingWeightPercent: { type: string }
        staleness:
          type: object
          additionalProperties: false
          required: [evaluatedAt, maximumAgeDays, ageDays, status]
          properties:
            evaluatedAt: { type: string, format: date }
            maximumAgeDays: { type: integer, minimum: 0 }
            ageDays: { type: integer, minimum: 0 }
            status: { type: string, enum: [current, stale] }

    PortfolioExposureBundle:
      type: object
      additionalProperties: false
      required: [classifications, fundDocuments]
      properties:
        classifications:
          type: array
          maxItems: 5000
          items:
            { $ref: "#/components/schemas/PortfolioExposureClassification" }
        fundDocuments:
          type: array
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [investmentId, shareClassIdentifier, document]
            properties:
              investmentId: { type: integer, minimum: 1 }
              shareClassIdentifier:
                { $ref: "#/components/schemas/PortfolioSecurityIdentifier" }
              document: { $ref: "#/components/schemas/FundHoldingsDocument" }

    PortfolioExposureContribution:
      type: object
      required:
        [
          sourceType,
          investmentId,
          investmentName,
          sourceFundName,
          amount,
          sourceAsOfDate,
          stale,
        ]
      properties:
        sourceType: { type: string, enum: [direct, fund] }
        investmentId: { type: integer }
        investmentName: { type: string }
        sourceFundName: { type: string, nullable: true }
        amount: { type: number }
        sourceAsOfDate: { type: string, format: date, nullable: true }
        stale: { type: boolean }

    PortfolioExposureDimension:
      type: object
      required:
        [
          rows,
          classifiedValue,
          classifiedWeightPercent,
          unclassifiedValue,
          unclassifiedWeightPercent,
        ]
      properties:
        rows:
          type: array
          items:
            type: object
            required: [id, label, amount, weightPercent, contributions]
            properties:
              id: { type: string }
              label: { type: string }
              amount: { type: number }
              weightPercent: { type: number }
              contributions:
                type: array
                items:
                  { $ref: "#/components/schemas/PortfolioExposureContribution" }
        classifiedValue: { type: number }
        classifiedWeightPercent: { type: number }
        unclassifiedValue: { type: number }
        unclassifiedWeightPercent: { type: number }

    PortfolioExposureFundSource:
      type: object
      additionalProperties: false
      required:
        [
          investmentId,
          investmentName,
          asOfDate,
          evaluatedAt,
          ageDays,
          maximumAgeDays,
          stale,
          coverageStatus,
        ]
      properties:
        investmentId: { type: integer }
        investmentName: { type: string }
        asOfDate: { type: string, format: date }
        evaluatedAt: { type: string, format: date }
        ageDays: { type: integer, minimum: 0 }
        maximumAgeDays: { type: integer, minimum: 0 }
        stale: { type: boolean }
        coverageStatus: { type: string, enum: [complete, partial] }

    PortfolioExposure:
      type: object
      required:
        [
          currency,
          computedAt,
          totalValue,
          uncoveredValue,
          uncoveredWeightPercent,
          coveredCashValue,
          coveredCashWeightPercent,
          fundSources,
          issuer,
          sector,
          issuerCountry,
          warnings,
          scopeNotes,
        ]
      properties:
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        computedAt: { type: string, format: date-time }
        totalValue: { type: number }
        uncoveredValue: { type: number }
        uncoveredWeightPercent: { type: number }
        coveredCashValue: { type: number }
        coveredCashWeightPercent: { type: number }
        fundSources:
          type: array
          items: { $ref: "#/components/schemas/PortfolioExposureFundSource" }
        issuer: { $ref: "#/components/schemas/PortfolioExposureDimension" }
        sector: { $ref: "#/components/schemas/PortfolioExposureDimension" }
        issuerCountry:
          { $ref: "#/components/schemas/PortfolioExposureDimension" }
        warnings:
          type: array
          items: { type: object, additionalProperties: true }
        scopeNotes:
          type: array
          items: { type: string }

    PortfolioTransaction:
      type: object
      required:
        [
          id,
          investment_id,
          type,
          date,
          amount,
          currency,
          dividend_amount_convention,
          is_recurring,
          created_at,
          updated_at,
        ]
      properties:
        id:
          type: integer
        investment_id:
          type: integer
        type:
          $ref: "#/components/schemas/PortfolioTxnType"
        date:
          type: string
          format: date
        amount:
          type: number
        units:
          type: number
        price_per_unit:
          type: number
        fees:
          type: number
        taxes:
          type: number
        dividend_amount_convention:
          type: string
          enum: [gross, net, unknown]
          description: >-
            Whether a dividend transaction's amount is before or after
            withholding tax. Unknown for legacy or unclassified rows and
            ignored for non-dividend transactions.
        income_recognition_role:
          type: string
          enum: [standard, included_in_units]
          readOnly: true
          description: >-
            Read-only accounting role. included_in_units is allowed only for dividends
            whose literal income is already represented by proved acquired units.
            Amount and source facts are retained, but ordinary income and gain totals
            exclude the row. The role does not classify legal tax treatment. Older
            responses and immutable snapshots without this field mean standard;
            explicit role setters are rejected by create/update endpoints.
        currency:
          type: string
        fx_rate_to_eur:
          type: number
        account_id:
          type: integer
          nullable: true
          description: Owning account for the lot (ADR-091); null = unassigned/global
        import_batch_id:
          type: string
          nullable: true
          description: >-
            Portfolio-import batch that created the row. PostgreSQL BIGINT is
            serialized by node-postgres as a string; null means the transaction
            was created manually or predates batch attribution.
        note:
          type: string
        is_recurring:
          type: boolean
        recurrence_interval:
          $ref: "#/components/schemas/RecurrenceInterval"
        recurrence_end_date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PortfolioTransactionList:
      allOf:
        - $ref: "#/components/schemas/PaginationFields"
        - type: object
          required: [items, links]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/PortfolioTransaction"
            links:
              type: array
              items:
                $ref: "#/components/schemas/Link"

    PortfolioBrokerRetagReceipt:
      type: object
      required:
        - receipt_id
        - idempotency_key
        - from_account_id
        - to_account_id
        - transaction_ids
        - previous_assignments
        - selected_count
        - changed_count
        - created_at
        - replayed
      properties:
        receipt_id:
          type: integer
          format: int64
        idempotency_key:
          type: string
          format: uuid
        from_account_id:
          type: integer
          format: int32
          nullable: true
        to_account_id:
          type: integer
          format: int32
          nullable: true
        transaction_ids:
          type: array
          items:
            type: integer
            format: int32
        previous_assignments:
          type: array
          items:
            type: object
            required: [transaction_id, account_id]
            properties:
              transaction_id:
                type: integer
                format: int32
              account_id:
                type: integer
                format: int32
                nullable: true
        selected_count:
          type: integer
        changed_count:
          type: integer
        created_at:
          type: string
          format: date-time
        replayed:
          type: boolean

    # ─── Aggregation envelope ────────────────────────────────────────────────
    AggregationEnvelope:
      type: object
      required: [ok, cached, generatedAt]
      properties:
        ok:
          type: boolean
        cached:
          type: boolean
        generatedAt:
          type: string
          format: date-time

    RecipientPivotData:
      type: object
      required: [recipientPivot, conversion]
      properties:
        recipientPivot:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              required: [recipientId, name, total, transactionCount]
              properties:
                recipientId: { type: integer }
                name: { type: string }
                total: { type: number }
                transactionCount: { type: integer }
        conversion:
          type: object
          required: [usedHistoricalFallback, affectedCurrencies]
          properties:
            usedHistoricalFallback:
              type: boolean
              description: True when at least one row lacked its requested historical rate and used a current or identity fallback.
            affectedCurrencies:
              type: array
              uniqueItems: true
              items: { type: string }
              description: Sorted uppercase source currencies whose rows used the fallback.

    CategoryPivotData:
      type: object
      required: [categoryPivot]
      properties:
        categoryPivot:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              required:
                [
                  categoryId,
                  categoryName,
                  categoryPathIds,
                  categoryPathSegments,
                  total,
                  income,
                  expense,
                  transactionCount,
                ]
              properties:
                categoryId: { type: integer, nullable: true }
                categoryName: { type: string }
                categoryPathIds:
                  type: array
                  items: { type: integer }
                categoryPathSegments:
                  type: array
                  items: { type: string }
                total: { type: number }
                income: { type: number }
                expense: { type: number }
                transactionCount: { type: integer }
                incomeByOwner:
                  type: object
                  description: >-
                    Additive (ADR-201). Part of `income` booked on accounts whose owner is
                    `partner` or `joint`; present only when one of them is non-zero. The rest of
                    `income` is on `me` accounts or on transactions without an account.
                  properties:
                    partner: { type: number }
                    joint: { type: number }

    # ─── Net Worth ───────────────────────────────────────────────────────────
    NetWorthSnapshot:
      type: object
      required: [date, liquid, liabilities, investments, netWorth]
      properties:
        date:
          type: string
          format: date
        liquid:
          type: number
        liabilities:
          type: number
          description: Σ liability-account balances (negative); split out of liquid so debt is not counted as a liquid asset (ADR-092).
        investments:
          type: number
        netWorth:
          type: number

    NetWorthResponse:
      type: object
      required: [current, monthlyChange, monthlyChangePercent, snapshots]
      properties:
        current:
          type: object
          required: [liquid, liabilities, investments, netWorth, currency]
          properties:
            liquid:
              type: number
            liabilities:
              type: number
            investments:
              type: number
            netWorth:
              type: number
            currency:
              type: string
        monthlyChange:
          type: number
        monthlyChangePercent:
          type: number
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/NetWorthSnapshot"
        # Pagination facts for the embedded `snapshots` list, in the body (the
        # single API-wide convention). Present only when the request paginated.
        snapshotsTotal:
          type: integer
        snapshotsLimit:
          type: integer
        snapshotsOffset:
          type: integer

    NetWorthByAccountRow:
      type: object
      required: [accountId, name, type, cashCurrency, cash, holdings, total, unconverted]
      properties:
        accountId:
          type: integer
          nullable: true
          description: null for holdings not assigned to an account.
        name:
          type: string
          nullable: true
          description: Account display_name or name; null for the unassigned row or an unknown account.
        type: { type: string, nullable: true }
        cashCurrency: { type: string, nullable: true }
        cash:
          type: number
          nullable: true
          description: Cash balance at the latest stored rate. 0 for accounts outside net worth, holdings-only accounts (crypto_exchange, wallet) and the unassigned row; null when the account currency has no rate.
        holdings: { type: number, description: Σ live portfolio-summary byAccount currentValue. }
        total: { type: number, nullable: true, description: cash + holdings; null when cash is null. }
        unconverted: { type: boolean }

    NetWorthByAccountResponse:
      type: object
      required: [currency, rows, total, unconvertedAccountIds]
      properties:
        currency: { type: string }
        rows:
          type: array
          description: Ordered by account id, the unassigned row last.
          items: { $ref: "#/components/schemas/NetWorthByAccountRow" }
        total:
          type: number
          nullable: true
          description: Σ row totals; null while any cash balance is unconverted.
        unconvertedAccountIds:
          type: array
          items: { type: integer }

    # ─── Saved Charts ────────────────────────────────────────────────────────
    SavedChart:
      type: object
      required:
        [
          id,
          name,
          chart_type,
          chart_variant,
          time_bucket,
          category_ids,
          recipient_ids,
          tag_ids,
          all_categories,
          all_recipients,
          all_tags,
          created_at,
          updated_at,
        ]
      properties:
        id:
          type: integer
        name:
          type: string
        chart_type:
          type: string
          enum: [line, bar, area]
        chart_variant:
          type: string
          enum: [default, stacked, grouped, ranked]
          description: "ranked is only valid with chart_type=bar; line:ranked and area:ranked return 400"
        time_bucket:
          type: string
          enum: [monthly, yearly]
          description: "Ignored when chart_variant=ranked"
        category_ids:
          type: array
          items:
            type: integer
          description: "Ignored when all_categories=true"
        recipient_ids:
          type: array
          items:
            type: integer
          description: "Ignored when all_recipients=true"
        tag_ids:
          type: array
          items:
            type: integer
          description: "Ignored when all_tags=true"
        all_categories:
          type: boolean
          default: false
        all_recipients:
          type: boolean
          default: false
        all_tags:
          type: boolean
          default: false
        date_range_start:
          type: string
          format: date
          nullable: true
        date_range_end:
          type: string
          format: date
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ─── Settings ────────────────────────────────────────────────────────────
    SettingBaseline:
      description: Persisted JSON from the read that produced the edit. Absence is distinct from JSON null.
      oneOf:
        - type: object
          additionalProperties: false
          required: [exists]
          properties:
            exists:
              type: boolean
              enum: [false]
        - type: object
          additionalProperties: false
          required: [exists, value]
          properties:
            exists:
              type: boolean
              enum: [true]
            value: {}
    Setting:
      type: object
      required: [key, value, expected]
      properties:
        key:
          type: string
        value: {}
        expected:
          $ref: "#/components/schemas/SettingBaseline"

    # ─── Splits ──────────────────────────────────────────────────────────────
    # A transaction_splits row as emitted by splitRepository's formatSplit:
    # a per-recipient share of one transaction. There is no description /
    # total_amount / currency / shares — those described a split model the
    # backend has never implemented.
    Split:
      type: object
      # recipient_name/note are required + nullable: formatSplit always emits
      # them (`row.recipient_name || null` / `row.note`), never omits them.
      required:
        [
          id,
          transaction_id,
          recipient_id,
          recipient_name,
          amount,
          amount_paid,
          note,
          is_settled,
          created_at,
          updated_at,
        ]
      properties:
        id:
          type: integer
        transaction_id:
          type: integer
        recipient_id:
          type: integer
        recipient_name:
          type: string
          nullable: true
        amount:
          type: number
        # Σ split_payments.amount for this split; 0 on a freshly created split.
        amount_paid:
          type: number
        note:
          type: string
          nullable: true
        is_settled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # A split_payments row (POST /api/splits/{id}/pay, GET /{id}/payments).
    # note is required + nullable: formatPayment spreads the full row, and the
    # column is always selected (SQL NULL → null on the wire).
    SplitPayment:
      type: object
      required: [id, split_id, amount, note, paid_at, created_at]
      properties:
        id:
          type: integer
        split_id:
          type: integer
        amount:
          type: number
        note:
          type: string
          nullable: true
        paid_at:
          type: string
          format: date
        created_at:
          type: string
          format: date-time

    # Envelope `data` for the split-list endpoints (res.ok({ items, total })).
    # limit/offset appear only when the caller paginated (opt-in).
    SplitList:
      allOf:
        - $ref: "#/components/schemas/OptionalPaginationFields"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Split"

    # POST /api/splits/bulk result (splitService.createBulkSplitsAtomic).
    # `requested` counts the ids as sent (duplicates included); `split` the
    # rows written; the skipped_* counts explain the difference.
    BulkSplitResult:
      type: object
      required:
        [
          requested,
          split,
          skipped_already_split,
          skipped_zero_amount,
          skipped_missing,
          items,
        ]
      properties:
        requested:
          type: integer
        split:
          type: integer
        skipped_already_split:
          type: integer
        skipped_zero_amount:
          type: integer
        skipped_missing:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/Split"

    # Aggregated "who owes what" row from computeOwedSummary. No currency is
    # carried here — the summary sums across a recipient's splits.
    SplitOwed:
      type: object
      required:
        [
          recipient_id,
          recipient_name,
          total_owed,
          total_paid,
          remaining,
          split_count,
        ]
      properties:
        recipient_id:
          type: integer
        recipient_name:
          type: string
        total_owed:
          type: number
        total_paid:
          type: number
        remaining:
          type: number
        split_count:
          type: integer

    # One unsettled split of a recipient (GET /api/splits/owed/{id}) — a Split
    # enriched with the fields of the transaction it was carved out of.
    SplitOwedDetail:
      allOf:
        - $ref: "#/components/schemas/Split"
        - type: object
          required:
            [
              transaction_date,
              transaction_amount,
              transaction_currency,
              remaining,
            ]
          properties:
            transaction_date:
              type: string
              format: date
            transaction_memo:
              type: string
              nullable: true
            transaction_amount:
              type: number
            transaction_currency:
              type: string
            bank_account:
              type: string
              nullable: true
            transaction_recipient_name:
              type: string
              nullable: true
            remaining:
              type: number

    # ─── Attachments ─────────────────────────────────────────────────────────
    Attachment:
      type: object
      required:
        [
          id,
          transaction_id,
          filename,
          stored_path,
          mime_type,
          size_bytes,
          created_at,
        ]
      properties:
        id:
          type: string
          pattern: "^\\d+$"
          description: BIGSERIAL identity, serialized as a decimal string.
        transaction_id:
          type: integer
        filename:
          type: string
        # On-disk location; the file bytes are not stored in the database.
        stored_path:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
        created_at:
          type: string
          format: date-time

    # ─── Watchlist ────────────────────────────────────────────────────────────
    # Mirrors the `watchlist` table as mapped by watchlistRepository. It has no
    # current_price column: live quotes are fetched separately and never merged
    # into this row.
    WatchlistItem:
      type: object
      required:
        [id, name, asset_class, target_price, currency, created_at, updated_at]
      properties:
        id:
          type: integer
        name:
          type: string
        symbol:
          type: string
          nullable: true
        asset_class:
          type: string
          enum: [stock, etf, crypto, metals]
        target_price:
          type: number
        currency:
          type: string
        notes:
          type: string
          nullable: true
        price_provider_id:
          type: string
          nullable: true
        added_price:
          description: Live price snapshotted when the item was added (ADR-097 backtest).
          type: number
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ─── AI ──────────────────────────────────────────────────────────────────
    # ai_conversations row. Column aliases are camelCase on the wire
    # (aiChatRepository's CONVERSATION_COLUMNS), not snake_case.
    AiConversation:
      type: object
      required: [id, title, model, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        model:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ai_messages row (aiChatRepository's MESSAGE_COLUMNS). Tool turns carry
    # toolName/toolArgs/toolResult and a null content.
    AiMessage:
      type: object
      required: [id, conversationId, role, content, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant, tool, system]
        content:
          type: string
          nullable: true
        toolName:
          type: string
          nullable: true
        toolArgs:
          type: object
          additionalProperties: true
          nullable: true
        toolResult:
          type: object
          additionalProperties: true
          nullable: true
        toolPresentation:
          $ref: "#/components/schemas/AiToolPresentation"
        status:
          type: string
          enum: [complete, streaming, aborted, error]
        createdAt:
          type: string
          format: date-time

    AiToolPresentation:
      type: object
      description: Additive outgoing-message metadata inferred by shared TypeScript from the original JSON tool result; stored results and provider prompts remain unchanged. Nested array rows and first-row ordered keys retain the existing web behavior.
      required:
        [renderAs, rows, columns, xKey, yKeys, rowCount, pieRenderable, pieRows]
      properties:
        renderAs:
          type: string
        rows:
          type: array
          items: {}
        columns:
          type: array
          items:
            type: string
        xKey:
          type: string
        yKeys:
          type: array
          items:
            type: string
        rowCount:
          type: integer
          minimum: 0
        pieRenderable:
          type: boolean
        pieRows:
          type: array
          description: Empty when the first y key is unavailable or the source numeric sum is not positive; otherwise retains negative values and Recharts default sector composition.
          items:
            type: object
            required: [name, value, percent, labelPercent, startAngle, endAngle]
            properties:
              name:
                type: string
              value:
                type: number
              percent:
                type: number
              labelPercent:
                type: number
              startAngle:
                type: number
              endAngle:
                type: number

    # Usage counters forwarded from the Ollama response; null until the first
    # model reply lands, or when the provider omits the counter.
    AiTokenUsage:
      type: object
      required: [evalCount, promptEvalCount, totalDurationMs]
      properties:
        evalCount:
          type: integer
          nullable: true
        promptEvalCount:
          type: integer
          nullable: true
        totalDurationMs:
          type: integer
          nullable: true

    # One installed model, projected from Ollama /api/tags by the backend's
    # ollama client — not the daemon's raw row.
    OllamaModel:
      type: object
      required: [name, size, family, parameterSize, quantization, modifiedAt]
      properties:
        name:
          type: string
        size:
          type: integer
          nullable: true
        family:
          type: string
          nullable: true
        parameterSize:
          type: string
          nullable: true
        quantization:
          type: string
          nullable: true
        modifiedAt:
          type: string
          nullable: true

    # `data` of GET /api/ai/conversations/{id} and POST /api/ai/conversations
    # (routes/ai.js — getConversationWithMessages / createEmptyConversation):
    # one conversation row plus its full ordered message history (empty on
    # create).
    AiConversationDetail:
      type: object
      required: [conversation, messages]
      properties:
        conversation:
          $ref: "#/components/schemas/AiConversation"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AiMessage"

    # `data` of GET /api/ai/status (routes/ai.js) — normalized Ollama
    # reachability. Every field is always emitted; error/code/hint are null
    # when the daemon is reachable (or no hint applies).
    OllamaStatus:
      type: object
      required:
        [
          ok,
          baseUrl,
          displayUrl,
          modelCount,
          error,
          code,
          hint,
          defaultModel,
          enabled,
        ]
      properties:
        ok:
          type: boolean
        baseUrl:
          type: string
        # URL shown in the settings UI.
        displayUrl:
          type: string
        modelCount:
          type: integer
        error:
          type: string
          nullable: true
        code:
          type: string
          nullable: true
        hint:
          type: string
          nullable: true
        defaultModel:
          type: string
        enabled:
          type: boolean

    # ─── Portfolio Import ─────────────────────────────────────────────────────
    PortfolioImportReconciliationDateProof:
      type: object
      additionalProperties: false
      description: >-
        Present only on a correct_existing_only prefer_source date-only adoption
        of a proved closed Kinesis yield group. Existing and source dates equal
        recordedDate and paymentDate respectively. Quantities, type and all
        financial values are unchanged. memberCount includes unchanged yield
        anchors, which need not be selected correction actions; complete group
        closure and atomic selection are proved by the server and bound in the
        reviewed fingerprint.
      required: [kind, groupKey, recordedDate, paymentDate, memberCount]
      properties:
        kind: { type: string, enum: [closed_kinesis_yield_group] }
        groupKey: { type: string, pattern: "^[a-f0-9]{64}$" }
        recordedDate: { type: string, format: date }
        paymentDate: { type: string, format: date }
        memberCount: { type: integer, minimum: 1 }

    PortfolioImportReconciliationIncomeProof:
      type: object
      additionalProperties: false
      required: [kind]
      anyOf:
        - required: [unitRowId]
        - required: [unitTransactionId]
      description: Present on proved record_income, duplicate or settled paired-income actions in full history or record_in_kind_income_only. Narrow scope requires unitTransactionId and forbids unitRowId. Full scope requires unitRowId binding the distinct selected Gift action in the same batch/investment/payment date. A paired Gift insert has no canonical unit ID until the same atomic commit creates it; a paired adoption or existing Gift requires unitTransactionId, as do repeated income actions. Repeats also identify the distinct existing income through existingTransactionId and may omit source/existing bodies. The server proves literal zero-basis income/units identity and immutable receipt images, binds proof into the fingerprint, and writes income only after its unit is proved. Each income and unit identity is unique; the proof cannot record income again or add another acquisition.
      properties:
        kind: { type: string, enum: [paired_kinesis_income] }
        unitRowId:
          {
            type: integer,
            format: int64,
            minimum: 1,
            maximum: 9007199254740991,
            description: Required only in full history; output-only staged Gift row ID selected in this review.,
          }
        unitTransactionId:
          {
            type: integer,
            format: int64,
            minimum: 1,
            maximum: 9007199254740991,
          }

    PortfolioImportReconciliationCashValues:
      type: object
      additionalProperties: false
      required:
        [
          date,
          amount,
          currency,
          accountId,
          isTransfer,
          transferSource,
          transferPeerId,
        ]
      description: Signed cash ledger values for a proved source event. Required for a new cash action, optional on proved duplicate/settled repeats. Trade quotes and confirmed own-account funding use isTransfer=true; card expenses use false. Every row has brokerage origin and no invented peer. A separately quoted own-account withdrawal fee is retained as a second negative expense component; the transfer component is net of that fee. Card spending already includes its quoted fee and creates no extra fee row.
      properties:
        date: { type: string, format: date }
        amount: { type: string, pattern: "^-?[0-9]+(\\.[0-9]+)?$" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        accountId:
          {
            type: integer,
            format: int64,
            minimum: 1,
            maximum: 9007199254740991,
          }
        isTransfer: { type: boolean }
        transferSource: { type: string, enum: [brokerage] }
        transferPeerId: { type: integer, nullable: true, enum: [null] }

    PortfolioImportReconciliationCashProof:
      type: object
      additionalProperties: false
      required:
        [
          kind,
          groupKey,
          eventKey,
          eventKind,
          fileHash,
          memberCount,
          componentCount,
        ]
      description: Present only in record_cash_only on every cash, duplicate or settled action. The complete original source and all cash balance chains are proved before selection; every group member selects together. memberCount includes new and repeated cash actions, and equals selected group action count. Event identities are unique, and fileHash is common within a source batch/group. Repeats identify a positive existingTransactionId and create no cash again. Proof is bound to the reviewed fingerprint and confirmed own-account funding policy; it does not authorize portfolio or custody actions.
      properties:
        kind: { type: string, enum: [closed_kinesis_cash] }
        groupKey: { type: string, pattern: "^[a-f0-9]{64}$" }
        eventKey: { type: string, pattern: "^[a-f0-9]{64}$" }
        eventKind:
          {
            type: string,
            enum: [trade_quote, own_account_funding, card_expense],
          }
        fileHash: { type: string, pattern: "^[a-f0-9]{64}$" }
        memberCount: { type: integer, minimum: 1, maximum: 9007199254740991 }
        componentCount:
          {
            type: integer,
            enum: [1, 2],
            description: One ledger component,
            or two for a separately quoted own-account withdrawal fee.,
          }

    PortfolioImportReconciliationCounts:
      type: object
      required: [imported, duplicates, adopted, repaired, errors]
      properties:
        imported: { type: integer, minimum: 0 }
        duplicates: { type: integer, minimum: 0 }
        adopted: { type: integer, minimum: 0 }
        repaired: { type: integer, minimum: 0 }
        errors: { type: integer, minimum: 0 }
        recordedCash:
          type: integer
          minimum: 0
          description: Additive aggregate and batch subtotal of newly recorded cash ledger components. In full history it is a subset of imported alongside recordedIncome and ordinary records. In record_cash_only it equals imported, includes separately quoted withdrawal fee expenses, and adopted/repaired/recordedIncome are zero; summary.cash counts source actions and may be smaller. Repeated settlement records no new cash.
        recordedIncome:
          type: integer
          minimum: 0
          description: Additive aggregate and batch subtotal of newly recorded paired canonical income rows. In full history it is a subset of imported; the paired Gift is recorded or adopted once in the same commit. In record_in_kind_income_only it equals imported and no units/acquisitions are created; adopted/repaired are zero. Repeats may settle duplicates but recordedIncome is zero. Missing subtotals remain valid for older full responses.

    PortfolioImportReconciliationCommitResult:
      allOf:
        - $ref: "#/components/schemas/PortfolioImportReconciliationCounts"
        - $ref: "#/components/schemas/PortfolioImportReconciliationScopeProgress"
        - type: object
          required: [batches]
          properties:
            selectedRowIds:
              type: array
              uniqueItems: true
              description: Present for every bounded scope; server-derived staging IDs, never caller-selectable. Already settled actions need not add to duplicates.
              items:
                {
                  type: integer,
                  format: int64,
                  minimum: 1,
                  maximum: 9007199254740991,
                }
            batches:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/PortfolioImportReconciliationCounts"
                  - $ref: "#/components/schemas/PortfolioImportReconciliationScopeProgress"
                  - type: object
                    required: [batch_id]
                    properties:
                      batch_id: { type: integer, format: int64 }

    PortfolioImportReconciliationScopeProgress:
      type: object
      description: >-
        All four fields are emitted for adopt_existing_only, correct_existing_only, record_in_kind_income_only and record_cash_only plans, commit results,
        and commit batch entries. Preview batchProgress entries use pending,
        complete and deferredCounts with their batchId, without reconciliationScope.
        Full-scope responses retain their existing shape and omit these fields.
        Complete describes source settlement, not the batch lifecycle: every selected
        batch stays awaiting_review while the overall session has pending events.
      properties:
        reconciliationScope:
          type: string
          enum:
            [
              adopt_existing_only,
              correct_existing_only,
              record_in_kind_income_only,
              record_cash_only,
            ]
        pending:
          type: integer
          minimum: 0
          description: Excluded unsettled source rows after selected actions; per-batch counts sum to the session total.
        complete:
          type: boolean
          description: True exactly when pending is zero.
        deferredCounts:
          type: object
          description: >-
            Pending rows grouped by staged event kind, including dividend, gift,
            sell, cash, asset_transfer, asset_adjustment, account_internal and
            unsupported when present. Values sum to pending.
          additionalProperties: { type: integer, minimum: 0 }

    PortfolioImportReconciliationPlan:
      allOf:
        - $ref: "#/components/schemas/PortfolioImportReconciliationScopeProgress"
        - type: object
          required:
            [
              batchIds,
              adoptPolicy,
              batchPolicies,
              planFingerprint,
              ready,
              actions,
              blockers,
              summary,
            ]
          properties:
            batchIds:
              type: array
              items:
                {
                  type: integer,
                  format: int64,
                  minimum: 1,
                  maximum: 9007199254740991,
                }
            adoptPolicy:
              type: string
              nullable: true
              enum: [preserve_existing, prefer_source, null]
            batchPolicies:
              type: array
              items:
                type: object
                required: [batchId, adoptPolicy]
                properties:
                  batchId:
                    {
                      type: integer,
                      format: int64,
                      minimum: 1,
                      maximum: 9007199254740991,
                    }
                  adoptPolicy:
                    { type: string, enum: [preserve_existing, prefer_source] }
            planFingerprint:
              type: string
              pattern: "^[a-f0-9]{64}$"
            ready: { type: boolean }
            actions:
              type: array
              description: Full-scope reviewed actions; attachment/correction selects adopt/duplicate/settled, record_in_kind_income_only selects record_income/duplicate/settled, and record_cash_only selects cash/duplicate/settled only.
              items:
                type: object
                additionalProperties: true
                properties:
                  investmentId:
                    type: integer
                    format: int64
                    minimum: 1
                    maximum: 9007199254740991
                    nullable: true
                    description: Resolved investment identity; required on full paired income and its selected Gift action, including bodyless repeats.
                  existingTransactionId:
                    type: integer
                    format: int64
                    minimum: 1
                    maximum: 9007199254740991
                    description: Existing canonical identity for adoption or owned duplicate/settled actions. Full paired income requires distinct existing income and unit identities on repeats.
                  isCash:
                    type: boolean
                    description: True for proven native IBKR funding corrections. existingTransactionId identifies the cash ledger; investmentId is null. Only amount and currency can change, retaining the original date, notes and financial provenance.
                  dateProof:
                    $ref: "#/components/schemas/PortfolioImportReconciliationDateProof"
                  incomeProof:
                    $ref: "#/components/schemas/PortfolioImportReconciliationIncomeProof"
                  cashProof:
                    $ref: "#/components/schemas/PortfolioImportReconciliationCashProof"
                  cashValues:
                    $ref: "#/components/schemas/PortfolioImportReconciliationCashValues"
                  cashFeeValues:
                    allOf:
                      - $ref: "#/components/schemas/PortfolioImportReconciliationCashValues"
                    description: Required on new componentCount=2 own-account withdrawals. Negative same-date/currency/account fee expense with isTransfer=false, brokerage origin and null peer. Main cashValues is the net withdrawal and isTransfer=true; no separate fee is invented for card payments. Optional alongside main values on repeats.
                  existingCashFeeTransactionId:
                    type: integer
                    format: int64
                    minimum: 1
                    maximum: 9007199254740991
                    description: Required on duplicate/settled componentCount=2 repeats; a distinct existing fee transaction whose complete after-image is guarded. Forbidden for single-component actions.
            blockers:
              type: array
              items: { type: object, additionalProperties: true }
            summary:
              type: object
              description: Counts of actions in this plan; narrow scope excludes deferred events.
              additionalProperties: { type: integer, minimum: 0 }
            selectedRowIds:
              type: array
              uniqueItems: true
              description: Present for every bounded scope; exactly the distinct row IDs in selected actions, derived by the server.
              items:
                {
                  type: integer,
                  format: int64,
                  minimum: 1,
                  maximum: 9007199254740991,
                }
            batchProgress:
              type: array
              description: Present only in narrow preview; commit reports progress within batches instead.
              items:
                allOf:
                  - $ref: "#/components/schemas/PortfolioImportReconciliationScopeProgress"
                  - type: object
                    required: [batchId, pending, complete, deferredCounts]
                    properties:
                      batchId:
                        {
                          type: integer,
                          format: int64,
                          minimum: 1,
                          maximum: 9007199254740991,
                        }

    PortfolioImportBatch:
      type: object
      required:
        [
          id,
          adapter_name,
          status,
          rows_total,
          rows_imported,
          rows_duplicate,
          rows_error,
          started_at,
        ]
      properties:
        id:
          type: string
        adapter_name:
          type: string
        source_filename:
          type: string
        source_size_bytes:
          type: integer
        status:
          type: string
          enum:
            [
              pending,
              staging,
              validating,
              matching,
              committing,
              complete,
              complete_with_errors,
              failed,
              aborted,
              awaiting_review,
            ]
        rows_total:
          type: integer
        rows_imported:
          type: integer
        rows_duplicate:
          type: integer
        rows_error:
          type: integer
        error_summary:
          type: string
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    PortfolioImportUpload:
      type: object
      required: [file, date_column, default_asset_class]
      properties:
        file:
          type: string
          format: binary
          description: >-
            CSV history, detailed Saxo XLSX, or original IBKR funding XLS/XLSX,
            maximum 50 MiB. Saxo requires portfolio_format=saxo_transaction_history
            and the Transacties, _Transacties, and Bookings sheets. IBKR funding
            requires portfolio_format=ibkr_funding_history and original Deposit
            and Withdrawal sheet headers. Workbook structure, size, identifiers,
            formulas and accounting detail are validated before staging.
            Legacy XLS is accepted only for native IBKR funding history.
        adapter_name:
          type: string
          description: Display label for the import source
        transfer_destination_account_id:
          type: integer
          minimum: 1
          description: Optional active portfolio account receiving asset withdrawals. Must differ from the source account. Unresolved withdrawal destinations block reconciliation; no account is guessed.
        transfer_origin_account_id:
          type: integer
          minimum: 1
          description: Optional active portfolio account supplying incoming asset returns. Must differ from the statement account. Original acquisition lots and costs are carried; transfer-time market valuations are not purchase costs.
        included_symbols:
          type: string
          maxLength: 500
          description: Optional comma-separated exact adapter asset symbols. Omit for the full statement. Unselected parsed rows remain outside this batch and are counted in custom_config.scope_excluded_rows. Parse errors still block review. Literal source records and source identity are preserved.
        yield_basis_policy:
          type: string
          enum: [zero]
          description: Explicit known-zero cost for Kinesis distribution units and reversals. Income valuations remain recorded; unrelated original gifts and purchases retain their basis.
        portfolio_format:
          type: string
          enum:
            - ibkr_transaction_history
            - ibkr_funding_history
            - kinesis_transaction_history
            - nexo_transaction_history
            - nexo_pro_spot_history
            - saxo_transaction_history
          description: >-
            Specialized portfolio statement parser; omit for generic column
            mapping. Maintained IBKR, Kinesis, Nexo, Nexo Pro, and Saxo formats require
            is_brokerage=true and account_id because their transaction histories
            include or affect sleeve cash movements. Automatic source selection
            is a frontend convenience; API callers provide this field. Saxo
            accepts CSV and detailed XLSX; net-only CSV dividends remain review
            errors because gross income and withholding taxes are unavailable.
            IBKR Transaction History funding values are statement-base amounts;
            the native funding workbook proves original amounts and currencies.
            A separate funding correction scope with prefer_source updates exact
            existing cash matches and creates no new financial records. Unproved
            new Transaction History funding records cannot be committed.
            Nexo Pro Spot uses filled quantities, execution prices and literal
            fee currency. Its timestamp retains the exported calendar date;
            the adapter does not establish that it is an execution timestamp.
        date_format:
          type: string
          description: "Python strptime format, default: %Y-%m-%d"
        separator:
          type: string
          description: Single-character CSV delimiter, default ','
        encoding:
          type: string
          default: utf-8
          description: UTF-8, Latin-1 (latin1, latin-1, iso-8859-1), or windows-1252; unsupported values reject with 400.
        number_format:
          $ref: "#/components/schemas/CsvNumberFormat"
        skip_rows:
          type: integer
          default: 0
          minimum: 0
          description: Physical leading lines before the CSV header.
        date_column: { type: string }
        type_column: { type: string }
        symbol_column: { type: string }
        name_column: { type: string }
        units_column: { type: string }
        price_column: { type: string }
        amount_column: { type: string }
        fees_column: { type: string }
        taxes_column: { type: string }
        currency_column: { type: string }
        fx_rate_column: { type: string }
        note_column: { type: string }
        source_id_column:
          type: string
          maxLength: 200
          description: Optional CSV header for the literal provider event ID. Trimmed; blank or omitted leaves source_id unmapped.
        source_account_column:
          type: string
          maxLength: 200
          description: Optional CSV header for the literal provider account identity. Trimmed; blank or omitted leaves source_account unmapped.
        default_asset_class:
          type: string
          enum: [stock, etf, crypto, metals, real_estate, savings, bond]
        default_type:
          type: string
          enum: [buy, sell, dividend, fee, tax, interest]
        type_mapping:
          type: string
          description: JSON object mapping raw CSV type strings to canonical portfolio_txn_type values
        is_brokerage:
          type: boolean
          description: Brokerage fan-out (ADR-095) — cash rows land on a ledger account
        account_id:
          type: integer
          format: int32
          minimum: 1
          description: >-
            Sleeve account every row of this import lands on. Required when
            is_brokerage is true or portfolio_format is a maintained
            transaction-history parser; ignored otherwise. Must be a positive
            integer; malformed values are rejected rather than coerced.

    PortfolioParserConfig:
      type: object
      required: [id, name, config]
      properties:
        id:
          type: integer
        name:
          type: string
        config:
          type: object
          additionalProperties: true
          properties:
            accountId:
              type: integer
              minimum: 1
              description: Optional active portfolio account used as the file-level broker destination.
            transferDestinationAccountId:
              type: integer
              minimum: 1
              description: Optional custody account receiving asset withdrawals.
            transferOriginAccountId:
              type: integer
              minimum: 1
              description: Optional custody account supplying incoming asset returns.
            yieldBasisPolicy:
              type: string
              enum: [zero]
              description: Optional explicit known-zero basis policy for Kinesis yield unit receipts and reversals.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ─── Import ───────────────────────────────────────────────────────────────
    ImportBatch:
      type: object
      required:
        - id
        - adapter_name
        - source_filename
        - source_size_bytes
        - status
        - rows_total
        - rows_imported
        - rows_duplicate
        - rows_error
        - error_summary
        - started_at
        - completed_at
        - transactions_remaining
      properties:
        id:
          type: string
          description: PostgreSQL BIGINT serialized by node-postgres as a string.
        adapter_name:
          type: string
        source_filename:
          type: string
          nullable: true
        source_size_bytes:
          type: string
          nullable: true
          description: PostgreSQL BIGINT serialized by node-postgres as a string.
        custom_config:
          type: object
          additionalProperties: true
          nullable: true
          description: Present on batch-detail responses; omitted from batch-list rows.
        status:
          type: string
          enum:
            [
              pending,
              staging,
              validating,
              matching,
              awaiting_review,
              committing,
              complete,
              failed,
              aborted,
            ]
        rows_total:
          type: integer
        rows_imported:
          type: integer
        rows_duplicate:
          type: integer
        rows_error:
          type: integer
        error_summary:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        transactions_remaining:
          type: integer

    # Body of the 201 answer from POST /api/import/csv and /api/import/csv/custom,
    # built by buildImportResult(buildPipelineResult(...)) in routes/importRoutes.js.
    ImportCsvResult:
      type: object
      required:
        [
          total,
          imported,
          duplicates,
          errors,
          batch_id,
          auto_linked_count,
          status,
          error_message,
          links,
        ]
      properties:
        total:
          type: integer
          description: Rows read from the CSV.
        imported:
          type: integer
        duplicates:
          type: integer
        errors:
          type: integer
          description: Validation errors plus commit errors.
        batch_id:
          type: integer
        auto_linked_count:
          type: integer
          description: Planned payments auto-cleared by the imported transactions.
        status:
          type: string
          enum: [completed, completed_with_errors]
        error_message:
          type: string
          nullable: true
        links:
          type: array
          items:
            $ref: "#/components/schemas/Link"

    # Body of the 202 answer from the same two routes: rows need user review, so
    # nothing was committed and no counts exist yet.
    ImportCsvReviewRequired:
      type: object
      required: [batch_id, requires_review, match_source_counts]
      properties:
        batch_id:
          type: integer
        requires_review:
          type: boolean
        match_source_counts:
          type: object
          description: Rows per match source (exact / fuzzy / pattern / new).
          additionalProperties:
            type: integer

    # ─── Recipient sub-resources ──────────────────────────────────────────────
    RecipientPattern:
      type: object
      description: A `recipient_match_patterns` row as `listPatternsForRecipient` selects it.
      required:
        [
          id,
          pattern,
          pattern_kind,
          case_sensitive,
          priority,
          is_active,
          source,
          created_at,
        ]
      properties:
        id:
          type: integer
        pattern:
          type: string
        pattern_kind:
          type: string
          enum: [literal_prefix, glob, regex]
        case_sensitive:
          type: boolean
        priority:
          type: integer
          format: int32
        is_active:
          type: boolean
        source:
          type: string
          enum: [user, suggested, system]
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RecipientBankAccount:
      type: object
      required: [id, recipient_id, account_number, is_primary, is_active]
      properties:
        id:
          type: integer
        recipient_id:
          type: integer
        account_number:
          type: string
        bank_name:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        account_label:
          type: string
          nullable: true
        is_primary:
          type: boolean
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    # ─── Market ───────────────────────────────────────────────────────────────
    MarketSearchResult:
      type: object
      required: [symbol, name, exchange, type]
      properties:
        symbol:
          type: string
        name:
          type: string
        exchange:
          type: string
        currency:
          type: string
        type:
          type: string

# ─── Paths ───────────────────────────────────────────────────────────────────
paths:
  # ─── Tags ───────────────────────────────────────────────────────────────────

  /api/tags:
    get:
      summary: List tags
      operationId: getTags
      tags: [Tags]
      parameters:
        - in: query
          name: active
          schema:
            type: string
            enum: ["true", "false", "all"]
          description: Filter by active status (default true; `all` disables the filter). Accepts true/false/1/0; other values use the default.
        - $ref: "#/components/parameters/OptionalLimit"
        - $ref: "#/components/parameters/OptionalOffset"
      responses:
        "200":
          description: Tag list (complete unless limit/offset are supplied)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TagList"
    post:
      summary: Create or reactivate tag
      operationId: createTag
      tags: [Tags]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagCreate"
      responses:
        "400":
          description: "VALIDATION_ERROR: missing or empty slug, or a field of the wrong type"
        "200":
          description: Existing active tag returned (`created` is false)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/Tag"
                          - type: object
                            required: [created]
                            properties:
                              created:
                                type: boolean
                                enum: [false]
        "201":
          description: Created or reactivated tag (`created` distinguishes the two)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/Tag"
                          - type: object
                            required: [created]
                            properties:
                              created:
                                type: boolean

  /api/tags/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    patch:
      summary: Update tag color or active status
      operationId: updateTag
      tags: [Tags]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagUpdate"
      responses:
        "200":
          description: Updated tag
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Tag"
        "400":
          description: "VALIDATION_ERROR: malformed id or a field of the wrong type"
        "404":
          description: Tag not found
    delete:
      summary: Soft-delete tag (sets is_active=false)
      operationId: deleteTag
      tags: [Tags]
      responses:
        "200":
          description: The deactivated tag (soft delete — the row survives)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          description: Tag not found

  # ─── Manual analysis workspace ─────────────────────────────────────────────
  /api/analysis/catalog:
    get:
      summary: List approved analysis datasets, fields, measures, and joins
      operationId: getAnalysisCatalog
      tags: [Analysis]
      responses:
        "200":
          description: Versioned analysis catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }

  /api/analysis/compile:
    post:
      summary: Compile a visual analysis plan to generated SQL
      description: Money sums require currency grouping or a single-currency equality filter. Event unit sums require investment grouping or a single-investment equality filter. Visual limit is an executor page size, not an inner SQL cap.
      operationId: compileAnalysis
      tags: [Analysis]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnalysisVisualPlan" }
      responses:
        "200":
          description: Generated SQL, result columns, datasets, and normalized plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400":
          {
            description: "VALIDATION_ERROR for a mistyped plan; otherwise an invalid or duplication-unsafe visual plan",
          }

  /api/analysis/interchange/import:
    post:
      operationId: importAnalysisInterchange
      summary: Parse a CSV or Vision XLSX scenario attachment without persistence
      tags: [Analysis]
      description: Read-only shared TypeScript value inference. CSV allows 1,000,000 bytes, 1000 rows and 32 normalized unique columns. XLSX allows 10,000,000 bytes (the tighter existing parser cap), stored ZIP Results/Provenance sheets with CRC validation, then the attachment cap of 1000 rows/32 columns. Formula cells are ignored/null and counted; dates retain Excel 1900 behavior; provenance identifiers are restored while units are stripped. Caller retains its five-attachment cap and CSV replacement versus workbook append behavior. No formulas, Analysis execution, database or settings writes.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, format]
              properties:
                file: { type: string, format: binary }
                format: { type: string, enum: [csv, xlsx] }
      responses:
        "200":
          description: Inferred value-only attachment and raw ignored-formula count.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        {
                          $ref: "#/components/schemas/AnalysisInterchangeImport",
                        }
        "400":
          {
            description: Invalid format,
            file,
            upload limit,
            CSV structure or bounds,
            ZIP/CRC/XML,
            provenance or attachment bounds.,
          }
        "429": { description: API or existing Analysis rate limit exceeded. }
        "500": { description: Upload source read failed. }

  /api/analysis/interchange/export:
    post:
      operationId: exportAnalysisInterchange
      summary: Export a supplied captured Analysis snapshot as CSV or value-only XLSX
      tags: [Analysis]
      description: Read-only shared TypeScript export of exactly the submitted result/context. The multipart file contains UTF-8 AnalysisInterchangeExportPayload JSON and has a route-scoped 64 MiB limit, allowing 100000-row XLSX snapshots beyond the global 1 MB JSON limit. XLSX retains its 100000-row limit; CSV adds no row cap. Neither format rereads or recomputes data. CSV retains formula-prefix escaping and captured metadata; XLSX emits five stored-ZIP sheets, exact long-decimal text, Excel 1900 dates and non-executable formula definitions. Client must retain original result/input signatures and unchanged-input/export eligibility checks.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, format]
              properties:
                file:
                  type: string
                  format: binary
                  description: UTF-8 JSON matching AnalysisInterchangeExportPayload; maximum 67108864 bytes.
                format: { type: string, enum: [csv, xlsx] }
      responses:
        "200":
          description: Raw bytes with Content-Disposition attachment filename analysis.csv or analysis.xlsx.
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            text/csv:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "400":
          {
            description: Missing or invalid multipart snapshot/format,
            over 64 MiB input,
            invalid result/context JSON,
            or XLSX row limit.,
          }
        "429": { description: API or existing Analysis rate limit exceeded. }
        "500": { description: Upload source read or serialization failed. }

  /api/analysis/execute:
    post:
      summary: Execute a bounded visual or custom-SQL analysis
      description: Visual money and unit measures enforce currency and investment scope. Visual limits paginate the full query result; custom SQL retains author-defined limits and currency semantics.
      operationId: executeAnalysis
      tags: [Analysis]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: "`mode: visual` requires `plan`. An omitted `mode` or `mode: sql` requires `sql`. Any other `mode` returns 400."
              oneOf:
                - type: object
                  required: [mode, plan]
                  properties:
                    mode: { type: string, enum: [visual] }
                    plan: { $ref: "#/components/schemas/AnalysisVisualPlan" }
                    requestId:
                      { type: string, pattern: "^[A-Za-z0-9_-]{8,128}$" }
                    limit: { type: number }
                    offset: { type: number }
                    workbench:
                      { $ref: "#/components/schemas/AnalysisWorkbenchInput" }
                    scenarioModel:
                      type: object
                      nullable: true
                      additionalProperties: true
                      properties:
                        attachments: { type: array, items: {} }
                        joins: { type: array, items: {} }
                    formulaModel:
                      type: object
                      nullable: true
                      additionalProperties: true
                      properties:
                        formulas:
                          {
                            type: array,
                            items: { type: object, additionalProperties: true },
                          }
                        assumptions:
                          {
                            type: array,
                            items: { type: object, additionalProperties: true },
                          }
                        assumptionValues:
                          { type: object, additionalProperties: true }
                - type: object
                  required: [sql]
                  properties:
                    mode: { type: string, enum: [sql] }
                    sql: { type: string }
                    values:
                      type: array
                      items:
                        nullable: true
                        oneOf:
                          - type: string
                          - type: number
                          - type: boolean
                    datasetIds: { type: array, items: { type: string } }
                    columns:
                      type: array
                      items:
                        type: object
                        required: [id, type]
                        additionalProperties: true
                        properties:
                          id: { type: string }
                          label: { type: string }
                          type: { type: string }
                    requestId:
                      { type: string, pattern: "^[A-Za-z0-9_-]{8,128}$" }
                    limit: { type: number }
                    offset: { type: number }
                    workbench:
                      { $ref: "#/components/schemas/AnalysisWorkbenchInput" }
                    scenarioModel:
                      type: object
                      nullable: true
                      additionalProperties: true
                      properties:
                        attachments: { type: array, items: {} }
                        joins: { type: array, items: {} }
                    formulaModel:
                      type: object
                      nullable: true
                      additionalProperties: true
                      properties:
                        formulas:
                          {
                            type: array,
                            items: { type: object, additionalProperties: true },
                          }
                        assumptions:
                          {
                            type: array,
                            items: { type: object, additionalProperties: true },
                          }
                        assumptionValues:
                          { type: object, additionalProperties: true }
      responses:
        "200":
          description: Typed, paged or explicitly truncated analysis result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400":
          {
            description: "VALIDATION_ERROR for a malformed body; ANALYSIS_EXECUTION_REJECTED when the analysis boundary rejects the query",
          }
        "408": { description: Query cancelled or timed out }
        "500":
          {
            description: Database connection,
            resource,
            or network failure (server fault,
            not a rejected query),
          }

  /api/analysis/pivot:
    post:
      summary: Aggregate complete-source pivot hierarchy with unit partitions
      operationId: executeAnalysisPivot
      tags: [Analysis]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan, config, requestId]
              properties:
                plan: { $ref: "#/components/schemas/AnalysisVisualPlan" }
                config:
                  type: object
                  required: [rows, columns, values]
                  properties:
                    rows: { type: array, maxItems: 3, items: { type: string } }
                    columns:
                      { type: array, maxItems: 3, items: { type: string } }
                    values:
                      {
                        type: array,
                        minItems: 1,
                        maxItems: 8,
                        items: { type: string },
                      }
                    filters:
                      type: array
                      items:
                        { $ref: "#/components/schemas/AnalysisVisualFilter" }
                requestId: { type: string, minLength: 8, maxLength: 110 }
      responses:
        "200":
          description: Full-source detail and subtotal levels, partitioned percentages and coverage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400": { description: Invalid pivot or complete output exceeds limits }
        "500":
          { description: Database connection, resource, or network failure }

  /api/analysis/extensions/evaluate:
    post:
      summary: Evaluate repeatable preparation, calendar comparisons and isolated scenarios
      operationId: evaluateAnalysisExtension
      tags: [Analysis]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation, rows]
              properties:
                operation:
                  {
                    type: string,
                    enum:
                      [prepare, time, scenarios, sensitivity, goal, formulas],
                  }
                rows:
                  {
                    type: array,
                    maxItems: 1000,
                    items: { type: object, additionalProperties: true },
                  }
                columns:
                  type: array
                  items: { $ref: "#/components/schemas/AnalysisColumnRef" }
                complete: { type: boolean }
                inputComplete: { type: boolean }
                window: { type: object, additionalProperties: true }
                coverage: { type: object, additionalProperties: true }
                workbench:
                  { $ref: "#/components/schemas/AnalysisWorkbenchInput" }
                formulas:
                  {
                    type: array,
                    items: { type: object, additionalProperties: true },
                  }
                assumptions: { type: object, additionalProperties: true }
                assumptionUnits: { type: object, additionalProperties: true }
                dateColumn: { type: string }
                valueColumns: { type: array, items: { type: string } }
                outcomeId: { type: string }
                variableId: { type: string }
                target: { oneOf: [{ type: string }, { type: number }] }
                lower: { oneOf: [{ type: string }, { type: number }] }
                upper: { oneOf: [{ type: string }, { type: number }] }
              additionalProperties: true
      responses:
        "200":
          description: Bounded transformed values, coverage, lineage and explicit calculation errors
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400":
          {
            description: Invalid operation,
            partial population or resource limit exceeded,
          }

  /api/analysis/cancel/{requestId}:
    parameters:
      - in: path
        name: requestId
        required: true
        schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,128}$" }
    post:
      summary: Cancel a running analysis query
      operationId: cancelAnalysis
      tags: [Analysis]
      responses:
        "200":
          description: Cancellation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400": { description: "VALIDATION_ERROR: malformed requestId" }

  /api/analysis/drill:
    post:
      summary: Resolve a grouped visual result row to contributing records
      operationId: drillAnalysis
      tags: [Analysis]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan: { $ref: "#/components/schemas/AnalysisVisualPlan" }
                row:
                  type: object
                  additionalProperties: true
                  description: The grouped result row to resolve
                requestId: { type: string }
      responses:
        "200":
          description: Bounded source-record result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400": { description: Invalid drill-through request }
        "500":
          { description: Database connection, resource, or network failure }

  /api/analysis/formulas/evaluate:
    post:
      summary: Evaluate bounded typed formulas and isolated assumptions
      description: Optional inputComplete defaults to true. Incomplete input suppresses evaluated aggregates with INCOMPLETE_INPUT. Failed cells report a zero-based rowIndex without clearing other rows; consumed failed references report DEPENDENCY_ERROR. Numeric aggregates reject mixed contributing currency values with MIXED_CURRENCIES; omitted currency metadata cannot be inferred.
      operationId: evaluateAnalysisFormulas
      tags: [Analysis]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              additionalProperties: true
              properties:
                rows:
                  {
                    type: array,
                    items: { type: object, additionalProperties: true },
                  }
                formulas:
                  {
                    type: array,
                    items: { type: object, additionalProperties: true },
                  }
                assumptions: { type: object, additionalProperties: true }
                inputComplete: { type: boolean, default: true }
                columns:
                  type: array
                  items: { $ref: "#/components/schemas/AnalysisColumnRef" }
                assumptionUnits: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Formula rows, summaries, and explicit errors
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400": { description: Invalid or over-limit formula request }

  /api/analysis/ai-proposals/preview:
    post:
      summary: Validate and preview a typed AI edit without changing the analysis
      operationId: previewAnalysisProposal
      tags: [Analysis]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiAnalysisEditProposal" }
      responses:
        "200":
          description: Inspectable before and after definitions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400": { description: Invalid edit proposal }
        "409": { description: Base analysis version changed }

  /api/analysis/ai-proposals/apply:
    post:
      summary: Apply a previously inspected typed edit as a new version
      operationId: applyAnalysisProposal
      tags: [Analysis]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiAnalysisEditProposal" }
      responses:
        "200":
          description: Newly versioned saved analysis
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400": { description: Invalid edit proposal }
        "409": { description: Base analysis version changed }

  /api/analysis/saved:
    get:
      summary: List saved analyses, optionally by workspace
      operationId: listSavedAnalyses
      tags: [Analysis]
      parameters:
        - in: query
          name: workspace
          description: An empty value lists every workspace. Any other value outside the enum, or a repeated key, returns 400.
          schema:
            type: string
            enum: [budgeting, portfolio, research, cross-workspace]
      responses:
        "200":
          description: Saved analysis library
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400": { description: "VALIDATION_ERROR: unknown workspace" }
    post:
      summary: Save the first immutable definition version of an analysis
      operationId: createSavedAnalysis
      tags: [Analysis]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/AnalysisSavedFields"
                - type: object
                  required: [name, workspace, querySpec]
      responses:
        "201":
          description: Saved analysis
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400": { description: Invalid analysis definition }

  /api/analysis/saved/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get the current definition and last usable result
      operationId: getSavedAnalysis
      tags: [Analysis]
      responses:
        "200":
          description: Saved analysis
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "404": { description: Saved analysis not found }
    put:
      summary: Append a new immutable analysis definition version
      operationId: updateSavedAnalysis
      tags: [Analysis]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/AnalysisSavedFields"
                - type: object
                  required: [querySpec]
                  properties:
                    expectedVersion:
                      nullable: true
                      oneOf:
                        - { type: integer, minimum: 1 }
                        - { type: string }
      responses:
        "200":
          description: Updated saved analysis
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400": { description: Invalid analysis definition }
        "404": { description: Saved analysis not found }
    delete:
      summary: Delete a saved analysis and its private versions and runs
      operationId: deleteSavedAnalysis
      tags: [Analysis]
      responses:
        "204": { description: Saved analysis deleted }
        "404": { description: Saved analysis not found }

  /api/analysis/saved/{id}/run:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Refresh a saved analysis and record success or failure
      operationId: runSavedAnalysis
      tags: [Analysis]
      responses:
        "200":
          description: Refreshed saved analysis
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400": { description: Refresh failed }
        "404": { description: Saved analysis not found }
        "500":
          { description: Database connection, resource, or network failure }

  /api/analysis/saved/{id}/versions:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: List immutable definition and scenario versions
      operationId: listSavedAnalysisVersions
      tags: [Analysis]
      responses:
        "200":
          description: Version history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }

  /api/analysis/saved/{id}/ai-proposal:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Ask the configured local model for a typed inspectable edit proposal
      operationId: generateAnalysisProposal
      tags: [Analysis]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instruction]
              properties:
                instruction:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: Trimmed before the length check.
                model: { type: string, nullable: true, maxLength: 200 }
      responses:
        "200":
          description: Schema-valid before and after preview; no edit has been applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400":
          {
            description: Invalid instruction,
            or the proposal fails the saved analysis preview,
          }
        "404": { description: Saved analysis not found }
        "502":
          {
            description: "BAD_GATEWAY: the local model failed, returned invalid JSON, or returned a proposal outside the edit contract",
          }

  /api/analysis/saved/{id}/restore:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Restore an earlier definition and scenario as a new version
      operationId: restoreSavedAnalysisVersion
      tags: [Analysis]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, expectedVersion]
              properties:
                version: { type: integer, minimum: 1 }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Restored saved analysis
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400":
          {
            description: "VALIDATION_ERROR: version or expectedVersion is not a positive integer",
          }
        "404": { description: Saved analysis or version not found }
        "409": { description: Current version changed }

  # ─── Deterministic local analysis and evidence monitors ─────────────────────
  /api/analysis/monitors:
    get:
      summary: List bounded monitor rules with their latest observation
      operationId: listAnalysisMonitors
      tags: [AnalysisMonitors]
      parameters:
        - {
            in: query,
            name: limit,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
        - {
            in: query,
            name: offset,
            schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 },
          }
      responses:
        "200":
          description: Paged local monitor rules
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/AnalysisMonitorListEnvelope" }
        "400": { description: Invalid pagination }
    post:
      summary: Create a local threshold or dossier evidence monitor
      operationId: createAnalysisMonitor
      tags: [AnalysisMonitors]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnalysisMonitorCreate" }
      responses:
        "201":
          description: Created rule; first valid check will establish a baseline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalysisMonitorEnvelope" }
        "400":
          { description: Invalid rule, frozen analysis, or nonnumeric field }
        "404": { description: Monitor target not found }

  /api/analysis/monitors/notifications:
    get:
      summary: List durable in-app monitor notifications and unread count
      operationId: listAnalysisMonitorNotifications
      tags: [AnalysisMonitors]
      parameters:
        - {
            in: query,
            name: limit,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
        - {
            in: query,
            name: offset,
            schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 },
          }
      responses:
        "200":
          description: Paged notifications and server-owned unread count
          content:
            application/json:
              schema:
                {
                  $ref: "#/components/schemas/AnalysisMonitorNotificationListEnvelope",
                }
        "400": { description: Invalid pagination }

  /api/analysis/monitors/notifications/{id}/read:
    parameters:
      - {
          in: path,
          name: id,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      summary: Mark one monitor notification read
      operationId: readAnalysisMonitorNotification
      tags: [AnalysisMonitors]
      responses:
        "200":
          description: Read notification
          content:
            application/json:
              schema:
                {
                  $ref: "#/components/schemas/AnalysisMonitorNotificationEnvelope",
                }
        "400": { description: Invalid notification ID }
        "404": { description: Notification not found }

  /api/analysis/monitors/{id}:
    parameters:
      - {
          in: path,
          name: id,
          required: true,
          schema: { type: string, format: uuid },
        }
    patch:
      summary: Edit a monitor rule without changing its target
      operationId: patchAnalysisMonitor
      tags: [AnalysisMonitors]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnalysisMonitorUpdate" }
      responses:
        "200":
          description: Updated rule; changed threshold conditions establish a fresh baseline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalysisMonitorEnvelope" }
        "400": { description: Invalid edit or evidence-monitor condition }
        "404": { description: Monitor not found }
        "409": { description: Monitor check already running }
    delete:
      summary: Delete one monitor, its observations, and inbox notifications
      operationId: deleteAnalysisMonitor
      tags: [AnalysisMonitors]
      responses:
        "204": { description: Monitor and its history deleted }
        "400": { description: Invalid monitor ID }
        "404": { description: Monitor not found }

  /api/analysis/monitors/{id}/check:
    parameters:
      - {
          in: path,
          name: id,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      summary: Run one local monitor check and persist its observation
      operationId: checkAnalysisMonitor
      tags: [AnalysisMonitors]
      responses:
        "200":
          description: New baseline, unchanged, triggered, cooldown, partial, stale, or failed observation
          content:
            application/json:
              schema:
                {
                  $ref: "#/components/schemas/AnalysisMonitorObservationEnvelope",
                }
        "400": { description: Invalid monitor ID }
        "404": { description: Monitor not found }
        "409": { description: Monitor disabled, already running, or superseded }

  /api/analysis/monitors/{id}/observations:
    parameters:
      - {
          in: path,
          name: id,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      summary: List durable monitor observations newest first
      operationId: listAnalysisMonitorObservations
      tags: [AnalysisMonitors]
      parameters:
        - {
            in: query,
            name: limit,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
        - {
            in: query,
            name: offset,
            schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 },
          }
      responses:
        "200":
          description: Paged observation history, including visible failed and partial checks
          content:
            application/json:
              schema:
                {
                  $ref: "#/components/schemas/AnalysisMonitorObservationListEnvelope",
                }
        "400": { description: Invalid monitor ID or pagination }
        "404": { description: Monitor not found }

  # ─── Durable local research dossiers ───────────────────────────────────────
  /api/research-dossiers:
    get:
      summary: List bounded local research dossier summaries in latest-update order
      operationId: listResearchDossiers
      tags: [ResearchDossiers]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Paged dossier summaries and total count; evidence requires an individual GET
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/ResearchDossierListEnvelope" }
        "400": { description: Invalid pagination }
    post:
      summary: Create a local research dossier and version one
      operationId: createResearchDossier
      tags: [ResearchDossiers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResearchDossierContent" }
      responses:
        "201":
          description: Created dossier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResearchDossierEnvelope" }
        "400": { description: Invalid content, link, or document provenance }

  /api/research-dossiers/export:
    get:
      summary: Export all current dossiers with every version as JSON
      operationId: exportResearchDossiers
      tags: [ResearchDossiers]
      responses:
        "200":
          description: Complete portable JSON snapshot; no import endpoint
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/ResearchDossierExportEnvelope" }

  /api/research-dossiers/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Read a current research dossier with live and deleted link details
      operationId: getResearchDossier
      tags: [ResearchDossiers]
      responses:
        "200":
          description: Current dossier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResearchDossierEnvelope" }
        "404": { description: Dossier not found }
    put:
      summary: Append an immutable version if expectedVersion still matches
      operationId: updateResearchDossier
      tags: [ResearchDossiers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ResearchDossierContent"
                - type: object
                  required: [expectedVersion]
                  properties:
                    expectedVersion: { type: integer, minimum: 1 }
      responses:
        "200":
          description: New current version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResearchDossierEnvelope" }
        "400": { description: Invalid content, link, or document provenance }
        "404": { description: Dossier not found }
        "409": { description: Expected version is stale }
    delete:
      summary: Delete a dossier and all its versions
      operationId: deleteResearchDossier
      tags: [ResearchDossiers]
      responses:
        "204": { description: Dossier deleted }
        "404": { description: Dossier not found }

  /api/research-dossiers/{id}/versions:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: List immutable dossier content snapshots, newest first
      operationId: listResearchDossierVersions
      tags: [ResearchDossiers]
      responses:
        "200":
          description: Version snapshots
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/ResearchDossierVersionsEnvelope" }
        "404": { description: Dossier not found }

  /api/research-dossiers/{id}/restore:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Copy a historical snapshot into a new current version
      operationId: restoreResearchDossier
      tags: [ResearchDossiers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, expectedVersion]
              properties:
                version: { type: integer, minimum: 1 }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Restored content at a new version number
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResearchDossierEnvelope" }
        "400":
          {
            description: Historical link or source cannot be restored as requested,
          }
        "404": { description: Dossier or version not found }
        "409": { description: Expected version is stale }

  /api/research-dossiers/{id}/export:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Export one current dossier with every version as JSON
      operationId: exportResearchDossier
      tags: [ResearchDossiers]
      responses:
        "200":
          description: Portable JSON snapshot; no import endpoint
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/ResearchDossierExportEnvelope" }
        "404": { description: Dossier not found }

  # ─── Bounded AI research ──────────────────────────────────────────────────
  /api/ai-research/status:
    get:
      summary: Inspect local, web, and optional cloud route capabilities
      operationId: getAiResearchStatus
      tags: [AIResearch]
      responses:
        "200":
          description: Configured capabilities without credentials, including optional AgentCloak mode and location. Desktop mode reports protect-and-block; MCP mode reports block-on-change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }

  /api/ai-research/agentcloak-desktop:
    get:
      summary: Inspect AgentCloak Desktop availability and protection state
      operationId: getAgentCloakDesktopStatus
      tags: [AIResearch]
      responses:
        "200":
          description: Effective Desktop preference, fresh availability probe, mapping key state, and OpenAI route state; no secret values
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        { $ref: "#/components/schemas/AgentCloakDesktopStatus" }
    put:
      summary: Enable or disable AgentCloak Desktop protection
      description: Enabling probes the Desktop loopback endpoint and ensures a local encrypted-reference mapping key before saving the boolean preference. Disabling saves the preference without deleting the key.
      operationId: configureAgentCloakDesktop
      tags: [AIResearch]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: Updated Desktop status; no secret values
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        { $ref: "#/components/schemas/AgentCloakDesktopStatus" }
        "400": { description: Invalid request body }
        "409": { description: Existing local mapping key is invalid }
        "502":
          { description: AgentCloak Desktop is unavailable during enablement }
        "503": { description: Local mapping key could not be stored }

  /api/ai-research/investigations:
    get:
      summary: List recoverable AI investigation jobs
      operationId: listAiInvestigations
      tags: [AIResearch]
      responses:
        "200":
          description: Investigation jobs and explicit states
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    post:
      summary: Start a bounded evidence-backed investigation
      operationId: createAiInvestigation
      tags: [AIResearch]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiInvestigationRequest" }
      responses:
        "202":
          description: Persisted queued job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400": { description: Invalid scope, route, or limits }

  /api/ai-research/investigations/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get a job, checkpoints, partial evidence, and answer
      operationId: getAiInvestigation
      tags: [AIResearch]
      responses:
        "200":
          description: Investigation state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "404": { description: Investigation not found }
    delete:
      summary: Delete a local investigation and its checkpoints
      operationId: deleteAiInvestigation
      tags: [AIResearch]
      responses:
        "204": { description: Investigation deleted }
        "404": { description: Investigation not found }

  /api/ai-research/investigations/{id}/resume:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Resume a recoverable job while reusing completed steps
      operationId: resumeAiInvestigation
      tags: [AIResearch]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                clarification: { type: string, minLength: 1, maxLength: 1000 }
                scope:
                  type: object
                  additionalProperties: false
                  required: [workspaces]
                  properties:
                    workspaces:
                      type: array
                      minItems: 1
                      maxItems: 4
                      items:
                        type: string
                        enum: [budgeting, portfolio, research, cross-workspace]
                    accountIds:
                      type: array
                      maxItems: 100
                      items: { type: integer, minimum: 1 }
                    investmentIds:
                      type: array
                      maxItems: 100
                      items: { type: integer, minimum: 1 }
                    dateFrom: { type: string, format: date, nullable: true }
                    dateTo: { type: string, format: date, nullable: true }
                    currency:
                      { type: string, pattern: "^[A-Z]{3}$", default: EUR }
                    constraints:
                      type: array
                      maxItems: 30
                      items: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "202":
          description: Resume accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "404": { description: Investigation not found }

  /api/ai-research/investigations/{id}/cancel:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Request cancellation and abort an active provider call
      operationId: cancelAiInvestigation
      tags: [AIResearch]
      responses:
        "200":
          description: Cancellation requested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "404": { description: Investigation not found }

  /api/ai-research/documents:
    get:
      summary: List locally indexed user-selected research documents
      operationId: listAiResearchDocuments
      tags: [AIResearch]
      responses:
        "200":
          description: Local document versions and extraction states
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    post:
      summary: Index one bounded text, Markdown, or HTML document locally
      operationId: createAiResearchDocument
      tags: [AIResearch]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                title: { type: string, maxLength: 300 }
                source_name: { type: string, maxLength: 500 }
      responses:
        "201":
          description: Indexed document or explicit unsupported state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400":
          {
            description: "Missing, unsupported, empty, unreadable, or oversized file, or a text field sent more than once",
          }

  /api/ai-research/documents/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get a local document and passage metadata
      operationId: getAiResearchDocument
      tags: [AIResearch]
      responses:
        "200":
          description: Document details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "404": { description: Document not found }
    delete:
      summary: Delete a document and all derived passages and embeddings
      operationId: deleteAiResearchDocument
      tags: [AIResearch]
      responses:
        "204": { description: Document and derived indexes deleted }
        "404": { description: Document not found }

  /api/ai-research/documents/search/passages:
    post:
      summary: Retrieve cited keyword, semantic, or hybrid local passages
      operationId: searchAiResearchPassages
      tags: [AIResearch]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  minLength: 1
                  description: Trimmed before use; a blank query is rejected.
                mode:
                  type: string
                  enum: [hybrid, keyword, semantic]
                  default: hybrid
                limit:
                  type: integer
                  minimum: 1
                  default: 8
                  description: The service caps results at 20.
      responses:
        "200":
          description: Bounded passages with document, version, page, and section locators
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400":
          {
            description: "VALIDATION_ERROR: missing or blank query, unknown mode, or a limit that is not a positive integer",
          }

  /api/ai-research/disclosures/preview:
    post:
      summary: Protect selected text when Desktop mode is enabled, then preview the exact canonical cloud payload and run AgentCloak preflight
      operationId: previewAiDisclosure
      tags: [AIResearch]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiInvestigationRequest" }
      responses:
        "200":
          description: Payload, digest, field manifest, disclosure units, any encrypted local reference scope including Desktop-detected values, and AgentCloak preflight status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400":
          {
            description: Invalid or non-cloud request,
            or AgentCloak flagged public or remaining cloud text,
          }
        "502":
          {
            description: Enabled AgentCloak detection or preflight was unavailable or returned an invalid response,
          }
        "503": { description: Reversible-reference key unavailable }

  /api/ai-research/disclosures/grants:
    get:
      summary: List local disclosure grants and revocation state
      operationId: listAiDisclosureGrants
      tags: [AIResearch]
      responses:
        "200":
          description: Disclosure grants without payloads or credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    post:
      summary: Grant bounded egress for one inspected payload digest
      operationId: createAiDisclosureGrant
      tags: [AIResearch]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "201":
          description: Persisted, expiring grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400": { description: Invalid grant or retention request }

  /api/ai-research/disclosures/grants/{id}/revoke:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Revoke a grant before any queued request or retry
      operationId: revokeAiDisclosureGrant
      tags: [AIResearch]
      responses:
        "200":
          description: Grant revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "404": { description: Grant not found }

  /api/ai-research/disclosures/records:
    get:
      summary: Inspect minimal local disclosure metadata and usage
      operationId: listAiDisclosureRecords
      tags: [AIResearch]
      responses:
        "200":
          description: Metadata-only disclosure records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    delete:
      summary: Delete all local disclosure records and grants
      operationId: deleteAiDisclosureRecords
      tags: [AIResearch]
      responses:
        "200":
          description: Deleted record and grant counts; deleting grants revokes unused consent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }

  /api/cross-workspace/commitment-aware-cash:
    post:
      summary: Estimate a 90-day candidate cash cap after planned commitments
      description: >-
        Projects the lowest end-of-day spendable balance from active unexecuted
        planned transactions, including bounded recurring occurrences once.
        Subtracts the editable reserve floor. Excludes statistical forecasts and
        unplanned expenses; the result is an estimate, not a guarantee.
      operationId: computeCommitmentAwareCash
      tags: [CrossWorkspace]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currency: { type: string, pattern: "^[A-Za-z]{3}$" }
                reserveFloor:
                  { type: number, minimum: 0, default: 0, nullable: true }
      responses:
        "200":
          description: Candidate cap and projection assumptions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          [
                            currency,
                            today,
                            horizonEnd,
                            horizonDays,
                            currentCash,
                            reserveFloor,
                            minimumProjectedBalance,
                            minimumDate,
                            candidateCashCap,
                            occurrenceCount,
                            assumptions,
                          ]
                        properties:
                          currency: { type: string }
                          today: { type: string, format: date }
                          horizonEnd: { type: string, format: date }
                          horizonDays: { type: integer, enum: [90] }
                          currentCash: { type: number }
                          reserveFloor: { type: number }
                          minimumProjectedBalance: { type: number }
                          minimumDate: { type: string, format: date }
                          candidateCashCap: { type: number }
                          occurrenceCount: { type: integer }
                          assumptions:
                            type: object
                            required:
                              [
                                plannedOnly,
                                excludesStatisticalForecast,
                                excludesFutureIncome,
                                excludesUnplannedExpenses,
                                currencyConversionAtRecentRates,
                              ]
                            properties:
                              plannedOnly: { type: boolean }
                              excludesStatisticalForecast: { type: boolean }
                              excludesFutureIncome: { type: boolean }
                              excludesUnplannedExpenses: { type: boolean }
                              currencyConversionAtRecentRates: { type: boolean }
        "400":
          description: VALIDATION_ERROR — body is not an object, or invalid reserve floor or currency

  /api/cross-workspace/rebalance:
    post:
      summary: Cash-aware rebalancing plan (ADR-098)
      description: >-
        Deploy spendable account cash into underweight portfolio sleeves toward a
        target allocation, without selling. Composes Budgeting + Portfolio.
      operationId: computeRebalance
      tags: [CrossWorkspace]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currency: { type: string }
                model:
                  type: string
                  enum: [sixty_forty, all_weather, three_fund, awesome]
                targetWeights:
                  type: object
                  additionalProperties: { type: number }
                availableCash:
                  type: number
                  description: Optional cash cap. A non-numeric value is ignored.
      responses:
        "200":
          description: Rebalancing plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          description: Body is not a JSON object, or the target weights are invalid

  /api/accounts:
    get:
      summary: List accounts
      operationId: getAccounts
      tags: [Accounts]
      parameters:
        - in: query
          name: active
          schema:
            type: string
            enum: ["true", "false", "all"]
          description: Filter by active status (default true)
        - $ref: "#/components/parameters/OptionalLimit"
        - $ref: "#/components/parameters/OptionalOffset"
      responses:
        "200":
          description: Account list (complete unless limit/offset are supplied)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AccountList"
    post:
      summary: Create account
      operationId: createAccount
      tags: [Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreate"
      responses:
        "201":
          description: Created account
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Account"
        "400":
          description: Invalid field (for example funding_account_id is not a positive integer or does not identify an existing account)
        "409":
          description: An account with that name already exists

  /api/accounts/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    get:
      summary: Get one account
      operationId: getAccount
      tags: [Accounts]
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Account"
        "404":
          description: Account not found
    patch:
      summary: Update account
      operationId: updateAccount
      tags: [Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdate"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Account"
        "400":
          description: Invalid field (for example funding_account_id is invalid, self-referencing, missing, or closes a funding cycle)
        "404":
          description: Account not found
        "409":
          description: An account with that name already exists
    delete:
      summary: Delete account (409 if still referenced — archive instead)
      operationId: deleteAccount
      tags: [Accounts]
      responses:
        "204":
          description: No Content
        "404":
          description: Account not found
        "409":
          description: Account still has transactions; archive it instead

  /api/accounts/{id}/portfolio-lot-retag-preview:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    get:
      summary: Preview portfolio lot rows assigned to an account
      operationId: previewAccountPortfolioLots
      tags: [Accounts]
      description: >-
        Returns the exact buy, gift, and sell row count assigned to the account.
        Transaction IDs are returned only when the complete selection fits the
        500-row audited bulk broker re-tag limit; a partial ID list is never returned.
      responses:
        "200":
          description: Account portfolio lot preview
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          [account_id, eligible_count, transaction_ids, limit]
                        properties:
                          account_id:
                            type: integer
                            format: int32
                          eligible_count:
                            type: integer
                            minimum: 0
                          transaction_ids:
                            type: array
                            maxItems: 500
                            items:
                              type: integer
                              format: int32
                          limit:
                            type: integer
                            enum: [500]
        "404":
          description: Account not found

  /api/accounts/{id}/close:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    post:
      summary: Close an account, optionally zeroing each currency partition
      operationId: closeAccount
      tags: [Accounts]
      description: >-
        Atomically closes the account and removes it from net worth. With
        balance_handling=adjustment, writes one visible system adjustment per
        non-zero currency partition before closing; these rows are excluded
        from income and spending. Repeating a successful close is idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [balance_handling]
              properties:
                balance_handling:
                  type: string
                  enum: [preserve, adjustment]
      responses:
        "200":
          description: Account closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          description: Invalid balance handling
        "404":
          description: Account not found

  /api/accounts/{id}/merge:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
        description: Survivor account id (sources merge into this one)
    post:
      summary: Merge source accounts into this (survivor) account
      description: Repoints all references (transactions, planned, portfolio lots, funding_account_id) from each source account to this (survivor) account, then deletes the sources (ADR-088).
      operationId: mergeAccounts
      tags: [Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_ids]
              properties:
                source_ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: integer
                    format: int32
                    minimum: 1
                    maximum: 2147483647
                  description: Account ids to merge into this account and delete; must not include the survivor id
      responses:
        "200":
          description: Merge result (survivor id, merged ids, reassigned counts)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          description: Empty, oversized, malformed, or self-referencing source_ids list
        "404":
          description: Target or a source account not found

  /api/accounts/{id}/merge-preview:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
        description: Source account id (the account that would be merged away)
    get:
      summary: Preview merging this account into another (read-only)
      description: >-
        Dry-run of merging account {id} (the source) INTO the account given by
        `into` (the survivor). Returns the row counts that would be repointed
        (same categories POST /merge moves), the projected post-merge computed
        balance — the anchor+delta definition evaluated over the union of both
        accounts' active rows, in the survivor's native currency — and whether
        the merge would interleave stamped balance histories
        (`stampsInterleaved`), in which case the merge clears the survivor's
        statement-balance anchor. No mutation.
      operationId: previewAccountMerge
      tags: [Accounts]
      parameters:
        - in: query
          name: into
          required: true
          schema:
            type: integer
          description: Survivor account id (the account {id} would merge into)
      responses:
        "200":
          description: Merge preview
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          into:
                            type: integer
                            description: Survivor account id
                          source:
                            type: integer
                            description: Source account id
                          reassigned:
                            type: object
                            description: Row counts that would move to the survivor
                            properties:
                              transactions: { type: integer }
                              planned: { type: integer }
                              portfolio: { type: integer }
                              funding: { type: integer }
                          projectedBalance:
                            type: number
                            description: Post-merge computed balance — anchor+delta evaluated per currency over the union of both accounts' active rows, each currency partition converted at its own current rate into the survivor's currency
                          projectedBalanceCurrency:
                            type: string
                            description: The survivor's native currency (ISO-4217)
                          balanceParts:
                            type: array
                            description: Native per-currency balances in the projected merged ledger
                            items:
                              type: object
                              required: [currency, balance]
                              properties:
                                currency: { type: string }
                                balance: { type: number }
                          projectedBalanceIncomplete:
                            type: boolean
                            description: Whether projectedBalance excludes at least one partition because a conversion rate is unavailable
                          unconvertedCurrencies:
                            type: array
                            description: Currency codes excluded from projectedBalance because a conversion rate is unavailable
                            items: { type: string }
                          stampsInterleaved:
                            type: boolean
                            description: Whether both accounts carry stamped balance histories with overlapping date ranges (the merge would clear the survivor's statement anchor)
                          openingAnchorCollision:
                            type: boolean
                            description: Whether both accounts hold an opening balance in the same currency (only one is allowed per account and currency, so POST /merge would refuse with a 400 until one is removed)
        "400":
          description: Missing/invalid `into`, or `into` equals {id}
        "404":
          description: Source or survivor account not found

  /api/accounts/{id}/opening-balance:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
        description: Account to anchor
    post:
      summary: Set the opening-balance anchor for an account
      description: >-
        Creates (or updates) one system anchor row per account+currency with
        amount=0, a server-stamped `balance`, is_transfer=true and
        transfer_source='opening' (ADR-094 second addendum, D4). The single
        sanctioned exception to the balance write-protection; lets manual/cash-only
        accounts seed a balance. Invoking again updates the existing anchor.
      operationId: setAccountOpeningBalance
      tags: [Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [balance, date]
              properties:
                balance:
                  type: number
                  description: The opening balance to stamp
                date:
                  type: string
                  format: date
                  description: As-of date; expected to precede the account's activity
                currency:
                  type: string
                  description: 3-letter ISO code; defaults to the account currency
      responses:
        "200":
          description: The anchor transaction plus an optional warning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          description: Missing/invalid balance, date, or currency (must be a 3-letter ISO code)
        "404":
          description: Account not found

  /api/accounts/{id}/reconcile:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
        description: Account to reconcile
    post:
      summary: Reconcile an account's drift
      description: >-
        Resolves the drift (selected statement reading − reconcilable_balance) surfaced by
        the drift badge (ADR-094, Phase C). Both modes act on the reconciliation
        base — the one currency partition the statement figure is a statement for
        — so a multi-currency account resolves in its own currency and the other
        partitions are untouched. `mode: 'accept'` rewrites the stored statement
        figure to that base (no transaction created); `mode: 'adjustment'` stamps
        one server-side ledger row (amount=drift, in `reconcilable_currency`,
        balance-free, is_transfer=true, transfer_source='adjustment') so the base
        rises to meet the statement — preserving the ADR-094 descriptive-only
        default. Either way the drift collapses to 0.
      operationId: reconcileAccount
      tags: [Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [accept, adjustment]
                  description: How to resolve the drift
                currency:
                  type: string
                  pattern: "^[A-Z]{3}$"
                  description: Native currency partition to reconcile; defaults to the account currency.
      responses:
        "200":
          description: The reconciled figures plus any created adjustment transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          description: No drift to resolve, no statement balance, or an invalid mode
        "404":
          description: Account not found

  /api/accounts/{id}/statement-balances/{currency}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int32, minimum: 1 }
      - in: path
        name: currency
        required: true
        schema: { type: string, pattern: "^[A-Z]{3}$" }
    put:
      summary: Set a per-currency statement reading
      operationId: setAccountStatementBalance
      tags: [Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [balance, date]
              properties:
                balance: { type: number }
                date: { type: string, format: date }
      responses:
        "200":
          description: Stored statement reading
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400": { description: Invalid balance, date, or currency }
        "404": { description: Account not found }
    delete:
      summary: Delete a per-currency statement reading
      operationId: deleteAccountStatementBalance
      tags: [Accounts]
      responses:
        "200":
          description: Deleted statement reading identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400": { description: Invalid currency }
        "404": { description: Account or statement reading not found }

  # ─── Transactions ────────────────────────────────────────────────────────────

  /api/transactions:
    get:
      summary: List transactions
      operationId: getTransactions
      tags: [Transactions]
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
        - in: query
          name: start_date
          schema:
            type: string
            format: date
        - in: query
          name: end_date
          schema:
            type: string
            format: date
        - in: query
          name: account_id
          description: Preferred account filter (exact FK match, ADR-088); bank_account remains a substring escape hatch
          schema:
            type: integer
            format: int32
            minimum: 1
        - in: query
          name: bank_account
          schema:
            type: string
        - in: query
          name: category_id
          schema:
            type: integer
            format: int32
            minimum: 1
        - in: query
          name: recipient_id
          schema:
            type: integer
            format: int32
            minimum: 1
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: sort_by
          schema:
            type: string
        - in: query
          name: sort_dir
          schema:
            type: string
            enum: [asc, desc]
        - in: query
          name: tags
          schema:
            type: string
          description: Comma-separated tag slugs — OR filter
        - in: query
          name: transaction_id
          description: Fetch a single transaction by id (exact match)
          schema:
            type: integer
            format: int32
            minimum: 1
        - in: query
          name: category_ids
          description: >-
            Comma-separated category ids — OR filter. Every element must be a plain base-10
            integer in 1..2147483647; a malformed element returns 400 VALIDATION_ERROR
            (the parser used to truncate/drop it). An absent or empty value means no filter.
          schema:
            type: string
            pattern: "^[0-9]+(,[0-9]+)*$"
        - in: query
          name: recipient_group_id
          description: Filter by primary (grouped) recipient id
          schema:
            type: integer
            format: int32
            minimum: 1
        - in: query
          name: recipient_name
          description: Filter by recipient display name (substring)
          schema:
            type: string
        - in: query
          name: active
          description: Include only active (default true) or inactive rows
          schema:
            type: boolean
            default: true
        - in: query
          name: include_balance
          description: Include the running-balance column on each row
          schema:
            type: boolean
        - in: query
          name: transaction_type
          description: Filter by kind (e.g. income/expense)
          schema:
            type: string
        - in: query
          name: amount_min
          description: Minimum amount (see amount_signed for sign semantics)
          schema:
            type: number
        - in: query
          name: amount_max
          description: Maximum amount (see amount_signed)
          schema:
            type: number
        - in: query
          name: amount_exact
          description: Exact amount — shorthand for amount_min == amount_max
          schema:
            type: number
        - in: query
          name: amount_signed
          description: When true, amount_* compare signed values; otherwise magnitude
          schema:
            type: boolean
        - in: query
          name: uncategorised
          description: When true, return the active uncategorised queue and its filtered size as total; category filters are ignored consistently and pagination affects items only.
          schema:
            type: boolean
        - in: query
          name: normalize_to_eur
          description: Convert amounts to EUR (or target_currency) at read time
          schema:
            type: boolean
            default: false
        - in: query
          name: target_currency
          description: Target currency for normalize_to_eur (defaults to EUR)
          schema:
            type: string
      responses:
        "200":
          description: Paginated transaction list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TransactionList"
    post:
      summary: Create transaction
      operationId: createTransaction
      tags: [Transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionCreate"
      responses:
        "201":
          description: Created transaction
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Transaction"
        "409":
          description: Matching active manual transaction exists and allow_duplicate was omitted or false

  /api/transactions/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    get:
      summary: Get transaction
      operationId: getTransaction
      tags: [Transactions]
      responses:
        "200":
          description: Single transaction
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Transaction"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
    patch:
      summary: Update transaction
      operationId: updateTransaction
      tags: [Transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpdate"
      responses:
        "200":
          description: Updated transaction
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Transaction"
        "400":
          description: Ledger mutation requires an active account; reopen a closed account first
        "409":
          description: Transaction ownership changed during locking; reload and retry
    delete:
      summary: Delete transaction
      operationId: deleteTransaction
      tags: [Transactions]
      responses:
        "204":
          description: No Content
        "400":
          description: Reopen the closed account before deleting ledger rows
        "409":
          description: Transaction is linked to a planned execution or ownership changed

  /api/categories:
