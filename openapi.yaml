    BelgianTaxDashboard:
      type: object
      required:
        [
          year,
          currency,
          isHistorical,
          hasIncomeSources,
          hasStatsData,
          isEmpty,
          portfolioTaxesForYear,
          totalTaxIncludingPortfolio,
          totalTaxIncludingPropertyEstimate,
          yearlyIncome,
          monthlyIncomeTax,
          recordedIncomeByPartner,
          yearCalculations,
          currentInputs,
          exportProfile,
          suggestions,
          householdBreakdownRows,
          rules,
        ]
      properties:
        year: { type: integer }
        currency: { type: string }
        isHistorical: { type: boolean }
        hasIncomeSources: { type: boolean }
        hasStatsData: { type: boolean }
