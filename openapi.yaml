        or all=true to return every active tag in the
        workspace. With neither, the pivot is empty. A transaction carrying
        several selected tags counts toward each tag's total independently.
        Used by custom saved charts with tag series; the frontend caps results
        to top 8 by spend + "Other" when all=true and entity count exceeds 8.
      operationId: getTagPivot
      tags: [Aggregations]
      parameters:
        - in: query
          name: tag_ids
          description: "Tag ids to include as series (repeatable). Ignored when all=true."
          schema:
            type: array
            items:
              type: integer
        - in: query
          name: all
          description: "When true, returns all active tags; tag_ids is ignored."
          schema:
            type: boolean
        - in: query
          name: bucket
          schema:
            type: string
            enum: [monthly, yearly]
        - in: query
          name: start_date
          description: Inclusive start date.
          schema:
            type: string
            format: date
        - in: query
          name: end_date
          description: Inclusive end date.
          schema:
            type: string
            format: date
        - in: query
