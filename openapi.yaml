openapi: 3.0.3

info:
  title: Vision Financial API
  version: "1.0"
  description: >
    Self-hosted financial transaction manager.
    All responses are wrapped in the ADR-026 envelope:
    `{ ok: true, data: T }` on success, `{ ok: false, error: {...} }` on failure.

servers:
  - url: http://localhost:3000
    description: Local development

# ─── Shared envelope & list wrappers ─────────────────────────────────────────
components:
  schemas:

    # ADR-026 API envelope
    Envelope:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        data:
          description: Present on success
        error:
          $ref: "#/components/schemas/ErrorPayload"

    ErrorPayload:
      type: object
      required: [message]
      properties:
        message:
          type: string
        code:
          type: string
        status:
          type: integer

    Link:
      type: object
      required: [rel, href, method]
      properties:
        rel:
          type: string
        href:
          type: string
        method:
          type: string
        title:
          type: string

    PaginationMeta:
      type: object
      required: [total, limit, offset]
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    # ─── Categories ─────────────────────────────────────────────────────────
    Category:
      type: object
      required: [id, general, detail, is_active, created_at, links]
      properties:
        id:
          type: integer
        general:
          type: string
        detail:
          type: string
        description:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        links:
          type: array
          items:
            $ref: "#/components/schemas/Link"

    CategoryCreate:
      type: object
      required: [general, detail]
      properties:
        general:
          type: string
        detail:
          type: string
        description:
          type: string

    CategoryUpdate:
      type: object
      properties:
        general:
          type: string
        detail:
          type: string
        description:
          type: string
        is_active:
          type: boolean

    CategoryList:
      allOf:
        - $ref: "#/components/schemas/PaginationMeta"
        - type: object
          required: [items, links]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Category"
            links:
              type: array
              items:
                $ref: "#/components/schemas/Link"

    # ─── Recipients ─────────────────────────────────────────────────────────
    Recipient:
      type: object
      required: [id, name, is_active, created_at, links]
      properties:
        id:
          type: integer
        name:
          type: string
        primary_bank_account:
          type: string
        default_category_id:
          type: integer
        default_category_name:
          type: string
        primary_recipient_id:
          type: integer
          nullable: true
        primary_recipient_name:
          type: string
          nullable: true
        alias_count:
          type: integer
        notes:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        links:
          type: array
          items:
            $ref: "#/components/schemas/Link"

    RecipientCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        default_category_id:
          type: integer
        notes:
          type: string

    RecipientUpdate:
      type: object
      properties:
        name:
          type: string
        default_category_id:
          type: integer
          nullable: true
        notes:
          type: string
        is_active:
          type: boolean

    RecipientList:
      allOf:
        - $ref: "#/components/schemas/PaginationMeta"
        - type: object
          required: [items, links]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Recipient"
            links:
              type: array
              items:
                $ref: "#/components/schemas/Link"

    # ─── Transactions ────────────────────────────────────────────────────────
    Transaction:
      type: object
      required: [id, transaction_date, bank_account, amount, created_at, links]
      properties:
        id:
          type: integer
        transaction_date:
          type: string
          format: date
          description: YYYY-MM-DD
        bank_account:
          type: string
        recipient_id:
          type: integer
        recipient_name:
          type: string
        memo:
          type: string
        amount:
          type: number
          format: double
        amount_eur:
          type: number
          format: double
        currency:
          type: string
        balance:
          type: number
          format: double
        category_id:
          type: integer
        category_name:
          type: string
          description: "Format: GENERAL:DETAIL"
        comment:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        links:
          type: array
          items:
            $ref: "#/components/schemas/Link"

    TransactionCreate:
      type: object
      required: [transaction_date, bank_account, recipient_id, amount]
      properties:
        transaction_date:
          type: string
          format: date
        bank_account:
          type: string
        recipient_id:
          type: integer
        memo:
          type: string
        amount:
          type: number
        currency:
          type: string
        balance:
          type: number
        category_id:
          type: integer
        comment:
          type: string

    TransactionUpdate:
      type: object
      properties:
        transaction_date:
          type: string
          format: date
        bank_account:
          type: string
        recipient_id:
          type: integer
        recipient_name:
          type: string
        memo:
          type: string
        amount:
          type: number
        currency:
          type: string
        balance:
          type: number
        category_id:
          type: integer
        category_name:
          type: string
        comment:
          type: string
        is_active:
          type: boolean

    TransactionList:
      allOf:
        - $ref: "#/components/schemas/PaginationMeta"
        - type: object
          required: [items, links]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Transaction"
            links:
              type: array
              items:
                $ref: "#/components/schemas/Link"

    # ─── Planned Transactions ────────────────────────────────────────────────
    PlannedLoanType:
      type: string
      enum: [amortizing, fixed_principal, interest_only]

    PlannedLoanScheduleEntry:
      type: object
      required: [installment_number, due_date, payment_amount, principal_amount, interest_amount, remaining_principal]
      properties:
        installment_number:
          type: integer
        due_date:
          type: string
          format: date
        payment_amount:
          type: number
        principal_amount:
          type: number
        interest_amount:
          type: number
        remaining_principal:
          type: number

    PlannedTransactionExecution:
      type: object
      required: [id, executed_transaction_id, execution_date, created_at]
      properties:
        id:
          type: integer
        executed_transaction_id:
          type: integer
        execution_date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time

    PlannedTransaction:
      type: object
      required: [id, planned_date, bank_account, amount, is_recurring, is_executed, execution_count, is_active, created_at, links]
      properties:
        id:
          type: integer
        planned_date:
          type: string
          format: date
        bank_account:
          type: string
        recipient_id:
          type: integer
        recipient_name:
          type: string
        memo:
          type: string
        amount:
          type: number
        currency:
          type: string
        category_id:
          type: integer
        category_name:
          type: string
        comment:
          type: string
        url:
          type: string
        is_recurring:
          type: boolean
        recurrence_pattern:
          type: string
        is_loan:
          type: boolean
        loan_type:
          $ref: "#/components/schemas/PlannedLoanType"
          nullable: true
        loan_principal:
          type: number
          nullable: true
        loan_annual_interest_rate:
          type: number
          nullable: true
        loan_term_months:
          type: integer
          nullable: true
        loan_start_date:
          type: string
          format: date
          nullable: true
        loan_payment_day:
          type: integer
          nullable: true
        loan_regular_payment_amount:
          type: number
          nullable: true
        loan_first_payment_date:
          type: string
          format: date
          nullable: true
        loan_schedule:
          type: array
          items:
            $ref: "#/components/schemas/PlannedLoanScheduleEntry"
        is_executed:
          type: boolean
        last_executed_date:
          type: string
          format: date
        executed_transaction_id:
          type: integer
        execution_count:
          type: integer
        executions:
          type: array
          items:
            $ref: "#/components/schemas/PlannedTransactionExecution"
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        links:
          type: array
          items:
            $ref: "#/components/schemas/Link"

    PlannedTransactionCreate:
      type: object
      required: [planned_date, bank_account, recipient_id, amount]
      properties:
        planned_date:
          type: string
          format: date
        bank_account:
          type: string
        recipient_id:
          type: integer
        memo:
          type: string
        amount:
          type: number
        currency:
          type: string
        category_id:
          type: integer
        comment:
          type: string
        url:
          type: string
        is_recurring:
          type: boolean
        recurrence_pattern:
          type: string
        is_loan:
          type: boolean
        loan_type:
          $ref: "#/components/schemas/PlannedLoanType"
        loan_principal:
          type: number
        loan_annual_interest_rate:
          type: number
        loan_term_months:
          type: integer
        loan_start_date:
          type: string
          format: date
        loan_payment_day:
          type: integer

    PlannedTransactionList:
      allOf:
        - $ref: "#/components/schemas/PaginationMeta"
        - type: object
          required: [items, links]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/PlannedTransaction"
            links:
              type: array
              items:
                $ref: "#/components/schemas/Link"

    # ─── Portfolio / Investments ─────────────────────────────────────────────
    AssetClass:
      type: string
      enum: [stock, etf, crypto, metals, real_estate, savings, bond]

    PortfolioTxnType:
      type: string
      enum: [buy, sell, dividend, fee, tax, interest, rent_income, appreciation, gift]

    RecurrenceInterval:
      type: string
      enum: [daily, weekly, bi-weekly, monthly, quarterly, yearly]

    PriceProvider:
      type: string
      enum: [manual, binance, yahoo, custom, kinesis]

    Investment:
      type: object
      required: [id, name, asset_class, currency, price_provider, is_active, created_at, updated_at]
      properties:
        id:
          type: integer
        name:
          type: string
        symbol:
          type: string
        asset_class:
          $ref: "#/components/schemas/AssetClass"
        currency:
          type: string
        current_price:
          type: number
        interest_rate:
          type: number
        maturity_date:
          type: string
          format: date
        location:
          type: string
        municipality:
          type: string
        cadastral_income:
          type: number
        municipality_tax_rate:
          type: number
        notes:
          type: string
        price_provider:
          $ref: "#/components/schemas/PriceProvider"
        price_provider_id:
          type: string
        price_provider_url:
          type: string
        price_provider_latest_url:
          type: string
        price_provider_latest_path:
          type: string
        price_provider_history_url:
          type: string
        price_provider_history_path:
          type: string
        price_provider_history_ts_path:
          type: string
        price_provider_history_price_path:
          type: string
        price_updated_at:
          type: string
          format: date-time
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    InvestmentList:
      allOf:
        - $ref: "#/components/schemas/PaginationMeta"
        - type: object
          required: [items, links]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Investment"
            links:
              type: array
              items:
                $ref: "#/components/schemas/Link"

    PortfolioTransaction:
      type: object
      required: [id, investment_id, type, date, amount, currency, is_recurring, created_at, updated_at]
      properties:
        id:
          type: integer
        investment_id:
          type: integer
        type:
          $ref: "#/components/schemas/PortfolioTxnType"
        date:
          type: string
          format: date
        amount:
          type: number
        units:
          type: number
        price_per_unit:
          type: number
        fees:
          type: number
        taxes:
          type: number
        currency:
          type: string
        fx_rate_to_eur:
          type: number
        note:
          type: string
        is_recurring:
          type: boolean
        recurrence_interval:
          $ref: "#/components/schemas/RecurrenceInterval"
        recurrence_end_date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PortfolioTransactionList:
      allOf:
        - $ref: "#/components/schemas/PaginationMeta"
        - type: object
          required: [items, links]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/PortfolioTransaction"
            links:
              type: array
              items:
                $ref: "#/components/schemas/Link"

    # ─── Aggregation envelope ────────────────────────────────────────────────
    AggregationEnvelope:
      type: object
      required: [ok, cached, generatedAt]
      properties:
        ok:
          type: boolean
        cached:
          type: boolean
        generatedAt:
          type: string
          format: date-time

    # ─── Net Worth ───────────────────────────────────────────────────────────
    NetWorthSnapshot:
      type: object
      required: [date, liquid, investments, netWorth]
      properties:
        date:
          type: string
          format: date
        liquid:
          type: number
        investments:
          type: number
        netWorth:
          type: number

    NetWorthResponse:
      type: object
      required: [current, monthlyChange, monthlyChangePercent, snapshots]
      properties:
        current:
          type: object
          required: [liquid, investments, netWorth, currency]
          properties:
            liquid:
              type: number
            investments:
              type: number
            netWorth:
              type: number
            currency:
              type: string
        monthlyChange:
          type: number
        monthlyChangePercent:
          type: number
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/NetWorthSnapshot"
        snapshotsTotal:
          type: integer

    # ─── Saved Charts ────────────────────────────────────────────────────────
    SavedChart:
      type: object
      required: [id, name, chart_type, category_ids, created_at, updated_at]
      properties:
        id:
          type: integer
        name:
          type: string
        chart_type:
          type: string
          enum: [line, bar, area]
        category_ids:
          type: array
          items:
            type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ─── Settings ────────────────────────────────────────────────────────────
    Setting:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
        value: {}

# ─── Paths ───────────────────────────────────────────────────────────────────
paths:

  /api/transactions:
    get:
      summary: List transactions
      operationId: getTransactions
      tags: [Transactions]
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
        - in: query
          name: start_date
          schema:
            type: string
            format: date
        - in: query
          name: end_date
          schema:
            type: string
            format: date
        - in: query
          name: bank_account
          schema:
            type: string
        - in: query
          name: category_id
          schema:
            type: integer
        - in: query
          name: recipient_id
          schema:
            type: integer
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: sort_by
          schema:
            type: string
        - in: query
          name: sort_dir
          schema:
            type: string
            enum: [asc, desc]
      responses:
        "200":
          description: Paginated transaction list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TransactionList"
    post:
      summary: Create transaction
      operationId: createTransaction
      tags: [Transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionCreate"
      responses:
        "201":
          description: Created transaction
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Transaction"

  /api/transactions/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      summary: Get transaction
      operationId: getTransaction
      tags: [Transactions]
      responses:
        "200":
          description: Single transaction
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Transaction"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
    patch:
      summary: Update transaction
      operationId: updateTransaction
      tags: [Transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpdate"
      responses:
        "200":
          description: Updated transaction
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Transaction"
    delete:
      summary: Delete transaction
      operationId: deleteTransaction
      tags: [Transactions]
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /api/categories:
    get:
      summary: List categories
      operationId: getCategories
      tags: [Categories]
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: offset
          schema:
            type: integer
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: is_active
          schema:
            type: boolean
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CategoryList"
    post:
      summary: Create or get existing category
      operationId: createCategory
      tags: [Categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreate"
      responses:
        "200":
          description: Existing category returned
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Category"
        "201":
          description: New category created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Category"

  /api/categories/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      summary: Get category
      operationId: getCategory
      tags: [Categories]
      responses:
        "200":
          description: Single category
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Category"
    patch:
      summary: Update category
      operationId: updateCategory
      tags: [Categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Category"
    delete:
      summary: Delete category
      operationId: deleteCategory
      tags: [Categories]
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /api/recipients:
    get:
      summary: List recipients
      operationId: getRecipients
      tags: [Recipients]
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: offset
          schema:
            type: integer
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: is_active
          schema:
            type: boolean
      responses:
        "200":
          description: Recipient list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RecipientList"
    post:
      summary: Create or get existing recipient
      operationId: createRecipient
      tags: [Recipients]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipientCreate"
      responses:
        "200":
          description: Existing recipient
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Recipient"
        "201":
          description: New recipient created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Recipient"

  /api/recipients/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      summary: Get recipient
      operationId: getRecipient
      tags: [Recipients]
      responses:
        "200":
          description: Single recipient
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Recipient"
    patch:
      summary: Update recipient
      operationId: updateRecipient
      tags: [Recipients]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipientUpdate"
      responses:
        "200":
          description: Updated recipient
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Recipient"
    delete:
      summary: Delete recipient
      operationId: deleteRecipient
      tags: [Recipients]
      responses:
        "200":
          description: Deleted
          content:
            application/json:
