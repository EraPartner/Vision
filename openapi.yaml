                  properties:
                    format:
                      type: string
                      enum: [csv, json]
                      default: csv
                    include_balance:
                      type: boolean
                      default: false
      responses:
        "200":
          description: Streamed export
          content:
            text/csv:
              schema:
                type: string
            application/x-ndjson:
              schema:
                type: string
        "400":
          description: Invalid format
        "429":
          description: Rate limit exceeded

