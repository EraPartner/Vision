  /api/admin/database/tables/{table}/schema:
    parameters:
      - in: path
        name: table
        required: true
        schema:
          type: string
        description: Table name (validated against the live catalog)
    get:
      summary: Get a table's column metadata (Data Editor, ADR-101)
      description: The six protected audit tables require a dedicated viewer that authenticates audit history and return 403 here.
      operationId: adminGetTableSchema
      tags: [Admin]
      responses:
        "200":
          description: Column metadata and primary key
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DbEditorTableSchema"
        "403":
          description: Protected audit table cannot be opened in the generic data editor
        "404":
          description: Unknown table

  /api/admin/database/tables/{table}/rows:
    parameters:
      - in: path
        name: table
        required: true
        schema:
          type: string
    get:
      summary: Read paginated rows from a table (Data Editor, ADR-101)
      description: The six protected audit tables require a dedicated viewer that authenticates audit history and return 403 here.
      operationId: adminGetTableRows
      tags: [Admin]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - in: query
          name: cursor
          schema: { type: string }
          description: Opaque continuation cursor returned by the preceding page. It is bound to the table, sort, direction, and filters.
        - in: query
          name: orderBy
          schema: { type: string }
        - in: query
          name: dir
          schema:
            type: string
            enum: [asc, desc]
        - in: query
          name: filters
          schema: { type: string }
          description: JSON-encoded array of `{ column, op?, value? }` objects; `column` and `op` are strings. Invalid JSON, a non-array, or a non-object entry returns 400.
      responses:
        "200":
          description: Keyset page of rows with column metadata and continuation state. No unbounded count query is run.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DbEditorRows"
        "400":
          description: Invalid filters or query parameter
        "403":
          description: Protected audit table cannot be opened in the generic data editor
        "404":
          description: Unknown table

  /api/admin/database/tables/{table}/mutate:
    parameters:
      - in: path
        name: table
        required: true
        schema:
          type: string
    post:
      summary: Apply row mutations to a table (Data Editor, ADR-101)
      description: Rate-limited (adminMutateLimiter). Identifiers are validated against the live catalog and double-quoted; values are parameterised. Updates/deletes are optimistic-locked on xmin. Pass dryRun to preview statements without applying. The six protected audit tables return 403 even for dry runs.
      operationId: adminMutateTableRows
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changes]
              properties:
                dryRun:
                  type: boolean
                  description: Preview the SQL statements without applying them. Must be a JSON boolean; a string such as "true" returns 400.
                changes:
                  type: array
                  items:
                    type: object
                    required: [op]
                    properties:
                      op:
                        type: string
                        enum: [insert, update, delete]
                      pk:
                        type: object
                        description: Primary-key column values (required for update/delete)
                      values:
                        type: object
                        description: Column values for an insert
                      set:
                        type: object
                        description: Column values to write for an update
                      xmin:
                        oneOf:
                          - type: string
                          - type: number
                        description: Optimistic-concurrency token captured at read time
      responses:
        "200":
          description: Mutation result (dry-run preview or applied results)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DbEditorMutationResult"
        "400":
          description: Malformed change set or non-boolean dryRun
        "403":
          description: Protected audit table cannot be edited in the generic data editor
        "404":
          description: Unknown table
        "409":
          description: Row changed or was deleted since it was loaded

