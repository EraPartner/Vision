    # Research wire contracts. These are named even where most provider fields
    # are optional so generated clients and the hand-written UI adapters cannot
    # silently drift apart.
    ResearchPresentationRow:
      type: object
      required: [time]
      description: Timestamp plus submitted-series/indicator identifiers. Missing provider volume fields may be absent; non-finite derived values serialize as null.
      properties:
        time: { type: number }
      additionalProperties: { type: number, nullable: true }

    ResearchPresentationCompareResult:
      type: object
      required: [rows, stats, correlation]
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/ResearchPresentationRow" }
        stats:
          type: array
          items:
            type: object
            required: [symbol, totalReturn, volatility, maxDrawdown]
            properties:
              symbol: { type: string }
              totalReturn: { type: number, nullable: true }
              volatility: { type: number, nullable: true }
              maxDrawdown: { type: number, nullable: true }
              firstTime: { type: number }
              lastTime: { type: number }
        correlation:
          type: object
          required: [symbols, matrix]
          properties:
            symbols: { type: array, items: { type: string } }
            matrix:
              type: array
              items:
                type: array
                items: { type: number, nullable: true }

    ResearchPresentationChartResult:
      type: object
      required: [rows, oscillatorRows]
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/ResearchPresentationRow" }
        oscillatorRows:
          type: array
          items: { $ref: "#/components/schemas/ResearchPresentationRow" }

    ResearchPresentationWatchlistList:
      type: object
      required:
