  # ─── Portfolio Import ─────────────────────────────────────────────────────────
  /api/portfolio/import/csv/custom:
    post:
      summary: One-shot portfolio CSV import with custom column mapping
      operationId: portfolioImportCsvCustom
      tags: [PortfolioImport]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, date_column, default_asset_class]
              properties:
                file:
                  type: string
                  format: binary
                adapter_name:
                  type: string
                  description: Display label for the import source
                date_format:
                  type: string
                  description: "Python strptime format, default: %Y-%m-%d"
                separator:
                  type: string
                  description: Single-character CSV delimiter, default ','
                encoding:
                  type: string
                  default: utf-8
                skip_rows:
                  type: integer
                  default: 0
                date_column:
                  type: string
                type_column:
                  type: string
                symbol_column:
                  type: string
                name_column:
                  type: string
                units_column:
                  type: string
                price_column:
                  type: string
                amount_column:
                  type: string
                fees_column:
                  type: string
                taxes_column:
                  type: string
                currency_column:
                  type: string
                fx_rate_column:
                  type: string
                note_column:
                  type: string
                default_asset_class:
                  type: string
                  enum: [stock, etf, crypto, metals, real_estate, savings, bond]
                default_type:
                  type: string
                  enum: [buy, sell, dividend, fee, tax, interest]
                type_mapping:
                  type: string
                  description: JSON object mapping raw CSV type strings to canonical portfolio_txn_type values
      responses:
        "201":
          description: All rows matched — batch committed immediately
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          batch_id:
                            type: string
                          total:
                            type: integer
                          imported:
                            type: integer
                          duplicates:
                            type: integer
                          errors:
                            type: integer
        "202":
          description: Some rows unresolved — batch left in awaiting_review; client must use review endpoints then POST commit
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          batch_id:
                            type: string
                          requires_review:
                            type: boolean
                          match_source_counts:
                            type: object
                            additionalProperties:
                              type: integer

