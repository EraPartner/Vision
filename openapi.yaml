  # ─── Research (ADR-079) ───────────────────────────────────────────────────────
  /api/research/presentation:
    post:
      summary: Compute Research presentation from submitted data without fetching or persisting
      operationId: computeResearchPresentation
      tags: [Research]
      description: >-
        Stateless shared TypeScript transformations for Compare, Chart Builder,
        watchlist list/chart/add previews, provider-history quotes, analyst consensus
        market-add two-of-three previews and Life Scenario preparation/comparison. No provider, database, settings or FX
        lookup. Original source ordering, warmups, thresholds and currency semantics
        are retained. Submit one UTF-8 JSON snapshot file; the 64 MiB scoped multipart
        limit bypasses the global JSON-body size limit without silently truncating history.
        Numeric JSON is validated as finite numbers; non-finite calculation outputs
        serialize as null as in the web client. Uses the existing Research market rate limiter.
      requestBody:
        required: true
        description: Single file field only; its JSON shape is ResearchPresentationSnapshot. Extra multipart fields and repeated files are rejected.
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              additionalProperties: false
              properties:
                file:
                  type: string
                  format: binary
                  description: UTF-8 JSON ResearchPresentationSnapshot; maximum 67,108,864 bytes.
      responses:
        "200":
          description: Computed kind-specific presentation, standard envelope; no read or write side effects.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        {
                          $ref: "#/components/schemas/ResearchPresentationData",
                        }
        "400":
          description: VALIDATION_ERROR for missing/repeated/oversize file, extra multipart fields, invalid JSON or invalid/bounded snapshot.
        "429": { description: Existing Research market rate limit. }
        "500": { description: File I/O or unexpected calculation failure. }

