openapi: 3.0.3

info:
  title: Vision Financial API
  version: "1.0"
  description: >
    Self-hosted financial transaction manager.
    All responses are wrapped in the ADR-026 envelope:
    `{ ok: true, data: T }` on success, `{ ok: false, error: {...} }` on failure.

servers:
  - url: http://localhost:3000
    description: Local development

# ─── Shared envelope & list wrappers ─────────────────────────────────────────
components:
  parameters:
    # Opt-in pagination for list endpoints that historically returned every row.
    # Both are optional and, when neither is sent, the response carries the full
    # collection (and no limit/offset fields) — exactly the pre-pagination
    # behaviour, so existing clients are never silently truncated.
    OptionalLimit:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
      description: >
        Page size. Omit (together with offset) to receive the whole collection.
        Values above the endpoint's cap are clamped.
    OptionalOffset:
      in: query
      name: offset
      required: false
      schema:
        type: integer
        minimum: 0
      description: Rows to skip. Omit (together with limit) to receive the whole collection.

  schemas:

    # ADR-026 API envelope
    Envelope:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        data:
          description: Present on success
        error:
          $ref: "#/components/schemas/ErrorPayload"

    ErrorPayload:
      type: object
      required: [message]
      properties:
        message:
          type: string
        code:
          type: string
        status:
          type: integer

    Link:
      type: object
      required: [rel, href, method]
      properties:
        rel:
          type: string
        href:
          type: string
        method:
          type: string
        title:
          type: string

    # Pagination travels in the response BODY, mixed in alongside `items` —
    # never in the envelope's `meta`. `total` is the full match count, not the
    # length of the page.
    PaginationFields:
      type: object
      required: [total, limit, offset]
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    # Same fields, for lists whose pagination is OPT-IN: a request that sends
    # neither limit nor offset gets the complete collection back (and then
    # neither field appears, because there is no page to describe).
    OptionalPaginationFields:
      type: object
      required: [total]
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    # ─── Categories ─────────────────────────────────────────────────────────
    Category:
      type: object
      required: [id, general, detail, is_active, created_at, links]
      properties:
        id:
          type: integer
        general:
          type: string
        detail:
          type: string
        description:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        links:
          type: array
          items:
            $ref: "#/components/schemas/Link"

    CategoryCreate:
      type: object
      required: [general, detail]
      properties:
        general:
          type: string
        detail:
          type: string
        description:
          type: string

    CategoryUpdate:
      type: object
      properties:
        general:
          type: string
        detail:
          type: string
        description:
          type: string
        is_active:
          type: boolean

    CategoryList:
      allOf:
        - $ref: "#/components/schemas/PaginationFields"
        - type: object
          required: [items, links]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Category"
            links:
              type: array
              items:
                $ref: "#/components/schemas/Link"

    # ─── Recipients ─────────────────────────────────────────────────────────
    Recipient:
      type: object
      required: [id, name, is_active, created_at, links]
      properties:
        id:
          type: integer
        name:
          type: string
        primary_bank_account:
          type: string
        default_category_id:
          type: integer
        default_category_name:
          type: string
        primary_recipient_id:
          type: integer
          nullable: true
        primary_recipient_name:
          type: string
          nullable: true
        alias_count:
          type: integer
        notes:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        links:
          type: array
          items:
            $ref: "#/components/schemas/Link"

    RecipientCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        default_category_id:
          type: integer
        notes:
          type: string

    RecipientUpdate:
      type: object
      properties:
        name:
          type: string
        default_category_id:
          type: integer
          nullable: true
        notes:
          type: string
        is_active:
          type: boolean

    RecipientList:
      allOf:
        - $ref: "#/components/schemas/PaginationFields"
        - type: object
          required: [items, links]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Recipient"
            links:
              type: array
              items:
                $ref: "#/components/schemas/Link"

    # ─── Tags ───────────────────────────────────────────────────────────────
    Tag:
      type: object
      required: [id, slug, is_active, created_at, updated_at]
      properties:
        id:
          type: integer
        slug:
          type: string
        color:
          type: string
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TagList:
      allOf:
        - $ref: "#/components/schemas/PaginationFields"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Tag"

    TagCreate:
      type: object
      required: [slug]
      properties:
        slug:
          type: string
        color:
          type: string
          nullable: true

    TagUpdate:
      type: object
      properties:
        color:
          type: string
          nullable: true
        is_active:
          type: boolean

    Account:
      type: object
      required: [id, name, currency, type, liquidity_class, spendable, in_net_worth, tax_wrapper, owner, multi_currency_cash, has_cash_sleeve, is_active, created_at, updated_at]
      properties:
        id:
          type: integer
        name:
          type: string
        display_name:
          type: string
          nullable: true
        institution:
          type: string
          nullable: true
        currency:
          type: string
          description: ISO 4217 currency code
        type:
          type: string
          enum: [checking, savings, brokerage, crypto_exchange, wallet, pension, liability]
        liquidity_class:
          type: string
          enum: [liquid, semi_liquid, illiquid]
        spendable:
          type: boolean
        in_net_worth:
          type: boolean
        tax_wrapper:
          type: string
          enum: [none, pension, tax_advantaged]
        owner:
          type: string
          enum: [me, partner, joint]
        multi_currency_cash:
          type: boolean
        has_cash_sleeve:
          type: boolean
        funding_account_id:
          type: integer
          nullable: true
        statement_balance:
          type: number
          nullable: true
        statement_balance_date:
          type: string
          format: date
          nullable: true
        computed_balance:
          type: number
          nullable: true
          description: Latest active transaction balance for the account (ADR-094)
        drift:
          type: number
          nullable: true
          description: statement_balance − computed_balance; null if no statement balance (ADR-094)
        anchor_date:
          type: string
          format: date
          description: YYYY-MM-DD date of the stamped statement balance anchoring computed_balance (WP-A1 provenance); absent when nothing is stamped. Only returned by the list endpoint.
        post_anchor_count:
          type: integer
          description: Active ledger entries after the anchor, or all active entries when unstamped — the "{n} entries since" / "sum of {n} entries" figure (WP-A1 provenance). Only returned by the list endpoint.
        has_transactions:
          type: boolean
          description: Whether the account has any active ledger rows; only returned by the list endpoint.
        is_active:
          type: boolean
        closed_at:
          type: string
          format: date-time
          nullable: true
          description: Server-stamped when the account is closed (is_active=false); cleared on reactivate (ADR-088 addendum, D5)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AccountList:
      allOf:
        - $ref: "#/components/schemas/OptionalPaginationFields"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Account"
            links:
              type: array
              items:
                $ref: "#/components/schemas/Link"

    AccountCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        display_name:
          type: string
          nullable: true
        institution:
          type: string
          nullable: true
        currency:
          type: string
        type:
          type: string
          enum: [checking, savings, brokerage, crypto_exchange, wallet, pension, liability]
        liquidity_class:
          type: string
          enum: [liquid, semi_liquid, illiquid]
        spendable:
          type: boolean
        in_net_worth:
          type: boolean
        tax_wrapper:
          type: string
          enum: [none, pension, tax_advantaged]
        owner:
          type: string
          enum: [me, partner, joint]
        multi_currency_cash:
          type: boolean
        has_cash_sleeve:
          type: boolean
        funding_account_id:
          type: integer
          nullable: true
        statement_balance:
          type: number
          nullable: true
        statement_balance_date:
          type: string
          format: date
          nullable: true

    AccountUpdate:
      type: object
      properties:
        name:
          type: string
        display_name:
          type: string
          nullable: true
        institution:
          type: string
          nullable: true
        currency:
          type: string
        type:
          type: string
          enum: [checking, savings, brokerage, crypto_exchange, wallet, pension, liability]
        liquidity_class:
          type: string
          enum: [liquid, semi_liquid, illiquid]
        spendable:
          type: boolean
        in_net_worth:
          type: boolean
        tax_wrapper:
          type: string
          enum: [none, pension, tax_advantaged]
        owner:
          type: string
          enum: [me, partner, joint]
        multi_currency_cash:
          type: boolean
        has_cash_sleeve:
          type: boolean
        funding_account_id:
          type: integer
          nullable: true
        statement_balance:
          type: number
          nullable: true
        statement_balance_date:
          type: string
          format: date
          nullable: true
        is_active:
          type: boolean

    BulkTagRequest:
      type: object
      required: [transaction_ids]
      properties:
        transaction_ids:
          type: array
          items:
            type: integer
          minItems: 1
          maxItems: 500
        add_slugs:
          type: array
          items:
            type: string
          maxItems: 50
        remove_slugs:
          type: array
          items:
            type: string
          maxItems: 50

    BulkTagResult:
      type: object
      required: [added, removed, transactions_affected]
      properties:
        added:
          type: integer
        removed:
          type: integer
        transactions_affected:
          type: integer

    BulkSelection:
      type: object
      description: >-
        Selects transactions to act on. Provide an explicit `ids` array or a
        `filter` object (same shape as GET /api/transactions query filters);
        exactly one is resolved server-side.
      properties:
        ids:
          type: array
          items:
            type: integer
        filter:
          type: object
          additionalProperties: true

    CustomParserConfig:
      type: object
      required: [id, name, config]
      properties:
        id:
          type: integer
        name:
          type: string
        config:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ─── Transactions ────────────────────────────────────────────────────────
    Transaction:
      type: object
      required: [id, transaction_date, bank_account, amount, created_at, links]
      properties:
        id:
          type: integer
        transaction_date:
          type: string
          format: date
          description: YYYY-MM-DD
        bank_account:
          type: string
        recipient_id:
          type: integer
        recipient_name:
          type: string
        memo:
          type: string
        amount:
          type: number
          format: double
        amount_eur:
          type: number
          format: double
        currency:
          type: string
        balance:
          type: number
          format: double
        running_balance:
          type: number
          format: double
          description: Per-account running balance (SQL window over the filtered set); present only when the list endpoint is queried with include_balance=true
        category_id:
          type: integer
        category_name:
          type: string
          description: "Format: GENERAL:DETAIL"
        comment:
          type: string
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
          description: Tags attached to this transaction
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        links:
          type: array
          items:
            $ref: "#/components/schemas/Link"

    TransactionCreate:
      type: object
      required: [transaction_date, bank_account, recipient_id, amount]
      properties:
        transaction_date:
          type: string
          format: date
        bank_account:
          type: string
        recipient_id:
          type: integer
        memo:
          type: string
        amount:
          type: number
        currency:
          type: string
        balance:
          type: number
        category_id:
          type: integer
        comment:
          type: string
        tags:
          type: array
          items:
            type: string
          description: Tag slugs to assign (replaces existing tags)

    TransactionUpdate:
      type: object
      description: >-
        PATCH semantics: an explicit null on a nullable field clears the stored
        value; an absent key leaves it unchanged.
      properties:
        transaction_date:
          type: string
          format: date
        bank_account:
          type: string
          nullable: true
        recipient_id:
          type: integer
          nullable: true
        recipient_name:
          type: string
        memo:
          type: string
          nullable: true
        amount:
          type: number
        currency:
          type: string
        balance:
          type: number
        category_id:
          type: integer
          nullable: true
        category_name:
          type: string
        comment:
          type: string
          nullable: true
        is_active:
          type: boolean
        tags:
          type: array
          items:
            type: string
          description: Tag slugs to assign (replaces existing tags when present)

    TransactionList:
      allOf:
        - $ref: "#/components/schemas/PaginationFields"
        - type: object
          required: [items, links]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Transaction"
            links:
              type: array
              items:
                $ref: "#/components/schemas/Link"

    # ─── Planned Transactions ────────────────────────────────────────────────
    PlannedLoanType:
      type: string
      enum: [amortizing, fixed_principal, interest_only]

    PlannedLoanScheduleEntry:
      type: object
      required: [installment_number, due_date, payment_amount, principal_amount, interest_amount, remaining_principal]
      properties:
        installment_number:
          type: integer
        due_date:
          type: string
          format: date
        payment_amount:
          type: number
        principal_amount:
          type: number
        interest_amount:
          type: number
        remaining_principal:
          type: number

    PlannedTransactionExecution:
      type: object
      required: [id, executed_transaction_id, execution_date, created_at]
      properties:
        id:
          type: integer
        executed_transaction_id:
          type: integer
        execution_date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time

    PlannedTransaction:
      type: object
      required: [id, planned_date, bank_account, amount, is_recurring, is_executed, execution_count, is_active, created_at, links]
      properties:
        id:
          type: integer
        planned_date:
          type: string
          format: date
        bank_account:
          type: string
        recipient_id:
          type: integer
        recipient_name:
          type: string
        memo:
          type: string
        amount:
          type: number
        currency:
          type: string
        category_id:
          type: integer
        category_name:
          type: string
        comment:
          type: string
        url:
          type: string
        is_recurring:
          type: boolean
        recurrence_pattern:
          type: string
        recurrence_end_date:
          type: string
          format: date
          nullable: true
          description: Recurrence bound — the series completes once the next occurrence would fall past this date.
        max_occurrences:
          type: integer
          nullable: true
          description: Recurrence bound — the series completes at this execution count.
        is_loan:
          type: boolean
        loan_type:
          $ref: "#/components/schemas/PlannedLoanType"
          nullable: true
        loan_principal:
          type: number
          nullable: true
        loan_annual_interest_rate:
          type: number
          nullable: true
        loan_term_months:
          type: integer
          nullable: true
        loan_start_date:
          type: string
          format: date
          nullable: true
        loan_payment_day:
          type: integer
          nullable: true
        loan_regular_payment_amount:
          type: number
          nullable: true
        loan_first_payment_date:
          type: string
          format: date
          nullable: true
        loan_schedule:
          type: array
          items:
            $ref: "#/components/schemas/PlannedLoanScheduleEntry"
        is_executed:
          type: boolean
        last_executed_date:
          type: string
          format: date
        executed_transaction_id:
          type: integer
        execution_count:
          type: integer
        executions:
          type: array
          items:
            $ref: "#/components/schemas/PlannedTransactionExecution"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
          description: Tags attached to this planned transaction
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        links:
          type: array
          items:
            $ref: "#/components/schemas/Link"

    PlannedTransactionCreate:
      type: object
      required: [planned_date, bank_account, recipient_id, amount]
      properties:
        planned_date:
          type: string
          format: date
        bank_account:
          type: string
        recipient_id:
          type: integer
        memo:
          type: string
        amount:
          type: number
        currency:
          type: string
        category_id:
          type: integer
        comment:
          type: string
        url:
          type: string
        is_recurring:
          type: boolean
        recurrence_pattern:
          type: string
        recurrence_end_date:
          type: string
          format: date
          nullable: true
          description: Recurrence bound — the series completes once the next occurrence would fall past this date.
        max_occurrences:
          type: integer
          nullable: true
          description: Recurrence bound — the series completes at this execution count.
        is_loan:
          type: boolean
        loan_type:
          $ref: "#/components/schemas/PlannedLoanType"
        loan_principal:
          type: number
        loan_annual_interest_rate:
          type: number
        loan_term_months:
          type: integer
        loan_start_date:
          type: string
          format: date
        loan_payment_day:
          type: integer
        tags:
          type: array
          items:
            type: string
          description: Tag slugs to assign

    PlannedTransactionList:
      allOf:
        - $ref: "#/components/schemas/PaginationFields"
        - type: object
          required: [items, links]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/PlannedTransaction"
            links:
              type: array
              items:
                $ref: "#/components/schemas/Link"

    # ─── Portfolio / Investments ─────────────────────────────────────────────
    AssetClass:
      type: string
      enum: [stock, etf, crypto, metals, real_estate, savings, bond]

    PortfolioTxnType:
      type: string
      enum: [buy, sell, dividend, fee, tax, interest, rent_income, appreciation, gift]

    RecurrenceInterval:
      type: string
      enum: [daily, weekly, bi-weekly, monthly, quarterly, yearly]

    PriceProvider:
      type: string
      enum: [manual, binance, yahoo, custom, kinesis]

    Investment:
      type: object
      required: [id, name, asset_class, currency, price_provider, is_active, show_in_ticker, created_at, updated_at]
      properties:
        id:
          type: integer
        name:
          type: string
        symbol:
          type: string
        asset_class:
          $ref: "#/components/schemas/AssetClass"
        currency:
          type: string
        current_price:
          type: number
        interest_rate:
          type: number
        maturity_date:
          type: string
          format: date
        location:
          type: string
        municipality:
          type: string
        cadastral_income:
          type: number
        municipality_tax_rate:
          type: number
        notes:
          type: string
        price_provider:
          $ref: "#/components/schemas/PriceProvider"
        price_provider_id:
          type: string
        price_provider_url:
          type: string
        price_provider_latest_url:
          type: string
        price_provider_latest_path:
          type: string
        price_provider_history_url:
          type: string
        price_provider_history_path:
          type: string
        price_provider_history_ts_path:
          type: string
        price_provider_history_price_path:
          type: string
        price_updated_at:
          type: string
          format: date-time
        is_active:
          type: boolean
        show_in_ticker:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    InvestmentList:
      allOf:
        - $ref: "#/components/schemas/PaginationFields"
        - type: object
          required: [items, links]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Investment"
            links:
              type: array
              items:
                $ref: "#/components/schemas/Link"

    PortfolioTransaction:
      type: object
      required: [id, investment_id, type, date, amount, currency, is_recurring, created_at, updated_at]
      properties:
        id:
          type: integer
        investment_id:
          type: integer
        type:
          $ref: "#/components/schemas/PortfolioTxnType"
        date:
          type: string
          format: date
        amount:
          type: number
        units:
          type: number
        price_per_unit:
          type: number
        fees:
          type: number
        taxes:
          type: number
        currency:
          type: string
        fx_rate_to_eur:
          type: number
        account_id:
          type: integer
          nullable: true
          description: Owning account for the lot (ADR-091); null = unassigned/global
        note:
          type: string
        is_recurring:
          type: boolean
        recurrence_interval:
          $ref: "#/components/schemas/RecurrenceInterval"
        recurrence_end_date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PortfolioTransactionList:
      allOf:
        - $ref: "#/components/schemas/PaginationFields"
        - type: object
          required: [items, links]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/PortfolioTransaction"
            links:
              type: array
              items:
                $ref: "#/components/schemas/Link"

    # ─── Aggregation envelope ────────────────────────────────────────────────
    AggregationEnvelope:
      type: object
      required: [ok, cached, generatedAt]
      properties:
        ok:
          type: boolean
        cached:
          type: boolean
        generatedAt:
          type: string
          format: date-time

    # ─── Net Worth ───────────────────────────────────────────────────────────
    NetWorthSnapshot:
      type: object
      required: [date, liquid, liabilities, investments, netWorth]
      properties:
        date:
          type: string
          format: date
        liquid:
          type: number
        liabilities:
          type: number
          description: Σ liability-account balances (negative); split out of liquid so debt is not counted as a liquid asset (ADR-092).
        investments:
          type: number
        netWorth:
          type: number

    NetWorthResponse:
      type: object
      required: [current, monthlyChange, monthlyChangePercent, snapshots]
      properties:
        current:
          type: object
          required: [liquid, liabilities, investments, netWorth, currency]
          properties:
            liquid:
              type: number
            liabilities:
              type: number
            investments:
              type: number
            netWorth:
              type: number
            currency:
              type: string
        monthlyChange:
          type: number
        monthlyChangePercent:
          type: number
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/NetWorthSnapshot"
        # Pagination facts for the embedded `snapshots` list, in the body (the
        # single API-wide convention). Present only when the request paginated.
        snapshotsTotal:
          type: integer
        snapshotsLimit:
          type: integer
        snapshotsOffset:
          type: integer

    # ─── Saved Charts ────────────────────────────────────────────────────────
    SavedChart:
      type: object
      required: [id, name, chart_type, chart_variant, time_bucket, category_ids, recipient_ids, tag_ids, all_categories, all_recipients, all_tags, created_at, updated_at]
      properties:
        id:
          type: integer
        name:
          type: string
        chart_type:
          type: string
          enum: [line, bar, area]
        chart_variant:
          type: string
          enum: [default, stacked, grouped, ranked]
          description: "ranked is only valid with chart_type=bar; line:ranked and area:ranked return 400"
        time_bucket:
          type: string
          enum: [monthly, yearly]
          description: "Ignored when chart_variant=ranked"
        category_ids:
          type: array
          items:
            type: integer
          description: "Ignored when all_categories=true"
        recipient_ids:
          type: array
          items:
            type: integer
          description: "Ignored when all_recipients=true"
        tag_ids:
          type: array
          items:
            type: integer
          description: "Ignored when all_tags=true"
        all_categories:
          type: boolean
          default: false
        all_recipients:
          type: boolean
          default: false
        all_tags:
          type: boolean
          default: false
        date_range_start:
          type: string
          format: date
          nullable: true
        date_range_end:
          type: string
          format: date
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ─── Settings ────────────────────────────────────────────────────────────
    Setting:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
        value: {}

    # ─── Splits ──────────────────────────────────────────────────────────────
    # A transaction_splits row as emitted by splitRepository's formatSplit:
    # a per-recipient share of one transaction. There is no description /
    # total_amount / currency / shares — those described a split model the
    # backend has never implemented.
    Split:
      type: object
      required: [id, transaction_id, recipient_id, amount, amount_paid, is_settled, created_at, updated_at]
      properties:
        id:
          type: integer
        transaction_id:
          type: integer
        recipient_id:
          type: integer
        recipient_name:
          type: string
          nullable: true
        amount:
          type: number
        # Σ split_payments.amount for this split; 0 on a freshly created split.
        amount_paid:
          type: number
        note:
          type: string
          nullable: true
        is_settled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # A split_payments row (POST /api/splits/{id}/pay, GET /{id}/payments).
    SplitPayment:
      type: object
      required: [id, split_id, amount, paid_at, created_at]
      properties:
        id:
          type: integer
        split_id:
          type: integer
        amount:
          type: number
        note:
          type: string
          nullable: true
        paid_at:
          type: string
          format: date
        created_at:
          type: string
          format: date-time

    # Envelope `data` for the split-list endpoints (res.ok({ items, total })).
    # limit/offset appear only when the caller paginated (opt-in).
    SplitList:
      allOf:
        - $ref: "#/components/schemas/OptionalPaginationFields"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Split"

    # Aggregated "who owes what" row from computeOwedSummary. No currency is
    # carried here — the summary sums across a recipient's splits.
    SplitOwed:
      type: object
      required: [recipient_id, recipient_name, total_owed, total_paid, remaining, split_count]
      properties:
        recipient_id:
          type: integer
        recipient_name:
          type: string
        total_owed:
          type: number
        total_paid:
          type: number
        remaining:
          type: number
        split_count:
          type: integer

    # One unsettled split of a recipient (GET /api/splits/owed/{id}) — a Split
    # enriched with the fields of the transaction it was carved out of.
    SplitOwedDetail:
      allOf:
        - $ref: "#/components/schemas/Split"
        - type: object
          required: [transaction_date, transaction_amount, transaction_currency, remaining]
          properties:
            transaction_date:
              type: string
              format: date
            transaction_memo:
              type: string
              nullable: true
            transaction_amount:
              type: number
            transaction_currency:
              type: string
            bank_account:
              type: string
              nullable: true
            transaction_recipient_name:
              type: string
              nullable: true
            remaining:
              type: number

    # ─── Attachments ─────────────────────────────────────────────────────────
    Attachment:
      type: object
      required: [id, transaction_id, filename, stored_path, mime_type, size_bytes, created_at]
      properties:
        id:
          type: integer
        transaction_id:
          type: integer
        filename:
          type: string
        # On-disk location; the file bytes are not stored in the database.
        stored_path:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
        created_at:
          type: string
          format: date-time

    # ─── Watchlist ────────────────────────────────────────────────────────────
    # Mirrors the `watchlist` table as mapped by watchlistRepository. It has no
    # current_price column: live quotes are fetched separately and never merged
    # into this row.
    WatchlistItem:
      type: object
      required: [id, name, asset_class, target_price, currency, created_at, updated_at]
      properties:
        id:
          type: integer
        name:
          type: string
        symbol:
          type: string
          nullable: true
        asset_class:
          type: string
          enum: [stock, etf, crypto, metals]
        target_price:
          type: number
        currency:
          type: string
        notes:
          type: string
          nullable: true
        price_provider_id:
          type: string
          nullable: true
        added_price:
          description: Live price snapshotted when the item was added (ADR-097 backtest).
          type: number
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ─── AI ──────────────────────────────────────────────────────────────────
    # ai_conversations row. Column aliases are camelCase on the wire
    # (aiChatRepository's CONVERSATION_COLUMNS), not snake_case.
    AiConversation:
      type: object
      required: [id, title, model, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        model:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ai_messages row (aiChatRepository's MESSAGE_COLUMNS). Tool turns carry
    # toolName/toolArgs/toolResult and a null content.
    AiMessage:
      type: object
      required: [id, conversationId, role, content, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant, tool, system]
        content:
          type: string
          nullable: true
        toolName:
          type: string
          nullable: true
        toolArgs:
          type: object
          additionalProperties: true
          nullable: true
        toolResult:
          type: object
          additionalProperties: true
          nullable: true
        status:
          type: string
          enum: [complete, streaming, aborted, error]
        createdAt:
          type: string
          format: date-time

    # Usage counters forwarded from the Ollama response; null until the first
    # model reply lands, or when the provider omits the counter.
    AiTokenUsage:
      type: object
      required: [evalCount, promptEvalCount, totalDurationMs]
      properties:
        evalCount:
          type: integer
          nullable: true
        promptEvalCount:
          type: integer
          nullable: true
        totalDurationMs:
          type: integer
          nullable: true

    # One installed model, projected from Ollama /api/tags by the backend's
    # ollama client — not the daemon's raw row.
    OllamaModel:
      type: object
      required: [name, size, family, parameterSize, quantization, modifiedAt]
      properties:
        name:
          type: string
        size:
          type: integer
          nullable: true
        family:
          type: string
          nullable: true
        parameterSize:
          type: string
          nullable: true
        quantization:
          type: string
          nullable: true
        modifiedAt:
          type: string
          nullable: true

    # ─── Portfolio Import ─────────────────────────────────────────────────────
    PortfolioImportBatch:
      type: object
      required: [id, adapter_name, status, rows_total, rows_imported, rows_duplicate, rows_error, started_at]
      properties:
        id:
          type: string
        adapter_name:
          type: string
        source_filename:
          type: string
        source_size_bytes:
          type: integer
        status:
          type: string
          enum: [pending, staging, validating, matching, committing, complete, complete_with_errors, failed, aborted, awaiting_review]
        rows_total:
          type: integer
        rows_imported:
          type: integer
        rows_duplicate:
          type: integer
        rows_error:
          type: integer
        error_summary:
          type: string
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    PortfolioParserConfig:
      type: object
      required: [id, name, config]
      properties:
        id:
          type: integer
        name:
          type: string
        config:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ─── Import ───────────────────────────────────────────────────────────────
    ImportBatch:
      type: object
      required: [id, bank, row_count, status, created_at]
      properties:
        id:
          type: string
        bank:
          type: string
        row_count:
          type: integer
        status:
          type: string
          enum: [pending, committed, failed]
        created_at:
          type: string
          format: date-time

    # ─── Recipient sub-resources ──────────────────────────────────────────────
    RecipientPattern:
      type: object
      required: [id, pattern, created_at]
      properties:
        id:
          type: integer
        pattern:
          type: string
        is_regex:
          type: boolean
        created_at:
          type: string
          format: date-time

    RecipientBankAccount:
      type: object
      required: [id, recipient_id, iban, is_primary]
      properties:
        id:
          type: integer
        recipient_id:
          type: integer
        iban:
          type: string
        bic:
          type: string
        bank_name:
          type: string
        is_primary:
          type: boolean
        created_at:
          type: string
          format: date-time

    # ─── Market ───────────────────────────────────────────────────────────────
    MarketSearchResult:
      type: object
      required: [symbol, name, exchange, currency]
      properties:
        symbol:
          type: string
        name:
          type: string
        exchange:
          type: string
        currency:
          type: string
        type:
          type: string

# ─── Paths ───────────────────────────────────────────────────────────────────
paths:

  # ─── Tags ───────────────────────────────────────────────────────────────────

  /api/tags:
    get:
      summary: List tags
      operationId: getTags
      tags: [Tags]
      parameters:
        - in: query
          name: is_active
          schema:
            type: boolean
          description: Filter by active status (omit for all)
      responses:
        "200":
          description: Tag list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TagList"
    post:
      summary: Create or reactivate tag
      operationId: createTag
      tags: [Tags]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagCreate"
      responses:
        "201":
          description: Created or reactivated tag
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Tag"

  /api/tags/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    patch:
      summary: Update tag color or active status
      operationId: updateTag
      tags: [Tags]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagUpdate"
      responses:
        "200":
          description: Updated tag
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Tag"
        "404":
          description: Tag not found
    delete:
      summary: Soft-delete tag (sets is_active=false)
      operationId: deleteTag
      tags: [Tags]
      responses:
        "200":
          description: The deactivated tag (soft delete — the row survives)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          description: Tag not found

  /api/cross-workspace/rebalance:
    post:
      summary: Cash-aware rebalancing plan (ADR-098)
      description: >-
        Deploy spendable account cash into underweight portfolio sleeves toward a
        target allocation, without selling. Composes Budgeting + Portfolio.
      operationId: computeRebalance
      tags: [CrossWorkspace]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currency: { type: string }
                model:
                  type: string
                  enum: [sixty_forty, all_weather, three_fund]
                targetWeights:
                  type: object
                  additionalProperties: { type: number }
                availableCash: { type: number }
      responses:
        "200":
          description: Rebalancing plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /api/accounts:
    get:
      summary: List accounts
      operationId: getAccounts
      tags: [Accounts]
      parameters:
        - in: query
          name: active
          schema:
            type: string
            enum: ["true", "false", "all"]
          description: Filter by active status (default true)
        - $ref: "#/components/parameters/OptionalLimit"
        - $ref: "#/components/parameters/OptionalOffset"
      responses:
        "200":
          description: Account list (complete unless limit/offset are supplied)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AccountList"
    post:
      summary: Create account
      operationId: createAccount
      tags: [Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreate"
      responses:
        "201":
          description: Created account
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Account"
        "409":
          description: An account with that name already exists

  /api/accounts/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      summary: Get one account
      operationId: getAccount
      tags: [Accounts]
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Account"
        "404":
          description: Account not found
    patch:
      summary: Update account
      operationId: updateAccount
      tags: [Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdate"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Account"
        "404":
          description: Account not found
        "409":
          description: An account with that name already exists
    delete:
      summary: Delete account (409 if still referenced — archive instead)
      operationId: deleteAccount
      tags: [Accounts]
      responses:
        "204":
          description: No Content
        "404":
          description: Account not found
        "409":
          description: Account still has transactions; archive it instead

  /api/accounts/{id}/merge:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: Survivor account id (sources merge into this one)
    post:
      summary: Merge source accounts into this (survivor) account
      description: Repoints all references (transactions, planned, portfolio lots, funding_account_id) from each source account to this (survivor) account, then deletes the sources (ADR-088).
      operationId: mergeAccounts
      tags: [Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_ids]
              properties:
                source_ids:
                  type: array
                  items:
                    type: integer
                  description: Account ids to merge into this account and delete
      responses:
        "200":
          description: Merge result (survivor id, merged ids, reassigned counts)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          description: Target or a source account not found

  /api/accounts/{id}/merge-preview:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: Source account id (the account that would be merged away)
    get:
      summary: Preview merging this account into another (read-only)
      description: >-
        Dry-run of merging account {id} (the source) INTO the account given by
        `into` (the survivor). Returns the row counts that would be repointed
        (same categories POST /merge moves), the projected post-merge computed
        balance — the anchor+delta definition evaluated over the union of both
        accounts' active rows, in the survivor's native currency — and whether
        the merge would interleave stamped balance histories
        (`stampsInterleaved`), in which case the merge clears the survivor's
        statement-balance anchor. No mutation.
      operationId: previewAccountMerge
      tags: [Accounts]
      parameters:
        - in: query
          name: into
          required: true
          schema:
            type: integer
          description: Survivor account id (the account {id} would merge into)
      responses:
        "200":
          description: Merge preview
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          into:
                            type: integer
                            description: Survivor account id
                          source:
                            type: integer
                            description: Source account id
                          reassigned:
                            type: object
                            description: Row counts that would move to the survivor
                            properties:
                              transactions: { type: integer }
                              planned: { type: integer }
                              portfolio: { type: integer }
                              funding: { type: integer }
                          projectedBalance:
                            type: number
                            description: Post-merge computed balance (anchor+delta over the union of both accounts' active rows)
                          projectedBalanceCurrency:
                            type: string
                            description: The survivor's native currency (ISO-4217)
                          stampsInterleaved:
                            type: boolean
                            description: Whether both accounts carry stamped balance histories with overlapping date ranges (the merge would clear the survivor's statement anchor)
        "400":
          description: Missing/invalid `into`, or `into` equals {id}
        "404":
          description: Source or survivor account not found

  /api/accounts/{id}/opening-balance:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: Account to anchor
    post:
      summary: Set the opening-balance anchor for an account
      description: >-
        Creates (or updates) one system anchor row per account+currency with
        amount=0, a server-stamped `balance`, is_transfer=true and
        transfer_source='opening' (ADR-094 second addendum, D4). The single
        sanctioned exception to the balance write-protection; lets manual/cash-only
        accounts seed a balance. Invoking again updates the existing anchor.
      operationId: setAccountOpeningBalance
      tags: [Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [balance, date]
              properties:
                balance:
                  type: number
                  description: The opening balance to stamp
                date:
                  type: string
                  format: date
                  description: As-of date; expected to precede the account's activity
                currency:
                  type: string
                  description: 3-letter ISO code; defaults to the account currency
      responses:
        "200":
          description: The anchor transaction plus an optional warning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          description: Missing/invalid balance, date, or currency (must be a 3-letter ISO code)
        "404":
          description: Account not found

  /api/accounts/{id}/reconcile:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: Account to reconcile
    post:
      summary: Reconcile an account's drift
      description: >-
        Resolves the drift (statement_balance − computed_balance) surfaced by the
        drift badge (ADR-094, Phase C). `mode: 'accept'` rewrites the stored
        statement figure to the computed balance (no transaction created);
        `mode: 'adjustment'` stamps one server-side ledger row (amount=drift,
        balance-free, is_transfer=true, transfer_source='adjustment') so the
        computed balance rises to meet the statement — preserving the ADR-094
        descriptive-only default. Either way the drift collapses to 0.
      operationId: reconcileAccount
      tags: [Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [accept, adjustment]
                  description: How to resolve the drift
      responses:
        "200":
          description: The reconciled figures plus any created adjustment transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          description: No drift to resolve, no statement balance, or an invalid mode
        "404":
          description: Account not found

  # ─── Transactions ────────────────────────────────────────────────────────────

  /api/transactions:
    get:
      summary: List transactions
      operationId: getTransactions
      tags: [Transactions]
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
        - in: query
          name: start_date
          schema:
            type: string
            format: date
        - in: query
          name: end_date
          schema:
            type: string
            format: date
        - in: query
          name: account_id
          description: Preferred account filter (exact FK match, ADR-088); bank_account remains a substring escape hatch
          schema:
            type: integer
        - in: query
          name: bank_account
          schema:
            type: string
        - in: query
          name: category_id
          schema:
            type: integer
        - in: query
          name: recipient_id
          schema:
            type: integer
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: sort_by
          schema:
            type: string
        - in: query
          name: sort_dir
          schema:
            type: string
            enum: [asc, desc]
        - in: query
          name: tags
          schema:
            type: string
          description: Comma-separated tag slugs — OR filter
        - in: query
          name: transaction_id
          description: Fetch a single transaction by id (exact match)
          schema:
            type: integer
        - in: query
          name: category_ids
          description: Comma-separated category ids — OR filter
          schema:
            type: string
        - in: query
          name: recipient_group_id
          description: Filter by primary (grouped) recipient id
          schema:
            type: integer
        - in: query
          name: recipient_name
          description: Filter by recipient display name (substring)
          schema:
            type: string
        - in: query
          name: active
          description: Include only active (default true) or inactive rows
          schema:
            type: boolean
            default: true
        - in: query
          name: include_balance
          description: Include the running-balance column on each row
          schema:
            type: boolean
        - in: query
          name: transaction_type
          description: Filter by kind (e.g. income/expense)
          schema:
            type: string
        - in: query
          name: amount_min
          description: Minimum amount (see amount_signed for sign semantics)
          schema:
            type: number
        - in: query
          name: amount_max
          description: Maximum amount (see amount_signed)
          schema:
            type: number
        - in: query
          name: amount_exact
          description: Exact amount — shorthand for amount_min == amount_max
          schema:
            type: number
        - in: query
          name: amount_signed
          description: When true, amount_* compare signed values; otherwise magnitude
          schema:
            type: boolean
        - in: query
          name: uncategorised
          description: When true, return only uncategorised transactions
          schema:
            type: boolean
        - in: query
          name: normalize_to_eur
          description: Convert amounts to EUR (or target_currency) at read time
          schema:
            type: boolean
            default: false
        - in: query
          name: target_currency
          description: Target currency for normalize_to_eur (defaults to EUR)
          schema:
            type: string
      responses:
        "200":
          description: Paginated transaction list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TransactionList"
    post:
      summary: Create transaction
      operationId: createTransaction
      tags: [Transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionCreate"
      responses:
