  # ─── Import ───────────────────────────────────────────────────────────────────
  /api/import/csv:
    post:
      summary: Import transactions from bank CSV
      operationId: importCsv
      description: >-
        Rejects the whole file before staging if any transaction data row cannot
        be parsed. No transactions are imported from a rejected file. Correct the
        reported dates, amounts or CSV structure and upload again. Intentionally
        excluded non-settled records do not trigger this rejection. JSON uploads
        return 400 VALIDATION_ERROR; streaming uploads emit an error event with
        code VALIDATION_ERROR and an actionable detail message.
      tags: [Import]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, bank_name]
              properties:
                file:
                  type: string
                  format: binary
                bank_name:
                  type: string
                  description: Bank adapter identifier.
      responses:
        "201":
          description: All rows matched exactly — batch committed immediately
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ImportCsvResult"
        "202":
          description: Some rows need review — batch left in awaiting_review; client must use the review endpoints then POST commit
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ImportCsvReviewRequired"

  /api/import/csv/custom:
    post:
      summary: Import CSV with custom column mapping
      operationId: importCsvCustom
      description: >-
        Rejects the whole file before staging if any transaction data row cannot
        be parsed. No transactions are imported from a rejected file. Correct the
        reported dates, amounts or CSV structure and upload again. Intentionally
        excluded non-settled records do not trigger this rejection. JSON uploads
        return 400 VALIDATION_ERROR; streaming uploads emit an error event with
        code VALIDATION_ERROR and an actionable detail message.
      tags: [Import]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: Flat multipart form fields (customCsvImportSchema in
                routes/importRoutes.js).
              required:
                [
                  file,
                  bank_name,
                  date_format,
                  date_column,
                  recipient_column,
                  amount_column,
                ]
              properties:
                file:
                  type: string
                  format: binary
                bank_name:
                  type: string
                  description: Display label for the custom adapter
                date_format:
                  type: string
                  description: Date format of the date column (e.g. DD/MM/YYYY)
                date_column:
                  type: string
                recipient_column:
                  type: string
                amount_column:
                  type: string
                memo_column:
                  type: string
                separator:
                  type: string
                  description: Single-character CSV delimiter, default ','
                encoding:
                  type: string
                  default: utf-8
                  description: UTF-8, Latin-1 (latin1, latin-1, iso-8859-1), or windows-1252; unsupported values reject with 400.
                number_format:
                  $ref: "#/components/schemas/CsvNumberFormat"
                skip_rows:
                  type: integer
                  default: 0
                  minimum: 0
                  description: Physical leading lines before the CSV header.
      responses:
        "400":
          description: Invalid configuration, unsupported encoding, or ambiguous generic number; no rows staged.
        "201":
          description: All rows matched exactly — batch committed immediately
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ImportCsvResult"
        "202":
          description: Some rows need review — batch left in awaiting_review; client must use the review endpoints then POST commit
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ImportCsvReviewRequired"

  /api/import/csv/stream:
    post:
      summary: Stream-import large CSV file
      operationId: importCsvStream
      description: >-
        Rejects the whole file before staging if any transaction data row cannot
        be parsed. No transactions are imported from a rejected file. Correct the
        reported dates, amounts or CSV structure and upload again. Intentionally
        excluded non-settled records do not trigger this rejection. JSON uploads
        return 400 VALIDATION_ERROR; streaming uploads emit an error event with
        code VALIDATION_ERROR and an actionable detail message.
      tags: [Import]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, bank_name]
              properties:
                file:
                  type: string
                  format: binary
                bank_name:
                  type: string
                  description: Bank adapter identifier.
      responses:
        "200":
          description: Server-Sent Events stream; events are progress /
            review_required / complete / error. The `complete` event carries
            `{total_processed, imported, duplicates, errors, batch_id,
            auto_linked_count, status, percent}` (routes/importRoutes.js
            buildComplete); `review_required` carries `{batch_id,
            match_source_counts, percent}` — no counts. Event payloads are not
            modelled as schemas (OpenAPI cannot type SSE events), so the
            frontend keeps a hand-written `ImportResult` type for this stream.
            Error events carry `{detail, code}`.
          content:
            text/event-stream:
              schema:
                type: string

