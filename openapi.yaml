            - $ref: "#/components/schemas/ResearchPresentationWatchlistResult"
            - $ref: "#/components/schemas/ResearchPresentationWatchlistBatchResult"
            - $ref: "#/components/schemas/ResearchPresentationProviderQuoteResult"
            - $ref: "#/components/schemas/ResearchPresentationAnalystResult"
            - $ref: "#/components/schemas/ResearchPresentationMarketAddResult"
            - $ref: "#/components/schemas/ResearchLifeScenarioPrepareResult"
            - $ref: "#/components/schemas/ResearchLifeScenarioCompareResult"

