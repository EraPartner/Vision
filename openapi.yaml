            type: string
            format: date
        - in: query
          name: end_date
          schema:
            type: string
            format: date
        - in: query
          name: bank_account
          schema:
            type: string
        - in: query
          name: include_balance
          schema:
            type: boolean
        - in: query
          name: tags
          schema:
            type: string
          description: Comma-separated tag slugs — OR filter
      responses:
        "200":
          description: CSV stream
          content:
            text/csv:
              schema:
                type: string

  /api/transactions/export/json:
    get:
