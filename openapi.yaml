              schema:
                $ref: "#/components/schemas/Envelope"

  # ─── Planned Transactions ────────────────────────────────────────────────────
  /api/planned-transactions:
    get:
      summary: List planned transactions
      operationId: getPlannedTransactions
      tags: [PlannedTransactions]
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: offset
          schema:
            type: integer
        - in: query
          name: bank_account
          schema:
            type: string
        - in: query
          name: account_id
          description: Exact account foreign-key filter; takes precedence over bank_account.
          schema:
            type: integer
            minimum: 1
        - in: query
          name: is_recurring
          schema:
            type: boolean
        - in: query
          name: is_executed
          schema:
            type: boolean
        - in: query
          name: active
          description: "true (the default) lists active payments only; false includes paused ones."
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Planned transaction list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PlannedTransactionList"
    post:
      summary: Create planned transaction
      operationId: createPlannedTransaction
      tags: [PlannedTransactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlannedTransactionCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PlannedTransaction"

  /api/planned-transactions/due-soon:
    get:
      summary: List planned transactions due within 7 days
      operationId: getPlannedTransactionsDueSoon
      tags: [PlannedTransactions]
      responses:
        "200":
          description: Due-soon list (canonical `{items, total}` body; `days` echoes the effective window)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, total, days]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/PlannedTransaction"
                          total:
                            type: integer
                          days:
                            type: integer

  /api/planned-transactions/totals:
    get:
      summary: Planned totals in one display currency
      description: >
        Server-computed planned totals. `rest_of_month` sums every occurrence
        due from today to the end of the calendar month (recurring rows counted
        once per occurrence, bounded by recurrence end date and max occurrences),
        split into incoming and outgoing. `monthly_equivalent` is the signed net
        monthly amount of active recurring rows (weekly = 30.4375/7 per month).
        Amounts are converted at the latest stored exchange rates; rows without a
        rate are left out and counted in `unconverted_count`.
      operationId: getPlannedTotals
      tags: [PlannedTransactions]
      parameters:
        - in: query
          name: currency
          schema:
            type: string
            pattern: "^[A-Za-z]{3}$"
            default: EUR
      responses:
        "200":
          description: Planned totals
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PlannedTotals"
        "400":
          description: "VALIDATION_ERROR: currency is not a 3-letter ISO code"
  /api/planned-transactions/match-suggestions:
    get:
      summary: List planned payments with likely-matching unlinked transactions
      description: >
        Active, unexecuted planned payments that have one or more recent unlinked
        transactions within match tolerance (same recipient cluster, sign, ±5%
        amount, ±5 days) but were not auto-cleared — ambiguous matches or
        auto-clear disabled. Each entry carries its candidate transactions for
        the user to confirm.
      operationId: getPlannedMatchSuggestions
      tags: [PlannedTransactions]
      responses:
        "200":
          description: Match suggestions (canonical `{items, total}` body)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, total]
                        properties:
                          total:
                            type: integer
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                planned:
                                  type: object
                                  properties:
                                    id: { type: integer }
                                    recipient_id:
                                      { type: integer, nullable: true }
                                    recipient_name:
                                      { type: string, nullable: true }
                                    amount: { type: number }
                                    planned_date: { type: string }
                                    currency: { type: string, nullable: true }
                                    is_recurring: { type: boolean }
                                candidates:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      id: { type: integer }
                                      recipient_name:
                                        { type: string, nullable: true }
                                      amount: { type: number }
                                      transaction_date: { type: string }
                                      currency: { type: string, nullable: true }
                                      memo: { type: string, nullable: true }

  /api/planned-transactions/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    get:
      summary: Get planned transaction
      operationId: getPlannedTransaction
      tags: [PlannedTransactions]
      responses:
        "200":
          description: Single planned transaction
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PlannedTransaction"
    patch:
      summary: Update planned transaction
      operationId: updatePlannedTransaction
      tags: [PlannedTransactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                planned_date:
                  type: string
                  format: date
                account_id:
                  type: integer
                  minimum: 1
                  nullable: true
                  description: Canonical account identity (the retired bank_account string is rejected)
                recipient_id:
                  type: integer
                memo:
                  type: string
                amount:
                  type: number
                currency:
                  type: string
                category_id:
                  type: integer
                comment:
                  type: string
                url:
                  type: string
                is_recurring:
                  type: boolean
                recurrence_pattern:
                  type: string
                recurrence_end_date:
                  type: string
                  format: date
                  nullable: true
                max_occurrences:
                  type: integer
                  nullable: true
                is_active:
                  type: boolean
                is_loan:
                  type: boolean
                loan_type:
                  $ref: "#/components/schemas/PlannedLoanType"
                loan_principal:
                  type: number
                loan_annual_interest_rate:
                  type: number
                loan_term_months:
                  type: integer
                loan_start_date:
                  type: string
                  format: date
                loan_payment_day:
                  type: integer
                tags:
                  type: array
                  items:
                    type: string
                  description: Tag slugs; replaces the attached set
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PlannedTransaction"
    delete:
      summary: Delete planned transaction
      operationId: deletePlannedTransaction
      tags: [PlannedTransactions]
      responses:
        "204":
          description: No Content

  /api/planned-transactions/{id}/execute:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    post:
      summary: Link a real transaction and advance the planned payment
      operationId: executePlannedTransaction
      tags: [PlannedTransactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [executed_transaction_id]
              properties:
                executed_transaction_id:
                  type: integer
                  minimum: 1
                execution_date:
                  type: string
                  format: date
      responses:
        "200":
          description: Execution recorded or replayed; completed recurring series accept only existing execution pairs
          headers:
            Idempotent-Replay:
              description: Present with value true for an existing execution pair
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PlannedTransaction"
        "400":
          description: Missing or invalid transaction ID or execution date
        "404":
          description: Planned transaction not found
        "409":
          description: Completed plan, inactive ledger row, mismatched currency, or stale automatic occurrence; existing pairs remain replayable

