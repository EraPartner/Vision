openapi: 3.0.3

info:
  title: Vision Financial API
  version: "1.0"
  description: >
    Self-hosted financial transaction manager.
    All responses are wrapped in the ADR-026 envelope:
    `{ ok: true, data: T }` on success, `{ ok: false, error: {...} }` on failure.
    Every request must have one valid Host authority targeting loopback, the configured
    listener hostname/address, or an exact SERVER_ALLOWED_HOSTS entry. Rejected
    destinations receive 403 before CORS, body parsing, health and routes.

servers:
  - url: http://localhost:3000
    description: Local development

# ─── Shared envelope & list wrappers ─────────────────────────────────────────
components:
  securitySchemes:
    AuditBridgeToken:
      type: http
      scheme: bearer
      description: >
        Per-launch token supplied only by the Electron main process to its native
        backend. A loopback socket peer is also required. This is not ADMIN_AUTH_TOKEN.
  parameters:
    # Opt-in pagination for list endpoints that historically returned every row.
    # Both are optional and, when neither is sent, the response carries the full
    # collection (and no limit/offset fields) — exactly the pre-pagination
    # behaviour, so existing clients are never silently truncated.
    OptionalLimit:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
      description: >
        Page size. Omit (together with offset) to receive the whole collection.
        Values above the endpoint's cap are clamped.
    OptionalOffset:
      in: query
      name: offset
      required: false
      schema:
        type: integer
        minimum: 0
      description: Rows to skip. Omit (together with limit) to receive the whole collection.

  schemas:
    ReportPeriod:
      description: Report window. Custom dates validate their YYYY-MM-DD shape; the route does not check calendar validity or from/to ordering.
      default: { kind: rolling, months: 12 }
      oneOf:
        - type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [ytd] }
        - type: object
          required: [kind, months]
          properties:
            kind: { type: string, enum: [rolling] }
            months: { type: integer, minimum: 1, maximum: 60 }
        - type: object
          required: [kind, from, to]
          properties:
            kind: { type: string, enum: [custom] }
            from: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
            to: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - type: object
          required: [kind, year]
          properties:
            kind: { type: string, enum: [year] }
            year: { type: integer, minimum: 2000, maximum: 2100 }
      discriminator:
        propertyName: kind
    ReportThemeToken:
      type: string
      pattern: '^\d{1,3}(?:\.\d+)?\s+\d{1,3}(?:\.\d+)?%\s+\d{1,3}(?:\.\d+)?%$'
      description: HSL component triple only, without hsl() or CSS declarations. The shape guard does not impose numeric hue/saturation/lightness bounds.
      example: '158 62% 32%'
    ReportTheme:
      type: object
      default: { mode: light }
      description: Known optional HSL tokens. Unknown properties are stripped by the route; omitted mode defaults to light.
      properties:
        primary: { $ref: "#/components/schemas/ReportThemeToken" }
        accent: { $ref: "#/components/schemas/ReportThemeToken" }
        success: { $ref: "#/components/schemas/ReportThemeToken" }
        expense: { $ref: "#/components/schemas/ReportThemeToken" }
        surface: { $ref: "#/components/schemas/ReportThemeToken" }
        text: { $ref: "#/components/schemas/ReportThemeToken" }
        muted: { $ref: "#/components/schemas/ReportThemeToken" }
        border: { $ref: "#/components/schemas/ReportThemeToken" }
        chart1: { $ref: "#/components/schemas/ReportThemeToken" }
        chart2: { $ref: "#/components/schemas/ReportThemeToken" }
        chart3: { $ref: "#/components/schemas/ReportThemeToken" }
        chart4: { $ref: "#/components/schemas/ReportThemeToken" }
        chart5: { $ref: "#/components/schemas/ReportThemeToken" }
        chart6: { $ref: "#/components/schemas/ReportThemeToken" }
        chart7: { $ref: "#/components/schemas/ReportThemeToken" }
        chart8: { $ref: "#/components/schemas/ReportThemeToken" }
        mode: { type: string, enum: [light, dark], default: light }
    ReportExclusionIds:
      type: array
      default: []
      items: { type: integer, format: int32, minimum: 1, maximum: 2147483647 }
    ReportTaxProfile:
      type: object
      properties:
        filingStatus: { type: string }
        region: { type: string }
        taxYear: { type: integer }
    ReportPrecomputedPIT:
      type: object
      description: Existing frontend-engine amounts; no server-side PIT calculation. Bracket rate uses percent units (25 means 25%).
      properties:
        taxableIncome: { type: number }
        totalTax: { type: number }
        brackets:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              rate: { type: number }
              taxableIncome: { type: number }
              taxAmount: { type: number }
    ReportPrecomputedHousehold:
      type: object
      description: Frontend-engine per-partner figures. Partner ids must be unique; duplicate ids are rejected with 400.
      required: [assessmentMode, partners]
      properties:
        assessmentMode: { type: string, enum: [single, separate, joint] }
        legalBasis: { type: string, maxLength: 200 }
        quotient:
          type: object
          required: [applied, transfer, benefit]
          properties:
            applied: { type: boolean }
            transfer: { type: number }
            fromPartnerId: { type: string, enum: [A, B] }
            toPartnerId: { type: string, enum: [A, B] }
            benefit: { type: number }
        partners:
          type: array
          minItems: 1
          maxItems: 2
          items:
            type: object
            required: [partnerId, grossIncome, taxableIncome, totalPIT]
            properties:
              partnerId: { type: string, enum: [A, B] }
              grossIncome: { type: number }
              taxableIncome: { type: number }
              totalPIT: { type: number }
    ReportRequest:
      type: object
      description: >-
        Shared validated request for all three existing report routes. An empty object is valid.
        Unknown fields are stripped, including the obsolete top-level start_date/end_date/year;
        select a window through period instead. Tax context fields are accepted by all routes
        but forwarded to rendering only for the tax report. Null is not an omitted field.
      properties:
        currency: { type: string, pattern: '^[A-Z]{3}$', default: EUR }
        period: { $ref: "#/components/schemas/ReportPeriod" }
        sections:
          type: array
          default: []
          items: { type: string }
          description: Section ids; omitted or empty selects the renderer defaults. The route does not enforce a section-id enum.
        theme: { $ref: "#/components/schemas/ReportTheme" }
        excludedCategoryIds: { $ref: "#/components/schemas/ReportExclusionIds" }
        excludedRecipientIds: { $ref: "#/components/schemas/ReportExclusionIds" }
        taxProfile: { $ref: "#/components/schemas/ReportTaxProfile" }
        precomputedPIT: { $ref: "#/components/schemas/ReportPrecomputedPIT" }
        household: { $ref: "#/components/schemas/BelgianTaxHouseholdInput" }
        precomputedHousehold: { $ref: "#/components/schemas/ReportPrecomputedHousehold" }
    CsvNumberFormat:
      type: string
      enum: [auto, decimal_dot, decimal_comma]
      default: auto
      description: >-
        Generic custom numeric grammar, independent of the CSV delimiter.
        Auto rejects values with conflicting valid decimal/grouping interpretations.
        Choose decimal_dot or decimal_comma to disambiguate. Ambiguity rejects
        the complete import with a row/column diagnostic before staging.
    AuditTrustedCheckpoint:
      type: object
      additionalProperties: false
      required: [sequence, hash]
      properties:
        sequence: { type: integer, minimum: 0 }
        hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        retention: { $ref: "#/components/schemas/AuditRetentionBoundary" }
    AuditRetentionBoundary:
      type: object
      additionalProperties: false
      required: [through, hash, domainMax, migrationHeads]
      properties:
        through: { type: integer, minimum: 1 }
        hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        domainMax: { $ref: "#/components/schemas/AuditRetentionDomainMax" }
        migrationHeads:
          type: array
          maxItems: 16
          items: { type: string, pattern: "^[0-9a-z_]{1,64}$" }
    AuditRetentionDomainMax:
      type: object
      additionalProperties: false
      required: [dbEditor, split, retag]
      properties:
        dbEditor: { type: integer, minimum: 0 }
        split: { type: integer, minimum: 0 }
        retag: { type: integer, minimum: 0 }
    AuditLegacyCutover:
      type: object
      required: [dbEditorMaxId, splitMaxId, retagMaxId]
      properties:
        dbEditorMaxId: { type: integer, minimum: 0 }
        splitMaxId: { type: integer, minimum: 0 }
        retagMaxId: { type: integer, minimum: 0 }
    AuditVerificationResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [verified, partially_verified, unavailable, failed]
        code:
          { type: string, description: Failure reason when status is failed }
        reason:
          {
            type: string,
            description: Unavailability reason when status is unavailable,
          }
        sequence: { type: integer, minimum: 0 }
        hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        anchoredThrough: { type: integer, minimum: 0 }
        retentionThrough: { type: integer, minimum: 1 }
        legacyCutover: { $ref: "#/components/schemas/AuditLegacyCutover" }
        legacyUnverified:
          type: object
          description: Decimal-string counts of pre-cutover audit rows outside the chain.
          properties:
            dbEditor: { type: string, pattern: "^[0-9]+$" }
            split: { type: string, pattern: "^[0-9]+$" }
            portfolioRetag: { type: string, pattern: "^[0-9]+$" }
    AuditReadPage:
      type: object
      required: [verification, entries, hasMore]
      properties:
        verification: { $ref: "#/components/schemas/AuditVerificationResult" }
        entries:
          type: array
          items:
            type: object
            required:
              [
                sequence,
                version,
                previousHash,
                hash,
                payload,
                createdAt,
                anchorStatus,
              ]
            properties:
              sequence: { type: integer, minimum: 1 }
              version: { type: integer, minimum: 1 }
              previousHash: { type: string, pattern: "^[0-9a-f]{64}$" }
              hash: { type: string, pattern: "^[0-9a-f]{64}$" }
              payload: { type: object, additionalProperties: true }
              createdAt: { type: string, format: date-time }
              anchorStatus: { type: string, enum: [anchored, pending_anchor] }
        hasMore: { type: boolean }
    AuditCheckpointMetadata:
      type: object
      additionalProperties: false
      required: [sequence, headHash, anchorKind, receiptId, receiptHash]
      properties:
        sequence: { type: integer, minimum: 0 }
        headHash: { type: string, pattern: "^[0-9a-f]{64}$" }
        anchorKind: { type: string, minLength: 1, maxLength: 100 }
        receiptId: { type: string, minLength: 1, maxLength: 300 }
        receiptHash: { type: string, pattern: "^[0-9a-f]{64}$" }
    AuditUpdateDecision:
      type: object
      additionalProperties: false
      required: [decision, mode, version]
      properties:
        decision:
          type: string
          enum:
            [
              checksum_verified,
              checksum_failed,
              install_requested,
              install_failed,
            ]
        mode: { type: string, enum: [native, dev] }
        version: { type: string, pattern: "^v?[0-9][0-9A-Za-z.+-]{0,63}$" }
    # Shared TypeScript tax engine (ADR-204); existing web calculations remain compatible.
    BelgianTaxHouseholdTaxResult:
      type: object
      required:
        - engineVersion
        - incomeYear
        - assessment
        - partners
        - quotient
        - csss
        - propertyTaxEstimate
        - totals
        - issues
      properties:
        engineVersion:
          type: integer
          enum:
            - 2
        incomeYear:
          type: integer
        assessment:
          $ref: "#/components/schemas/BelgianTaxAssessmentDecision"
        partners:
          type: array
          items:
            $ref: "#/components/schemas/BelgianTaxPartnerTaxResult"
        quotient:
          $ref: "#/components/schemas/BelgianTaxMaritalQuotientResult"
        csss:
          $ref: "#/components/schemas/BelgianTaxHouseholdCsssResult"
        propertyTaxEstimate:
          type: number
        totals:
          $ref: "#/components/schemas/BelgianTaxHouseholdTotals"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/BelgianTaxHouseholdTaxIssue"
    BelgianTaxAssessmentDecision:
      type: object
      required:
        - mode
        - reason
        - legalBasis
        - partnerIds
      properties:
        mode:
          type: string
          enum:
            - single
            - separate
            - joint
        reason:
          type: string
          enum:
            - one_partner
            - no_legal_union
            - union_year
            - union_year_after_legal_cohabitation
            - union_in_force
            - factual_separation_year
            - factually_separated
            - dissolution_year
            - dissolved
            - death_year
            - death_year_joint_election
            - surviving_partner
            - treaty_exempt_income
            - legacy_assumed_joint
        legalBasis:
          type: string
          description: Article the decision rests on, e.g. "WIB 92 art. 126 §2 al. 1, 1°".
        electable:
          type: boolean
          description: True when the taxpayer may elect the other mode (year of death, art. 126 §3).
        partnerIds:
          type: array
          items:
            type: string
            enum:
              - A
              - B
          description: Partners assessed for the year (the survivor only after a death in an earlier year).
    BelgianTaxPartnerTaxResult:
      type: object
      required:
        - partnerId
        - activities
        - categories
        - grossIncome
        - employeeSocialSecurity
        - professionalExpenses
        - unionDuesApplied
        - netProfessionalIncome
        - otherTaxableIncome
        - alimonyDeduction
        - taxableIncomeBeforeQuotient
        - quotientAdjustment
        - taxableIncome
        - bracketTax
        - exemption
        - exemptionBenefit
        - pitAfterExemption
        - reductions
        - ownHomeCreditRegime
        - ownHomeCredit
        - pensionReduction
        - reductionsApplied
        - federalPITAfterReductions
        - communalSurcharge
        - totalPIT
        - specialSocialSecurityContribution
        - csssSubject
        - dividendWhtReclaim
        - savingsInterestTax
        - marginalRate
      properties:
        partnerId:
          type: string
          enum:
            - A
            - B
        activities:
          type: array
          items:
            $ref: "#/components/schemas/BelgianTaxActivityTaxResult"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/BelgianTaxCategoryTaxResult"
        grossIncome:
          type: number
          description: Gross income of the activities that carry a gross figure (not `net_professional_amount`).
        employeeSocialSecurity:
          type: number
        professionalExpenses:
          type: number
        unionDuesApplied:
          type: number
        netProfessionalIncome:
          type: number
        otherTaxableIncome:
          type: number
        alimonyDeduction:
          type: number
        taxableIncomeBeforeQuotient:
          type: number
          description: Net professional + other income − alimony, before the marital quotient.
        quotientAdjustment:
          type: number
          description: Positive when the quotient adds income to this partner, negative when it removes some.
        taxableIncome:
          type: number
        bracketTax:
          $ref: "#/components/schemas/BelgianTaxBracketTax"
        exemption:
          $ref: "#/components/schemas/BelgianTaxExemptionAllocation"
        exemptionBenefit:
          type: number
        pitAfterExemption:
          type: number
        reductions:
          $ref: "#/components/schemas/BelgianTaxTaxReductionBreakdown"
        ownHomeCreditRegime:
          type: string
          enum:
            - none
            - flemish_woonbonus
            - walloon_cheque_habitat
        ownHomeCredit:
          type: number
        pensionReduction:
          type: number
          description: Reduction for pensions of this partner (WIB 92 arts 147-153, per spouse by art. 150).
        reductionsApplied:
          type: number
          description:
            "Reductions charged on this partner's tax: min(pension reduction + reductions + own-home

            credit, tax)."
        federalPITAfterReductions:
          type: number
        communalSurcharge:
          type: number
        totalPIT:
          type: number
        specialSocialSecurityContribution:
          type: number
        csssSubject:
          type: boolean
        dividendWhtReclaim:
          type: number
        savingsInterestTax:
          type: number
        marginalRate:
          type: number
    BelgianTaxActivityTaxResult:
      type: object
      required:
        - activityId
        - kind
        - forfaitCategory
        - grossIncome
        - employeeSocialSecurity
        - socialContributionsPaid
        - professionalExpenses
        - netProfessionalIncome
      properties:
        activityId:
          type: string
        kind:
          type: string
          enum:
            - employee
            - civil_servant
            - director
            - self_employed_profits
            - self_employed_fees
            - helping_spouse
            - pension
            - other_professional
            - net_professional_amount
        forfaitCategory:
          type: string
          enum:
            - director
            - helping_spouse
            - remuneration
            - profits
            - fees
            - none
        grossIncome:
          type: number
        employeeSocialSecurity:
          type: number
        socialContributionsPaid:
          type: number
          description: Self-employed social contributions deducted before the forfait (art. 52, 7°).
        professionalExpenses:
          type: number
          description: Category expenses allocated pro rata to this activity.
        netProfessionalIncome:
          type: number
    BelgianTaxCategoryTaxResult:
      type: object
      required:
        - category
        - method
        - grossAfterContributions
        - professionalExpenses
        - unionDuesApplied
        - netIncome
      properties:
        category:
          type: string
          enum:
            - director
            - helping_spouse
            - remuneration
            - profits
            - fees
            - none
        method:
          type: string
          enum:
            - lump_sum
            - actual
        grossAfterContributions:
          type: number
        professionalExpenses:
          type: number
        unionDuesApplied:
          type: number
        netIncome:
          type: number
          description: Category net income, clamped at 0 (no loss offset).
    BelgianTaxBracketTax:
      type: object
      required:
        - b1
        - b2
        - b3
        - b4
        - total
      properties:
        b1:
          type: number
        b2:
          type: number
        b3:
          type: number
        b4:
          type: number
        total:
          type: number
    BelgianTaxExemptionAllocation:
      type: object
      required:
        - basic
        - disability
        - dependentSupplements
        - isolatedParentSupplement
        - ownTotal
        - transferredIn
        - transferredOut
        - total
        - applied
      properties:
        basic:
          type: number
        disability:
          type: number
        dependentSupplements:
          type: number
        isolatedParentSupplement:
          type: number
        ownTotal:
          type: number
          description: basic + disability + dependentSupplements + isolatedParentSupplement.
        transferredIn:
          type: number
          description: Unused exemption received from the other spouse (joint assessment).
        transferredOut:
          type: number
          description: Unused exemption passed to the other spouse (joint assessment).
        total:
          type: number
          description: ownTotal + transferredIn − transferredOut.
        applied:
          type: number
          description: "Part of `total` charged on the taxable income: min(total, taxable income)."
    BelgianTaxTaxReductionBreakdown:
      type: object
      required:
        - pension
        - lifeInsurance
        - groupInsurance
        - donations
        - childcare
        - domesticHelp
        - serviceVouchers
        - total
      properties:
        pension:
          type: number
        lifeInsurance:
          type: number
        groupInsurance:
          type: number
        donations:
          type: number
        childcare:
          type: number
        domesticHelp:
          type: number
        serviceVouchers:
          type: number
        total:
          type: number
          description: Sum of the reductions above, before the cap at the tax due (own-home credit excluded).
    BelgianTaxMaritalQuotientResult:
      type: object
      required:
        - applied
        - transfer
        - target
        - cap
        - benefit
      properties:
        applied:
          type: boolean
        transfer:
          type: number
        fromPartnerId:
          type: string
          enum:
            - A
            - B
        toPartnerId:
          type: string
          enum:
            - A
            - B
        target:
          type: number
          description: min(30% of the household professional income, cap).
        cap:
          type: number
        benefit:
          type: number
          description: Combined tax saving (0 when not applied).
    BelgianTaxHouseholdCsssResult:
      type: object
      required:
        - scale
        - base
        - total
      properties:
        scale:
          type: string
          enum:
            - single
            - joint
            - none
        base:
          type: number
          description: Household base under joint assessment, otherwise the sum of each subject partner's base.
        total:
          type: number
    BelgianTaxHouseholdTotals:
      type: object
      required:
        - grossIncome
        - employeeSocialSecurity
        - professionalExpenses
        - netProfessionalIncome
        - taxableIncome
        - federalPITBeforeExemption
        - personalExemptionBenefit
        - taxReductions
        - federalPITAfterReductions
        - communalSurcharge
        - totalPIT
        - specialSocialSecurityContribution
        - propertyTaxEstimate
        - totalTaxBurden
        - netTakeHome
        - dividendWhtReclaim
        - savingsInterestTax
        - refundableChildCredit
      properties:
        grossIncome:
          type: number
          description: "Cash income: gross activity income, other taxable income and already-net amounts."
        employeeSocialSecurity:
          type: number
        professionalExpenses:
          type: number
        netProfessionalIncome:
          type: number
        taxableIncome:
          type: number
        federalPITBeforeExemption:
          type: number
        personalExemptionBenefit:
          type: number
        taxReductions:
          type: number
        federalPITAfterReductions:
          type: number
        communalSurcharge:
          type: number
        totalPIT:
          type: number
        specialSocialSecurityContribution:
          type: number
        propertyTaxEstimate:
          type: number
        totalTaxBurden:
          type: number
        netTakeHome:
          type: number
        dividendWhtReclaim:
          type: number
        savingsInterestTax:
          type: number
        refundableChildCredit:
          type: number
          description: Refundable child tax credit (art. 134 §3); always 0 until the formula is sourced.
    BelgianTaxHouseholdTaxIssue:
      type: object
      required:
        - code
        - severity
      properties:
        code:
          type: string
          enum:
            - relationship_dates_missing
            - treaty_exempt_separate_assessment
            - deceased_partner_not_assessed
            - director_contributions_not_deducted
            - forfait_category_aggregation_unverified
            - union_dues_outside_remuneration_claim
            - loss_offset_not_modelled
            - joint_reduction_allocation_unverified
            - csss_mixed_activity_base_unverified
            - refundable_child_credit_not_modelled
            - isolated_parent_supplement_not_granted
            - senior_quotient_cap_birth_years_missing
            - woonbonus_children_at_loan_start_missing
            - pension_reduction_activity_income_not_excluded
            - pension_exclusion_other_income_counted_as_activity
            - pension_quotient_partial_exclusion_unverified
            - donation_joint_ceiling_unverified
            - mortgage_region_not_used
        severity:
          type: string
          enum:
            - info
            - warning
            - needs_source
        partnerId:
          type: string
          enum:
            - A
            - B
        activityId:
          type: string
    BelgianTaxCalculation:
      type: object
      required:
        - grossIncome
        - spouseProfessionalIncome
        - householdGrossIncome
        - employeeSocialSecurity
        - specialSocialSecurityContribution
        - personalExemptionAmount
        - netIncomeAfterSS
        - professionalExpenses
        - otherDeductionsTotal
        - deductions
        - taxableIncome
        - federalPITBracket1
        - federalPITBracket2
        - federalPITBracket3
        - federalPITBracket4
        - federalPITBeforeExemption
        - personalExemptionBenefit
        - federalTaxCredits
        - ownHomeCreditRegime
        - ownHomeCredit
        - taxReductions
        - federalPITAfterReductions
        - communalSurcharge
        - totalPIT
        - totalTaxBurden
        - effectiveRate
        - marginalRate
        - netTakeHome
        - monthlyTaxReserve
        - propertyTaxEstimate
        - dividendWhtReclaim
        - savingsInterestTax
        - maritalQuotientTransfer
        - maritalQuotientBenefit
        - serviceVoucherCredit
        - breakdown
      properties:
        grossIncome:
          type: number
          description: The taxpayer's own gross income (salary + other taxable income).
        spouseProfessionalIncome:
          type: number
          description:
            "Spouse's professional income counted under a joint assessment (0 otherwise).

            `totalPIT` and the special social security contribution cover both spouses, so

            `householdGrossIncome`, `netTakeHome` and `effectiveRate` include it."
        householdGrossIncome:
          type: number
