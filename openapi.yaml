  /api/research/scorecard:
    get:
      summary: Fundamentals heuristic scorecard (health score + flags) for a symbol
      operationId: researchScorecard
      tags: [Research]
      parameters:
        - in: query
          name: symbol
          required: true
          schema:
            type: string
        - in: query
          name: asset_class
          schema:
            type: string
      responses:
        "200":
          description: "{ symbol, fundamentals, scorecard } with provenance meta, or unavailable"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          description: symbol parameter required
  /api/research/portfolio-forecast:
    post:
      summary: Monte-Carlo projection of portfolio value (on-demand, not persisted)
      operationId: researchPortfolioForecast
      tags: [Research]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                horizon_months: { type: integer }
                monthly_contribution: { type: number }
                paths: { type: integer }
                forward_blend: { type: number, description: "0 = historical drift, 1 = forward" }
                method: { type: string, enum: [parametric, block_bootstrap] }
                target_value: { type: number }
                currency: { type: string }
                seed: { type: string }
      responses:
        "200":
          description: Projection with percentile bands, summary stats, and forward-input provenance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  # Research symbol mapping (ADR-079)
  /api/research/mappings:
    get:
      summary: List stored cross-provider symbol mappings for an instrument
      operationId: researchListMappings
      tags: [Research]
      parameters:
        - in: query
          name: instrument_key
          required: true
          schema:
            type: string
        - in: query
          name: key_type
          required: false
          schema:
            type: string
            enum: [isin, internal]
            default: isin
      responses:
        "200":
          description: "Stored mappings (canonical `{items, total}` body)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          description: instrument_key required or invalid key_type
    post:
      summary: Persist user-confirmed cross-provider mappings (upsert per provider)
      operationId: researchSaveMappings
      tags: [Research]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instrument_key, mappings]
              properties:
                instrument_key:
                  type: string
                key_type:
                  type: string
                  enum: [isin, internal]
                  default: isin
                mappings:
                  type: array
                  items:
                    type: object
      responses:
        "200":
          description: Updated mapping set (canonical `{items, total}` body)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          description: instrument_key required or mappings must be a non-empty array
  /api/research/mappings/resolve:
    post:
      summary: Auto-propose per-provider symbols for an instrument (does not persist)
      operationId: researchResolveMappings
      tags: [Research]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instrument_key, query]
              properties:
                instrument_key:
                  type: string
                key_type:
                  type: string
                  enum: [isin, internal]
                  default: isin
                asset_class:
                  type: string
                query:
                  type: string
                investment_id:
                  type: integer
                  description: >-
                    Optional held-investment id. When set, that holding's
                    already-configured provider (price_provider +
                    price_provider_id) is pre-seeded as a confirmed proposal
                    (fromHolding) and its live search is skipped.
      responses:
        "200":
          description: Per-provider proposals + existing mappings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          description: instrument_key and query required
  /api/research/mappings/audit:
    post:
      summary: Cross-provider self-audit of an instrument's mappings (currency/price agreement)
      operationId: researchAuditMappings
      tags: [Research]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instrument_key]
              properties:
                instrument_key:
                  type: string
                key_type:
                  type: string
                  enum: [isin, internal]
                  default: isin
      responses:
        "200":
          description: Audit result (ok, quotes, discrepancies); stamps verified_at
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          description: instrument_key required
  /api/research/mappings/{id}:
    delete:
      summary: Delete a stored mapping by id
      operationId: researchDeleteMapping
      tags: [Research]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No Content (idempotent — an unknown id is not an error)
        "400":
          description: valid mapping id required
  # Research provider API keys (Settings, ADR-079)
  /api/research/provider-keys:
    get:
      summary: List keyed-provider API-key statuses (masked; never the full key)
      operationId: researchListProviderKeys
      tags: [Research]
      responses:
        "200":
          description: "Canonical `{items, total}` body; each item is { provider, label, envVar, configured, source, masked }"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /api/research/provider-keys/{provider}:
    put:
      summary: Set or replace a provider's API key (takes effect immediately)
      operationId: researchSetProviderKey
      tags: [Research]
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
            enum: [twelve_data, finnhub, fmp, alpha_vantage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key]
              properties:
                api_key:
                  type: string
      responses:
        "200":
          description: Updated masked statuses (canonical `{items, total}` body)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          description: unknown provider or empty api_key
    delete:
      summary: Clear a provider's stored API key (env fallback then applies)
      operationId: researchClearProviderKey
      tags: [Research]
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
            enum: [twelve_data, finnhub, fmp, alpha_vantage]
      responses:
        "204":
          description: No Content (refetch GET /provider-keys for the new statuses)
        "400":
          description: unknown provider
