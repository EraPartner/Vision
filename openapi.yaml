          sinceAddedPercent,
        ]
      properties:
        distancePercent: { type: number, nullable: true }
        absoluteDistancePercent: { type: number, nullable: true }
        isAtOrBelowTarget: { type: boolean }
        sinceAddedPercent: { type: number, nullable: true }

    ResearchPresentationWatchlistResult:
      type: object
