                  minLength: 1
                pattern_kind:
                  type: string
                  enum: [literal_prefix, glob, regex]
                  default: literal_prefix
                  nullable: true
                case_sensitive:
                  type: boolean
                  nullable: true
      responses:
        "400":
          description: "VALIDATION_ERROR: missing pattern, or a field of the wrong type"
        "200":
          description: Match count preview
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [matchCount, recipientIds]
                        properties:
                          matchCount:
                            type: integer
                          recipientIds:
                            type: array
                            items:
                              type: integer
                          truncated:
                            type: boolean
                            description: Only on a `regex` preview.

  /api/recipients/{id}/patterns/{patternId}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
      - in: path
        name: patternId
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    patch:
      summary: Update pattern
