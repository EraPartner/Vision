              maxItems: 2
              items: { type: number }
        preview:
          type: object
          nullable: true
          required: [absolutePercent, direction]
          properties:
            absolutePercent: { type: number }
            direction: { type: string, enum: [below, above] }

    ResearchPresentationWatchlistBatchResult:
      type: object
      required: [entries]
      properties:
