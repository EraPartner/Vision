                $ref: "#/components/schemas/Envelope"

  /api/recipients/{id}/aliases:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    get:
      summary: List recipient aliases (merged-in names)
      operationId: getRecipientAliases
      tags: [Recipients]
      responses:
        "200":
          description: Alias list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"

  /api/recipients/{id}/patterns:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    get:
      summary: List auto-assign patterns for recipient
      operationId: getRecipientPatterns
      tags: [Recipients]
      responses:
        "200":
          description: Pattern list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, total]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/RecipientPattern"
                          total:
                            type: integer
    post:
      summary: Create auto-assign pattern
      operationId: createRecipientPattern
      tags: [Recipients]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pattern]
              properties:
                pattern:
                  type: string
                  minLength: 1
                pattern_kind:
                  type: string
                  enum: [literal_prefix, glob, regex]
                  default: literal_prefix
                  nullable: true
                case_sensitive:
                  type: boolean
                  nullable: true
                priority:
                  type: integer
                  format: int32
                  nullable: true
                notes:
                  type: string
                  nullable: true
      responses:
        "400":
          description: "VALIDATION_ERROR: missing pattern, or a field of the wrong type"
        "201":
          description: Created pattern (its id)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [id]
                        properties:
                          id:
                            type: integer

  /api/recipients/{id}/patterns/preview:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    post:
