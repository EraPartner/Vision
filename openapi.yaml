                      description: At least one of the updatable properties
                      properties:
                        category_id:
                          type: integer
                          nullable: true
                        recipient_id:
                          type: integer
                        is_active:
                          type: boolean
      responses:
        "200":
          description: Number of transactions updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          updated:
                            type: integer
        "400":
          description: Invalid or missing fields, or invalid FK reference
        "429":
          description: Rate limit exceeded

  /api/transactions/bulk-export:
    post:
      summary: Export transactions selected by ids or filter (CSV or NDJSON stream)
      operationId: bulkExportTransactions
      tags: [Transactions]
      requestBody:
        required: true
        content:
