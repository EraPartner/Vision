                categoryIds:
                  type: array
                  items:
                    type: integer
                recipientIds:
                  type: array
                  items:
                    type: integer
                tagIds:
                  type: array
                  items:
                    type: integer
                allCategories:
                  type: boolean
                  default: false
                allRecipients:
                  type: boolean
                  default: false
                allTags:
                  type: boolean
                  default: false
                dateRangeStart:
                  type: string
                  format: date
                  nullable: true
                dateRangeEnd:
                  type: string
                  format: date
                  nullable: true
      responses:
        "201":
          description: Created chart
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SavedChart"

  /api/saved-charts/{id}:
    parameters:
      - in: path
        name: id
