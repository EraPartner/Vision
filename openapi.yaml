      summary: Update saved chart
      operationId: updateSavedChart
      tags: [Charts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "All fields optional — only provided fields are updated"
              properties:
                name:
                  type: string
                chartType:
                  type: string
                  enum: [line, bar, area]
                chartVariant:
                  type: string
                  enum: [default, stacked, grouped, ranked]
                  description: "ranked only valid with chartType=bar"
                timeBucket:
                  type: string
                  enum: [monthly, yearly]
                categoryIds:
                  type: array
                  items:
                    type: integer
                recipientIds:
                  type: array
                  items:
                    type: integer
                tagIds:
                  type: array
                  items:
                    type: integer
                allCategories:
                  type: boolean
                allRecipients:
                  type: boolean
                allTags:
