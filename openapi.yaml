          schema:
            type: string
            format: date
        - in: query
          name: end_date
          schema:
            type: string
            format: date
        - in: query
          name: account_id
          description: Preferred account filter (exact FK match, ADR-088); bank_account remains a substring escape hatch
          schema:
            type: integer
        - in: query
          name: account_ids
          description: Comma-separated account ids (exact FK match, ADR-088); preferred over bank_accounts
          schema:
            type: string
        - in: query
          name: bank_account
          schema:
            type: string
        - in: query
          name: tags
          schema:
            type: string
