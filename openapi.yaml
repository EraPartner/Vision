            { $ref: "#/components/schemas/BelgianTaxDashboardHouseholdRow" }
        rules:
          type: array
          items: { $ref: "#/components/schemas/BelgianTaxDashboardRuleSection" }

    # ADR-026 API envelope
    Envelope:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        data:
          description: Present on success
        error:
          $ref: "#/components/schemas/ErrorPayload"

    AgentCloakDesktopStatus:
      type: object
