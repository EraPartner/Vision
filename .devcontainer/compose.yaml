# Docker Compose flow for the Vision dev sandbox — devcontainer-free equivalent
# of .devcontainer/devcontainer.json. Same image hardening, egress lock, mounts,
# Postgres data volume, and ports. Driven by .devcontainer/bin/claude-compose.
#
#   build+start : docker compose -f .devcontainer/compose.yaml up -d --build
#   session     : docker compose -f .devcontainer/compose.yaml exec -u dev app claude
#
# Lifecycle (post-create once / post-start every start) + credential forwarding
# are done by bin/claude-compose. PID1 entrypoint runs as root (iptables, Postgres,
# squid); sessions use `exec -u dev` (= containerUser=root + remoteUser=dev).
name: vision

services:
  app:
    container_name: vision-dev
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, SETPCAP]
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    memswap_limit: 4g          # == mem_limit: no swap headroom beyond the cap
    cpus: 4
    pids_limit: 4096
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
      - /var/tmp:rw,noexec,nosuid,nodev,size=256m
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:3002:3002"
    environment:
      DEVCONTAINER: "true"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      DATABASE_URL: postgresql://ftm_user:localdev@127.0.0.1:5432/financial_transactions
      DB_HOST: "127.0.0.1"
      DB_PORT: "5432"
      DB_USER: ftm_user
      DB_NAME: financial_transactions
      POSTGRES_PASSWORD: localdev
      SERVER_HOST: 0.0.0.0
      PORT: "3002"
      CORS_ORIGINS: http://localhost:8080,http://localhost:3002
      VITE_API_URL: http://localhost:3002
      ALEMBIC_BIN: /workspaces/Vision/venv/bin/alembic
      DISABLE_TELEMETRY: "1"
      DISABLE_ERROR_REPORTING: "1"
      BASH_ENV: /home/dev/.safe-chain/scripts/init-posix.sh
      NODE_USE_ENV_PROXY: "1"
      HTTP_PROXY: http://127.0.0.1:3128
      HTTPS_PROXY: http://127.0.0.1:3128
      http_proxy: http://127.0.0.1:3128
      https_proxy: http://127.0.0.1:3128
      NO_PROXY: localhost,127.0.0.1,::1
      no_proxy: localhost,127.0.0.1,::1
    volumes:
      - type: bind
        source: ..
        target: /workspaces/Vision
      - type: bind
        source: ../.git
        target: /workspaces/Vision/.git
        read_only: true
      - type: bind
        source: .
        target: /workspaces/Vision/.devcontainer
        read_only: true
      - type: volume
        source: claude
        target: /home/dev/.claude
      - type: bind
        source: ${HOME}/.claude-vision-stage
        target: /home/dev/.claude-stage
        read_only: true
      - type: volume
        source: pgdata
        target: /var/lib/postgresql

volumes:
  claude:
    name: vision-claude
  pgdata:
    name: vision-pgdata
