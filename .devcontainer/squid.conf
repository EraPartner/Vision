# Vision devcontainer egress proxy (squid-openssl).
#
# Enforces a HOSTNAME allowlist on all outbound HTTPS/HTTP. Uses peek+splice:
# squid peeks the TLS ClientHello SNI, and for allowed names *splices*
# (tunnels without decrypting — end-to-end TLS is preserved, no MITM, no CA
# injection needed). Disallowed names are terminated.
#
# Stronger than an IP allowlist: can't be bypassed by an exfil endpoint
# co-hosted on an allowed CDN IP, and defeats CONNECT-host != real-SNI
# domain-fronting. iptables (init-firewall.sh) locks egress to this proxy's
# UID only, so nothing reaches the network except through here.
#
# NOTE: the Vision backend's own external calls (e.g. yahoo-finance2) use
# Node's global fetch, which does NOT honor HTTP(S)_PROXY — so those won't work
# from inside the container even though the host is allowlisted here. The
# devcontainer is for code editing; run the app on the host for live data.

http_port 3128 ssl-bump tls-cert=/etc/squid/certs/bump.pem tls-key=/etc/squid/certs/bump.pem
sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/lib/squid/ssl_db -M 4MB

# --- Allowlist (leading dot = domain + all subdomains) ---
acl allowed_sni ssl::server_name api.anthropic.com
acl allowed_sni ssl::server_name console.anthropic.com
acl allowed_sni ssl::server_name claude.ai
acl allowed_sni ssl::server_name code.claude.com
acl allowed_sni ssl::server_name docs.claude.com
acl allowed_sni ssl::server_name bun.sh
acl allowed_sni ssl::server_name registry.npmjs.org
acl allowed_sni ssl::server_name .githubusercontent.com
acl allowed_sni ssl::server_name github.com
acl allowed_sni ssl::server_name api.github.com
acl allowed_sni ssl::server_name codeload.github.com
acl allowed_sni ssl::server_name ghcr.io
acl allowed_sni ssl::server_name pkg-containers.githubusercontent.com
acl allowed_sni ssl::server_name pypi.org
acl allowed_sni ssl::server_name files.pythonhosted.org
acl allowed_sni ssl::server_name deb.debian.org
acl allowed_sni ssl::server_name security.debian.org
acl allowed_sni ssl::server_name apt.postgresql.org
acl allowed_sni ssl::server_name query1.finance.yahoo.com
acl allowed_sni ssl::server_name query2.finance.yahoo.com
acl allowed_sni ssl::server_name finance.yahoo.com
acl allowed_sni ssl::server_name .visualstudio.com
acl allowed_sni ssl::server_name malware-list.aikido.dev

acl allowed_dom dstdomain api.anthropic.com console.anthropic.com claude.ai
acl allowed_dom dstdomain code.claude.com docs.claude.com bun.sh
acl allowed_dom dstdomain registry.npmjs.org
acl allowed_dom dstdomain .githubusercontent.com github.com api.github.com codeload.github.com
acl allowed_dom dstdomain ghcr.io pkg-containers.githubusercontent.com
acl allowed_dom dstdomain pypi.org files.pythonhosted.org
acl allowed_dom dstdomain deb.debian.org security.debian.org apt.postgresql.org
acl allowed_dom dstdomain query1.finance.yahoo.com query2.finance.yahoo.com finance.yahoo.com
acl allowed_dom dstdomain .visualstudio.com
acl allowed_dom dstdomain malware-list.aikido.dev

acl step1 at_step SslBump1
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

ssl_bump peek step1
ssl_bump splice allowed_sni
ssl_bump terminate all

# Belt-and-suspenders: explicitly deny the cloud link-local metadata IP
# (already covered by default-deny + hostname allowlist, but self-documenting).
acl metadata dst 169.254.169.254/32
http_access deny metadata
http_access deny !Safe_ports
http_access allow CONNECT allowed_dom SSL_ports
http_access deny CONNECT all
http_access allow allowed_dom
http_access deny all

cache deny all
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
# No pid file: the root entrypoint manages squid as a background process, and
# /run is root-owned while squid drops to the proxy user.
pid_filename none
shutdown_lifetime 1 second

cache_effective_user proxy
cache_effective_group proxy
