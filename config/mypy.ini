# Strict type checking for every first-party Python file: Alembic env and
# migrations, repo scripts and their tests, and the packaged Alembic wrapper.
# alembic/legacy_versions/ is excluded: it is a frozen archive that never runs.
# Run with: bun run typecheck:python
[mypy]
python_version = 3.12
strict = True
warn_unreachable = True
files =
    alembic/env.py,
    alembic/versions,
    scripts,
    packaging/electron/scripts/vision-alembic.py

# Imported only to prove PyInstaller bundled it; no stubs are needed for that.
[mypy-psycopg2]
ignore_missing_imports = True
