title = "Vision gitleaks configuration"

[extend]
useDefault = true

[allowlist]
description = "Project-level allowlists"

# Obsidian plugin binaries and auto-generated plugin data (local-only keys,
# certificates, and minified third-party JS — none are project secrets).
paths = [
    '''^\.obsidian/''',
]

# Documentation examples that use placeholder tokens.
regexTarget = "match"
regexes = [
    '''YOUR_TOKEN''',
    '''replace-with-''',
    # Test and API-doc fixtures: a UUID idempotency key is a request id, not a credential.
    '''^idempotency_key"?: "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"$''',
    # An import list in apps/node-backend/tests/rateFetcher.test.ts (fetchFromErApi, ...).
    '''^fetchFromErApi,\s+__fetchHistoricalFromEcb90d''',
]
