<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Vision · Architecture & Flows</title>
    <meta
      name="description"
      content="Interactive map of Vision packages and end-to-end flows. Click a flow to trace data across the system."
    />
    <style>
      :root {
        --bg: #0c0e12;
        --bg-2: #13161c;
        --panel: rgba(255, 255, 255, 0.035);
        --panel-strong: rgba(255, 255, 255, 0.06);
        --border: rgba(255, 255, 255, 0.07);
        --border-strong: rgba(255, 255, 255, 0.14);
        --text: #e5e7eb;
        --text-dim: #9ca3af;
        --text-faint: #6b7280;
        --emerald: #10b981;
        --emerald-soft: rgba(16, 185, 129, 0.18);
        --emerald-glow: 0 0 24px rgba(16, 185, 129, 0.35);
        --gold: #d4a574;
        --gold-soft: rgba(212, 165, 116, 0.18);
        --rose: #f5a3b8;
        --node-bg: #1a1f28;
        --node-bg-active: rgba(16, 185, 129, 0.12);
        --node-bg-touched: rgba(212, 165, 116, 0.08);
        --arrow: rgba(255, 255, 255, 0.08);
        --arrow-active: #10b981;
        --arrow-past: rgba(212, 165, 116, 0.55);
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --ui:
          "Inter", "Inter Tight", "SF Pro Text", system-ui, -apple-system,
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: var(--ui);
        font-size: 14px;
        line-height: 1.5;
      }
      body {
        background:
          radial-gradient(
            ellipse 70% 50% at 12% 10%,
            rgba(16, 185, 129, 0.06),
            transparent 60%
          ),
          radial-gradient(
            ellipse 50% 40% at 90% 90%,
            rgba(212, 165, 116, 0.05),
            transparent 60%
          ),
          var(--bg);
        min-height: 100vh;
        overflow: hidden;
      }

      /* ── App shell ─────────────────────────────────────────────── */
      .app {
        display: grid;
        grid-template-columns: 280px 1fr 360px;
        grid-template-rows: 56px 1fr;
        height: 100vh;
        gap: 0;
      }

      header.top {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        border-bottom: 1px solid var(--border);
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.02),
          transparent
        );
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        z-index: 5;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .brand-mark {
        width: 24px;
        height: 24px;
        border-radius: 7px;
        background: linear-gradient(135deg, var(--emerald), #047857);
        box-shadow:
          var(--emerald-glow),
          inset 0 1px 0 rgba(255, 255, 255, 0.25);
        position: relative;
      }
      .brand-mark::after {
        content: "";
        position: absolute;
        inset: 4px;
        border-radius: 4px;
        background: radial-gradient(
          circle at 30% 30%,
          rgba(255, 255, 255, 0.4),
          transparent 50%
        );
      }
      .brand-text {
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .brand-text .muted {
        color: var(--text-dim);
        font-weight: 400;
        margin-left: 6px;
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 12px;
        color: var(--text-dim);
      }
      .stat {
        padding: 6px 12px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--panel);
      }
      .stat strong {
        color: var(--text);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      /* ── Left rail: flow list ──────────────────────────────────── */
      aside.left {
        border-right: 1px solid var(--border);
        background: var(--bg-2);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .search {
        padding: 14px 16px 10px;
        border-bottom: 1px solid var(--border);
      }
      .search input {
        width: 100%;
        padding: 9px 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.25);
        color: var(--text);
        font-family: inherit;
        font-size: 13px;
        outline: none;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .search input:focus {
        border-color: var(--emerald);
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
      }
      .search input::placeholder {
        color: var(--text-faint);
      }

      .flow-list {
        overflow-y: auto;
        flex: 1;
        padding: 8px 8px 16px;
      }
      .flow-list::-webkit-scrollbar {
        width: 8px;
      }
      .flow-list::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.08);
        border-radius: 4px;
      }

      .category {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--text-faint);
        padding: 14px 12px 6px;
        font-weight: 600;
      }
      .flow-btn {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        padding: 9px 12px;
        margin: 2px 0;
        border: 1px solid transparent;
        border-radius: 8px;
        background: transparent;
        color: var(--text);
        font-family: inherit;
        font-size: 13px;
        text-align: left;
        cursor: pointer;
        transition:
          background 0.12s,
          border-color 0.12s;
      }
      .flow-btn:hover {
        background: var(--panel);
        border-color: var(--border);
      }
      .flow-btn.active {
        background: var(--emerald-soft);
        border-color: rgba(16, 185, 129, 0.4);
        color: #d1fae5;
      }
      .flow-btn .badge {
        font-size: 11px;
        color: var(--text-dim);
        background: var(--panel-strong);
        padding: 2px 7px;
        border-radius: 999px;
        font-variant-numeric: tabular-nums;
        margin-left: 8px;
      }
      .flow-btn.active .badge {
        background: rgba(16, 185, 129, 0.25);
        color: #a7f3d0;
      }

      /* ── Canvas ────────────────────────────────────────────────── */
      main.canvas {
        overflow: auto;
        position: relative;
        background:
          radial-gradient(
            ellipse 40% 30% at 50% 20%,
            rgba(16, 185, 129, 0.04),
            transparent 70%
          ),
          var(--bg);
      }
      main.canvas::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      main.canvas::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.06);
        border-radius: 5px;
      }

      svg.diagram {
        display: block;
        margin: 16px auto;
        user-select: none;
      }

      /* Components */
      .node-bg {
        fill: var(--node-bg);
        stroke: var(--border-strong);
        stroke-width: 1;
        transition:
          fill 0.18s,
          stroke 0.18s,
          filter 0.18s;
      }
      .node-label {
        fill: var(--text);
        font-family: var(--ui);
        font-size: 12.5px;
        font-weight: 500;
        pointer-events: none;
        dominant-baseline: middle;
        text-anchor: middle;
      }
      .node-sub {
        fill: var(--text-faint);
        font-family: var(--mono);
        font-size: 9.5px;
        pointer-events: none;
        dominant-baseline: middle;
        text-anchor: middle;
      }
      .node {
        cursor: default;
        transition: transform 0.18s;
      }
      /* Kind variants */
      .node-bg.kind-client {
        fill: #1c1410;
        stroke: rgba(212, 165, 116, 0.3);
      }
      .node-bg.kind-frontend {
        fill: #11181f;
        stroke: rgba(96, 165, 250, 0.22);
      }
      .node-bg.kind-shared {
        fill: #181a22;
        stroke: rgba(212, 165, 116, 0.22);
      }
      .node-bg.kind-backend {
        fill: #131820;
        stroke: rgba(16, 185, 129, 0.2);
      }
      .node-bg.kind-service {
        fill: #131a18;
        stroke: rgba(16, 185, 129, 0.25);
      }
      .node-bg.kind-data {
        fill: #14171f;
        stroke: rgba(167, 139, 250, 0.28);
      }
      .node-bg.kind-external {
        fill: #1a1410;
        stroke: rgba(212, 165, 116, 0.3);
      }
      .node-bg.kind-build {
        fill: #1a1820;
        stroke: rgba(167, 139, 250, 0.22);
      }

      /* Touched (any step in flow uses it) */
      .node.touched .node-bg {
        fill: var(--node-bg-touched);
        stroke: rgba(212, 165, 116, 0.55);
      }
      /* Active (current step from/to) */
      .node.active .node-bg {
        fill: var(--node-bg-active);
        stroke: var(--emerald);
        filter: drop-shadow(0 0 12px rgba(16, 185, 129, 0.55));
      }
      /* Dimmed when a flow is selected but this node isn't touched */
      .has-flow .node:not(.touched) .node-bg {
        opacity: 0.35;
      }
      .has-flow .node:not(.touched) text {
        opacity: 0.45;
      }

      /* Layer labels */
      .layer-label {
        fill: var(--text-faint);
        font-family: var(--ui);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        pointer-events: none;
      }

      /* Arrows */
      .arrow-base {
        stroke: var(--arrow);
        stroke-width: 1.4;
        fill: none;
        transition:
          stroke 0.2s,
          stroke-width 0.2s,
          opacity 0.2s;
      }
      .arrow {
        fill: none;
        stroke-width: 1.8;
        pointer-events: none;
        transition:
          stroke 0.2s,
          stroke-width 0.2s,
          opacity 0.2s;
      }
      .arrow.past {
        stroke: var(--arrow-past);
        opacity: 0.85;
      }
      .arrow.active {
        stroke: var(--arrow-active);
        stroke-width: 2.4;
        filter: drop-shadow(0 0 6px rgba(16, 185, 129, 0.6));
      }
      .arrow.future {
        stroke: rgba(255, 255, 255, 0.18);
        stroke-dasharray: 4 4;
      }

      .step-badge-circle {
        fill: var(--bg-2);
        stroke: var(--border-strong);
        stroke-width: 1;
        transition:
          fill 0.2s,
          stroke 0.2s;
      }
      .step-badge-circle.past {
        fill: rgba(212, 165, 116, 0.2);
        stroke: var(--gold);
      }
      .step-badge-circle.active {
        fill: var(--emerald);
        stroke: var(--emerald);
        filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.6));
      }
      .step-badge-text {
        fill: var(--text-dim);
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 700;
        pointer-events: none;
        dominant-baseline: middle;
        text-anchor: middle;
      }
      .step-badge-text.active {
        fill: #052e1e;
      }
      .step-badge-text.past {
        fill: #fef3c7;
      }

      /* Traveling token */
      .token {
        fill: var(--emerald);
        stroke: rgba(255, 255, 255, 0.6);
        stroke-width: 1.2;
        filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.9));
      }

      /* ── Right rail: steps panel ───────────────────────────────── */
      aside.right {
        border-left: 1px solid var(--border);
        background: var(--bg-2);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .right-header {
        padding: 16px 18px 14px;
        border-bottom: 1px solid var(--border);
      }
      .right-header .flow-name {
        font-size: 15px;
        font-weight: 600;
        color: var(--text);
        margin: 0 0 4px;
      }
      .right-header .flow-summary {
        font-size: 12px;
        color: var(--text-dim);
        margin: 0;
      }
      .right-header.empty {
        color: var(--text-faint);
      }
      .right-header .empty-hint {
        font-size: 12px;
        color: var(--text-faint);
        margin: 4px 0 0;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.15);
      }
      .controls button {
        width: 30px;
        height: 30px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        border-radius: 7px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-family: inherit;
        font-size: 13px;
        transition:
          background 0.12s,
          border-color 0.12s,
          transform 0.08s;
      }
      .controls button:hover:not(:disabled) {
        background: var(--panel-strong);
        border-color: var(--border-strong);
      }
      .controls button:active:not(:disabled) {
        transform: scale(0.96);
      }
      .controls button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .controls .progress {
        flex: 1;
        text-align: right;
        font-size: 11px;
        color: var(--text-dim);
        font-variant-numeric: tabular-nums;
        font-family: var(--mono);
      }
      .controls .play {
        background: var(--emerald-soft);
        border-color: rgba(16, 185, 129, 0.35);
        color: #d1fae5;
      }
      .controls .play:hover:not(:disabled) {
        background: rgba(16, 185, 129, 0.28);
      }

      .step-list {
        overflow-y: auto;
        flex: 1;
        padding: 8px 14px 16px;
      }
      .step-list::-webkit-scrollbar {
        width: 8px;
      }
      .step-list::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.06);
        border-radius: 4px;
      }

      .step {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 11px 12px 12px;
        margin: 8px 0;
        background: var(--panel);
        cursor: pointer;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .step:hover {
        border-color: var(--border-strong);
        background: var(--panel-strong);
      }
      .step.past {
        border-color: rgba(212, 165, 116, 0.25);
        background: rgba(212, 165, 116, 0.04);
      }
      .step.active {
        border-color: var(--emerald);
        background: rgba(16, 185, 129, 0.08);
        box-shadow:
          0 0 0 1px rgba(16, 185, 129, 0.3),
          0 4px 14px rgba(0, 0, 0, 0.3);
      }
      .step-head {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        color: var(--text-dim);
        margin-bottom: 6px;
      }
      .step-num {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        border-radius: 999px;
        background: var(--panel-strong);
        color: var(--text-dim);
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 700;
      }
      .step.past .step-num {
        background: var(--gold-soft);
        color: var(--gold);
      }
      .step.active .step-num {
        background: var(--emerald);
        color: #052e1e;
      }

      .step-route {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--text);
        margin-bottom: 6px;
        line-height: 1.45;
        word-break: break-word;
      }
      .step-route .arrow-glyph {
        color: var(--text-faint);
        margin: 0 4px;
      }
      .step-route .endpoint {
        color: var(--emerald);
      }
      .step.past .step-route .endpoint {
        color: var(--gold);
      }

      .step-payload {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--text);
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 9px;
        margin: 6px 0;
        word-break: break-word;
        line-height: 1.45;
      }

      .step-annotation {
        font-size: 12.5px;
        color: var(--text-dim);
        line-height: 1.55;
      }

      /* Empty state */
      .empty-canvas-hint {
        fill: var(--text-faint);
        font-family: var(--ui);
        font-size: 13px;
        text-anchor: middle;
        pointer-events: none;
      }

      /* Footer / shortcuts */
      .shortcuts {
        padding: 10px 16px;
        border-top: 1px solid var(--border);
        font-size: 11px;
        color: var(--text-faint);
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
      }
      .kbd {
        display: inline-block;
        padding: 1px 6px;
        margin: 0 2px 0 0;
        border: 1px solid var(--border-strong);
        border-bottom-width: 2px;
        border-radius: 4px;
        font-family: var(--mono);
        font-size: 10px;
        color: var(--text-dim);
        background: rgba(0, 0, 0, 0.25);
      }

      /* Tooltip */
      .tooltip {
        position: fixed;
        pointer-events: none;
        background: rgba(20, 24, 32, 0.96);
        border: 1px solid var(--border-strong);
        border-radius: 7px;
        padding: 8px 10px;
        font-size: 12px;
        color: var(--text);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        z-index: 99;
        max-width: 280px;
        opacity: 0;
        transform: translate(0, -6px);
        transition:
          opacity 0.12s,
          transform 0.12s;
      }
      .tooltip.shown {
        opacity: 1;
        transform: translate(0, 0);
      }
      .tooltip .tip-title {
        font-weight: 600;
        margin: 0 0 2px;
        color: var(--emerald);
      }
      .tooltip .tip-path {
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--text-faint);
      }
      .tooltip .tip-desc {
        color: var(--text-dim);
        margin-top: 4px;
        font-size: 11.5px;
        line-height: 1.5;
      }

      /* Journey view keeps each handoff readable without the full system map. */
      button:focus-visible,
      a:focus-visible,
      select:focus-visible,
      .step:focus-visible {
        outline: 2px solid var(--emerald);
        outline-offset: 3px;
      }
      .search label {
        display: block;
        color: var(--text-dim);
        font-size: 12px;
        margin-bottom: 6px;
      }
      .search select {
        width: 100%;
        margin-bottom: 12px;
        padding: 8px;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        font: inherit;
      }
      .track-hint,
      .no-results {
        padding: 0 16px;
        color: var(--text-dim);
        font-size: 12px;
      }
      .canvas-toolbar {
        position: sticky;
        top: 0;
        z-index: 4;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        padding: 12px 18px;
        background: var(--bg-2);
        border-bottom: 1px solid var(--border);
      }
      .canvas-toolbar button {
        padding: 7px 12px;
        border-radius: 8px;
        border: 1px solid var(--border-strong);
        color: var(--text-dim);
        background: var(--panel);
        font: inherit;
        cursor: pointer;
      }
      .canvas-toolbar button[aria-pressed="true"] {
        color: #d1fae5;
        background: var(--emerald-soft);
        border-color: var(--emerald);
      }
      .canvas-toolbar span {
        color: var(--text-dim);
        font-size: 12px;
      }
      [hidden] {
        display: none !important;
      }
      .journey {
        max-width: 860px;
        padding: 24px;
        margin: 0 auto;
      }
      .journey-intro h1 {
        font-size: 22px;
        line-height: 1.3;
        margin: 0 0 8px;
      }
      .journey-intro p {
        color: var(--text-dim);
        margin: 0 0 18px;
      }
      .takeaway {
        padding: 12px 14px;
        border-left: 3px solid var(--gold);
        background: var(--gold-soft);
        border-radius: 6px;
      }
      .journey-step {
        width: 100%;
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr) 24px minmax(0, 1fr);
        align-items: center;
        gap: 10px;
        margin: 12px 0;
        padding: 14px;
        border: 1px solid var(--border-strong);
        border-radius: 12px;
        background: var(--panel);
        color: var(--text);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .journey-step.active {
        border-color: var(--emerald);
        background: var(--emerald-soft);
      }
      .journey-step.past {
        border-color: var(--gold);
      }
      .journey-step .step-num {
        grid-column: 1;
        grid-row: 1 / 3;
      }
      .journey-action {
        grid-column: 2 / -1;
        font-weight: 600;
      }
      .journey-node {
        display: block;
        padding: 10px;
        border-radius: 8px;
        background: var(--node-bg);
        border: 1px solid var(--border-strong);
        overflow-wrap: anywhere;
      }
      .journey-node small {
        display: block;
        color: var(--text-dim);
        font-size: 11px;
      }
      .journey-arrow {
        color: var(--emerald);
        text-align: center;
      }
      .journey-step .journey-node:first-of-type {
        grid-column: 2;
      }
      .journey-note {
        grid-column: 2 / -1;
        color: var(--text-dim);
        font-size: 12px;
      }
      .doc-links {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 12px;
        margin-top: 12px;
      }
      .doc-links a {
        color: #a7f3d0;
        font-size: 12px;
      }
      .step details {
        cursor: auto;
        margin-top: 8px;
      }
      .step summary {
        color: var(--text-dim);
        font-size: 12px;
        cursor: pointer;
      }
      .step-title {
        margin: 0 0 8px;
        font-weight: 600;
      }
      .step-select {
        display: block;
        width: 100%;
        padding: 0;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .step-select > span {
        display: block;
      }
      .step-select .step-head {
        display: flex;
      }
      .legend {
        padding: 10px 18px;
        color: var(--text-dim);
        font-size: 12px;
      }
      @media (max-width: 1200px) {
        .app {
          grid-template-columns: 240px minmax(0, 1fr);
        }
        aside.right {
          grid-column: 1 / -1;
          max-height: 42vh;
          border-top: 1px solid var(--border);
        }
        .app {
          grid-template-rows: 56px minmax(0, 1fr) auto;
        }
      }
      @media (max-width: 700px) {
        body {
          overflow: auto;
        }
        .app {
          display: flex;
          flex-direction: column;
          height: auto;
          min-height: 100vh;
        }
        header.top {
          min-height: 56px;
          padding: 10px 14px;
          flex-wrap: wrap;
          gap: 8px;
        }
        .header-right {
          gap: 6px;
        }
        aside.left {
          max-height: 320px;
        }
        main.canvas {
          overflow: auto;
        }
        aside.right {
          max-height: none;
        }
        .journey {
          padding: 16px;
        }
        .journey-step {
          padding: 10px;
          gap: 6px;
          font-size: 12px;
        }
        .brand-text .muted {
          font-size: 12px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
        }
        .token {
          display: none;
        }
      }

          {
            "id": "create-tx",
            "name": "Create a manual transaction",
            "category": "Transactions",
            "summary": "User selects an account and adds a transaction; the backend serializes duplicate identity, commits the row and neutral claim atomically, then refreshes derived state.",
            "steps": [
              {
                "from": "browser",
                "to": "fe.features",
                "payload": "click 'Add transaction' → AddTransactionSheet submit (Expense / Income)",
                "annotation": "apps/frontend/src/features/transactions/components/AddTransactionSheet.tsx",
                "title": "Enter a payment"
              },
              {
                "from": "fe.features",
                "to": "fe.apiclient",
                "payload": "useCreateTransaction() · React Query mutation",
                "annotation": "apps/frontend/src/hooks/useTransactions.ts",
                "title": "Submit the form"
              },
              {
                "from": "fe.apiclient",
                "to": "be.middleware",
                "payload": "POST /api/transactions; request ID and optional stored Bearer token",
                "annotation": "apps/frontend/src/lib/api/client.ts; apps/frontend/src/lib/api/transactions.ts",
                "title": "Send the transaction request",
                "note": "Admin token authentication protects admin routes. Host, rate and mutation-origin guards apply to this transaction request."
              },
              {
                "from": "be.middleware",
                "to": "be.routes",
                "payload": "validated request body",
                "annotation": "apps/node-backend/src/routes/transactions.ts",
                "title": "Validate the body",
                "note": "The route validates the request body before calling the service."
              },
              {
                "from": "be.routes",
                "to": "sv.transactiondomains",
                "payload": "transactionService.createManualTransaction({... account_id ...})",
                "annotation": "apps/node-backend/src/services/transactionService.ts",
                "title": "Apply transaction rules",
                "note": "An active canonical account_id is required; bank_account is rejected on writes."
              },
              {
                "from": "sv.transactiondomains",
                "to": "db.postgres",
                "payload": "BEGIN · pg_advisory_xact_lock(manual-v3 hash) · duplicate lookup",
                "annotation": "apps/node-backend/src/services/transactionService.ts; apps/node-backend/src/services/deduplication.ts",
                "title": "Lock the duplicate identity"
              },
              {
                "from": "sv.transactiondomains",
                "to": "be.repos",
                "payload": "transactionRepository.create({... account_id ...})",
                "annotation": "apps/node-backend/src/repositories/transactionRepository.ts",
                "title": "Create the canonical row"
              },
              {
                "from": "be.repos",
                "to": "db.postgres",
                "payload": "INSERT transaction + tags; UPSERT manual_transaction_dedup_claims; COMMIT",
                "annotation": "apps/node-backend/src/services/transactionService.ts; apps/node-backend/src/services/deduplication.ts",
                "title": "Commit the row and neutral claim"
              },
              {
                "from": "sv.transactiondomains",
                "to": "sv.transactiondomains",
                "title": "Match plans and schedule transfer reconciliation",
                "note": "These follow the durable create. Auto-link failure does not roll back the transaction.",
                "payload": "autoLinkTransactions; scheduleReconcile",
                "annotation": "apps/node-backend/src/services/transactionService.ts"
              },
              {
                "from": "sv.transactiondomains",
                "to": "sv.aggrefresh",
                "payload": "scheduleAggregationRefresh(rowIds)",
                "annotation": "apps/node-backend/src/services/transactionService.ts; apps/node-backend/src/services/transferReconciliationService.ts",
                "title": "Schedule derived-total refresh",
                "note": "scheduleReconcile invalidates statistics and schedules aggregation refresh after reconciliation."
              },
              {
                "from": "sv.aggrefresh",
                "to": "sv.matview",
                "payload": "REFRESH MATERIALIZED VIEW CONCURRENTLY mv_*",
                "annotation": "apps/node-backend/src/services/aggregationRefresh.ts; apps/node-backend/src/services/materializedViewService.ts",
                "title": "Refresh materialized views"
              },
              {
                "from": "be.routes",
                "to": "fe.apiclient",
                "payload": "201 { ok: true, data: { transaction fields, auto_linked }, meta }",
                "annotation": "apps/node-backend/src/routes/transactions.ts; apps/node-backend/src/middleware/envelope.ts; apps/frontend/src/hooks/useTransactions.ts",
                "title": "Return the saved transaction",
                "note": "The response uses the unified success envelope. The mutation invalidates affected queries."
              }
            ],
            "docs": [
              {
                "path": "features/transactions.md",
                "label": "Transactions"
              }
            ],
            "takeaway": "A manual payment uses an active account_id. The row and duplicate claim commit together; plan matching and transfer reconciliation follow the durable write."
          },

            "steps": [

    <script>
      (() => {
        "use strict";

        const DATA = JSON.parse(
          document.getElementById("flow-data").textContent,
        );
        const NODE_W = 168;
        const NODE_H = 56;

        // Index components by id
        const byId = Object.fromEntries(DATA.components.map((c) => [c.id, c]));

        // Compute center / edge points for arrow geometry
        const centerOf = (c) => ({ x: c.x + NODE_W / 2, y: c.y + NODE_H / 2 });
        function edgePoint(from, to) {
          // Returns the intersection of the line from->to with the rectangle of `from`
          const cf = centerOf(from);
          const ct = centerOf(to);
          const dx = ct.x - cf.x;
          const dy = ct.y - cf.y;
          if (dx === 0 && dy === 0) return cf;
          const hx = NODE_W / 2;
          const hy = NODE_H / 2;
          const sx = dx === 0 ? Infinity : hx / Math.abs(dx);
          const sy = dy === 0 ? Infinity : hy / Math.abs(dy);
          const s = Math.min(sx, sy);
          return { x: cf.x + dx * s, y: cf.y + dy * s };
        }
        function edges(from, to) {
          return { p1: edgePoint(from, to), p2: edgePoint(to, from) };
        }

        // ── Render layer labels ─────────────────────────────────────
        const layerLabels = document.getElementById("layer-labels");
        DATA.layers.forEach((L) => {
          const t = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "text",
          );
          t.setAttribute("class", "layer-label");
          t.setAttribute("x", 16);
          t.setAttribute("y", L.y);
          t.textContent = L.label;
          layerLabels.appendChild(t);
        });

        // ── Render components ───────────────────────────────────────
        const componentsLayer = document.getElementById("components");
        const nodeEls = {}; // id -> <g>
        DATA.components.forEach((c) => {
          const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
          g.setAttribute("class", "node");
          g.setAttribute("data-id", c.id);
          g.setAttribute("transform", `translate(${c.x},${c.y})`);

          const rect = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "rect",
          );
          rect.setAttribute("class", `node-bg kind-${c.kind}`);
          rect.setAttribute("width", NODE_W);
          rect.setAttribute("height", NODE_H);
          rect.setAttribute("rx", 9);
          g.appendChild(rect);

          const label = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "text",
          );
          label.setAttribute("class", "node-label");
          label.setAttribute("x", NODE_W / 2);
          label.setAttribute("y", c.sub ? 22 : NODE_H / 2);
          label.textContent = c.label;
          g.appendChild(label);

          if (c.sub) {
            const sub = document.createElementNS(
              "http://www.w3.org/2000/svg",
              "text",
            );
            sub.setAttribute("class", "node-sub");
            sub.setAttribute("x", NODE_W / 2);
            sub.setAttribute("y", 40);
            sub.textContent = c.sub;
            g.appendChild(sub);
          }

          // Tooltip handlers
          g.addEventListener("mouseenter", (e) => showTooltip(e, c));
          g.addEventListener("mousemove", moveTooltip);
          g.addEventListener("mouseleave", hideTooltip);

          componentsLayer.appendChild(g);
          nodeEls[c.id] = g;
        });

        // ── Render base edges (always-on faint lines) ───────────────
        const baseEdgesLayer = document.getElementById("base-edges");
        DATA.baseEdges.forEach(([fromId, toId]) => {
          const from = byId[fromId];
          const to = byId[toId];
          if (!from || !to) return;
          const { p1, p2 } = edges(from, to);
          const path = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line",
          );
          path.setAttribute("class", "arrow-base");
          path.setAttribute("x1", p1.x);
          path.setAttribute("y1", p1.y);
          path.setAttribute("x2", p2.x);
          path.setAttribute("y2", p2.y);
          path.setAttribute("marker-end", "url(#arrow-head-dim)");
          baseEdgesLayer.appendChild(path);
        });

        // ── Tooltip ─────────────────────────────────────────────────
        const tooltipEl = document.getElementById("tooltip");
        function showTooltip(e, c) {
          tooltipEl.innerHTML = `
      <div class="tip-title">${escapeHtml(c.label)}</div>
      ${c.sub ? `<div class="tip-path">${escapeHtml(c.sub)}</div>` : ""}
      <div class="tip-desc">${escapeHtml(c.desc || kindDesc(c.kind))}</div>
    `;
          tooltipEl.classList.add("shown");
          moveTooltip(e);
        }
        function moveTooltip(e) {
          const x = e.clientX + 14;
          const y = e.clientY + 14;
          tooltipEl.style.left = x + "px";
          tooltipEl.style.top = y + "px";
        }
        function hideTooltip() {
          tooltipEl.classList.remove("shown");
        }
        function kindDesc(k) {
          return (
            {
              client: "Client surface — Browser or Electron renderer.",
              frontend: "React app code (apps/frontend).",
              shared: "Shared between FE and BE (types, OpenAPI spec).",
              backend: "Node.js / Express on Bun.",
              service: "Backend business-logic service.",
              data: "Persistence — Postgres, attachments, migrations.",
              external: "External provider or operating-system service.",
              build: "Build / packaging / distribution surface.",
            }[k] || ""
          );
        }
        function escapeHtml(s) {
          return String(s).replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );
        }

        // ── Flow list ───────────────────────────────────────────────
        const flowListEl = document.getElementById("flow-list");
        const trackSelect = document.getElementById("track");
        let activeTrack = "start";
        trackSelect.innerHTML =
          `<option value="all">All flows</option>` +
          DATA.learningPaths
            .map(
              (path) =>
                `<option value="${escapeHtml(path.id)}">${escapeHtml(path.name)}</option>`,
            )
            .join("");
        trackSelect.value = activeTrack;
        trackSelect.addEventListener("change", () => {
          activeTrack = trackSelect.value;
          renderFlowList(document.getElementById("search").value);
        });
        function renderFlowList(filter = "") {
          flowListEl.innerHTML = "";
          const f = filter.trim().toLowerCase();
          const grouped = {};
          const track = DATA.learningPaths.find(
            (path) => path.id === activeTrack,
          );
          document.getElementById("track-hint").textContent = track
            ? track.description
            : "Choose a learning path for a suggested reading order, or search all flows.";
          const candidates = track
            ? track.flows.map((id) => DATA.flows.find((flow) => flow.id === id))
            : DATA.flows;
          candidates.forEach((flow) => {
            const hay = (
              flow.name +
              " " +
              flow.category +
              " " +
              flow.summary +
              " " +
              flow.steps
                .map((s) => (s.payload || "") + " " + (s.annotation || ""))
                .join(" ")
            ).toLowerCase();
            if (f && !hay.includes(f)) return;
            (grouped[track ? "Suggested order" : flow.category] ||= []).push(
              flow,
            );
          });
          if (!Object.keys(grouped).length) {
            const message = document.createElement("p");
            message.className = "no-results";
            message.textContent =
              "No flows match. Try another search or learning path.";
            flowListEl.appendChild(message);
          }
          Object.entries(grouped).forEach(([cat, flows]) => {
            const h = document.createElement("div");
            h.className = "category";
            h.textContent = cat;
            flowListEl.appendChild(h);
            flows.forEach((flow) => {
              const b = document.createElement("button");
              b.className = "flow-btn";
              b.dataset.flow = flow.id;
              b.innerHTML = `<span>${escapeHtml(flow.name)}</span><span class="badge">${flow.steps.length}</span>`;
              b.addEventListener("click", () => selectFlow(flow.id));
              b.setAttribute("aria-pressed", String(activeFlowId === flow.id));
              if (activeFlowId === flow.id) b.classList.add("active");
              flowListEl.appendChild(b);
            });
          });
        }
        document
          .getElementById("search")
          .addEventListener("input", (e) => renderFlowList(e.target.value));

        document.getElementById("stat-components").textContent =
          DATA.components.length;
        document.getElementById("stat-flows").textContent = DATA.flows.length;

        // ── Flow rendering ──────────────────────────────────────────
        let activeFlowId = null;
        let activeFlow = null;
        let stepIndex = -1; // -1 = none active, 0..N-1
        let showAll = false;
        let playing = false;
        let playTimer = null;
        const reducedMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        );
        const PLAY_INTERVAL_MS = 1600;
        const TOKEN_TRAVEL_MS = 900;

        const flowEdgesLayer = document.getElementById("flow-edges");
        const tokenLayer = document.getElementById("token-layer");
        const emptyHint = document.getElementById("empty-hint");
        const diagram = document.getElementById("diagram");
        const journey = document.getElementById("journey");
        let viewMode = "journey";

        function setView(mode) {
          viewMode = mode;
          diagram.toggleAttribute("hidden", mode !== "architecture");
          journey.hidden = mode !== "journey";
          document
            .getElementById("view-journey")
            .setAttribute("aria-pressed", String(mode === "journey"));
          document
            .getElementById("view-architecture")
            .setAttribute("aria-pressed", String(mode === "architecture"));
          document.getElementById("view-hint").textContent =
            mode === "journey"
              ? "Follow one handoff at a time. Select a card for details."
              : "See where the flow sits in the full system. Scroll to explore.";
          applyStepHighlight();
        }
        document
          .getElementById("view-journey")
          .addEventListener("click", () => setView("journey"));
        document
          .getElementById("view-architecture")
          .addEventListener("click", () => setView("architecture"));

        function docLinks(flow) {
          return `<nav class="doc-links" aria-label="Related documentation">${(
            flow.docs || []
          )
            .map(
              (doc) =>
                `<a href="${escapeHtml(doc.path)}">${escapeHtml(doc.label)}</a>`,
            )
            .join("")}</nav>`;
        }
        function nodeKindLabel(kind) {
          return (
            {
              client: "App surface",
              frontend: "User interface",
              shared: "Shared contract",
              backend: "API boundary",
              service: "Business rules",
              data: "Stored data",
              external: "Provider or OS service",
              build: "Desktop runtime",
            }[kind] || kind
          );
        }
        function renderJourney() {
          journey.innerHTML = "";
          if (!activeFlow) {
            journey.innerHTML = `<div class="journey-intro"><h1>Explore Vision visually</h1><p>Choose a learning path or a flow. Journey shows the order; Architecture map shows the system.</p></div>`;
            return;
          }
          const intro = document.createElement("div");
          intro.className = "journey-intro";
          intro.innerHTML =
            `<h1>${escapeHtml(activeFlow.name)}</h1><p>${escapeHtml(activeFlow.summary)}</p>` +
            (activeFlow.takeaway
              ? `<p class="takeaway"><strong>Remember:</strong> ${escapeHtml(activeFlow.takeaway)}</p>`
              : "") +
            docLinks(activeFlow);
          journey.appendChild(intro);
          activeFlow.steps.forEach((step, i) => {
            const from = byId[step.from];
            const to = byId[step.to];
            const card = document.createElement("button");
            card.type = "button";
            card.className = "journey-step";
            card.dataset.step = String(i);
            card.innerHTML =
              `<span class="step-num">${i + 1}</span>` +
              `<span class="journey-action">${escapeHtml(step.title || `${from.label} to ${to.label}`)}</span>` +
              `<span class="journey-node" style="grid-column:2">${escapeHtml(from.label)}<small>${escapeHtml(nodeKindLabel(from.kind))}</small></span>` +
              `<span class="journey-arrow" aria-label="sends to">→</span>` +
              `<span class="journey-node">${escapeHtml(to.label)}<small>${escapeHtml(nodeKindLabel(to.kind))}</small></span>` +
              `<span class="journey-note">${escapeHtml(step.note || step.payload)}</span>`;
            card.addEventListener("click", () => {
              stopPlay();
              gotoStep(i);
            });
            journey.appendChild(card);
          });
        }

        function selectFlow(id) {
          const flow = DATA.flows.find((f) => f.id === id);
          if (!flow) return;
          const track = DATA.learningPaths.find(
            (path) => path.id === activeTrack,
          );
          if (track && !track.flows.includes(id)) {
            activeTrack = "all";
            trackSelect.value = activeTrack;
            document.getElementById("search").value = "";
            renderFlowList();
          }
          activeFlowId = id;
          activeFlow = flow;
          if (window.location.hash !== `#${id}`) window.location.hash = id;
          stepIndex = 0;
          showAll = false;
          stopPlay();
          diagram.classList.add("has-flow");
          emptyHint.style.display = "none";

          // Update sidebar active
          document.querySelectorAll(".flow-btn").forEach((b) => {
            b.classList.toggle("active", b.dataset.flow === id);
            b.setAttribute("aria-pressed", String(b.dataset.flow === id));
          });

          drawFlowEdges();
          markTouchedNodes();
          renderRight();
          renderJourney();
          document.querySelector("main.canvas").scrollTop = 0;
          applyStepHighlight();
        }

        function drawFlowEdges() {
          flowEdgesLayer.innerHTML = "";
          if (!activeFlow) return;
          activeFlow.steps.forEach((step, i) => {
            const from = byId[step.from];
            const to = byId[step.to];
            if (!from || !to) return;
            const { p1, p2 } = edges(from, to);

            // Curve slightly perpendicular so parallel edges separate
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const len = Math.hypot(dx, dy) || 1;
            const priorHops = activeFlow.steps
              .slice(0, i)
              .filter(
                (s) =>
                  (s.from === step.from && s.to === step.to) ||
                  (s.from === step.to && s.to === step.from),
              ).length;
            const offset = 16 + priorHops * 22;
            const nx = (-dy / len) * offset;
            const ny = (dx / len) * offset;
            const cx = (p1.x + p2.x) / 2 + nx;
            const cy = (p1.y + p2.y) / 2 + ny;
            const selfHop = step.from === step.to;
            const d = selfHop
              ? `M ${from.x + NODE_W - 12},${from.y} C ${from.x + NODE_W + 34},${from.y - 28} ${from.x + NODE_W + 34},${from.y + NODE_H + 28} ${from.x + NODE_W - 12},${from.y + NODE_H}`
              : `M ${p1.x},${p1.y} Q ${cx},${cy} ${p2.x},${p2.y}`;

            const path = document.createElementNS(
              "http://www.w3.org/2000/svg",
              "path",
            );
            path.setAttribute("class", "arrow future");
            path.setAttribute("d", d);
            path.setAttribute("marker-end", "url(#arrow-head)");
            path.dataset.step = String(i);
            flowEdgesLayer.appendChild(path);

            // Step badge
            const badge = document.createElementNS(
              "http://www.w3.org/2000/svg",
              "g",
            );
            badge.setAttribute("class", "step-badge");
            badge.dataset.step = String(i);
            badge.style.cursor = "pointer";
            badge.addEventListener("click", () => gotoStep(i));

            const circle = document.createElementNS(
              "http://www.w3.org/2000/svg",
              "circle",
            );
            circle.setAttribute("class", "step-badge-circle");
            circle.setAttribute("cx", selfHop ? from.x + NODE_W + 22 : cx);
            circle.setAttribute("cy", selfHop ? from.y + NODE_H / 2 : cy);
            circle.setAttribute("r", 10);
            badge.appendChild(circle);

            const t = document.createElementNS(
              "http://www.w3.org/2000/svg",
              "text",
            );
            t.setAttribute("class", "step-badge-text");
            t.setAttribute("x", selfHop ? from.x + NODE_W + 22 : cx);
            t.setAttribute("y", (selfHop ? from.y + NODE_H / 2 : cy) + 0.5);
            t.textContent = String(i + 1);
            badge.appendChild(t);

            flowEdgesLayer.appendChild(badge);
          });
        }

        function markTouchedNodes() {
          Object.values(nodeEls).forEach((g) =>
            g.classList.remove("touched", "active"),
          );
          if (!activeFlow) return;
          const touched = new Set();
          activeFlow.steps.forEach((s) => {
            touched.add(s.from);
            touched.add(s.to);
          });
          touched.forEach(
            (id) => nodeEls[id] && nodeEls[id].classList.add("touched"),
          );
        }

        function applyStepHighlight() {
          if (!activeFlow) return;
          // Reset active class on nodes
          Object.values(nodeEls).forEach((g) => g.classList.remove("active"));

          // Reset arrow classes
          flowEdgesLayer.querySelectorAll(".arrow").forEach((p) => {
            const i = +p.dataset.step;
            p.classList.remove("past", "active", "future");
            if (showAll) {
              p.classList.add("active");
            } else if (i < stepIndex) {
              p.classList.add("past");
            } else if (i === stepIndex) {
              p.classList.add("active");
            } else {
              p.classList.add("future");
            }
          });
          flowEdgesLayer.querySelectorAll(".step-badge-circle").forEach((c) => {
            const i = +c.parentNode.dataset.step;
            c.classList.remove("past", "active");
            if (showAll || i === stepIndex) c.classList.add("active");
            else if (i < stepIndex) c.classList.add("past");
          });
          flowEdgesLayer.querySelectorAll(".step-badge-text").forEach((t) => {
            const i = +t.parentNode.dataset.step;
            t.classList.remove("past", "active");
            if (showAll || i === stepIndex) t.classList.add("active");
            else if (i < stepIndex) t.classList.add("past");
          });

          // Active step nodes
          if (
            !showAll &&
            stepIndex >= 0 &&
            stepIndex < activeFlow.steps.length
          ) {
            const s = activeFlow.steps[stepIndex];
            nodeEls[s.from] && nodeEls[s.from].classList.add("active");
            nodeEls[s.to] && nodeEls[s.to].classList.add("active");
            animateToken(s);
          } else {
            tokenLayer.innerHTML = "";
          }

          // Right panel
          document.querySelectorAll("#step-list .step").forEach((el, i) => {
            el.classList.remove("past", "active");
            if (showAll) el.classList.add("active");
            else if (i < stepIndex) el.classList.add("past");
            else if (i === stepIndex) el.classList.add("active");
          });

          journey.querySelectorAll(".journey-step").forEach((card, i) => {
            card.classList.toggle("active", showAll || i === stepIndex);
            card.classList.toggle("past", !showAll && i < stepIndex);
            if (!showAll && i === stepIndex)
              card.setAttribute("aria-current", "step");
            else card.removeAttribute("aria-current");
          });
          document
            .getElementById("btn-all")
            .setAttribute("aria-pressed", String(showAll));

          // Progress
          const total = activeFlow.steps.length;
          document.getElementById("progress").textContent =
            `${Math.min(stepIndex + 1, total)} / ${total}`;
          document.getElementById("btn-prev").disabled = stepIndex <= 0;
          document.getElementById("btn-next").disabled = stepIndex >= total - 1;

          // Scroll active step into view
          const activeStepEl = document.querySelector(
            "#step-list .step.active",
          );
          if (activeStepEl && !showAll)
            activeStepEl.scrollIntoView({
              behavior: reducedMotion.matches ? "auto" : "smooth",
              block: "nearest",
            });
          const activeCard = journey.querySelector('[aria-current="step"]');
          if (activeCard && viewMode === "journey" && !showAll)
            activeCard.scrollIntoView({
              behavior: reducedMotion.matches ? "auto" : "smooth",
              block: "nearest",
            });
        }

        function animateToken(step) {
          tokenLayer.innerHTML = "";
          if (
            reducedMotion.matches ||
            viewMode !== "architecture" ||
            step.from === step.to
          )
            return;
          const from = byId[step.from];
          const to = byId[step.to];
          if (!from || !to) return;
          const { p1, p2 } = edges(from, to);
          const token = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "circle",
          );
          token.setAttribute("class", "token");
          token.setAttribute("r", 5);
          token.setAttribute("cx", p1.x);
          token.setAttribute("cy", p1.y);
          tokenLayer.appendChild(token);

          const t0 = performance.now();
          function frame(t) {
            const u = Math.min(1, (t - t0) / TOKEN_TRAVEL_MS);
            const e = easeInOutCubic(u);
            const x = p1.x + (p2.x - p1.x) * e;
            const y = p1.y + (p2.y - p1.y) * e;
            token.setAttribute("cx", x);
            token.setAttribute("cy", y);
            if (u < 1 && !showAll && tokenLayer.contains(token))
              requestAnimationFrame(frame);
          }
          requestAnimationFrame(frame);
        }
        function easeInOutCubic(t) {
          return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        // ── Right panel ─────────────────────────────────────────────
        function renderRight() {
          const rh = document.getElementById("right-header");
          const ctrls = document.getElementById("controls");
          const list = document.getElementById("step-list");

          if (!activeFlow) {
            rh.classList.add("empty");
            rh.innerHTML = `<h2 class="flow-name">No flow selected</h2><p class="empty-hint">Choose a flow from the list to see step-by-step annotations.</p>`;
            ctrls.style.display = "none";
            list.innerHTML = "";
            return;
          }
          rh.classList.remove("empty");
          rh.innerHTML = `
      <h2 class="flow-name">${escapeHtml(activeFlow.name)}</h2>
      <p class="flow-summary">${escapeHtml(activeFlow.summary)}</p>
      ${docLinks(activeFlow)}
    `;
          ctrls.style.display = "flex";

          list.innerHTML = "";
          activeFlow.steps.forEach((s, i) => {
            const from = byId[s.from];
            const to = byId[s.to];
            const fromLabel = from ? from.label : s.from;
            const toLabel = to ? to.label : s.to;
            const el = document.createElement("div");
            el.className = "step";
            el.innerHTML = `
        <button type="button" class="step-select" aria-label="${escapeHtml(`Step ${i + 1}: ${s.title || fromLabel + " to " + toLabel}`)}">
        <span class="step-head">
          <span class="step-num">${i + 1}</span>
          <span>Step ${i + 1} of ${activeFlow.steps.length}</span>
        </span>
        ${s.title ? `<span class="step-title">${escapeHtml(s.title)}</span>` : ""}
        <span class="step-route">
          <span class="endpoint">${escapeHtml(fromLabel)}</span>
          <span class="arrow-glyph">→</span>
          <span class="endpoint">${escapeHtml(toLabel)}</span>
        </span>
        ${s.note ? `<span class="step-annotation">${escapeHtml(s.note)}</span>` : ""}
        </button>
        <details><summary>Payload and source details</summary>
          <div class="step-payload">${escapeHtml(s.payload)}</div>
          <div class="step-annotation">${escapeHtml(s.annotation)}</div>
        </details>
      `;
            el.querySelector(".step-select").addEventListener("click", () => {
              stopPlay();
              gotoStep(i);
            });
            list.appendChild(el);
          });
        }

        // ── Step controls ───────────────────────────────────────────
        function gotoStep(i) {
          if (!activeFlow) return;
          showAll = false;
          stepIndex = Math.max(0, Math.min(activeFlow.steps.length - 1, i));
          applyStepHighlight();
        }
        function next() {
          gotoStep(stepIndex + 1);
        }
        function prev() {
          gotoStep(stepIndex - 1);
        }
        function restart() {
          gotoStep(0);
        }
        function toggleAll() {
          if (!activeFlow) return;
          showAll = !showAll;
          stopPlay();
          applyStepHighlight();
        }
        function togglePlay() {
          if (!activeFlow) return;
          playing ? stopPlay() : startPlay();
        }
        function startPlay() {
          if (!activeFlow) return;
          playing = true;
          document.getElementById("btn-play").textContent = "❚❚";
          document
            .getElementById("btn-play")
            .setAttribute("aria-label", "Pause");
          if (stepIndex >= activeFlow.steps.length - 1) stepIndex = -1;
          playTimer = setInterval(() => {
            if (stepIndex >= activeFlow.steps.length - 1) {
              stopPlay();
              return;
            }
            gotoStep(stepIndex + 1);
          }, PLAY_INTERVAL_MS);
          // Trigger immediate first step too
          if (stepIndex < 0) gotoStep(0);
        }
        function stopPlay() {
          playing = false;
          document.getElementById("btn-play").textContent = "▶";
          document
            .getElementById("btn-play")
            .setAttribute("aria-label", "Play");
          if (playTimer) {
            clearInterval(playTimer);
            playTimer = null;
          }
        }
        function clearFlow() {
          activeFlowId = null;
          activeFlow = null;
          if (window.location.hash)
            window.history.replaceState(
              null,
              "",
              window.location.pathname + window.location.search,
            );
          stepIndex = -1;
          showAll = false;
          stopPlay();
          diagram.classList.remove("has-flow");
          flowEdgesLayer.innerHTML = "";
          tokenLayer.innerHTML = "";
          Object.values(nodeEls).forEach((g) =>
            g.classList.remove("touched", "active"),
          );
          emptyHint.style.display = "";
          document.querySelectorAll(".flow-btn").forEach((b) => {
            b.classList.remove("active");
            b.setAttribute("aria-pressed", "false");
          });
          renderRight();
          renderJourney();
        }

        document.getElementById("btn-next").addEventListener("click", next);
        document.getElementById("btn-prev").addEventListener("click", prev);
        document
          .getElementById("btn-restart")
          .addEventListener("click", restart);
        document
          .getElementById("btn-play")
          .addEventListener("click", togglePlay);
        document.getElementById("btn-all").addEventListener("click", toggleAll);

        // Keyboard
        window.addEventListener("keydown", (e) => {
          if (
            e.defaultPrevented ||
            e.target.closest?.(
              "input, select, textarea, button, a, summary, [contenteditable], [role='button']",
            )
          )
            return;
          if (e.key === "ArrowRight") {
            e.preventDefault();
            next();
          } else if (e.key === "ArrowLeft") {
            e.preventDefault();
            prev();
          } else if (e.key === " ") {
            e.preventDefault();
            togglePlay();
          } else if (e.key === "r" || e.key === "R") {
            e.preventDefault();
            restart();
          } else if (e.key === "Escape") {
            e.preventDefault();
            clearFlow();
          } else if (e.key === "a" || e.key === "A") {
            e.preventDefault();
            toggleAll();
          }
        });

        // Initial render
        renderFlowList();
        renderRight();

        // A note can link directly to a flow; browser back/forward retains that selection.
        function selectFromHash() {
          const id = window.location.hash.slice(1);
          if (!id) {
            clearFlow();
            return;
          }
          if (id !== activeFlowId && DATA.flows.some((flow) => flow.id === id))
            selectFlow(id);
        }
        window.addEventListener("hashchange", selectFromHash);
        const initialId = window.location.hash.slice(1);
        selectFlow(
          DATA.flows.some((flow) => flow.id === initialId)
            ? initialId
            : "api-request",
        );
      })();
    </script>
  </body>
</html>
