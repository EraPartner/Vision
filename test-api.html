<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
</head>
<body>
    <h1>API Test</h1>
    <button onclick="testAPI()">Test API</button>
    <pre id="output"></pre>

    <script>
        async function testAPI() {
            const output = document.getElementById('output');
            output.textContent = 'Testing...\n';

            try {
                // Test transaction count
                const countResponse = await fetch('http://localhost:3002/api/info/transaction-count');
                const countData = await countResponse.json();
                output.textContent += `Transaction Count: ${JSON.stringify(countData, null, 2)}\n\n`;

                // Test monthly summary
                const summaryResponse = await fetch('http://localhost:3002/api/info/monthly-summary');
                const summaryData = await summaryResponse.json();
                output.textContent += `Monthly Summary: ${JSON.stringify(summaryData, null, 2)}\n\n`;
            } catch (error) {
                output.textContent += `Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
