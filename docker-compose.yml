# ⚠️ REAL-DATA STACK. `name: vision` below pins the compose project to `vision`
# regardless of this checkout's directory name (a clone/worktree named `vision-2`
# would otherwise default to its basename and silently get a *fresh, empty* DB).
# Its `postgres_data` volume (vision_postgres_data) holds your real financial
# database — shared with the packaged Vision.app and the dev stack
# (docker-compose.dev.yml). The project name and named volumes match
# packaging/electron/resources/docker-compose.yml (CI: verify-compose-sync);
# the rest of the files intentionally differ (build vs GHCR image, init mounts).
# DO NOT run `docker compose down -v` / `docker volume rm vision_postgres_data`
# from this directory: it destroys that data (it did, on 2026-07-06). For e2e/CI
# or clean-slate runs use an isolated project — e.g. `COMPOSE_PROJECT_NAME=vision_e2e`
# (env var overrides `name:`; see .github/workflows/{ci,e2e}.yml) or
# docker-compose.clean.yml's separate volume.
name: vision
services:
  db:
    image: postgres:18-alpine
    # The current linux/arm64 image can contain empty entrypoint scripts
    # (docker-library/postgres#1378). Run only PostgreSQL under Docker Desktop's
    # amd64 emulation until the upstream image is reliable; the app stays native.
    platform: linux/amd64
    restart: unless-stopped
    # SSD-tuned planner: default random_page_cost=4.0 assumes spinning disks and
    # over-penalizes index scans. 1.1 reflects near-uniform random/sequential cost.
    command: postgres -c random_page_cost=1.1
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    # Postgres uses /dev/shm for parallel query workers and large sorts/hash
    # joins; Docker's 64mb default is easily exhausted. 256mb is a safe bump.
    shm_size: 256mb
    # No `env_file: .env` here on purpose: the db container needs exactly two
    # secrets, and inheriting the whole file would also hand it the app's API
    # keys, ADMIN_AUTH_TOKEN and DATABASE_URL for no reason. The `${…}` values
    # below still come from the same .env — Compose reads it for interpolation —
    # they are just passed one at a time. Keep the app service's env_file.
    environment:
      POSTGRES_USER: ftm_user
      POSTGRES_DB: financial_transactions
      # Superuser password for first init (ignored once the volume exists).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Consumed only by docker/postgres-init/01-app-role.sh, mounted below;
      # unset/empty means "single-role setup" and the script no-ops.
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-}
      # Pin the cluster's session timezone to UTC (ADR-009: storage = UTC).
      # Without this, CURRENT_DATE/NOW() follow initdb's OS-detected default,
      # which is implicit and not guaranteed across hosts.
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql
      # First-init-only scripts: creates the optional least-privilege ftm_app
      # role when POSTGRES_APP_PASSWORD is set in .env (see .env.example).
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ftm_user -d financial_transactions"]
      # Steady-state interval:30s to reduce log/CPU churn; start_period keeps the
      # first probes fast so the app container isn't held up on cold boots.
      interval: 30s
      timeout: 3s
      retries: 10
      start_period: 5s
      # NOTE: `start_interval` (faster first-probe cadence during start_period)
      # was removed — it requires Compose >= 2.20.2 / Engine >= 25, and older
      # binaries reject the unknown property during schema validation, breaking
      # `docker compose up` on installs that previously worked. It was only an
      # optimization for the very first health probes; the healthcheck is fully
      # functional without it.

  app:
    build: .
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    env_file: .env
    ports:
      - "127.0.0.1:${PORT:-3002}:3002"
    # Container hardening — defense-in-depth for hypothetical RCE.
    # Run as built-in bun user (UID 1000), drop all Linux capabilities,
    # lock filesystem read-only with explicit writable mounts, and prevent
    # privilege escalation via setuid binaries.
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Generous resource ceilings — protection without throttling local dev.
    mem_limit: 4g
    cpus: 4.0
    volumes:
      # Persist attachments across container recreate / image rebuild.
      - attachments_data:/app/data/attachments
      # Alembic skip-at-head cache — survives container restarts for warm-boot savings.
      - vision_cache_data:/app/.vision-cache
    # Map host.docker.internal to the host gateway so the backend can reach
    # Ollama running on the host machine. Docker Desktop (macOS/Windows)
    # provides this automatically; on Linux the mapping must be explicit.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # DATABASE_URL is built in .env so the password is never hard-coded here
      SERVER_HOST: "0.0.0.0"
      # The container binds 0.0.0.0 but the port is published on host loopback
      # only (see ports: above) — acknowledge that so a tokenless start is not
      # refused. Remove this (and set ADMIN_AUTH_TOKEN) if you widen ports:.
      ADMIN_ALLOW_TOKENLESS_NONLOOPBACK: "true"
      CORS_ORIGINS: "http://localhost:${PORT:-3002}"
    # depends_on uses `condition: service_started`, NOT `service_healthy`. The
    # strict health-gate was removed intentionally; service_started still creates
    # the db container for partial targets like `docker compose up app` (which
    # otherwise crash-loops on `getaddrinfo db`), without the serial delay.
    #
    # Docker's healthcheck gate forced a strict serial sequence:
    #   db starts → postgres init → healthcheck passes → THEN app starts
    # This added up to ~30s of dead time before the app container even launched.
    #
    # The app already handles this correctly on its own: main.js polls
    # checkConnection() every second for up to 20 attempts, and if postgres
    # isn't ready yet it waits. If it exhausts all attempts, Docker's
    # restart:unless-stopped policy will relaunch it automatically.
    #
    # Both containers now start together (service_started does not wait for the
    # db healthcheck). The db healthcheck is kept so `docker ps` / monitoring
    # tools can still report db readiness.
    depends_on:
      db:
        condition: service_started

volumes:
  postgres_data:
  attachments_data:
  vision_cache_data:
