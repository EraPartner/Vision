# docker-compose.dev.yml — Development override
#
# Builds the app image from local source instead of pulling from GHCR.
# Shares the postgres_data volume with packaged Vision.app so dev work
# operates on the same database as the deployed app — single source of
# truth for local data.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#   # or:  bun run docker:dev

services:
  db:
    # The current postgres:18-alpine linux/arm64 image has empty entrypoint
    # scripts (docker-library/postgres#1378). Keep the workaround dev-only and
    # run the database under Docker Desktop's amd64 emulation until it is fixed.
    platform: linux/amd64

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_DEVTOOLS: 'true'
